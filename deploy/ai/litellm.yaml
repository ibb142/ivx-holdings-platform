model_list:
  - model_name: ivx-local-chat
    litellm_params:
      model: os.environ/LITELLM_OLLAMA_MODEL
      api_base: http://ollama:11434
      timeout: 180
      num_ctx: 8192

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  request_timeout: 180
  num_retries: 0
  telemetry: false

# No database-backed LiteLLM budget, provider fallback, embedding model or
# automatic Qdrant integration is configured here. IVX admission remains separate.
