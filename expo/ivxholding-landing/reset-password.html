<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>IVX Holdings — Reset Password</title>
  <meta name="description" content="Reset your IVX Holdings password securely.">
  <style>
    :root{--bg:#0a0a0a;--surface:#141414;--border:#2a2a2a;--text:#fff;--muted:#a0a0a0;--gold:#FFD700;--error:#ff8a8a;--success:#7ee2a0}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{width:100%;max-width:430px;margin:20px;padding:32px 28px;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.6)}.logo{font-weight:900;letter-spacing:1.5px;margin-bottom:24px}.logo b{color:var(--gold)}h1{font-size:26px;margin:0 0 10px}p{color:var(--muted);line-height:1.5}.field{margin:18px 0}label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.input{display:flex;align-items:center;background:#1a1a1a;border:1px solid var(--border);border-radius:14px;height:54px;padding:0 14px}.input input{flex:1;width:100%;height:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:16px}.toggle{background:transparent;border:0;color:var(--muted);font-weight:700}.btn{width:100%;height:54px;border:0;border-radius:16px;background:var(--gold);color:#0a0a0a;font-weight:900;font-size:15px}.btn:disabled{opacity:.55}.status{border-radius:14px;padding:14px;margin:14px 0;font-size:14px;line-height:1.45}.info{background:rgba(255,215,0,.10);border:1px solid rgba(255,215,0,.25);color:#f5d742}.error{background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.35);color:var(--error)}.success{background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.35);color:var(--success)}.hidden{display:none}.rules{font-size:13px;color:var(--muted);margin:16px 0}.account{font-size:13px;color:var(--muted);word-break:break-all;margin-bottom:12px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <main class="card">
    <div class="logo"><b>IVX</b> HOLDINGS</div>
    <div id="status" class="status info">Verifying secure recovery link…</div>
    <section id="form" class="hidden">
      <h1>Set a new password</h1>
      <p>Choose a new password for your IVX account.</p>
      <div id="account" class="account hidden"></div>
      <div class="field"><label>New password</label><div class="input"><input id="p1" type="password" autocomplete="new-password"><button class="toggle" type="button" data-for="p1">Show</button></div></div>
      <div class="field"><label>Confirm password</label><div class="input"><input id="p2" type="password" autocomplete="new-password"><button class="toggle" type="button" data-for="p2">Show</button></div></div>
      <div class="rules">Minimum 12 characters, at least one uppercase letter and one number.</div>
      <button id="submit" class="btn" type="button">Update password</button>
    </section>
    <section id="done" class="hidden"><h1>Password updated</h1><p>Your password has been changed successfully. You can now sign in with the new password.</p><button id="login" class="btn" type="button">Return to Sign In</button></section>
  </main>
<script>
(async function(){
  const status=document.getElementById('status'),form=document.getElementById('form'),done=document.getElementById('done'),submit=document.getElementById('submit'),account=document.getElementById('account');
  const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));
  const show=(kind,msg)=>{status.className='status '+kind;status.textContent=msg;status.classList.remove('hidden')};
  let sb=null;
  const reveal=async()=>{const {data}=await sb.auth.getUser();const email=data&&data.user&&data.user.email||'';if(email){account.textContent='Account: '+email;account.classList.remove('hidden')}status.classList.add('hidden');form.classList.remove('hidden')};
  let url='__IVX_SUPABASE_URL__',key='__IVX_SUPABASE_ANON_KEY__';
  if(!url.startsWith('http')||!key||key.startsWith('__IVX_')){try{const r=await fetch('/ivx-config.json',{cache:'no-store'});const c=await r.json();url=c.supabaseUrl||c.SUPABASE_URL||'';key=c.supabaseAnonKey||c.SUPABASE_ANON_KEY||''}catch(e){}}
  if(!window.supabase||!url.startsWith('http')||!key){show('error','Supabase is not configured. Please request a new reset link.');return}
  sb=window.supabase.createClient(url,key,{auth:{detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});
  try{
    if(q.get('error')||q.get('error_description')) throw new Error(q.get('error_description')||q.get('error'));
    const access=h.get('access_token'),refresh=h.get('refresh_token');
    if(access&&refresh){const {error}=await sb.auth.setSession({access_token:access,refresh_token:refresh});if(error)throw error;history.replaceState({},document.title,location.pathname);await reveal();}
    else if(q.get('token_hash')&&(q.get('type')||'recovery')==='recovery'){const {error}=await sb.auth.verifyOtp({token_hash:q.get('token_hash'),type:'recovery'});if(error)throw error;history.replaceState({},document.title,location.pathname);await reveal();}
    else if(q.get('token')&&(q.get('type')||'recovery')==='recovery'){const {error}=await sb.auth.verifyOtp({token_hash:q.get('token'),type:'recovery'});if(error)throw error;history.replaceState({},document.title,location.pathname);await reveal();}
    else if(q.get('code')){const {error}=await sb.auth.exchangeCodeForSession(q.get('code'));if(error)throw error;history.replaceState({},document.title,location.pathname);await reveal();}
    else {const {data}=await sb.auth.getSession();if(data&&data.session)await reveal();else throw new Error('This password recovery link is incomplete or expired. Please request a new reset link.')}
  }catch(e){show('error','Could not verify your recovery link: '+(e.message||'unknown error'))}
  document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.for);const s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show'});
  submit.onclick=async()=>{const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1.length<12){show('error','Password must be at least 12 characters.');return}if(!/[A-Z]/.test(p1)){show('error','Password must contain at least one uppercase letter.');return}if(!/[0-9]/.test(p1)){show('error','Password must contain at least one number.');return}if(p1!==p2){show('error','Passwords do not match.');return}submit.disabled=true;submit.textContent='Updating…';try{const {data}=await sb.auth.getSession();if(!data.session)throw new Error('Recovery session expired. Please request a new reset link.');const {error}=await sb.auth.updateUser({password:p1});if(error)throw error;form.classList.add('hidden');done.classList.remove('hidden');show('success','Password updated successfully.');await sb.auth.signOut({scope:'local'});}catch(e){show('error',e.message||'Password update failed.');submit.disabled=false;submit.textContent='Update password'}};
  document.getElementById('login').onclick=()=>{location.href='/'};
})();
</script>
</body>
</html>
