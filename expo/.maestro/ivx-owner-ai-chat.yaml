appId: com.ivxholdings.app
name: IVX Owner AI Chat Smoke
tags:
  - ios-qa
  - chat
  - smoke
---
- launchApp
- tapOn:
    id: "home-owner-login-entry"
- tapOn:
    id: "login-email"
- inputText: ${OWNER_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${OWNER_PASSWORD}
- tapOn:
    id: "login-submit"
- assertVisible: "IVX"
- tapOn: "IVX Owner AI"
- inputText: "ping"
- tapOn:
    id: "ivx-owner-chat-input"
- inputText: "ping"
- tapOn:
    id: "ivx-owner-chat-send"
- assertVisible:
    id: "ivx-owner-chat-input"
    timeout: 8000
