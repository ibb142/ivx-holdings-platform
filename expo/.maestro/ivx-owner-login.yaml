appId: com.ivxholdings.app
name: IVX Owner Login Flow
tags:
  - ios-qa
  - login
---
- launchApp:
    clearState: true
- assertVisible: "IVX"
- tapOn:
    id: "home-owner-login-entry"
- assertVisible: "Owner Login"
- tapOn:
    id: "login-email"
- inputText: ${OWNER_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${OWNER_PASSWORD}
- tapOn:
    id: "login-submit"
- assertVisible: "IVX"
