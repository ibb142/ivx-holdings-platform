appId: com.ivxholdings.app.owner
name: IVX Owner Chat AI Certificate
tags:
  - android-qa
  - owner-auth
  - chat
  - ai
  - persistence
  - black-screen-regression
---
# Real-device owner chat certificate.
# Contract: send -> live AI reply -> render -> persistence -> reload.
# Fresh exact-SHA recertification requested 2026-09-06 after chat probe-gating repair.
# Retry state-machine behavior is hard-gated separately by
# expo/__tests__/chat-transport-reliability.test.ts.
- tapOn:
    id: "tab-chat"
- extendedWaitUntil:
    visible:
      id: "chat-open-message-room"
    timeout: 15000
- assertVisible: "IVX Owner AI room"
- tapOn:
    id: "chat-open-message-room"
- extendedWaitUntil:
    visible:
      id: "ivx-owner-chat-composer-dock"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "ivx-owner-chat-input"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "ivx-owner-chat-send"
    timeout: 10000
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
- runFlow:
    when:
      visible:
        id: "ivx-owner-chat-scroll-to-latest"
    commands:
      - tapOn:
          id: "ivx-owner-chat-scroll-to-latest"
- tapOn:
    id: "ivx-owner-chat-input"
- inputText: "Return only the result of joining IVX_CHAT_E2E_ and ${CHAT_E2E_SUFFIX}."
- hideKeyboard
- tapOn:
    id: "ivx-owner-chat-send"
- runFlow:
    when:
      visible:
        id: "ivx-owner-chat-scroll-to-latest"
    commands:
      - tapOn:
          id: "ivx-owner-chat-scroll-to-latest"
# Use the real conversation search to keep this command and its eventual
# answer in view while other owner runs append to the shared room. Scrolling
# toward older history before the provider replies moves away from the pending
# answer; the app correctly preserves that intentional reading position.
# The suffix alone is not a passing answer: both assertions below still require
# the sender role and the full joined value or full original command.
- tapOn:
    id: "ivx-owner-chat-search-open"
- tapOn:
    id: "ivx-owner-chat-search-input"
- inputText: ${CHAT_E2E_SUFFIX}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "chat-message-body-assistant-.*"
      text: ".*IVX_CHAT_E2E_${CHAT_E2E_SUFFIX}.*"
    # The canonical Owner AI path is SSE-backed with a 180s hard ceiling.
    # Keep the assertion fail-closed while allowing one complete live stream
    # during provider/database degradation.
    timeout: 200000
- assertVisible:
    id: "chat-message-body-assistant-.*"
    text: ".*IVX_CHAT_E2E_${CHAT_E2E_SUFFIX}.*"
- scrollUntilVisible:
    element:
      id: "chat-message-body-owner-.*"
      text: ".*Return only the result of joining IVX_CHAT_E2E_ and ${CHAT_E2E_SUFFIX}.*"
    direction: UP
    visibilityPercentage: 50
    timeout: 20000
- assertVisible:
    id: "chat-message-body-owner-.*"
    text: ".*Return only the result of joining IVX_CHAT_E2E_ and ${CHAT_E2E_SUFFIX}.*"
- tapOn:
    id: "ivx-owner-chat-search-clear"
- runFlow:
    when:
      visible:
        id: "ivx-owner-chat-scroll-to-latest"
    commands:
      - tapOn:
          id: "ivx-owner-chat-scroll-to-latest"
- assertNotVisible: "Not sent"
- assertNotVisible: "I was unable to display this reply"
- assertVisible:
    id: "ivx-owner-chat-composer-dock"
# Kill/relaunch without clearing app state. This proves the rendered thread is
# restored from the durable owner-chat persistence path, not just memory.
- stopApp
- launchApp:
    clearState: false
# Cold launch intentionally signs out; authenticate again without clearing history.
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 20000
- tapOn:
    id: "login-email"
- eraseText
- inputText: ${OWNER_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password"
- eraseText
- inputText: ${OWNER_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "tab-chat"
    timeout: 20000
- tapOn:
    id: "tab-chat"
- extendedWaitUntil:
    visible:
      id: "chat-open-message-room"
    timeout: 15000
- tapOn:
    id: "chat-open-message-room"
- extendedWaitUntil:
    visible:
      id: "ivx-owner-chat-composer-dock"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "ivx-owner-chat-scroll-to-latest"
    commands:
      - tapOn:
          id: "ivx-owner-chat-scroll-to-latest"
- tapOn:
    id: "ivx-owner-chat-search-open"
- tapOn:
    id: "ivx-owner-chat-search-input"
- inputText: ${CHAT_E2E_SUFFIX}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "chat-message-body-assistant-.*"
      text: ".*IVX_CHAT_E2E_${CHAT_E2E_SUFFIX}.*"
    timeout: 30000
- assertVisible:
    id: "chat-message-body-assistant-.*"
    text: ".*IVX_CHAT_E2E_${CHAT_E2E_SUFFIX}.*"
- scrollUntilVisible:
    element:
      id: "chat-message-body-owner-.*"
      text: ".*Return only the result of joining IVX_CHAT_E2E_ and ${CHAT_E2E_SUFFIX}.*"
    direction: UP
    visibilityPercentage: 50
    timeout: 30000
- assertVisible:
    id: "chat-message-body-owner-.*"
    text: ".*Return only the result of joining IVX_CHAT_E2E_ and ${CHAT_E2E_SUFFIX}.*"
- tapOn:
    id: "ivx-owner-chat-search-clear"
- runFlow:
    when:
      visible:
        id: "ivx-owner-chat-scroll-to-latest"
    commands:
      - tapOn:
          id: "ivx-owner-chat-scroll-to-latest"
- assertNotVisible: "Not sent"
- assertNotVisible: "I was unable to display this reply"
- assertVisible:
    id: "ivx-owner-chat-composer-dock"
