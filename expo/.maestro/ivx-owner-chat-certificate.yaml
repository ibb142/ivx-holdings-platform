appId: com.ivxholdings.app.owner
name: IVX Owner Chat AI Certificate
tags:
  - android-qa
  - owner-auth
  - chat
  - ai
  - persistence
  - black-screen-regression
---
# Real-device owner chat certificate.
# Contract: send -> live AI reply -> render -> persistence -> reload.
# Fresh exact-SHA recertification requested 2026-09-06 after chat probe-gating repair.
# Retry state-machine behavior is hard-gated separately by
# expo/__tests__/chat-transport-reliability.test.ts.
- tapOn:
    id: "tab-chat"
- extendedWaitUntil:
    visible:
      id: "chat-open-message-room"
    timeout: 15000
- assertVisible: "IVX Owner AI room"
- tapOn:
    id: "chat-open-message-room"
- extendedWaitUntil:
    visible:
      id: "ivx-owner-chat-composer-dock"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "ivx-owner-chat-input"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "ivx-owner-chat-send"
    timeout: 10000
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
- tapOn:
    id: "ivx-owner-chat-input"
- inputText: "Return only the result of joining IVX_CHAT_E2E_ and OK_${IVX_CHAT_E2E_NONCE}."
- tapOn:
    id: "ivx-owner-chat-send"
- hideKeyboard
- extendedWaitUntil:
    visible: "Return only the result of joining IVX_CHAT_E2E_ and OK_${IVX_CHAT_E2E_NONCE}."
    timeout: 20000
- extendedWaitUntil:
    visible: "IVX_CHAT_E2E_OK_${IVX_CHAT_E2E_NONCE}"
    timeout: 60000
- assertNotVisible: "Not sent"
- assertNotVisible: "I was unable to display this reply"
- assertVisible:
    id: "ivx-owner-chat-composer-dock"
# Kill/relaunch without clearing app state. This proves the rendered thread is
# restored from the durable owner-chat persistence path, not just memory.
- stopApp
- launchApp:
    clearState: false
# The app intentionally signs out on cold launch. Reauthenticate without
# clearing app data, then verify the same durable conversation/route.
- runFlow: "reauthenticate.yaml"
# Return through the owner shell after the required manual sign-in.
- openLink: "ivx-app:///home"
- extendedWaitUntil:
    visible:
      id: "tab-chat"
    timeout: 20000
- tapOn:
    id: "tab-chat"
- extendedWaitUntil:
    visible:
      id: "chat-open-message-room"
    timeout: 15000
- tapOn:
    id: "chat-open-message-room"
- extendedWaitUntil:
    visible: "Return only the result of joining IVX_CHAT_E2E_ and OK_${IVX_CHAT_E2E_NONCE}."
    timeout: 30000
- extendedWaitUntil:
    visible: "IVX_CHAT_E2E_OK_${IVX_CHAT_E2E_NONCE}"
    timeout: 30000
- assertNotVisible: "Not sent"
- assertNotVisible: "I was unable to display this reply"
- assertVisible:
    id: "ivx-owner-chat-composer-dock"
