appId: com.ivxholdings.app.owner
name: IVX Owner Sign In + Home/Profile Black Screen Certificate
tags:
  - android-qa
  - owner-auth
  - home
  - profile
  - black-screen-regression
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 10000
- tapOn:
    id: "login-email"
- inputText: ${OWNER_EMAIL}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "login-password"
    timeout: 10000
- tapOn:
    id: "login-password"
- inputText: ${OWNER_PASSWORD}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 10000
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "IVXHOLDINGS"
    timeout: 30000
- assertVisible:
    id: "home-reels-button"
- assertVisible:
    id: "tab-home"
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 15000
- assertVisible:
    id: "profile-screen-root"
- assertVisible: "Profile"
- assertVisible: "Personal Information"
- assertVisible: "Wallet & Payments"
- assertVisible: "Sign Out"
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "IVXHOLDINGS"
    timeout: 10000
- assertVisible:
    id: "home-reels-button"
- assertVisible:
    id: "tab-home"
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
