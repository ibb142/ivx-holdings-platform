appId: com.ivxholdings.app.owner
name: IVX Owner Dashboard Certificate
tags:
  - android-qa
  - owner-auth
  - dashboard
  - critical
---
# Runs immediately after the real Owner login/Home certificate on the same
# installed process and session. Navigate through the visible in-app Owner tab,
# not an external URI. This validates the same route transition a real Owner uses
# and avoids losing/rehydrating auth state through Android intent dispatch.
- extendedWaitUntil:
    visible:
      id: "tab-owner-console"
    timeout: 15000
- tapOn:
    id: "tab-owner-console"
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000
- assertVisible: "Live"
- assertNotVisible: "Access denied"
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
- extendedWaitUntil:
    visible: "Members"
    timeout: 15000
- extendedWaitUntil:
    visible: "Properties"
    timeout: 15000
- extendedWaitUntil:
    visible: "Transactions"
    timeout: 15000
- swipe:
    start: 50%,80%
    end: 50%,25%
    duration: 800
- assertVisible: "Dashboard"
- assertNotVisible: "Something went wrong"
# Return through the native router/tab tree; the next certificate must inherit
# the exact authenticated session and prove IVX IA Chat live + persistence.
- back
- extendedWaitUntil:
    visible:
      id: "tab-chat"
    timeout: 20000
