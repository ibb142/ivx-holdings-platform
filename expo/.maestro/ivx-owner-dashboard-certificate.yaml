appId: com.ivxholdings.app.owner
name: IVX Owner Dashboard Certificate
tags:
  - android-qa
  - owner-auth
  - dashboard
  - critical
---
# Runs after the real owner login flow on the same installed QA build.
# IMPORTANT: use three slashes. With a custom scheme, ivx-app://admin/dashboard
# treats `admin` as the URL host and can resolve the app path incorrectly.
# ivx-app:///admin/dashboard preserves the Expo Router path `/admin/dashboard`.
- openLink: "ivx-app:///admin/dashboard"
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000
- assertVisible: "Live"
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
# Core owner dashboard modules must paint instead of a black/blank surface.
- extendedWaitUntil:
    visible: "Members"
    timeout: 15000
- extendedWaitUntil:
    visible: "Properties"
    timeout: 15000
- extendedWaitUntil:
    visible: "Transactions"
    timeout: 15000
# Exercise the scroll surface to catch delayed render/blank-screen regressions.
- swipe:
    start: 50%,80%
    end: 50%,25%
    duration: 800
- assertVisible: "Dashboard"
- assertNotVisible: "Something went wrong"
# Return to the authenticated owner shell so the next certificate can open Chat.
- openLink: "ivx-app:///"
- extendedWaitUntil:
    visible:
      id: "tab-chat"
    timeout: 20000
