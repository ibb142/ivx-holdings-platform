appId: com.ivxholdings.app.owner
name: IVX Owner Dashboard Certificate
tags:
  - android-qa
  - owner-auth
  - dashboard
  - critical
---
# Runs after the real owner login flow on the same installed QA build.
# Follow the authenticated owner UI instead of relying on a reactivation intent:
# the Owner-only CRM tab and the Admin layout both enforce the existing guards.
- tapOn:
    id: "tab-crm"
- extendedWaitUntil:
    visible: "CRM"
    timeout: 20000
- tapOn:
    id: "crm-link-admin-dashboard"
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 20000
- assertVisible: "Live"
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
# Core owner dashboard modules must paint instead of a black/blank surface.
- extendedWaitUntil:
    visible: "Members"
    timeout: 15000
- extendedWaitUntil:
    visible: "Properties"
    timeout: 15000
- extendedWaitUntil:
    visible: "Transactions"
    timeout: 15000
# Exercise the scroll surface to catch delayed render/blank-screen regressions.
- swipe:
    start: 50%,80%
    end: 50%,25%
    duration: 800
- assertVisible: "Dashboard"
- assertNotVisible: "Something went wrong"
# Return to the authenticated tab shell so the next certificate can open Chat.
- back
- extendedWaitUntil:
    visible:
      id: "tab-chat"
    timeout: 20000
