appId: com.ivxholdings.app
name: "IVX Chat QA — Full 20-Step Flow"
tags:
  - ios-qa
  - chat
  - owner
---
- launchApp:
    clearState: true
- assertVisible: "IVX"
- tapOn:
    id: "home-owner-login-entry"
- assertVisible: "Owner Login"
- tapOn:
    id: "owner-login-password"
- inputText: ${OWNER_PASSWORD}
- tapOn:
    id: "owner-login-submit"
- assertVisible: "IVX"
- tapOn: "IVX Owner AI"
- assertVisible:
    id: "ivx-owner-chat-list"
- assertNotVisible:
    id: "ivx-owner-scroll-to-latest"
- tapOn:
    id: "ivx-owner-chat-input"
- inputText: "QA test message — iOS simulator verification"
- tapOn:
    id: "ivx-owner-chat-send"
- assertVisible:
    text: "QA test message — iOS simulator verification"
- assertVisible:
    id: "ivx-owner-typing-indicator"
- assertNotVisible:
    id: "ivx-owner-typing-indicator"
- scroll:
    direction: UP
    distance: 200
- scroll:
    direction: UP
    distance: 500
- scroll:
    direction: DOWN
    distance: 500
- tapOn:
    id: "ivx-owner-chat-input"
- inputText: "Line 1\nLine 2\nLine 3"
- hideKeyboard
- backgroundApp
- launchApp:
    clearState: false
- killApp
- launchApp:
    clearState: false
- assertVisible: "IVX"
- tapOn: "IVX Owner AI"
- assertVisible:
    id: "ivx-owner-chat-list"
- assertNotVisible:
    id: "ivx-owner-scroll-to-latest"
