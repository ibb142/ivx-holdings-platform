appId: com.ivxholdings.app.owner
name: IVX Owner Sign In + Home Black Screen Certificate
tags:
  - android-qa
  - owner-auth
  - home
  - black-screen-regression
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 15000
- assertVisible:
    id: "login-email"
- tapOn:
    id: "login-email"
- inputText: ${OWNER_EMAIL}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "login-password"
    timeout: 10000
- tapOn:
    id: "login-password"
- inputText: ${OWNER_PASSWORD}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 10000
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "owner-home-ready"
    timeout: 30000
- assertVisible:
    id: "home-runtime-ready"
- assertVisible: "Home ready"
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "owner-home-ready"
    timeout: 10000
- assertVisible: "Home ready"
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
