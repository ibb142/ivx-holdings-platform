appId: com.ivxholdings.app.owner
name: IVX Native Chat to Autonomous Certificate
tags:
  - android-qa
  - owner-auth
  - autonomous
---
- openLink: "ivx-app:///chat-hub"
- extendedWaitUntil:
    visible:
      id: "public-chat-new-session-button"
    timeout: 20000
- tapOn:
    id: "public-chat-new-session-button"
- extendedWaitUntil:
    visible:
      id: "public-chat-message-input"
    timeout: 10000
- assertNotVisible: ".*AUTONOMOUS TASK CREATED.*"
- tapOn:
    id: "public-chat-message-input"
- inputText: "Audit the repository pipeline in read-only mode and report findings. Verification reference ${IVX_HANDOFF_NONCE}."
- hideKeyboard
- tapOn:
    id: "public-chat-send-button"
- extendedWaitUntil:
    visible: ".*AUTONOMOUS TASK CREATED.*"
    timeout: 60000
- assertNotVisible: ".*No response body received.*"
- assertNotVisible: ".*AUTONOMOUS TASK: BLOCKED.*"
- assertNotVisible: ".*APPROVAL REQUIRED.*"
- takeScreenshot: native-autonomous-handoff
