# IVX E2E Registration Flow (item 191)
# Maestro flow for testing the IVX investor intake funnel on mobile.
# Run: maestro test ivx-e2e-registration.yml

appId: host.exp.exponent
---
# Launch the app
- launchApp

# Wait for the app to load
- waitForElementToBeVisible:
    id: "home-screen"

# Navigate to investor intake
- tapOn:
    text: "Get Started"

# Fill funnel form — Step 1: Name and email
- tapOn:
    id: "funnel-name"
- inputText: "Test Investor"

- tapOn:
    id: "funnel-email"
- inputText: "test-investor@example.com"

# Phone (optional)
- tapOn:
    id: "funnel-phone"
- inputText: "3055551234"

# Investment range
- tapOn:
    id: "funnel-range"
- inputText: "100000-500000"

# Consent checkbox
- tapOn:
    id: "funnel-consent"

# Submit
- tapOn:
    text: "Submit"

# Verify success message
- waitForElementToBeVisible:
    text: ".*received.*"

# Navigate back
- tapOn:
    text: "Close"
