appId: com.ivxholdings.app.owner
name: IVX Nested Admin to Public Chat Navigation
---
# Reproduce the exact transition observed in run 34690615318. The app must
# paint the destination, not merely remain alive on the previous screen.
- openLink: "ivx-app:///admin/waitlist-admin"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Waitlist Admin"
- openLink: "ivx-app:///chat-hub"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "public-chat-message-input"
- assertNotVisible: "Waitlist Admin"
- assertNotVisible: "IVX public chat unavailable"
- takeScreenshot: "public-chat-after-admin"
- openLink: "ivx-app:///app-guide"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "App Guide"
- assertNotVisible: "Waitlist Admin"
- takeScreenshot: "app-guide-after-public-chat"
