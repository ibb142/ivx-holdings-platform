# IVX Chat — 20-Step Full Lifecycle QA Flow
# Required by owner: launch → login → chat open → newest visible →
# no initial jump → send → appears once → realtime reply →
# scroll older → pagination → stable position → return to latest →
# keyboard → multiline → close keyboard → background/resume →
# restart → reopen → newest still visible
#
# Run: maestro test .maestro/ivx-chat-full-qa.yaml
# Env: OWNER_EMAIL, OWNER_PASSWORD (export before running)

appId: com.ivxholdings.app
name: IVX Chat 20-Step Full Lifecycle QA
tags:
  - ios-qa
  - chat
  - full-lifecycle
  - critical

---
# ── Step 1: Launch app ──────────────────────────────────────────
- launchApp:
    clearState: true
- assertVisible: "IVX"

# ── Step 2: Owner login ─────────────────────────────────────────
- tapOn:
    id: "home-owner-login-entry"
- assertVisible: "Owner Login"
- tapOn:
    id: "login-email"
- inputText: ${OWNER_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${OWNER_PASSWORD}
- tapOn:
    id: "login-submit"
- assertVisible: "IVX"

# ── Step 3: Open IVX Chat ───────────────────────────────────────
- tapOn: "IVX Owner AI"
- assertVisible:
    id: "ivx-owner-chat-composer-dock"
    timeout: 15000

# ── Step 4: Confirm latest conversation opens ───────────────────
- assertVisible:
    id: "ivx-owner-chat-composer"
    timeout: 10000

# ── Step 5: Confirm newest message is visible ───────────────────
# The inverted FlatList anchors at the newest message on first layout.
# If the composer dock is visible and the list is loaded, the newest
# message should be at the top of the visible viewport.
- assertVisible:
    id: "ivx-owner-chat-composer-dock"
    timeout: 10000

# ── Step 6: Confirm yellow arrow is HIDDEN on initial open ──────
# The scroll-to-latest button (yellow arrow) must NOT be visible
# when the chat first opens, because the inverted list anchors at
# the newest message naturally.
- assertNotVisible:
    id: "ivx-owner-chat-scroll-to-latest"
    timeout: 3000

# ── Step 7: Send a message ──────────────────────────────────────
- tapOn:
    id: "ivx-owner-chat-input"
- inputText: "QA test message — automated iOS flow"
- tapOn:
    id: "ivx-owner-chat-send"

# ── Step 8: Confirm message appears exactly once ────────────────
# Wait for the message to appear, then verify no duplicate renders.
- assertVisible: "QA test message — automated iOS flow"
    timeout: 10000

# ── Step 9: Receive/simulate authorized realtime reply ──────────
# If the backend is online, an AI reply should appear.
# If backend is hibernating, this step may timeout — that is acceptable.
- runFlow:
    when:
      visible:
        id: "ivx-owner-chat-composer-dock"
        timeout: 30000
    commands:
      - assertVisible:
          id: "ivx-owner-chat-composer-dock"
          timeout: 5000

# ── Step 10: Scroll to older messages ───────────────────────────
# Swipe UP to scroll toward older messages (inverted list: up = older).
- swipe:
    start: 50%,30%
    end: 50%,70%
    duration: 800

# ── Step 11: Trigger pagination ─────────────────────────────────
# Continue scrolling up to trigger the onEndReached pagination handler.
- swipe:
    start: 50%,20%
    end: 50%,80%
    duration: 800
- swipe:
    start: 50%,20%
    end: 50%,80%
    duration: 800

# ── Step 12: Confirm visible position remains stable ────────────
# After pagination loads older messages, the scroll position should
# not jump. We verify the composer dock is still accessible (not stuck).
- swipe:
    start: 50%,70%
    end: 50%,30%
    duration: 800

# ── Step 13: Return to latest ───────────────────────────────────
# If the yellow arrow appeared after scrolling, tap it to return.
# Otherwise, scroll down to the newest message.
- runFlow:
    when:
      visible:
        id: "ivx-owner-chat-scroll-to-latest"
        timeout: 3000
    commands:
      - tapOn:
          id: "ivx-owner-chat-scroll-to-latest"
- swipe:
    start: 50%,70%
    end: 50%,20%
    duration: 600
- swipe:
    start: 50%,70%
    end: 50%,20%
    duration: 600

# ── Step 14: Open keyboard ──────────────────────────────────────
- tapOn:
    id: "ivx-owner-chat-input"

# ── Step 15: Enter multiline text ───────────────────────────────
- inputText: "Line one\nLine two\nLine three"

# ── Step 16: Close keyboard ─────────────────────────────────────
# Tap outside the input to dismiss the keyboard.
- tapOn:
    point: 50%,10%

# ── Step 17: Background and resume ──────────────────────────────
- runBackground:
    duration: 3000
- assertVisible:
    id: "ivx-owner-chat-composer-dock"
    timeout: 10000

# ── Step 18: Restart app ────────────────────────────────────────
- killApp
- launchApp:
    clearState: false

# ── Step 19: Reopen chat ────────────────────────────────────────
- tapOn: "IVX Owner AI"
- assertVisible:
    id: "ivx-owner-chat-composer-dock"
    timeout: 15000

# ── Step 20: Confirm newest message remains visible ─────────────
# After restart, the inverted FlatList should anchor at the newest
# message again without any scroll-to-end timer.
- assertVisible:
    id: "ivx-owner-chat-composer-dock"
    timeout: 10000
- assertNotVisible:
    id: "ivx-owner-chat-scroll-to-latest"
    timeout: 3000
