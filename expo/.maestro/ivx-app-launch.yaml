# IVX App Launch QA — No auth required
# Verifies the app launches without crashing and shows the IVX brand.
# This flow runs on every iOS QA build, even without OWNER_PASSWORD secret.
appId: com.ivxholdings.app
name: IVX App Launch QA
tags:
  - ios-qa
  - launch
  - no-auth
---
- launchApp:
    clearState: true
- assertVisible: "IVX"
