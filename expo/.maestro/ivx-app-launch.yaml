# IVX App Launch QA — no credentials required
# Verifies the native app launches, resolves the canonical login deep link,
# waits for the React Native bundle/navigation to settle on CI,
# and renders the real sign-in surface used by member password recovery.
appId: com.ivxholdings.app
name: IVX App Launch QA
tags:
  - ios-qa
  - launch
  - no-auth
---
- launchApp:
    clearState: true
- openLink: "ivx-app://login"
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 60000
- assertVisible: "Sign In"
