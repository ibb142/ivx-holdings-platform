# IVX App Launch QA — no credentials required
# Preserve Expo development-client state established by `expo run:android`.
# Clearing app data here deletes the dev-client Metro connection and can leave
# the app unable to render the React Native login surface in CI.
appId: com.ivxholdings.app
name: IVX App Launch QA
tags:
  - ios-qa
  - launch
  - no-auth
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "IVX"
    timeout: 30000
- openLink: "ivx-app://login"
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 60000
- assertVisible: "Sign In"
