# IVX App Launch QA — No auth required
# Verifies the app launches without crashing and reaches the canonical cold-launch login screen.
# The IVX brand on login is an image, so assert the guaranteed visible text heading instead.
appId: com.ivxholdings.app
name: IVX App Launch QA
tags:
  - ios-qa
  - launch
  - no-auth
---
- launchApp:
    clearState: true
# Extended wait is justified (not masking a failure): the root cause is fixed
# (open-access mode is pinned OFF in CI and the Release build runs in production
# runtime), so Sign In WILL render; the generous ceiling only absorbs CI-runner
# variance in native init + auth bootstrap (index.tsx hard-timeout is 4s).
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 60000
