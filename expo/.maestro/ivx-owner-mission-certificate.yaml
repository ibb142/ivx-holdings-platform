appId: com.ivxholdings.app.owner
name: IVX Aviation Mission Control Certificate
tags:
  - android-qa
  - owner-auth
  - dashboard
---
- openLink: "ivx-app:///autonomous-dashboard"
- extendedWaitUntil:
    visible: "IVX MISSION CONTROL"
    timeout: 20000
- extendedWaitUntil:
    visible: "LIVE TELEMETRY"
    timeout: 45000
- assertVisible:
    id: "ivx-mission-control-screen"
- scrollUntilVisible:
    element:
      text: "112/112"
    direction: DOWN
    timeout: 15000
- assertNotVisible: "Something went wrong"
- stopApp
- launchApp:
    clearState: false
- openLink: "ivx-app:///autonomous-dashboard"
- extendedWaitUntil:
    visible: "IVX MISSION CONTROL"
    timeout: 20000
- extendedWaitUntil:
    visible: "LIVE TELEMETRY"
    timeout: 45000
- openLink: "ivx-app:///home"
- extendedWaitUntil:
    visible:
      id: "tab-chat"
    timeout: 20000
