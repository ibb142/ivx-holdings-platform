appId: com.ivxholdings.app.owner
name: IVX Owner Profile Black Screen Certificate
tags:
  - android-qa
  - owner-auth
  - profile
  - black-screen-regression
---
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "profile-screen-root"
    timeout: 15000
- extendedWaitUntil:
    visible: "Profile"
    timeout: 10000
- assertVisible: "Profile"
- assertVisible: "Personal Information"
- assertVisible: "Wallet & Payments"
- assertVisible:
    id: "tab-profile"
# Scroll to the bottom of the fail-safe module list and prove Sign Out renders.
# Explicit swipes cover the bulk of the list deterministically; scrollUntilVisible
# backstops any shortfall (on the software-rendered emulator it advances too
# slowly on its own to cross the full ~2600dp of content within its timeout).
- swipe:
    start: "50%, 85%"
    end: "50%, 15%"
- swipe:
    start: "50%, 85%"
    end: "50%, 15%"
- swipe:
    start: "50%, 85%"
    end: "50%, 15%"
- swipe:
    start: "50%, 85%"
    end: "50%, 15%"
- swipe:
    start: "50%, 85%"
    end: "50%, 15%"
- swipe:
    start: "50%, 85%"
    end: "50%, 15%"
- scrollUntilVisible:
    element:
      text: "Sign Out"
    timeout: 20000
- assertVisible: "Sign Out"
# The Profile title lives in a fixed header above the ScrollView, so it remains
# visible even at the bottom of the list.
- assertVisible: "Profile"
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
