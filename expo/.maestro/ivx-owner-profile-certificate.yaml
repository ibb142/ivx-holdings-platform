appId: com.ivxholdings.app.owner
name: IVX Owner Profile Black Screen Certificate
tags:
  - android-qa
  - owner-auth
  - profile
  - black-screen-regression
---
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "profile-screen-root"
    timeout: 15000
- extendedWaitUntil:
    visible: "Profile"
    timeout: 10000
- assertVisible: "Profile"
- assertVisible: "Personal Information"
- assertVisible: "Wallet & Payments"
- assertVisible:
    id: "tab-profile"
# Prove the full fail-safe module list renders below the fold, including Sign Out.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    timeout: 20000
- assertVisible: "Sign Out"
# Return to the top of the list so the delayed UIAutomator checkpoints run by
# the harness still find the Profile title inside the visible hierarchy.
- swipe:
    start: "50%, 25%"
    end: "50%, 80%"
- swipe:
    start: "50%, 25%"
    end: "50%, 80%"
- swipe:
    start: "50%, 25%"
    end: "50%, 80%"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 10000
- assertVisible: "Profile"
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
