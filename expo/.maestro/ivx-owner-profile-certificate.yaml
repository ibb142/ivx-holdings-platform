appId: com.ivxholdings.app.owner
name: IVX Owner Profile Black Screen Certificate
tags:
  - android-qa
  - owner-auth
  - profile
  - black-screen-regression
---
# The fail-safe Profile screen renders synchronously with no remote dependency,
# so the first viewport must contain the title and the first module rows the
# instant the tab is tapped. The complete module route list (all 32 routes plus
# Sign Out and the Owner Console) is hard-gated at source level by
# expo/__tests__/profile-full-failsafe-regression.test.ts in the IVX QA Suite;
# this device certificate proves the rendered surface: root, title, first
# modules, tab bar, and no auth-failure fallback — matching the P0 Phase 4
# checkpoint contract (profile root visible, tab-profile visible, non-empty
# hierarchy, no fatal exception, no black surface) at tap time, and the
# harness re-verifies at +2s/+5s/+10s.
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "profile-screen-root"
    timeout: 15000
- extendedWaitUntil:
    visible: "Profile"
    timeout: 10000
- assertVisible: "Profile"
- assertVisible: "IVX HOLDINGS"
- assertVisible: "Personal Information"
- assertVisible: "Wallet & Payments"
- assertVisible:
    id: "tab-profile"
- assertNotVisible: "Sign In Failed"
- assertNotVisible: "Login service temporarily unavailable"
