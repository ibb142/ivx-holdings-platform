name: IVX 112 Agent Utilization & Cascade QA

on:
  pull_request:
    paths:
      - 'backend/services/ivx-autonomous-truth-control.ts'
      - 'backend/services/ivx-campaign-dispatcher.ts'
      - 'backend/api/ivx-agent-api.ts'
      - '.github/workflows/ivx-112-utilization-repair.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ivx-112-agent-utilization-cascade-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-cascade-and-utilization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify 10 -> 10 cascade contract
        shell: bash
        run: |
          set -euo pipefail
          file=backend/services/ivx-autonomous-truth-control.ts
          grep -q "IVX_AUTONOMOUS_CASCADE_SEED_SIZE = 10" "$file"
          grep -q "IVX_AUTONOMOUS_CASCADE_FANOUT = 10" "$file"
          grep -q "async function cascadeStartAllAgents" "$file"
          grep -q "if(action==='start_all') await cascadeStartAllAgents()" "$file"
          grep -q "cascadeActivation:{seedSize:IVX_AUTONOMOUS_CASCADE_SEED_SIZE,fanout:IVX_AUTONOMOUS_CASCADE_FANOUT}" "$file"
          echo 'cascade_10x10_contract=PASS'

      - name: Verify 112 utilization invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Math.min(raw, 112) : 112" backend/services/ivx-campaign-dispatcher.ts
          grep -q "CONTINUOUS LOW-RISK BACKLOG" backend/services/ivx-campaign-dispatcher.ts
          grep -q "utilization24h" backend/services/ivx-campaign-dispatcher.ts
          grep -q "Promise.all(batch.map" backend/api/ivx-agent-api.ts
          grep -q "IVX_AGENT_EXECUTE_ALL_CONCURRENCY" backend/api/ivx-agent-api.ts
          echo 'utilization_invariants=PASS'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Backend TypeScript hard gate
        run: bunx tsc -p backend/tsconfig.json --noEmit

      - name: Focused cascade, agent, and dispatcher tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find backend -type f \( -name '*autonomous-truth-control*.test.ts' -o -name '*campaign-dispatcher*.test.ts' -o -name '*agent-api*.test.ts' -o -name '*agent-runtime*.test.ts' \) -print)
          if [ "${#files[@]}" -gt 0 ]; then bun test "${files[@]}"; else echo "No focused tests found"; fi
