name: IVX 112 Agent Utilization Repair

on:
  push:
    branches:
      - fix/112-agent-utilization-control
    paths:
      - '.github/workflows/ivx-112-utilization-repair.yml'
      - 'scripts/repair-112-utilization.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ivx-112-agent-utilization-repair
  cancel-in-progress: false

jobs:
  repair-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/112-agent-utilization-control
          fetch-depth: 0

      - name: Apply deterministic utilization repair
        run: node scripts/repair-112-utilization.mjs

      - name: Static safety assertions
        run: |
          set -euo pipefail
          grep -q "Math.min(raw, 112) : 112" backend/services/ivx-campaign-dispatcher.ts
          grep -q "CONTINUOUS LOW-RISK BACKLOG" backend/services/ivx-campaign-dispatcher.ts
          grep -q "utilization24h" backend/services/ivx-campaign-dispatcher.ts
          grep -q "Promise.all(batch.map" backend/api/ivx-agent-api.ts
          grep -q "IVX_AGENT_EXECUTE_ALL_CONCURRENCY" backend/api/ivx-agent-api.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Backend TypeScript hard gate
        run: bunx tsc -p backend/tsconfig.json --noEmit

      - name: Focused agent and dispatcher tests
        run: |
          set -euo pipefail
          mapfile -t files < <(find backend -type f \( -name '*campaign-dispatcher*.test.ts' -o -name '*agent-api*.test.ts' -o -name '*app-completion-campaign*.test.ts' -o -name '*agent-runtime*.test.ts' \) -print)
          if [ "${#files[@]}" -gt 0 ]; then bun test "${files[@]}"; else echo "No focused tests found"; fi

      - name: Commit QA-verified source repair
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/services/ivx-campaign-dispatcher.ts backend/api/ivx-agent-api.ts; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "ivx-autonomous"
          git config user.email "ivx-autonomous@users.noreply.github.com"
          git add backend/services/ivx-campaign-dispatcher.ts backend/api/ivx-agent-api.ts
          git commit -m "fix(autonomous): unleash 112-agent utilization safely"
          git push origin HEAD:fix/112-agent-utilization-control
