name: IVX 112 Three-Layer 24x7 Production Enforcer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-112-production-3layer-enforcer.yml'
      - '.github/workflows/ivx-112-no-idle-failclosed-recovery.yml'
      - '.github/workflows/ivx-112-2000h-utilization-sla.yml'
      - '.github/workflows/ivx-112-24x7-watchdog.yml'
      - 'backend/services/ivx-campaign-dispatcher.ts'
      - 'backend/api/ivx-agent-api.ts'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: ivx-112-three-layer-production-enforcer
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API_BASE: https://api.ivxholding.com
      MIN_PRODUCTIVE_AGENT_HOURS: '2000'
      STRONG_TARGET_AGENT_HOURS: '2400'
      MIN_UTILIZATION_PERCENT: '74.4'
      STRONG_TARGET_UTILIZATION_PERCENT: '89.29'
      IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
      IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
    steps:
      - name: Layer 1 - verify execution capacity and live production truth
        id: truth
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --max-time 30 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/truth.json
          test "$(jq -r '.ok // false' /tmp/truth.json)" = true
          max=$(jq -r '.dispatcher.maxConcurrency // 0' /tmp/truth.json)
          running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/truth.json)
          queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/truth.json)
          owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/truth.json)
          productive=$(jq -r '.dispatcher.utilization24h.productiveAgentHours // 0' /tmp/truth.json)
          utilization=$(jq -r '.dispatcher.utilization24h.utilizationPercent // 0' /tmp/truth.json)
          failed=$(jq -r '.dispatcher.totals.failed // 0' /tmp/truth.json)
          blocked=$(jq -r '.dispatcher.totals.blocked // 0' /tmp/truth.json)
          test "$max" -eq 112
          printf 'L1 max=%s running=%s queued=%s ownerGate=%s productive=%s utilization=%s failed=%s blocked=%s\n' "$max" "$running" "$queued" "$owner_gate" "$productive" "$utilization" "$failed" "$blocked"
          echo "running=$running" >> "$GITHUB_OUTPUT"
          echo "queued=$queued" >> "$GITHUB_OUTPUT"
          echo "owner_gate=$owner_gate" >> "$GITHUB_OUTPUT"
          echo "productive=$productive" >> "$GITHUB_OUTPUT"
          echo "utilization=$utilization" >> "$GITHUB_OUTPUT"

      - name: Layer 2 - obtain Autonomous OIDC recovery identity
        if: steps.truth.outputs.running == '0' || fromJSON(steps.truth.outputs.utilization) < 74.4
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$token_json" | jq -r '.value // empty')
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Layer 2 - root resume and immediate dispatcher tick
        if: steps.truth.outputs.running == '0' || fromJSON(steps.truth.outputs.utilization) < 74.4
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 45 -o /tmp/resume.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: $OIDC_TOKEN" \
            -d '{"action":"resume_all"}' "$API_BASE/api/ivx/agents/app-completion/control")
          echo "resume_http=$code"
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/resume.json)" = true

      - name: Layer 2 - check whether root resume started real workers
        if: steps.truth.outputs.running == '0'
        id: root_verify
        shell: bash
        run: |
          set -euo pipefail
          started=false
          for attempt in 1 2 3; do
            sleep 5
            curl -fsS --retry 2 --retry-delay 1 --max-time 20 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/root-after.json
            running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/root-after.json)
            queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/root-after.json)
            echo "root_attempt=$attempt running=$running queued=$queued"
            if [ "$running" -gt 0 ]; then started=true; break; fi
          done
          echo "started=$started" >> "$GITHUB_OUTPUT"

      - name: Layer 2 - bounded per-agent recycling fallback
        if: steps.truth.outputs.running == '0' && steps.root_verify.outputs.started != 'true'
        shell: bash
        run: |
          set -euo pipefail
          owner_key="${IVX_SYSTEM_SECRET:-${IVX_AI_SYSTEM_SECRET:-}}"
          if [ -z "$owner_key" ]; then
            echo 'owner_secret_unavailable=true; continuing to second signed resume'
            exit 0
          fi
          rm -f /tmp/retry-failures
          export owner_key API_BASE
          seq 1 112 | xargs -P 8 -I{} bash -c '
            agent="$1"
            code=$(curl -sS --connect-timeout 3 --max-time 6 -o "/tmp/retry-${agent}.json" -w "%{http_code}" \
              -X POST -H "content-type: application/json" -H "x-ivx-owner-key: ${owner_key}" \
              -d "{\"action\":\"retry_agent\",\"agentNumber\":${agent}}" \
              "${API_BASE}/api/ivx/agents/app-completion/control" 2>/dev/null || printf 000)
            if [ "$code" != 200 ]; then printf "%s\n" "$agent" >> /tmp/retry-failures; fi
          ' _ {}
          failures=0
          if [ -f /tmp/retry-failures ]; then failures=$(wc -l < /tmp/retry-failures); fi
          echo "bounded_retry_failures=$failures"
          exit 0

      - name: Layer 2 - second signed resume after bounded recycling
        if: steps.truth.outputs.running == '0' && steps.root_verify.outputs.started != 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 45 -o /tmp/resume2.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: $OIDC_TOKEN" \
            -d '{"action":"resume_all"}' "$API_BASE/api/ivx/agents/app-completion/control")
          echo "resume2_http=$code"
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/resume2.json)" = true

      - name: Layer 2 - require real workers after recovery
        if: steps.truth.outputs.running == '0'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            curl -fsS --retry 2 --retry-delay 1 --max-time 20 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/recovery.json
            running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/recovery.json)
            queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/recovery.json)
            echo "recovery_attempt=$attempt running=$running queued=$queued"
            if [ "$running" -gt 0 ]; then exit 0; fi
          done
          echo 'LAYER2_FAIL: production remained at 0 RUNNING after recovery.'
          exit 1

      - name: Layer 3 - enforce strong productive-hours market
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --max-time 30 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/final.json
          productive=$(jq -r '.dispatcher.utilization24h.productiveAgentHours // 0' /tmp/final.json)
          utilization=$(jq -r '.dispatcher.utilization24h.utilizationPercent // 0' /tmp/final.json)
          running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/final.json)
          queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/final.json)
          owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/final.json)
          printf 'L3 productive=%s utilization=%s running=%s queued=%s ownerGate=%s floorHours=%s strongHours=%s\n' "$productive" "$utilization" "$running" "$queued" "$owner_gate" "$MIN_PRODUCTIVE_AGENT_HOURS" "$STRONG_TARGET_AGENT_HOURS"
          if [ "$running" -eq 0 ] && [ "$queued" -gt 0 ]; then
            echo 'HARD_FAIL: executable backlog exists while 0 workers are RUNNING.'
            exit 1
          fi
          if [ "$running" -eq 0 ] && [ "$queued" -eq 0 ] && [ "$owner_gate" -eq 0 ]; then
            echo 'HARD_FAIL: fleet has no productive work and no owner gate; backlog creation/recycling is required.'
            exit 1
          fi
          awk -v p="$productive" -v m="$MIN_PRODUCTIVE_AGENT_HOURS" 'BEGIN { exit !((p+0) >= (m+0)) }' || {
            echo 'HARD_FAIL: rolling productive IA-hours are below the 2000-hour enterprise floor.'
            exit 1
          }
          if awk -v p="$productive" -v s="$STRONG_TARGET_AGENT_HOURS" -v u="$utilization" -v su="$STRONG_TARGET_UTILIZATION_PERCENT" 'BEGIN { exit !((p+0) >= (s+0) && (u+0) >= (su+0)) }'; then
            echo 'IVX_112_STRONG_MARKET=PASS target=2400h utilization>=89.29%'
          else
            echo 'IVX_112_STRONG_MARKET=BUILDING floor=PASS strong_target=NOT_YET'
          fi
