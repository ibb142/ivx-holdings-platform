name: IVX 112 Three-Layer 24x7 Production Enforcer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-112-production-3layer-enforcer.yml'
      - '.github/workflows/ivx-112-no-idle-failclosed-recovery.yml'
      - '.github/workflows/ivx-112-2000h-utilization-sla.yml'
      - '.github/workflows/ivx-112-24x7-watchdog.yml'
      - 'backend/services/ivx-campaign-dispatcher.ts'
      - 'backend/api/ivx-agent-api.ts'
      - 'backend/services/ivx-autonomous-runtime-enforcer.ts'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: ivx-112-three-layer-production-enforcer
  cancel-in-progress: true

env:
  API_BASE: https://api.ivxholding.com
  MIN_PRODUCTIVE_AGENT_HOURS: '2000'
  IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
  IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify execution capacity and live production truth
        id: truth
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/truth.json
          test "$(jq -r '.ok // false' /tmp/truth.json)" = true
          max=$(jq -r '.dispatcher.maxConcurrency // 0' /tmp/truth.json)
          running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/truth.json)
          queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/truth.json)
          owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/truth.json)
          productive=$(jq -r '.dispatcher.utilization24h.productiveAgentHours // 0' /tmp/truth.json)
          test "$max" -eq 112
          recovery=false
          if [ "$owner_gate" -eq 0 ] && { [ "$running" -eq 0 ] || { [ "$queued" -gt 0 ] && [ "$running" -lt "$max" ]; }; }; then recovery=true; fi
          echo "running=$running" >> "$GITHUB_OUTPUT"
          echo "queued=$queued" >> "$GITHUB_OUTPUT"
          echo "owner_gate=$owner_gate" >> "$GITHUB_OUTPUT"
          echo "productive=$productive" >> "$GITHUB_OUTPUT"
          echo "max=$max" >> "$GITHUB_OUTPUT"
          echo "recovery=$recovery" >> "$GITHUB_OUTPUT"
          printf 'max=%s running=%s queued=%s ownerGate=%s productive=%s recovery=%s\n' "$max" "$running" "$queued" "$owner_gate" "$productive" "$recovery"

      - name: Obtain bounded Autonomous recovery identity
        if: steps.truth.outputs.recovery == 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsS --max-time 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$token_json" | jq -r '.value // empty')
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Recover partial or total worker fleet
        if: steps.truth.outputs.recovery == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/resume.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: $OIDC_TOKEN" -d '{"action":"resume_all"}' "$API_BASE/api/ivx/agents/app-completion/control")
          echo "resume_http=$code"
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/resume.json)" = true

      - name: Fail closed on fleet collapse
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS --retry 2 --retry-delay 1 --max-time 20 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/final.json
          max=$(jq -r '.dispatcher.maxConcurrency // 0' /tmp/final.json)
          running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/final.json)
          queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/final.json)
          owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/final.json)
          productive=$(jq -r '.dispatcher.utilization24h.productiveAgentHours // 0' /tmp/final.json)
          echo "final max=$max running=$running queued=$queued ownerGate=$owner_gate productive=$productive"
          test "$max" -eq 112
          if [ "$running" -eq 0 ] && [ "$owner_gate" -eq 0 ]; then
            echo 'HARD_FAIL: 112-agent fleet collapsed to zero without an owner gate.'
            exit 1
          fi
          if [ "$queued" -gt 0 ] && [ "$running" -lt "$max" ] && [ "$owner_gate" -eq 0 ]; then
            echo 'PARTIAL_FLEET: executable backlog remains below max concurrency; next watchdog tick will recover again.'
          fi
