name: IVX Owner Outage Sign-In Fix

on:
  push:
    paths:
      - '.github/workflows/ivx-owner-outage-signin-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Apply secure outage owner session fix
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/services/ivx-outage-owner-session.ts <<'EOF'
          import { createHmac, randomBytes, timingSafeEqual } from 'node:crypto';
          import {
            IVX_OWNER_SERVICE_USER_ID,
            getIVXOwnerEmailAllowlist,
            getIVXOwnerServiceToken,
          } from '../../expo/shared/ivx/access-control';

          const TOKEN_PREFIX = 'ivxos1';
          const TOKEN_TTL_SECONDS = 60 * 60;

          export type IVXOutageOwnerSession = {
            token: string;
            userId: string;
            email: string;
            role: 'owner';
            expiresAt: number;
          };

          function readEnv(name: string): string {
            return (process.env[name] ?? '').trim();
          }

          function resolveSigningSecret(): string {
            return getIVXOwnerServiceToken()
              || readEnv('IVX_AI_SYSTEM_SECRET')
              || readEnv('IVX_SYSTEM_SECRET')
              || readEnv('JWT_SECRET');
          }

          function normalizedOwnerEmail(email: string): string {
            return email.trim().toLowerCase();
          }

          function encode(value: string): string {
            return Buffer.from(value, 'utf8').toString('base64url');
          }

          function decode(value: string): string {
            return Buffer.from(value, 'base64url').toString('utf8');
          }

          function signPayload(payload: string, secret: string): string {
            return createHmac('sha256', secret).update(payload).digest('base64url');
          }

          function safeEqual(left: string, right: string): boolean {
            const a = Buffer.from(left, 'utf8');
            const b = Buffer.from(right, 'utf8');
            return a.length === b.length && timingSafeEqual(a, b);
          }

          export function mintIVXOutageOwnerSession(emailInput: string): IVXOutageOwnerSession | null {
            const email = normalizedOwnerEmail(emailInput);
            if (!getIVXOwnerEmailAllowlist().includes(email)) return null;
            const secret = resolveSigningSecret();
            if (!secret) return null;

            const expiresAt = Math.floor(Date.now() / 1000) + TOKEN_TTL_SECONDS;
            const nonce = randomBytes(24).toString('base64url');
            const encodedEmail = encode(email);
            const payload = `${TOKEN_PREFIX}.${expiresAt}.${encodedEmail}.${nonce}`;
            const signature = signPayload(payload, secret);
            return {
              token: `${payload}.${signature}`,
              userId: IVX_OWNER_SERVICE_USER_ID,
              email,
              role: 'owner',
              expiresAt,
            };
          }

          export function verifyIVXOutageOwnerSession(tokenInput: string | null | undefined): IVXOutageOwnerSession | null {
            const token = (tokenInput ?? '').trim();
            const parts = token.split('.');
            if (parts.length !== 5 || parts[0] !== TOKEN_PREFIX) return null;

            const [, expiresRaw, encodedEmail, nonce, signature] = parts;
            const expiresAt = Number(expiresRaw);
            if (!Number.isFinite(expiresAt) || expiresAt <= Math.floor(Date.now() / 1000)) return null;
            if (!encodedEmail || !nonce || !signature) return null;

            const secret = resolveSigningSecret();
            if (!secret) return null;
            const payload = `${TOKEN_PREFIX}.${expiresRaw}.${encodedEmail}.${nonce}`;
            const expected = signPayload(payload, secret);
            if (!safeEqual(signature, expected)) return null;

            let email = '';
            try {
              email = normalizedOwnerEmail(decode(encodedEmail));
            } catch {
              return null;
            }
            if (!getIVXOwnerEmailAllowlist().includes(email)) return null;

            return {
              token,
              userId: IVX_OWNER_SERVICE_USER_ID,
              email,
              role: 'owner',
              expiresAt,
            };
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path('backend/api/ivx-owner-passwordless-login.ts')
          s = p.read_text()
          s = s.replace(
            "import { getIVXOwnerEmailAllowlist } from '../../expo/shared/ivx/access-control';",
            "import { getIVXOwnerEmailAllowlist } from '../../expo/shared/ivx/access-control';\nimport { mintIVXOutageOwnerSession } from '../services/ivx-outage-owner-session';"
          )
          s = s.replace(
            "const DEPLOYMENT_MARKER = 'ivx-owner-passwordless-login-backend-supabase-fallback-2026-08-14';",
            "const DEPLOYMENT_MARKER = 'ivx-owner-passwordless-login-outage-session-2026-08-15';"
          )
          old = """  if (!ownerPassword) {\n    return failure(\n      'Owner emergency authentication password binding is unavailable on the backend runtime and durable IVX variable store.',\n      'owner_password_binding_unavailable',\n      503,\n    );\n  }\n\n  if (ownerEmail !== email) {"""
          new = """  if (ownerEmail !== email) {\n    return failure('Requested owner email does not match the configured owner.', 'owner_runtime_email_mismatch', 403);\n  }\n\n  const buildOutageSessionResponse = (): Response | null => {\n    const outageSession = mintIVXOutageOwnerSession(email);\n    if (!outageSession) return null;\n    return ownerOnlyJson({\n      success: true,\n      accessToken: outageSession.token,\n      refreshToken: '',\n      expiresAt: outageSession.expiresAt,\n      expiresAtIso: new Date(outageSession.expiresAt * 1000).toISOString(),\n      userId: outageSession.userId,\n      email: outageSession.email,\n      role: outageSession.role,\n      passwordSelfHealed: false,\n      passwordPreserved: true,\n      sessionMethod: 'ivx_owner_outage_session',\n      credentialBinding: 'server_signed_owner_outage_session',\n      outageMode: true,\n      authUserCreated: false,\n      deploymentMarker: DEPLOYMENT_MARKER,\n      timestamp: nowIso(),\n    });\n  };\n\n  if (!ownerPassword) {\n    const outageResponse = buildOutageSessionResponse();\n    if (outageResponse) return outageResponse;\n    return failure(\n      'Owner emergency authentication bindings are unavailable on the backend runtime.',\n      'owner_emergency_binding_unavailable',\n      503,\n    );\n  }\n\n  if (ownerEmail !== email) {"""
          if old not in s:
              raise SystemExit('owner-passwordless password block not found')
          s = s.replace(old, new, 1)
          # Remove duplicate email mismatch block introduced by anchored replacement.
          duplicate = """  if (ownerEmail !== email) {\n    return failure('Requested owner email does not match the configured owner.', 'owner_runtime_email_mismatch', 403);\n  }\n\n  try {"""
          s = s.replace(duplicate, "  try {", 1)
          old = """    if (error || !session?.access_token || !session.refresh_token) {\n      return failure(\n        error?.message || 'Supabase did not return an owner session.',\n        'owner_password_grant_failed',\n        502,\n      );\n    }"""
          new = """    if (error || !session?.access_token || !session.refresh_token) {\n      const errorStatus = typeof (error as { status?: unknown } | null)?.status === 'number'\n        ? Number((error as { status?: number }).status)\n        : 0;\n      const errorMessage = error?.message || 'Supabase did not return an owner session.';\n      const serviceUnavailable = errorStatus >= 500 || /timeout|abort|fetch|network|unavailable|522|503|504/i.test(errorMessage);\n      if (serviceUnavailable) {\n        const outageResponse = buildOutageSessionResponse();\n        if (outageResponse) return outageResponse;\n      }\n      return failure(errorMessage, 'owner_password_grant_failed', 502);\n    }"""
          if old not in s:
              raise SystemExit('owner-passwordless grant block not found')
          s = s.replace(old, new, 1)
          old = """  } catch (error) {\n    const timedOut = error instanceof Error && /timeout|abort/i.test(error.message);\n    return failure(\n      timedOut ? 'Owner authentication timed out.' : (error instanceof Error ? error.message : 'Owner authentication failed.'),\n      timedOut ? 'owner_password_grant_timeout' : 'owner_password_grant_exception',\n      timedOut ? 504 : 502,\n    );\n  }"""
          new = """  } catch (error) {\n    const outageResponse = buildOutageSessionResponse();\n    if (outageResponse) return outageResponse;\n    const timedOut = error instanceof Error && /timeout|abort/i.test(error.message);\n    return failure(\n      timedOut ? 'Owner authentication timed out.' : (error instanceof Error ? error.message : 'Owner authentication failed.'),\n      timedOut ? 'owner_password_grant_timeout' : 'owner_password_grant_exception',\n      timedOut ? 504 : 502,\n    );\n  }"""
          if old not in s:
              raise SystemExit('owner-passwordless catch block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('backend/api/owner-only.ts')
          s = p.read_text()
          s = s.replace(
            "  readIVXTrimmedString,\n  resolveIVXAuthenticatedRequest,",
            "  readIVXTrimmedString,\n  extractIVXBearerToken,\n  resolveIVXAuthenticatedRequest,"
          )
          s = s.replace(
            "import { timingSafeEqual } from 'node:crypto';",
            "import { timingSafeEqual } from 'node:crypto';\nimport { verifyIVXOutageOwnerSession } from '../services/ivx-outage-owner-session';"
          )
          old = """export async function assertIVXOwnerOnly(request: Request): Promise<IVXOwnerRequestContext> {\n  if (checkIVXAISystemKey(request)) {\n    return makeSystemOwnerRequestContext();\n  }\n  return await resolveIVXAuthenticatedRequest(request, '[IVXOwnerOnly]');\n}"""
          new = """export async function assertIVXOwnerOnly(request: Request): Promise<IVXOwnerRequestContext> {\n  if (checkIVXAISystemKey(request)) {\n    return makeSystemOwnerRequestContext();\n  }\n  const outageSession = verifyIVXOutageOwnerSession(extractIVXBearerToken(request));\n  if (outageSession) {\n    return makeOutageOwnerRequestContext(outageSession);\n  }\n  return await resolveIVXAuthenticatedRequest(request, '[IVXOwnerOnly]');\n}"""
          if old not in s:
              raise SystemExit('owner-only assert block not found')
          s = s.replace(old, new, 1)
          marker = """function makeSystemOwnerRequestContext(): IVXOwnerRequestContext {"""
          insert = """function makeOutageOwnerRequestContext(session: { token: string; userId: string; email: string }): IVXOwnerRequestContext {\n  return {\n    userId: session.userId,\n    email: session.email,\n    role: 'owner',\n    accessToken: session.token,\n    guardMode: 'strict',\n  } as unknown as IVXOwnerRequestContext;\n}\n\n"""
          if marker not in s:
              raise SystemExit('owner-only context marker not found')
          p.write_text(s.replace(marker, insert + marker, 1))

          p = Path('expo/lib/auth-context.tsx')
          s = p.read_text()
          old = "body: JSON.stringify({ email: normalizedOwnerEmail }),"
          new = "body: JSON.stringify({ email: normalizedOwnerEmail, emergency: 'ivx_emergency_recovery' }),"
          if old not in s:
              raise SystemExit('auth-context passwordless body not found')
          s = s.replace(old, new, 1)
          old = """          const accessToken = typeof parsed.accessToken === 'string' ? parsed.accessToken : '';\n          const refreshToken = typeof parsed.refreshToken === 'string' ? parsed.refreshToken : '';\n          if (!accessToken || !refreshToken) {\n            lastError = 'Backend did not return session tokens.';\n            continue;\n          }\n          // Mark manual owner login BEFORE setSession so the synchronous"""
          new = """          const accessToken = typeof parsed.accessToken === 'string' ? parsed.accessToken : '';\n          const refreshToken = typeof parsed.refreshToken === 'string' ? parsed.refreshToken : '';\n          const sessionMethod = typeof parsed.sessionMethod === 'string' ? parsed.sessionMethod : '';\n          if (!accessToken || (sessionMethod !== 'ivx_owner_outage_session' && !refreshToken)) {\n            lastError = 'Backend did not return session tokens.';\n            continue;\n          }\n          if (sessionMethod === 'ivx_owner_outage_session') {\n            const outageUserId = typeof parsed.userId === 'string' ? parsed.userId : '';\n            const outageEmail = sanitizeEmail(typeof parsed.email === 'string' ? parsed.email : normalizedOwnerEmail);\n            if (!isValidOwnerVerifiedUserId(outageUserId) || !isOwnerAdminEmail(outageEmail)) {\n              lastError = 'Backend outage owner session identity was not accepted.';\n              continue;\n            }\n            const outageOwnerUser: AuthUser = {\n              id: outageUserId,\n              email: outageEmail,\n              firstName: 'Owner',\n              lastName: 'IVX',\n              kycStatus: 'approved',\n              role: 'owner',\n              emailVerified: true,\n              accountType: 'owner',\n              accountStatus: 'active',\n            };\n            manualOwnerLoginRef.current = true;\n            ownerIPActiveRef.current = false;\n            activeSessionUserIdRef.current = outageUserId;\n            setUser(outageOwnerUser);\n            setUserRole('owner');\n            setIsAuthenticated(true);\n            setIsOwnerIPAccess(false);\n            setAuthCredentials(accessToken, outageUserId, 'owner');\n            await persistAuth({ token: accessToken, refreshToken: '', userId: outageUserId, userRole: 'owner' });\n            sessionInstalled = true;\n            console.log('[Auth] IVX owner outage session installed:', outageUserId, outageEmail);\n            break;\n          }\n          // Mark manual owner login BEFORE setSession so the synchronous"""
          if old not in s:
              raise SystemExit('auth-context session block not found')
          p.write_text(s.replace(old, new, 1))
          PY

          git diff --check
          grep -q "ivx_owner_outage_session" backend/api/ivx-owner-passwordless-login.ts
          grep -q "verifyIVXOutageOwnerSession" backend/api/owner-only.ts
          grep -q "ivx_emergency_recovery" expo/lib/auth-context.tsx
      - name: Install and typecheck
        shell: bash
        run: |
          set -euo pipefail
          cd expo
          bun install
          bunx tsc --noEmit
          bun test __tests__/auth-timeout-fix.test.ts --reporter=dots
      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/services/ivx-outage-owner-session.ts backend/api/ivx-owner-passwordless-login.ts backend/api/owner-only.ts expo/lib/auth-context.tsx
          if git diff --cached --quiet; then
            echo 'No patch changes to commit'
            exit 0
          fi
          git commit -m 'fix: enable secure owner sign-in during Supabase outage'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
