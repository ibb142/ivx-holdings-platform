name: IVX Supabase Read-only Log Diagnosis
on:
  push:
    branches: [diagnostics/supabase-connection-errors]
    paths: ['.github/workflows/ivx-supabase-log-diagnosis.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ivx-supabase-log-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/diagnostics/supabase-connection-errors'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read and classify recent database errors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: python
        run: |
          import os, re, json, datetime, urllib.request, urllib.parse, urllib.error
          from pathlib import Path
          token = os.environ.get('SUPABASE_ACCESS_TOKEN', '').strip()
          if not token:
              raise SystemExit('SUPABASE_ACCESS_TOKEN_NOT_BOUND')
          text = Path('scripts/ops/supabase-incident-recovery.mjs').read_text()
          project = re.search(r"export const PROJECT = '([a-z0-9]+)'", text).group(1)
          end = datetime.datetime.now(datetime.timezone.utc)
          start = end - datetime.timedelta(minutes=30)
          categories = {
              'connection_slots': 'too many clients|remaining connection slots|too many connections',
              'authentication_timeout': 'authentication.*timeout|authentication.*timed out|authentication.*did not complete',
              'idle_transaction_timeout': 'idle-in-transaction timeout|idle in transaction timeout',
              'statement_timeout': 'statement timeout',
              'lock_timeout': 'lock timeout|deadlock detected',
              'server_shutdown': 'administrator command|database system is shutting down|database system is starting up',
              'disk_full': 'no space left on device|disk quota',
              'memory': 'out of memory|cannot allocate memory',
              'connection_reset': 'connection reset|broken pipe|connection.*closed|connection.*terminated',
              'pool_timeout': 'pool.*timeout|pool.*timed out|checkout.*timeout',
              'schema_cache': 'schema cache',
          }
          cases = ', '.join("match(event_message, '(?i)" + pattern + "'), '" + label + "'" for label, pattern in categories.items())
          sql = ("select source, multiIf(" + cases + ", 'other') as category, "
                 "count() as n from logs where source in ('postgres_logs','supavisor_logs','pgbouncer_logs') "
                 "and (match(event_message, '(?i)error|fatal|panic|timeout|timed out|terminated|connection reset|too many') "
                 "or severity_text in ('ERROR','FATAL','PANIC')) group by source,category order by n desc limit 50")
          params = urllib.parse.urlencode({'sql': sql, 'iso_timestamp_start': start.isoformat(), 'iso_timestamp_end': end.isoformat()})
          request = urllib.request.Request('https://api.supabase.com/v1/projects/' + project + '/analytics/endpoints/logs?' + params,
              headers={'Authorization': 'Bearer ' + token})
          print(json.dumps({'startedAt': start.isoformat(), 'finishedAt': end.isoformat(), 'mode': 'read_only'}))
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit('LOGS_API_HTTP_' + str(error.code))
          except Exception:
              raise SystemExit('LOGS_API_TRANSPORT_FAILURE')
          if not isinstance(payload, dict) or payload.get('error') or not isinstance(payload.get('result'), list):
              raise SystemExit('LOGS_API_RESULT_INVALID')
          allowed_sources = {'postgres_logs', 'supavisor_logs', 'pgbouncer_logs'}
          for row in payload['result']:
              if row.get('source') not in allowed_sources or row.get('category') not in {*categories, 'other'}:
                  raise SystemExit('LOGS_API_UNEXPECTED_CATEGORY')
              print(json.dumps({'source': row['source'], 'category': row['category'], 'count': int(row['n'])}))
          print('LOG_DIAGNOSIS_COMPLETE')
