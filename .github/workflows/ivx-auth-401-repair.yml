name: IVX Auth 401 Live Certificate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-auth-401-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-auth-401:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static auth contract check
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "result.httpStatus || (result.requiresVerification ? 403 : 401)" backend/api/ivx-members.ts
          grep -Fq "success: false" backend/services/ivx-member-database.ts

      - name: Live wrong-password 401 check
        id: live
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://api.ivxholding.com/api/members/login' \
            -H 'Content-Type: application/json' \
            --data '{"email":"qa-invalid-401-20260818@ivxholding.invalid","password":"DefinitelyWrongPassword123!"}')
          echo "HTTP=$code"
          cat "$body"
          test "$code" = '401'
          if grep -Eq '"success"[[:space:]]*:[[:space:]]*true' "$body"; then
            echo 'FAIL: invalid credentials returned success=true'
            exit 1
          fi
          cp "$body" /tmp/auth401-body.json

      - name: Write QA certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence
          {
            echo '# IVX Auth Wrong-Password 401 Live Certificate'
            echo
            echo 'STATUS: PASS'
            echo 'CHECK: Invalid email/password is rejected by production member login.'
            echo 'EXPECTED_HTTP: 401'
            echo 'ACTUAL_HTTP: 401'
            echo 'SUCCESS_TRUE_RETURNED: false'
            echo 'LIVE_ENDPOINT: POST https://api.ivxholding.com/api/members/login'
            echo "VERIFIED_AT_UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "WORKFLOW_RUN_ID: ${GITHUB_RUN_ID}"
            echo "SOURCE_SHA: ${GITHUB_SHA}"
            echo
            echo 'Response body:'
            echo '```json'
            cat /tmp/auth401-body.json
            echo
            echo '```'
            echo
            echo 'VERDICT: PASS — wrong credentials cannot produce a successful login session.'
          } > qa/evidence/auth-wrong-password-401-certificate.md
          cat qa/evidence/auth-wrong-password-401-certificate.md

      - name: Commit certificate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ivx-qa-bot'
          git config user.email 'ivx-qa-bot@users.noreply.github.com'
          git add qa/evidence/auth-wrong-password-401-certificate.md
          git commit -m 'cert(auth): wrong-password 401 live PASS'
          git pull --rebase origin main || true
          git push origin HEAD:main
