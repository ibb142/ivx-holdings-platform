name: IVX Auth 401 Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-auth-401-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch false-success auth path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service = Path('backend/services/ivx-member-database.ts')
          text = service.read_text()

          old_type = """  requiresVerification?: boolean;\n  deploymentMarker: string;\n}"""
          new_type = """  requiresVerification?: boolean;\n  errorCode?: string;\n  retryable?: boolean;\n  httpStatus?: number;\n  deploymentMarker: string;\n}"""
          if old_type not in text:
              raise SystemExit('MemberLoginResult type anchor not found')
          text = text.replace(old_type, new_type, 1)

          old_block = """    // Mint a real Supabase session for this fallback member via magic-link (with 5s timeout).\n    let session: { accessToken: string; refreshToken: string; expiresAt: number } | null = null;\n    try {\n      const admin = getSupabaseAdmin();\n      session = await Promise.race([\n        mintSessionForFallbackMember(admin, normalizedEmail),\n        new Promise<null>((resolve) => setTimeout(() => resolve(null), 5_000)),\n      ]);\n    } catch { /* non-fatal — still return userId */ }\n    return {\n      success: true,\n      message: 'Login successful.',\n      userId: fallbackUserId,\n      email: normalizedEmail,\n      accessToken: session?.accessToken,\n      refreshToken: session?.refreshToken,\n      expiresAt: session?.expiresAt,\n      deploymentMarker: DEPLOYMENT_MARKER,\n    };"""

          new_block = """    // A credential check is not a login until Supabase issues a real session.\n    // First try the normal password grant; if the account exists in Supabase this\n    // preserves the same password and avoids any privileged recovery path.\n    let session: { accessToken: string; refreshToken: string; expiresAt: number } | null = null;\n    try {\n      const anonClient = getSupabaseAnonClient();\n      const authResult = await Promise.race([\n        anonClient.auth.signInWithPassword({ email: normalizedEmail, password }),\n        new Promise<null>((resolve) => setTimeout(() => resolve(null), 5_000)),\n      ]);\n      if (authResult && !authResult.error && authResult.data?.session?.access_token && authResult.data?.session?.refresh_token) {\n        session = {\n          accessToken: authResult.data.session.access_token,\n          refreshToken: authResult.data.session.refresh_token,\n          expiresAt: typeof authResult.data.session.expires_at === 'number' ? authResult.data.session.expires_at : 0,\n        };\n      }\n    } catch { /* continue to controlled recovery */ }\n\n    // Controlled recovery is only available when a real service-role credential is bound.\n    if (!session && hasServiceRoleKey()) {\n      try {\n        const admin = getSupabaseAdmin();\n        session = await Promise.race([\n          mintSessionForFallbackMember(admin, normalizedEmail),\n          new Promise<null>((resolve) => setTimeout(() => resolve(null), 5_000)),\n        ]);\n      } catch { /* handled below */ }\n    }\n\n    // Never return HTTP 200/login-success without a token. That false success was\n    // the source of immediate downstream 401 responses on protected member APIs.\n    if (!session?.accessToken || !session?.refreshToken) {\n      return {\n        success: false,\n        message: 'Authentication service could not issue a valid session. Please retry.',\n        userId: fallbackUserId,\n        email: normalizedEmail,\n        errorCode: 'SESSION_UNAVAILABLE',\n        retryable: true,\n        httpStatus: 503,\n        deploymentMarker: DEPLOYMENT_MARKER,\n      };\n    }\n\n    return {\n      success: true,\n      message: 'Login successful.',\n      userId: fallbackUserId,\n      email: normalizedEmail,\n      accessToken: session.accessToken,\n      refreshToken: session.refreshToken,\n      expiresAt: session.expiresAt,\n      deploymentMarker: DEPLOYMENT_MARKER,\n    };"""

          if old_block not in text:
              raise SystemExit('Fallback login anchor not found')
          text = text.replace(old_block, new_block, 1)
          service.write_text(text)

          api = Path('backend/api/ivx-members.ts')
          api_text = api.read_text()
          old_api = "return jsonResponse(result, result.success ? 200 : (result.requiresVerification ? 403 : 401));"
          new_api = "return jsonResponse(result, result.success ? 200 : (result.httpStatus || (result.requiresVerification ? 403 : 401)));"
          if old_api not in api_text:
              raise SystemExit('Member login HTTP status anchor not found')
          api.write_text(api_text.replace(old_api, new_api, 1))
          PY
          git diff --check
          grep -Fq "errorCode: 'SESSION_UNAVAILABLE'" backend/services/ivx-member-database.ts
          grep -Fq 'result.httpStatus ||' backend/api/ivx-members.ts

      - name: Install and run member auth QA
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test backend/ivx-business-workflows.test.ts

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/services/ivx-member-database.ts backend/api/ivx-members.ts
          if git diff --cached --quiet; then
            echo 'No auth changes required.'
            exit 0
          fi
          git commit -m 'fix(auth): require a real session before login success'
          git push origin HEAD:main
