name: IVX Code and Deployment Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ivx-4phase-final-certification.yml'
      - 'qa/ivx-deployment-evidence*.mjs'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ivx-4phase-final-certification
  cancel-in-progress: false

jobs:
  phase-1-code-and-registry:
    name: 'Code registry tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify 112-agent registry and core autonomous tests
        run: |
          set -euo pipefail
          test -f backend/services/ivx-enterprise-master-registry.ts
          test -f backend/services/ivx-autonomous-completion-campaign.ts
          grep -q 'ALL_ENTERPRISE_AGENTS' backend/services/ivx-enterprise-master-registry.ts
          bun test backend/ivx-senior-developer-worker.test.ts
      - name: Reject unsupported phase certification claims
        run: node --test qa/ivx-deployment-evidence.test.mjs

  phase-2-typecheck-and-safety:
    name: 'TypeScript and static safety references'
    needs: phase-1-code-and-registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Backend typecheck
        working-directory: backend
        run: bunx tsc --noEmit
      - name: Check safety references in source (not runtime authorization)
        run: |
          set -euo pipefail
          grep -q 'productionClaimsRequireProof: true' backend/services/ivx-autonomous-completion-campaign.ts
          grep -q 'destructiveActionsRequireOwnerApproval: true' backend/services/ivx-autonomous-completion-campaign.ts
          grep -q 'paidSpendRequiresOwnerApproval: true' backend/services/ivx-autonomous-completion-campaign.ts
          grep -q 'checkEmergencyStop' backend/services/ivx-senior-developer-worker.ts

  phase-3-live-exact-sha:
    name: 'API liveness and exact SHA'
    if: github.event_name != 'pull_request'
    needs: phase-2-typecheck-and-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for exact main SHA on production
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ok=false
          for i in $(seq 1 80); do
            live=''
            healthy=''
            if curl --connect-timeout 5 --max-time 15 -fsS https://api.ivxholding.com/health -o /tmp/health.json &&
               curl --connect-timeout 5 --max-time 15 -fsS https://api.ivxholding.com/version -o /tmp/version.json; then
              live=$(jq -r '.commit // .version.commit // empty' /tmp/version.json 2>/dev/null || true)
              healthy=$(jq -r '.ok // .healthy // empty' /tmp/health.json 2>/dev/null || true)
            fi
            echo "poll=$i expected=${EXPECTED_SHA} live=${live:-missing} healthy=${healthy:-unknown}"
            if [ "$live" = "$EXPECTED_SHA" ] && { [ "$healthy" = true ] || [ "$healthy" = "true" ]; }; then ok=true; break; fi
            sleep 10
          done
          test "$ok" = true

  phase-4-final-certificate:
    name: 'Partial deployment evidence (not a phase certificate)'
    needs: phase-3-live-exact-sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record current observations and require dependency readiness
        run: node qa/ivx-deployment-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivx-partial-deployment-evidence-${{ github.run_id }}
          path: certification/
          if-no-files-found: error
