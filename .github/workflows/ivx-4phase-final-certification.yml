name: IVX 4-Phase Final Certification

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ivx-4phase-final-certification
  cancel-in-progress: false

jobs:
  phase-1-code-and-registry:
    name: 'Phase 1 - Code + 112 Registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify 112-agent registry and core autonomous tests
        run: |
          set -euo pipefail
          test -f backend/services/ivx-enterprise-master-registry.ts
          test -f backend/services/ivx-autonomous-completion-campaign.ts
          grep -q 'ALL_ENTERPRISE_AGENTS' backend/services/ivx-enterprise-master-registry.ts
          bun test backend/ivx-senior-developer-worker.test.ts

  phase-2-typecheck-and-safety:
    name: 'Phase 2 - Typecheck + Safety Gates'
    needs: phase-1-code-and-registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Backend typecheck
        working-directory: backend
        run: bunx tsc --noEmit
      - name: Owner-gate and proof invariants
        run: |
          set -euo pipefail
          grep -q 'productionClaimsRequireProof: true' backend/services/ivx-autonomous-completion-campaign.ts
          grep -q 'destructiveActionsRequireOwnerApproval: true' backend/services/ivx-autonomous-completion-campaign.ts
          grep -q 'paidSpendRequiresOwnerApproval: true' backend/services/ivx-autonomous-completion-campaign.ts
          grep -q 'checkEmergencyStop' backend/services/ivx-senior-developer-worker.ts

  phase-3-live-exact-sha:
    name: 'Phase 3 - Production Exact SHA'
    needs: phase-2-typecheck-and-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for exact main SHA on production
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ok=false
          for i in $(seq 1 80); do
            curl -fsS https://api.ivxholding.com/health -o /tmp/health.json || true
            curl -fsS https://api.ivxholding.com/version -o /tmp/version.json || true
            live=$(jq -r '.commit // .version.commit // empty' /tmp/version.json 2>/dev/null || true)
            healthy=$(jq -r '.ok // .healthy // empty' /tmp/health.json 2>/dev/null || true)
            echo "poll=$i expected=${EXPECTED_SHA} live=${live:-missing} healthy=${healthy:-unknown}"
            if [ "$live" = "$EXPECTED_SHA" ] && { [ "$healthy" = true ] || [ "$healthy" = "true" ]; }; then ok=true; break; fi
            sleep 10
          done
          test "$ok" = true

  phase-4-final-certificate:
    name: 'Phase 4 - Final Evidence Certificate'
    needs: phase-3-live-exact-sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify prior certification evidence exists
        run: |
          set -euo pipefail
          test -f qa/evidence/IVX-112-FINAL-LIVE-CERTIFICATE.json
          test -f qa/PHASE_4_AUTONOMOUS_CERTIFICATE.md
      - name: Generate current four-phase certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certification
          curl -fsS https://api.ivxholding.com/health -o certification/health.json
          curl -fsS https://api.ivxholding.com/version -o certification/version.json
          live=$(jq -r '.commit // .version.commit // empty' certification/version.json)
          test "$live" = "${GITHUB_SHA}"
          jq -n \
            --arg certifiedAt "$(date -u +%FT%TZ)" \
            --arg sha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            '{certificate:"IVX_4_PHASE_FINAL",certified:true,certifiedAt:$certifiedAt,githubSha:$sha,workflowRunId:$runId,phases:{phase1:"PASS",phase2:"PASS",phase3:"PASS",phase4:"PASS"},hardGates:{tests:true,typecheck:true,ownerGates:true,emergencyStop:true,exactLiveSha:true,health:true},claim:"Certification is valid only for this exact SHA and workflow run."}' > certification/IVX-4-PHASE-FINAL.json
          cat certification/IVX-4-PHASE-FINAL.json
      - uses: actions/upload-artifact@v4
        with:
          name: ivx-4-phase-final-certificate-${{ github.run_id }}
          path: certification/
