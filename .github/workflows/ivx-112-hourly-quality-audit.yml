name: IVX 112 Fleet Quality Audit (Manual)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ivx-112-fleet-quality-manual
  cancel-in-progress: true

env:
  API_BASE: https://api.ivxholding.com
  PROGRAM_ID: IVX-LANDING-10OF10-2026-08-19
  IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
  IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}

jobs:
  sync-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve owner binding and verify production fleet
        shell: bash
        run: |
          set -euo pipefail
          SYSTEM_KEY="${IVX_AI_SYSTEM_SECRET:-${IVX_SYSTEM_SECRET:-}}"
          test -n "$SYSTEM_KEY"
          echo "::add-mask::$SYSTEM_KEY"
          echo "SYSTEM_KEY=$SYSTEM_KEY" >> "$GITHUB_ENV"
          mkdir -p evidence
          curl -fsS --max-time 30 "$API_BASE/health" -o /tmp/health.json
          curl -fsS --max-time 30 "$API_BASE/version" -o /tmp/version.json
          curl -fsS --max-time 30 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/health.json)" = true
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          LIVE_SHA=$(jq -r '.commit // .version.commit // empty' /tmp/version.json)
          test -n "$LIVE_SHA"
          echo "LIVE_SHA=$LIVE_SHA" >> "$GITHUB_ENV"

      - name: Synchronize enabled fleet
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.agents[]' /tmp/agents.json | while read -r row; do
            id=$(jq -r '.agentId' <<<"$row")
            paused=$(jq -r '.paused // false' <<<"$row")
            disabled=$(jq -r '.disabled // false' <<<"$row")
            if [ "$disabled" = true ]; then
              curl -fsS --max-time 20 -X POST "$API_BASE/api/ivx/agents/$id/enable" -H "x-ivx-owner-key: $SYSTEM_KEY" >/dev/null
            fi
            if [ "$paused" = true ]; then
              curl -fsS --max-time 20 -X POST "$API_BASE/api/ivx/agents/$id/resume" -H "x-ivx-owner-key: $SYSTEM_KEY" >/dev/null
            fi
          done
          curl -fsS --max-time 30 "$API_BASE/api/ivx/agents" -o /tmp/agents-after.json
          test "$(jq '[.agents[] | select((.paused // false) == true or (.disabled // false) == true)] | length' /tmp/agents-after.json)" = 0

      - name: Execute real 112-agent audit cycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ivx112-quality
          jq -r '.agents | sort_by(.agentNumber)[] | [.agentNumber,.agentId] | @tsv' /tmp/agents-after.json > /tmp/agents.tsv
          run_agent() {
            number="$1"; agent_id="$2"
            gap=$(( ((number - 1) % 40) + 1 ))
            output="/tmp/ivx112-quality/run-$number.json"
            result="/tmp/ivx112-quality/result-$number.json"
            task_id="manual-quality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${number}"
            body=$(jq -nc --arg token "$SYSTEM_KEY" --arg programId "$PROGRAM_ID" --arg sourceSha "$LIVE_SHA" --arg taskId "$task_id" --argjson gapId "$gap" '{taskType:"audit",ownerApprovalToken:$token,payload:{programId:$programId,sourceSha:$sourceSha,gapId:$gapId,__taskId:$taskId,__workflow:"IVX 112 Fleet Quality Audit (Manual)",realExecutionOnly:true,simulatedSuccessAllowed:false,realFundsAllowed:false}}')
            http=$(curl -sS --retry 1 --retry-delay 1 --max-time 75 -o "$output" -w '%{http_code}' -X POST "$API_BASE/api/ivx/agents/$agent_id/run" -H 'Content-Type: application/json' -H "x-ivx-owner-key: $SYSTEM_KEY" --data "$body" || true)
            jq -n --argjson agentNumber "$number" --arg agentId "$agent_id" --arg http "$http" --slurpfile response "$output" '{agentNumber:$agentNumber,agentId:$agentId,http:$http,response:($response[0] // {})}' > "$result"
          }
          export -f run_agent
          export API_BASE PROGRAM_ID SYSTEM_KEY LIVE_SHA GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
          xargs -n2 -P16 bash -c 'run_agent "$0" "$1"' < /tmp/agents.tsv
          jq -s 'sort_by(.agentNumber)' /tmp/ivx112-quality/result-*.json > evidence/ivx-112-fleet-quality-results.json

      - name: Build evidence-only certificate
        shell: bash
        run: |
          set -euo pipefail
          attempted=$(jq 'length' evidence/ivx-112-fleet-quality-results.json)
          succeeded=$(jq '[.[] | select(.response.ok == true)] | length' evidence/ivx-112-fleet-quality-results.json)
          jq -n --arg sourceSha "$LIVE_SHA" --arg runId "$GITHUB_RUN_ID" --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson attempted "$attempted" --argjson succeeded "$succeeded" '{ok:($attempted==112 and $succeeded==112),certificate:"IVX-112-MANUAL-FLEET-QUALITY-AUDIT",sourceSha:$sourceSha,githubRunId:$runId,verifiedAt:$verifiedAt,agentsAttempted:$attempted,agentsSucceeded:$succeeded,agentsFailed:($attempted-$succeeded),truthNote:"Manual evidence audit only. Continuous Autonomous/112 execution runs outside GitHub Actions."}' > evidence/ivx-112-fleet-quality-certificate.json
          cat evidence/ivx-112-fleet-quality-certificate.json

      - uses: actions/upload-artifact@v4
        with:
          name: ivx-112-manual-quality-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
