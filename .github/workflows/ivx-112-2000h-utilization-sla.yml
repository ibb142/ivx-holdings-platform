name: IVX 112 Agent 2000h Utilization SLA

on:
  push:
    branches: [main]
    paths:
      - 'backend/services/ivx-campaign-dispatcher.ts'
      - 'backend/api/ivx-agent-api.ts'
      - 'backend/services/ivx-github-actions-oidc.ts'
      - '.github/workflows/ivx-112-2000h-utilization-sla.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: ivx-112-2000h-utilization-sla
  cancel-in-progress: true

jobs:
  utilization-sla:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API_BASE: https://api.ivxholding.com
      MIN_PRODUCTIVE_AGENT_HOURS: '2000'
      MIN_UTILIZATION_PERCENT: '74.4'
      IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
      IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      REPO: ibb142/ivx-holdings-platform
      LANDING_112_WORKFLOW: landing-112-agent-autonomous-qa.yml
    steps:
      - name: Read production 112-agent utilization
        id: before
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -fsS --retry 8 --retry-delay 3 --retry-all-errors --max-time 30 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/dashboard.json; then
            echo 'Production dashboard is temporarily unavailable; forcing the GitHub 112-worker recovery fallback.'
            echo 'DASHBOARD_AVAILABLE=false' >> "$GITHUB_ENV"
            echo 'SLA_MET=false' >> "$GITHUB_ENV"
            echo 'running=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'DASHBOARD_AVAILABLE=true' >> "$GITHUB_ENV"
          test "$(jq -r '.ok // false' /tmp/dashboard.json)" = true
          max_concurrency=$(jq -r '.dispatcher.maxConcurrency // 0' /tmp/dashboard.json)
          theoretical=$(jq -r '.dispatcher.utilization24h.theoreticalAgentHours // 0' /tmp/dashboard.json)
          productive=$(jq -r '.dispatcher.utilization24h.productiveAgentHours // 0' /tmp/dashboard.json)
          utilization=$(jq -r '.dispatcher.utilization24h.utilizationPercent // 0' /tmp/dashboard.json)
          running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/dashboard.json)
          queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/dashboard.json)
          blocked=$(jq -r '.dispatcher.totals.blocked // 0' /tmp/dashboard.json)
          failed=$(jq -r '.dispatcher.totals.failed // 0' /tmp/dashboard.json)
          owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/dashboard.json)
          printf 'maxConcurrency=%s\ntheoreticalAgentHours=%s\nproductiveAgentHours=%s\nutilizationPercent=%s\nrunningNow=%s\nqueuedNow=%s\nblocked=%s\nfailed=%s\nownerGateNow=%s\n' "$max_concurrency" "$theoretical" "$productive" "$utilization" "$running" "$queued" "$blocked" "$failed" "$owner_gate" | tee /tmp/utilization.txt
          test "$max_concurrency" -eq 112
          awk -v v="$theoretical" 'BEGIN { exit !(v >= 2688) }'
          echo "running=$running" >> "$GITHUB_OUTPUT"
          if awk -v p="$productive" -v m="$MIN_PRODUCTIVE_AGENT_HOURS" -v u="$utilization" -v mu="$MIN_UTILIZATION_PERCENT" 'BEGIN { exit !((p+0) >= (m+0) && (u+0) >= (mu+0)) }'; then
            echo 'SLA_MET=true' >> "$GITHUB_ENV"
          else
            echo 'SLA_MET=false' >> "$GITHUB_ENV"
          fi

      - name: Obtain IVX GitHub OIDC token for bounded recovery
        if: env.SLA_MET == 'false'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$token_json" | jq -r '.value // empty')
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Recycle repairable failed blocked cancelled work across all 112 agents
        if: env.SLA_MET == 'false' && env.DASHBOARD_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          owner_key="${IVX_SYSTEM_SECRET:-${IVX_AI_SYSTEM_SECRET:-}}"
          if [ -z "$owner_key" ]; then
            echo 'No owner secret available for retry_agent recycling; bounded OIDC resume still runs.'
            exit 0
          fi
          failures=0
          for agent in $(seq 1 112); do
            code=$(curl -sS --max-time 20 -o "/tmp/retry-$agent.json" -w '%{http_code}' -X POST -H 'content-type: application/json' -H "x-ivx-owner-key: $owner_key" -d "{\"action\":\"retry_agent\",\"agentNumber\":$agent}" "$API_BASE/api/ivx/agents/app-completion/control") || code=000
            if [ "$code" != 200 ] || [ "$(jq -r '.ok // false' "/tmp/retry-$agent.json" 2>/dev/null || echo false)" != true ]; then failures=$((failures + 1)); fi
          done
          echo "retry_agent_failures=$failures"
          test "$failures" -eq 0

      - name: Resume Autonomous campaign when below SLA
        if: env.SLA_MET == 'false' && env.DASHBOARD_AVAILABLE == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/resume.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: $OIDC_TOKEN" -d '{"action":"resume_all"}' "$API_BASE/api/ivx/agents/app-completion/control")
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/resume.json)" = true

      - name: Require real workers to start after recovery
        if: env.SLA_MET == 'false' && env.DASHBOARD_AVAILABLE == 'true'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          started=false
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            curl -fsS --retry 2 --retry-delay 1 --max-time 20 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/after.json
            running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/after.json)
            if [ "$running" -gt 0 ]; then started=true; break; fi
          done
          echo "started=$started" >> "$GITHUB_OUTPUT"

      - name: Trigger real 112-worker fallback if production dispatcher remains idle
        if: env.SLA_MET == 'false' && (env.DASHBOARD_AVAILABLE != 'true' || steps.verify.outputs.started != 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/actions/workflows/$LANDING_112_WORKFLOW/dispatches" -d '{"ref":"main"}')
          test "$code" = 204

      - name: Fail closed when productive backlog exists but zero workers run
        if: env.SLA_MET == 'false' && env.DASHBOARD_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --max-time 30 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/recovery-final.json
          running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/recovery-final.json)
          queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/recovery-final.json)
          owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/recovery-final.json)
          if [ "$running" -eq 0 ] && [ "$queued" -gt 0 ]; then exit 1; fi
          if [ "$running" -eq 0 ] && [ "$queued" -eq 0 ] && [ "$owner_gate" -eq 0 ]; then exit 1; fi

      - name: Enforce rolling 24-hour enterprise SLA
        if: env.DASHBOARD_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --max-time 30 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/final.json
          productive=$(jq -r '.dispatcher.utilization24h.productiveAgentHours // 0' /tmp/final.json)
          utilization=$(jq -r '.dispatcher.utilization24h.utilizationPercent // 0' /tmp/final.json)
          awk -v p="$productive" -v m="$MIN_PRODUCTIVE_AGENT_HOURS" -v u="$utilization" -v mu="$MIN_UTILIZATION_PERCENT" 'BEGIN { exit !((p+0) >= (m+0) && (u+0) >= (mu+0)) }'
          echo 'IVX_112_2000H_SLA=PASS'
