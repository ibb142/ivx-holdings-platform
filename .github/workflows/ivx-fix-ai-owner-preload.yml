name: IVX Fix AI Owner Preload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-fix-ai-owner-preload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Patch deterministic AI credential preload
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 -c "from pathlib import Path; p=Path('backend/services/ivx-owner-ai-task-queue.ts'); s=p.read_text(); old=\"  const startup = validateIVXAIStartup();\\n  // Use the AI runtime's unified key resolver, which checks the encrypted\\n  // IVX Owner Variables store FIRST, then falls back to process.env.\\n  // This is the same binding pattern already used for SUPABASE_ACCESS_TOKEN.\\n  const { getIVXAIGatewayApiKey } = await import('../ivx-ai-runtime');\\n  const apiKey = getIVXAIGatewayApiKey();\\n\"; new=\"  const { getIVXAIGatewayApiKey, preloadIVXAIGatewayKeyFromOwnerVariables } = await import('../ivx-ai-runtime');\\n  await preloadIVXAIGatewayKeyFromOwnerVariables();\\n  const startup = validateIVXAIStartup();\\n  const apiKey = getIVXAIGatewayApiKey();\\n\"; assert old in s, 'target probe block not found'; p.write_text(s.replace(old,new,1))"
      - name: Verify source compiles
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit -p tsconfig.json
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/services/ivx-owner-ai-task-queue.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: load encrypted AI credential before live probe'
          git push origin HEAD:main
