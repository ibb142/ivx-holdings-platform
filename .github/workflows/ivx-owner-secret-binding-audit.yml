name: IVX Owner Secret Binding Audit

on:
  push:
    branches: [main]
    paths:
      - '.ivx-owner-secret-binding-audit-trigger'
      - '.github/workflows/ivx-owner-secret-binding-audit.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S1: ${{ secrets.OWNER_NEW_PASSWORD }}
      S2: ${{ secrets.OWNER_PASSWORD }}
      S3: ${{ secrets.IVX_OWNER_PASSWORD }}
      S4: ${{ secrets.IVX_OWNER_NEW_PASSWORD }}
      S5: ${{ secrets.OWNER_LOGIN_PASSWORD }}
      S6: ${{ secrets.IVX_OWNER_LOGIN_PASSWORD }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for n in S1 S2 S3 S4 S5 S6; do
            if [ -n "${!n:-}" ]; then echo "$n=present"; else echo "$n=missing"; fi
          done
