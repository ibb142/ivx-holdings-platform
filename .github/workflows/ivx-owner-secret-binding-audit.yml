name: IVX Owner Secret Binding Audit

on:
  push:
    branches: [main]
    paths:
      - '.ivx-owner-secret-binding-audit-trigger'
      - '.github/workflows/ivx-owner-secret-binding-audit.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S1: ${{ secrets.OWNER_NEW_PASSWORD }}
      S2: ${{ secrets.OWNER_PASSWORD }}
      S3: ${{ secrets.IVX_OWNER_PASSWORD }}
      S4: ${{ secrets.IVX_OWNER_NEW_PASSWORD }}
      S5: ${{ secrets.OWNER_LOGIN_PASSWORD }}
      S6: ${{ secrets.IVX_OWNER_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist presence-only result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence
          out=qa/evidence/ivx-owner-secret-binding-audit.json
          s1=false; s2=false; s3=false; s4=false; s5=false; s6=false
          [ -n "${S1:-}" ] && s1=true
          [ -n "${S2:-}" ] && s2=true
          [ -n "${S3:-}" ] && s3=true
          [ -n "${S4:-}" ] && s4=true
          [ -n "${S5:-}" ] && s5=true
          [ -n "${S6:-}" ] && s6=true
          jq -n \
            --arg sha "$(git rev-parse HEAD)" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson s1 "$s1" --argjson s2 "$s2" --argjson s3 "$s3" \
            --argjson s4 "$s4" --argjson s5 "$s5" --argjson s6 "$s6" \
            '{sourceSha:$sha,verifiedAt:$verifiedAt,secretValuesReturned:false,bindings:{OWNER_NEW_PASSWORD:$s1,OWNER_PASSWORD:$s2,IVX_OWNER_PASSWORD:$s3,IVX_OWNER_NEW_PASSWORD:$s4,OWNER_LOGIN_PASSWORD:$s5,IVX_OWNER_LOGIN_PASSWORD:$s6}}' > "$out"
          cat "$out"
          git config user.name 'IVX Auth Binding Audit'
          git config user.email 'ivx-auth-binding-audit@users.noreply.github.com'
          git add "$out"
          git diff --cached --quiet && exit 0
          git commit -m 'diag(auth): persist owner secret binding audit [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
