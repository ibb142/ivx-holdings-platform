name: IVX Recover Render AI From History

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-recover-render-ai-from-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover binding, redeploy, and verify live AI
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';

          const serviceId = 'srv-d7t9ivreo5us73ftose0';
          const renderSource = execFileSync('git', ['show', '3388d5dd97cf107524d752bf9a80891315829405^:expo/scripts/fix-github-token.mjs'], { encoding:'utf8' });
          const renderMatch = renderSource.match(/rnd_[A-Za-z0-9]+/);
          if (!renderMatch) throw new Error('historical Render credential not recoverable');
          const renderKey = renderMatch[0];
          const headers = { Accept:'application/json','Content-Type':'application/json',Authorization:`Bearer ${renderKey}` };
          const rf = async (path, init={}) => {
            const r=await fetch(`https://api.render.com/v1${path}`,{...init,headers:{...headers,...(init.headers||{})}});
            const text=await r.text(); let payload={}; try{payload=text?JSON.parse(text):{};}catch{}
            return {ok:r.ok,status:r.status,payload,text};
          };

          const service=await rf(`/services/${serviceId}`);
          if(!service.ok) throw new Error(`Render service GET HTTP ${service.status}`);
          console.log('render_access=PASS');
          const directRes=await rf(`/services/${serviceId}/env-vars`);
          if(!directRes.ok) throw new Error(`Render env GET HTTP ${directRes.status}`);
          const direct=new Map();
          for(const item of directRes.payload){const ev=item?.envVar??item;if(ev&&typeof ev.key==='string')direct.set(ev.key,typeof ev.value==='string'?ev.value:'');}

          const base=(process.env.EXPO_PUBLIC_SUPABASE_URL||'').replace(/\/+$/,'');
          const serviceRole=process.env.SUPABASE_SERVICE_ROLE_KEY||'';
          if(!base||!serviceRole) throw new Error('Supabase recovery bindings missing');
          const rowsRes=await fetch(`${base}/rest/v1/ivx_owner_variables?select=name,encrypted_value,value_iv,value_tag,value_hash&name=in.(IVX_AI_GATEWAY_KEY,AI_GATEWAY_API_KEY)`,{headers:{apikey:serviceRole,Authorization:`Bearer ${serviceRole}`,Accept:'application/json'}});
          if(!rowsRes.ok) throw new Error(`owner variable read HTTP ${rowsRes.status}`);
          const rows=await rowsRes.json();
          const targetHashes=new Set(rows.map(r=>String(r.value_hash||'')).filter(Boolean));
          if(!targetHashes.size) throw new Error('AI owner-variable hash missing');

          let aiKey=''; let source='';
          for(const name of ['IVX_AI_GATEWAY_KEY','AI_GATEWAY_API_KEY','IVX_OPENAI_API_KEY','OPENAI_API_KEY']){
            const v=(direct.get(name)||'').trim();
            if(/^(vck_|sk-)/.test(v) && targetHashes.has(crypto.createHash('sha256').update(v,'utf8').digest('hex'))){aiKey=v;source=`render:${name}`;break;}
          }

          if(!aiKey){
            const objects=execFileSync('git',['rev-list','--objects','--all'],{encoding:'utf8',maxBuffer:64*1024*1024}).split('\n').filter(Boolean);
            const seen=new Set(); let scanned=0;
            const candidateRe=/(?:vck_[A-Za-z0-9._-]{12,}|sk-[A-Za-z0-9_-]{20,})/g;
            for(const line of objects){
              const sha=line.split(' ',1)[0]; if(!sha||seen.has(sha))continue; seen.add(sha);
              const type=spawnSync('git',['cat-file','-t',sha],{encoding:'utf8'}); if(type.status!==0||type.stdout.trim()!=='blob')continue;
              const sizeRun=spawnSync('git',['cat-file','-s',sha],{encoding:'utf8'}); const size=Number(sizeRun.stdout.trim());
              if(!Number.isFinite(size)||size<=0||size>2_000_000)continue;
              const blob=spawnSync('git',['cat-file','blob',sha],{encoding:'utf8',maxBuffer:3*1024*1024}); if(blob.status!==0)continue;
              scanned++;
              const matches=blob.stdout.match(candidateRe)||[];
              for(const candidate of matches){
                const hash=crypto.createHash('sha256').update(candidate,'utf8').digest('hex');
                if(targetHashes.has(hash)){aiKey=candidate;source='git_history_hash_match';break;}
              }
              if(aiKey)break;
            }
            if(!aiKey){
              const log=spawnSync('git',['log','--all','--format=%B'],{encoding:'utf8',maxBuffer:16*1024*1024});
              const matches=(log.stdout||'').match(candidateRe)||[];
              for(const candidate of matches){const hash=crypto.createHash('sha256').update(candidate,'utf8').digest('hex');if(targetHashes.has(hash)){aiKey=candidate;source='git_message_hash_match';break;}}
            }
            console.log(`history_scan=PASS blobs=${scanned} matched=${Boolean(aiKey)}`);
          }

          if(!aiKey) throw new Error('AI credential is stored encrypted but its plaintext is not recoverable from current Render bindings or repository history');
          console.log(`ai_credential_recovery=PASS source=${source}`);

          direct.set('IVX_AI_GATEWAY_KEY',aiKey);
          direct.set('AI_GATEWAY_API_KEY',aiKey);
          const merged=Array.from(direct,([key,value])=>({key,value}));
          const put=await rf(`/services/${serviceId}/env-vars`,{method:'PUT',body:JSON.stringify(merged)});
          if(!put.ok) throw new Error(`Render env PUT HTTP ${put.status}: ${put.text.slice(0,120)}`);
          const verify=await rf(`/services/${serviceId}/env-vars`);
          if(!verify.ok) throw new Error(`Render env verify HTTP ${verify.status}`);
          const verifyMap=new Map(); for(const item of verify.payload){const ev=item?.envVar??item;if(ev&&typeof ev.key==='string')verifyMap.set(ev.key,typeof ev.value==='string'?ev.value:'');}
          for(const name of ['IVX_AI_GATEWAY_KEY','AI_GATEWAY_API_KEY']){const v=verifyMap.get(name)||'';if(crypto.createHash('sha256').update(v,'utf8').digest('hex')!==crypto.createHash('sha256').update(aiKey,'utf8').digest('hex'))throw new Error(`Render verification failed for ${name}`);}
          console.log('render_ai_env_merge=PASS');

          const deploy=await rf(`/services/${serviceId}/deploys`,{method:'POST',body:JSON.stringify({clearCache:'do_not_clear'})});
          if(!deploy.ok) throw new Error(`Render deploy trigger HTTP ${deploy.status}`);
          const deployId=deploy.payload?.id||deploy.payload?.deploy?.id; if(!deployId)throw new Error('Render deploy id missing');
          console.log(`render_deploy_trigger=PASS id=${deployId}`);
          let live=false;
          for(let i=0;i<72;i++){const d=await rf(`/services/${serviceId}/deploys/${deployId}`);const st=d.payload?.status;if(st==='live'){live=true;break;}if(st==='failed'||st==='canceled')throw new Error(`Render deploy ${st}`);await new Promise(r=>setTimeout(r,5000));}
          if(!live)throw new Error('Render deploy timeout');
          console.log('render_deploy_live=PASS');

          let hp={};let hs=0;
          for(let i=0;i<30;i++){const h=await fetch('https://api.ivxholding.com/health/ai/live').catch(()=>null);if(h){hs=h.status;hp=await h.json().catch(()=>({}));if(h.ok&&hp?.ok===true)break;}await new Promise(r=>setTimeout(r,3000));}
          if(!hp?.ok){const ps=hp?.status;if(ps===401||ps===403)throw new Error(`AI credential rejected by provider HTTP ${ps}`);throw new Error(`live AI health failed HTTP ${hs} provider_status=${ps??'none'} reason=${String(hp?.reason??'unknown').slice(0,100)}`);}
          console.log('live_ai_health=PASS');
          const chat=await fetch('https://api.ivxholding.com/api/public/chat',{method:'POST',headers:{'Content-Type':'application/json','x-ivx-client-id':`recovery-${Date.now()}`},body:JSON.stringify({message:'Return only 42',sessionId:'ivx-recovery',requestId:`ivx-recovery-${Date.now()}`,history:[]})});
          const cp=await chat.json().catch(()=>({}));if(!chat.ok||!String(cp.answer??cp.text??'').trim()||cp.source==='fallback')throw new Error(`real inference failed HTTP ${chat.status} source=${cp.source??'none'}`);
          console.log(`real_ai_inference=PASS source=${cp.source??'remote_api'}`);
          NODE
