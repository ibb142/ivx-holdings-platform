name: Landing 112/Autonomous Enterprise Orchestrator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/landing-112-autonomous-3h-scheduler.yml'
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: landing-112-enterprise-orchestrator
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch one current-main 112-agent landing QA run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: landing-112-3h-enterprise-human-qa.yml
        shell: bash
        run: |
          set -euo pipefail

          # Enterprise invariant: never create duplicate fleet runs. A single
          # current-main queued/in-progress run owns the lane until terminal.
          current_sha="${GITHUB_SHA}"
          active=$(gh run list --workflow "$TARGET_WORKFLOW" --limit 30 \
            --json status,headSha,databaseId \
            --jq --arg sha "$current_sha" '[.[] | select(.headSha == $sha and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending"))] | length')
          if [ "$active" -gt 0 ]; then
            echo "LANDING_112_ORCHESTRATOR=PASS reason=current-main-run-already-active sha=${current_sha}"
            exit 0
          fi

          # Dispatch through gh so auth/API failures are fail-closed and visible.
          for attempt in 1 2 3; do
            if gh workflow run "$TARGET_WORKFLOW" --ref main; then
              echo "LANDING_112_ORCHESTRATOR=PASS dispatch_attempt=${attempt} sha=${current_sha}"
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo 'LANDING_112_ORCHESTRATOR=FAIL dispatch exhausted after 3 attempts' >&2
          exit 1

      - name: Verify fleet run entered GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: landing-112-3h-enterprise-human-qa.yml
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            found=$(gh run list --workflow "$TARGET_WORKFLOW" --limit 20 \
              --json status,headSha,databaseId,url \
              --jq --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)] | length')
            if [ "$found" -gt 0 ]; then
              gh run list --workflow "$TARGET_WORKFLOW" --limit 5 \
                --json status,conclusion,headSha,databaseId,url
              echo "LANDING_112_FLEET_ACCEPTED=PASS sha=${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "LANDING_112_FLEET_ACCEPTED=FAIL sha=${GITHUB_SHA}" >&2
          exit 1
