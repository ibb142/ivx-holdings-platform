name: Android v1.10.30 Black Screen Fix Delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-v11030-delivery.yml'
      - 'expo/app.config.ts'
      - 'expo/app/(tabs)/_layout.tsx'
      - 'expo/app/_providers.tsx'
      - 'expo/scripts/certify-android-launch.sh'
      - 'expo/__tests__/android-auth-route-black-screen.test.ts'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  build-certify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      IVX_RELEASE_KEYSTORE_BASE64: ${{ secrets.IVX_RELEASE_KEYSTORE_BASE64 }}
      IVX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.IVX_RELEASE_KEYSTORE_PASSWORD }}
      IVX_RELEASE_KEY_ALIAS: ${{ secrets.IVX_RELEASE_KEY_ALIAS }}
      IVX_RELEASE_KEY_PASSWORD: ${{ secrets.IVX_RELEASE_KEY_PASSWORD }}
      EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "APK v1.10.30 BLACKSCREEN RUN - ${GITHUB_RUN_ID}" \
            --body "Run ID: ${GITHUB_RUN_ID}\nSource SHA: ${GITHUB_SHA}\nVersion: 1.10.30\nVersion code: 128\nStatus: STARTED" || true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun install
          cd expo
          bun install
          bun scripts/apply-patches.mjs

      - name: Run black-screen regression tests
        working-directory: expo
        run: |
          set -euo pipefail
          bun test __tests__/android-auth-route-black-screen.test.ts __tests__/home-route-blank-screen.test.ts __tests__/text-node-guard-render-props.test.ts

      - name: Validate production signing
        run: |
          set -euo pipefail
          for variable in IVX_RELEASE_KEYSTORE_BASE64 IVX_RELEASE_KEYSTORE_PASSWORD IVX_RELEASE_KEY_ALIAS IVX_RELEASE_KEY_PASSWORD; do
            test -n "${!variable}"
          done
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/ivx-release.keystore"
          printf '%s' "$IVX_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$IVX_RELEASE_KEYSTORE_PASSWORD" -alias "$IVX_RELEASE_KEY_ALIAS" >/dev/null
          echo "IVX_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Pin native APK version to 1.10.30 / 128
        working-directory: expo
        run: |
          set -euo pipefail
          sed -i 's/versionCode 126/versionCode 128/' android/app/build.gradle
          sed -i 's/versionName "1.10.28"/versionName "1.10.30"/' android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle | head

      - name: Build signed production APK
        working-directory: expo/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint 2>&1 | tee "$GITHUB_WORKSPACE/gradle-v11030.log"

      - name: Verify APK and record SHA-256
        id: apk
        working-directory: expo/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apksigner-v11030.txt"
          HASH=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          cp "$APK" "$GITHUB_WORKSPACE/IVX-Holdings-v1.10.30-PRODUCTION.apk"
          echo "$HASH  IVX-Holdings-v1.10.30-PRODUCTION.apk" > "$GITHUB_WORKSPACE/IVX-Holdings-v1.10.30-PRODUCTION.sha256"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload APK before runtime QA
        uses: actions/upload-artifact@v4
        with:
          name: IVX-Holdings-v1.10.30-PRODUCTION-${{ github.sha }}
          path: |
            IVX-Holdings-v1.10.30-PRODUCTION.apk
            IVX-Holdings-v1.10.30-PRODUCTION.sha256
            apksigner-v11030.txt
            gradle-v11030.log
          retention-days: 30
          if-no-files-found: error

      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Certify visible login UI remains alive
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/expo/scripts/certify-android-launch.sh" "$GITHUB_WORKSPACE/IVX-Holdings-v1.10.30-PRODUCTION.apk" com.ivxholdings.app android-v11030-launch.png android-v11030-logcat.txt android-v11030-launch.txt android-v11030-package-version.txt "Sign In"

      - name: Upload visible-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IVX-Holdings-v1.10.30-RUNTIME-${{ github.sha }}
          path: |
            android-v11030-launch.png
            android-v11030-launch-*.png
            android-v11030-logcat.txt
            android-v11030-launch.txt
            android-v11030-launch-*-ui.xml
            android-v11030-package-version.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish final locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "APK v1.10.30 BLACKSCREEN RESULT - ${GITHUB_RUN_ID} - ${{ job.status }}" \
            --body "Run ID: ${GITHUB_RUN_ID}\nSource SHA: ${GITHUB_SHA}\nVersion: 1.10.30\nVersion code: 128\nJob status: ${{ job.status }}\nAPK SHA-256: ${{ steps.apk.outputs.hash }}\nAPK size: ${{ steps.apk.outputs.size }}\nAPK artifact: IVX-Holdings-v1.10.30-PRODUCTION-${GITHUB_SHA}\nRuntime artifact: IVX-Holdings-v1.10.30-RUNTIME-${GITHUB_SHA}\nVisible UI gate: Sign In at t+6s, t+16s, and restart+8s" || true
