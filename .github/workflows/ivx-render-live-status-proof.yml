name: IVX Render Live Status Proof

on:
  push:
    branches: [main, fix/fleet-render-ha-20260908]
    paths:
      - 'backend/**'
      - 'server.ts'
      - 'Dockerfile'
      - 'scripts/ivx-fleet-slo-live-proof.ts'
      - 'scripts/ivx-fleet-ha-live-proof.ts'
      - 'render.yaml'
      - 'package.json'
      - 'bun.lock'
      - 'bun.lockb'
      - '.github/workflows/ivx-render-live-status-proof.yml'
  workflow_dispatch:
    inputs:
      restart_worker:
        description: Verify a rolling worker restart with continuous API probes
        type: boolean
        default: false
      target_sha:
        description: Existing main SHA to certify (defaults to the dispatched ref)
        type: string
        required: false
        default: ''
      authorized_system_fallback:
        description: Use the protected IVX machine credential if Supabase Auth is unreachable
        type: boolean
        default: false

concurrency:
  group: ivx-render-live-status-proof-main
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  prove-live-exact-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      API_BASE: https://api.ivxholding.com
      OWNER_EMAIL: iperez4242@gmail.com
      OWNER_PASSWORD_S1: ${{ secrets.OWNER_NEW_PASSWORD }}
      OWNER_PASSWORD_S2: ${{ secrets.OWNER_PASSWORD }}
      OWNER_PASSWORD_S3: ${{ secrets.IVX_OWNER_PASSWORD }}
      OWNER_PASSWORD_S4: ${{ secrets.IVX_OWNER_NEW_PASSWORD }}
      OWNER_PASSWORD_S5: ${{ secrets.OWNER_LOGIN_PASSWORD }}
      OWNER_PASSWORD_S6: ${{ secrets.IVX_OWNER_LOGIN_PASSWORD }}
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      IVX_SYSTEM_KEY: ${{ secrets.IVX_AI_SYSTEM_SECRET || secrets.IVX_SYSTEM_SECRET }}
      IVX_TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      IVX_AUTHORIZED_SYSTEM_FALLBACK: ${{ inputs.authorized_system_fallback || (github.event_name == 'push' && github.ref_name == 'fix/fleet-render-ha-20260908') }}
      IVX_HA_RESTART_WORKER: ${{ inputs.restart_worker || github.ref_name == 'fix/fleet-render-ha-20260908' || contains(github.event.head_commit.message, '[verify-fleet-ha-recovery]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Resolve protected certification target
        shell: bash
        run: |
          set -euo pipefail
          target="$IVX_TARGET_SHA"
          if [ "$GITHUB_REF_NAME" = fix/fleet-render-ha-20260908 ]; then
            test "$GITHUB_ACTOR" = ibb142
            git fetch origin main --quiet
            target=$(git rev-parse origin/main)
          fi
          test "$(printf '%s' "$target" | grep -Ec '^[a-f0-9]{40}$')" = 1
          echo "IVX_TARGET_SHA=$target" >> "$GITHUB_ENV"
          echo "certification_target=$target trigger_sha=$GITHUB_SHA"
      - name: Publish pending exact-SHA status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${IVX_TARGET_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"ivx/render-live-exact-sha\",\"description\":\"Waiting for Render exact-SHA production parity\"}"

      - name: Wait for health and version exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(printf '%s' "$IVX_TARGET_SHA" | grep -Ec '^[a-f0-9]{40}$')" = 1
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$IVX_TARGET_SHA" != "$GITHUB_SHA" ]; then
            git fetch origin main --quiet
            test "$IVX_TARGET_SHA" = "$(git rev-parse origin/main)" || { echo 'target_sha must be current main'; exit 1; }
          fi
          for i in $(seq 1 90); do
            health_code=$(curl -sS -m 20 -o /tmp/health.json -w '%{http_code}' "${API_BASE}/health" || true)
            version_code=$(curl -sS -m 20 -o /tmp/version.json -w '%{http_code}' "${API_BASE}/version" || true)
            health_commit=$(jq -r '.commit // .sha // .gitCommit // .git_commit // empty' /tmp/health.json 2>/dev/null || true)
            health_ok=$(jq -r '.ok // false' /tmp/health.json 2>/dev/null || echo false)
            version_commit=$(jq -r '.commit // empty' /tmp/version.json 2>/dev/null || true)
            version_ok=$(jq -r '.ok // false' /tmp/version.json 2>/dev/null || echo false)
            echo "poll=$i health_http=$health_code health_ok=$health_ok health_sha=${health_commit:-missing} version_http=$version_code version_ok=$version_ok version_sha=${version_commit:-missing} expected=$IVX_TARGET_SHA"
            if [ "$health_code" = "200" ] && [ "$version_code" = "200" ] && [ "$health_ok" = "true" ] && [ "$version_ok" = "true" ] && [ "$health_commit" = "$IVX_TARGET_SHA" ] && [ "$version_commit" = "$IVX_TARGET_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not reach exact SHA ${IVX_TARGET_SHA}" >&2
          exit 1

      - name: Resolve real owner credential binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OWNER_EMAIL"; test -n "$SUPABASE_URL"; test -n "$SUPABASE_ANON_KEY"
          owner_password=''; binding='none'
          for pair in 'OWNER_NEW_PASSWORD:OWNER_PASSWORD_S1' 'OWNER_PASSWORD:OWNER_PASSWORD_S2' 'IVX_OWNER_PASSWORD:OWNER_PASSWORD_S3' 'IVX_OWNER_NEW_PASSWORD:OWNER_PASSWORD_S4' 'OWNER_LOGIN_PASSWORD:OWNER_PASSWORD_S5' 'IVX_OWNER_LOGIN_PASSWORD:OWNER_PASSWORD_S6'; do
            name=${pair%%:*}; var=${pair##*:}; value=${!var:-}
            if [ -n "$value" ]; then owner_password="$value"; binding="$name"; break; fi
          done
          test -n "$owner_password" || { echo 'No Owner password alias is bound.'; exit 1; }
          echo "::add-mask::$owner_password"
          {
            echo 'OWNER_PASSWORD_EFFECTIVE<<IVX_EOF'
            echo "$owner_password"
            echo 'IVX_EOF'
            echo "OWNER_PASSWORD_BINDING=$binding"
          } >> "$GITHUB_ENV"
          echo "owner_password_binding=$binding"

      - name: Authenticate real Owner or protected owner-authorized automation
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -nc --arg email "$OWNER_EMAIL" --arg password "$OWNER_PASSWORD_EFFECTIVE" '{email:$email,password:$password}')
          code=$(curl -sS --retry 2 --retry-delay 2 --retry-all-errors --max-time 20 -o /tmp/login-predeploy.json -w '%{http_code}' -X POST "${SUPABASE_URL%/}/auth/v1/token?grant_type=password" -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" -H 'Content-Type: application/json' --data "$body" || true)
          if [ "$code" = 200 ]; then
            token=$(jq -r '.access_token // empty' /tmp/login-predeploy.json)
            user_id=$(jq -r '.user.id // empty' /tmp/login-predeploy.json)
            role=$(jq -r '.user.app_metadata.role // .user.user_metadata.role // empty' /tmp/login-predeploy.json)
            test -n "$token"; test -n "$user_id"
            case "$role" in owner|admin) ;; *) echo "Owner role gate failed role=${role:-missing}"; exit 1;; esac
            echo "::add-mask::$token"
            echo "OWNER_TOKEN=$token" >> "$GITHUB_ENV"
            echo "OWNER_USER_ID=$user_id" >> "$GITHUB_ENV"
            echo 'IVX_HA_AUTH_MODE=owner_bearer' >> "$GITHUB_ENV"
            echo 'owner_predeploy_auth=PASS'
            exit 0
          fi
          jq '{error,error_code,msg,message}' /tmp/login-predeploy.json 2>/dev/null || true
          if [ "$IVX_AUTHORIZED_SYSTEM_FALLBACK" = true ] && [ "$GITHUB_ACTOR" = ibb142 ] && [ -n "${IVX_SYSTEM_KEY:-}" ]; then
            echo "::add-mask::$IVX_SYSTEM_KEY"
            echo 'IVX_HA_AUTH_MODE=system_key' >> "$GITHUB_ENV"
            echo 'owner_authorized_system_auth=PASS reason=supabase_auth_unreachable'
            exit 0
          fi
          echo "Supabase owner authentication failed with HTTP ${code:-000}; protected fallback was not authorized."
          exit 1

      - name: Apply two replicas and prove shared topology
        run: bun scripts/ivx-fleet-ha-live-proof.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-ha-${{ env.IVX_TARGET_SHA }}-${{ github.run_attempt }}
          path: qa/evidence/fleet-ha/
          if-no-files-found: warn

      - name: Prove authenticated fleet telemetry and five-minute process stability
        env:
          IVX_SYSTEM_KEY: ${{ secrets.IVX_AI_SYSTEM_SECRET || secrets.IVX_SYSTEM_SECRET }}
        run: bun scripts/ivx-fleet-slo-live-proof.ts

      - name: Publish success exact-SHA status
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${IVX_TARGET_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"ivx/render-live-exact-sha\",\"description\":\"Exact SHA, stable health, authenticated fleet SLO verified\"}"

      - name: Publish failure exact-SHA status
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${IVX_TARGET_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"ivx/render-live-exact-sha\",\"description\":\"Render exact-SHA production parity failed\"}"
