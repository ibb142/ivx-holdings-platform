name: IVX 112 Final Live Certificate

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ivx-112-final-live-cert
  cancel-in-progress: true

jobs:
  audit-deploy-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_BASE: https://api.ivxholding.com
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Source QA for 112-agent root invariants
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JWT_SECRET:-}"
          grep -q "TOTAL_AGENTS_REQUIRED = 112" backend/services/ivx-real-execution-certificate.ts
          grep -q "simulatedRuns" backend/services/ivx-real-execution-certificate.ts
          grep -q "resolveActiveIVXSystemSecret" backend/api/ivx-agent-api.ts
          grep -q "ciSystemAuthorized" backend/api/ivx-agent-api.ts
          grep -q "createHmac('sha256'" backend/api/ivx-agent-api.ts
          grep -q "certificate/run" backend/api/ivx-agent-api.ts
          grep -q "ivx_holdings_\\\\d+" backend/api/ivx-agent-api.ts
          ! grep -q "provided.startsWith('owner-')" backend/api/ivx-agent-api.ts
          echo 'source_112_root_invariants=PASS'

      - name: Wait for exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            code=$(curl -sS -m 20 -o /tmp/version.json -w '%{http_code}' "${API_BASE}/version" || true)
            if [ "$code" = 200 ]; then
              ok=$(jq -r '.ok // false' /tmp/version.json)
              live=$(jq -r '.commit // empty' /tmp/version.json)
              echo "poll=$i live=${live:-missing} expected=$GITHUB_SHA"
              if [ "$ok" = true ] && [ "$live" = "$GITHUB_SHA" ]; then
                echo 'exact_production_sha=PASS'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Exact production SHA never became live.'
          exit 1

      - name: Audit all 112 live contracts and runtime guards
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "${API_BASE}/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents' /tmp/agents.json)" = 112
          test "$(jq '[.agents[].agentId]|unique|length' /tmp/agents.json)" = 112
          test "$(jq '[.agents[].agentNumber]|unique|length' /tmp/agents.json)" = 112
          test "$(jq '[.agents[]|select(.paused==true or .disabled==true)]|length' /tmp/agents.json)" = 0
          mkdir -p /tmp/ivx-contracts
          jq -r '.agents[].agentId' /tmp/agents.json | while read -r agent_id; do
            code=$(curl -sS -m 20 -o "/tmp/ivx-contracts/${agent_id}.json" -w '%{http_code}' "${API_BASE}/api/ivx/agents/${agent_id}/contract" || true)
            test "$code" = 200
            test "$(jq -r '.ok // false' "/tmp/ivx-contracts/${agent_id}.json")" = true
            test -n "$(jq -r '.contract.memoryNamespace // empty' "/tmp/ivx-contracts/${agent_id}.json")"
            test -n "$(jq -r '.contract.queueNamespace // empty' "/tmp/ivx-contracts/${agent_id}.json")"
            test -n "$(jq -r '.contract.instructionHash // empty' "/tmp/ivx-contracts/${agent_id}.json")"
          done
          test "$(find /tmp/ivx-contracts -name '*.json' | wc -l | tr -d ' ')" = 112
          jq -s '[.[].contract.memoryNamespace] | unique | length' /tmp/ivx-contracts/*.json | grep -qx '112'
          jq -s '[.[].contract.queueNamespace] | unique | length' /tmp/ivx-contracts/*.json | grep -qx '112'
          jq -s '[.[].contract.agentId] | unique | length' /tmp/ivx-contracts/*.json | grep -qx '112'
          unauth=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' -X POST "${API_BASE}/api/ivx/agents/ivx_holdings_1/pause")
          test "$unauth" = 401
          echo 'live_112_registry_contract_isolation_and_security=PASS'

      - name: Start real 112-agent certificate with scoped CI proof
        shell: bash
        run: |
          set -euo pipefail
          CI_PATH='/api/ivx/agents/certificate/run'
          CI_TS=$(date +%s)
          CI_PROOF=$(CI_TS="$CI_TS" CI_PATH="$CI_PATH" node -e "const {createHmac}=require('node:crypto'); process.stdout.write(createHmac('sha256',process.env.JWT_SECRET).update(process.env.CI_TS+':POST:'+process.env.CI_PATH).digest('hex'))")
          HTTP=$(curl -sS -m 30 -o /tmp/start.json -w '%{http_code}' \
            -X POST "${API_BASE}${CI_PATH}" \
            -H 'Content-Type: application/json' \
            -H "x-ivx-ci-ts: ${CI_TS}" \
            -H "x-ivx-ci-proof: ${CI_PROOF}" \
            --data '{}')
          jq '{ok,runId,error,message}' /tmp/start.json || true
          test "$HTTP" = 200
          test "$(jq -r '.ok // false' /tmp/start.json)" = true
          RUN_ID=$(jq -r '.runId // empty' /tmp/start.json)
          test -n "$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "certificate_run=$RUN_ID"

      - name: Wait for 112 of 112 real completion
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            curl -fsS "${API_BASE}/api/ivx/agents/certificate/progress" -o /tmp/progress.json
            status=$(jq -r '.activeRun.status // "none"' /tmp/progress.json)
            processed=$(jq -r '.activeRun.processed // 0' /tmp/progress.json)
            failed=$(jq -r '.activeRun.failed // 0' /tmp/progress.json)
            run=$(jq -r '.activeRun.runId // empty' /tmp/progress.json)
            echo "poll=$i run=${run:-none} status=$status processed=$processed failed=$failed"
            if [ "$run" = "$RUN_ID" ] && [ "$status" = failed ]; then exit 1; fi
            curl -fsS "${API_BASE}/api/ivx/agents/certificate" -o /tmp/cert.json
            cert_run=$(jq -r '.runId // .certificate.runId // empty' /tmp/cert.json)
            certified=$(jq -r '.certified // .certificate.certified // false' /tmp/cert.json)
            if [ "$cert_run" = "$RUN_ID" ] && [ "$certified" = true ]; then break; fi
            sleep 10
          done
          curl -fsS "${API_BASE}/api/ivx/agents/certificate" -o /tmp/cert.json
          test "$(jq -r '.certified // .certificate.certified // false' /tmp/cert.json)" = true
          test "$(jq -r '.runId // .certificate.runId // empty' /tmp/cert.json)" = "$RUN_ID"
          test "$(jq -r '.total // .certificate.total // 0' /tmp/cert.json)" = 112
          test "$(jq -r '.healthy // .certificate.healthy // 0' /tmp/cert.json)" = 112
          test "$(jq -r '.realExecutionVerified // .certificate.realExecutionVerified // 0' /tmp/cert.json)" = 112
          test "$(jq -r '.evidenceVerified // .certificate.evidenceVerified // 0' /tmp/cert.json)" = 112
          test "$(jq -r '.simulatedRuns // .certificate.simulatedRuns // -1' /tmp/cert.json)" = 0
          cert_sha=$(jq -r '.commitSha // .certificate.commitSha // empty' /tmp/cert.json)
          test "$cert_sha" = "$GITHUB_SHA"
          echo 'final_112_real_certificate=PASS'

      - name: Write final GitHub certificate artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence
          jq --arg githubSha "$GITHUB_SHA" --arg runId "$RUN_ID" --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. + {githubFinalCertificate:true, githubSha:$githubSha, requestedRunId:$runId, verifiedAt:$verifiedAt, verdict:"112/112 PASS — exact deployed SHA — 0 simulated"}' \
            /tmp/cert.json > qa/evidence/IVX-112-FINAL-LIVE-CERTIFICATE.json
          cat qa/evidence/IVX-112-FINAL-LIVE-CERTIFICATE.json

      - name: Upload final 112 certificate
        uses: actions/upload-artifact@v4
        with:
          name: IVX-112-FINAL-LIVE-CERTIFICATE-${{ github.sha }}
          path: qa/evidence/IVX-112-FINAL-LIVE-CERTIFICATE.json
          if-no-files-found: error
