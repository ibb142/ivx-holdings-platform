name: IVX 112 No-Idle Fail-Closed Recovery

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: ivx-112-no-idle-failclosed-recovery
  cancel-in-progress: false

jobs:
  recover-live-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_BASE: https://api.ivxholding.com
      REPO: ibb142/ivx-holdings-platform
      LANDING_112_WORKFLOW: landing-112-agent-autonomous-qa.yml
      IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
      IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
    steps:
      - name: Read live dispatcher truth
        id: before
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --max-time 30 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/before.json
          test "$(jq -r '.ok // false' /tmp/before.json)" = true
          max=$(jq -r '.dispatcher.maxConcurrency // 0' /tmp/before.json)
          running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/before.json)
          queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/before.json)
          blocked=$(jq -r '.dispatcher.totals.blocked // 0' /tmp/before.json)
          failed=$(jq -r '.dispatcher.totals.failed // 0' /tmp/before.json)
          owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/before.json)
          test "$max" -eq 112
          echo "running=$running" >> "$GITHUB_OUTPUT"
          echo "queued=$queued" >> "$GITHUB_OUTPUT"
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "owner_gate=$owner_gate" >> "$GITHUB_OUTPUT"
          echo "LIVE running=$running queued=$queued blocked=$blocked failed=$failed ownerGate=$owner_gate"

      - name: Obtain bounded Autonomous OIDC token
        if: steps.before.outputs.running == '0'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$token_json" | jq -r '.value // empty')
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Root resume and immediate dispatcher tick
        if: steps.before.outputs.running == '0'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 45 -o /tmp/resume.json -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -H "X-IVX-GitHub-OIDC: $OIDC_TOKEN" \
            -d '{"action":"resume_all"}' \
            "$API_BASE/api/ivx/agents/app-completion/control")
          echo "resume_http=$code"
          cat /tmp/resume.json
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/resume.json)" = true

      - name: Check whether root resume started real workers
        if: steps.before.outputs.running == '0'
        id: root_verify
        shell: bash
        run: |
          set -euo pipefail
          started=false
          for attempt in 1 2 3; do
            sleep 5
            curl -fsS --retry 2 --retry-delay 1 --max-time 20 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/root-after.json
            running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/root-after.json)
            queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/root-after.json)
            echo "root_attempt=$attempt running=$running queued=$queued"
            if [ "$running" -gt 0 ]; then started=true; break; fi
          done
          echo "started=$started" >> "$GITHUB_OUTPUT"

      - name: Bounded per-agent recycling fallback
        if: steps.before.outputs.running == '0' && steps.root_verify.outputs.started != 'true'
        shell: bash
        run: |
          set -euo pipefail
          owner_key="${IVX_SYSTEM_SECRET:-${IVX_AI_SYSTEM_SECRET:-}}"
          if [ -z "$owner_key" ]; then
            echo 'owner_secret_unavailable=true; continuing to second OIDC resume'
            exit 0
          fi
          rm -f /tmp/retry-failures
          export owner_key API_BASE
          seq 1 112 | xargs -P 8 -I{} bash -c '
            agent="$1"
            code=$(curl -sS --connect-timeout 3 --max-time 6 -o "/tmp/retry-${agent}.json" -w "%{http_code}" \
              -X POST -H "content-type: application/json" -H "x-ivx-owner-key: ${owner_key}" \
              -d "{\"action\":\"retry_agent\",\"agentNumber\":${agent}}" \
              "${API_BASE}/api/ivx/agents/app-completion/control" 2>/dev/null || printf 000)
            if [ "$code" != 200 ]; then printf "%s\n" "$agent" >> /tmp/retry-failures; fi
          ' _ {}
          failures=0
          if [ -f /tmp/retry-failures ]; then failures=$(wc -l < /tmp/retry-failures); fi
          echo "bounded_retry_failures=$failures"
          # Per-agent recycling is best-effort. It must never prevent the
          # signed global recovery command and fail-closed verification.
          exit 0

      - name: Second signed resume after bounded recycling
        if: steps.before.outputs.running == '0' && steps.root_verify.outputs.started != 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 45 -o /tmp/resume2.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: $OIDC_TOKEN" \
            -d '{"action":"resume_all"}' "$API_BASE/api/ivx/agents/app-completion/control")
          echo "resume2_http=$code"
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/resume2.json)" = true

      - name: Require real workers to start
        if: steps.before.outputs.running == '0'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          started=false
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            curl -fsS --retry 2 --retry-delay 1 --max-time 20 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/after.json
            running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/after.json)
            queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/after.json)
            blocked=$(jq -r '.dispatcher.totals.blocked // 0' /tmp/after.json)
            failed=$(jq -r '.dispatcher.totals.failed // 0' /tmp/after.json)
            echo "attempt=$attempt running=$running queued=$queued blocked=$blocked failed=$failed"
            if [ "$running" -gt 0 ]; then started=true; break; fi
          done
          echo "started=$started" >> "$GITHUB_OUTPUT"

      - name: Trigger real 112-worker War Room fallback
        if: steps.before.outputs.running == '0' && steps.verify.outputs.started != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/workflows/$LANDING_112_WORKFLOW/dispatches" \
            -d '{"ref":"main"}')
          echo "fallback_dispatch_http=$code"
          test "$code" = 204

      - name: Fail closed on silent idle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --max-time 30 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/final.json
          running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/final.json)
          queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/final.json)
          owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/final.json)
          productive=$(jq -r '.dispatcher.utilization24h.productiveAgentHours // 0' /tmp/final.json)
          utilization=$(jq -r '.dispatcher.utilization24h.utilizationPercent // 0' /tmp/final.json)
          echo "FINAL running=$running queued=$queued ownerGate=$owner_gate productiveHours=$productive utilization=$utilization"
          if [ "$running" -eq 0 ] && [ "$queued" -gt 0 ]; then
            echo 'FAIL-CLOSED: executable backlog exists but no production worker is RUNNING.'
            exit 1
          fi
          if [ "$running" -eq 0 ] && [ "$queued" -eq 0 ] && [ "$owner_gate" -eq 0 ]; then
            echo 'FAIL-CLOSED: no workers and no owner gate; Autonomous must create or recycle useful work.'
            exit 1
          fi
          echo "IVX_112_NO_IDLE_PROOF runningNow=$running queuedNow=$queued productiveAgentHours=$productive utilizationPercent=$utilization"
