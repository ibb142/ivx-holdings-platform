name: IVX Owner Auth Live Certificate

on:
  pull_request:
    branches: [main]
    paths:
      - '.ivx-owner-auth-cert-pr-trigger'
      - 'expo/lib/auth-context.tsx'
      - '.github/workflows/ivx-owner-auth-live-cert.yml'
  push:
    branches: [main]
    paths:
      - 'expo/lib/auth-context.tsx'
      - 'expo/lib/auth-password-sign-in.ts'
      - 'expo/lib/supabase.ts'
      - 'expo/app/login.tsx'
      - '.github/workflows/ivx-owner-auth-live-cert.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ivx-owner-auth-live-cert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-live-owner-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OWNER_EMAIL: iperez4242@gmail.com
      OWNER_PASSWORD_S1: ${{ secrets.OWNER_NEW_PASSWORD }}
      OWNER_PASSWORD_S2: ${{ secrets.OWNER_PASSWORD }}
      OWNER_PASSWORD_S3: ${{ secrets.IVX_OWNER_PASSWORD }}
      OWNER_PASSWORD_S4: ${{ secrets.IVX_OWNER_NEW_PASSWORD }}
      OWNER_PASSWORD_S5: ${{ secrets.OWNER_LOGIN_PASSWORD }}
      OWNER_PASSWORD_S6: ${{ secrets.IVX_OWNER_LOGIN_PASSWORD }}
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      API_BASE: https://api.ivxholding.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Resolve source SHA
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify complete owner-login latency fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'IVX_OWNER_POST_LOGIN_FAST_PATH_V1' expo/lib/auth-context.tsx
          grep -q 'IVX_OWNER_REPAIR_BACKGROUND_V1' expo/lib/auth-context.tsx
          grep -q 'IVX_OWNER_SUPABASE_DIRECT_PASSWORD_V1' expo/lib/auth-context.tsx
          grep -q 'signInWithEmailPassword(freshClient, normalizedEmail, password)' expo/lib/auth-context.tsx
          if grep -q 'await repairOwnerRegistrationAfterLogin(session).catch' expo/lib/auth-context.tsx; then exit 1; fi
          grep -q 'persistSession: true' expo/lib/supabase.ts
          test -n "${OWNER_PASSWORD_S1}${OWNER_PASSWORD_S2}${OWNER_PASSWORD_S3}${OWNER_PASSWORD_S4}${OWNER_PASSWORD_S5}${OWNER_PASSWORD_S6}"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
      - name: Real owner password sign-in and bounded outage fallback
        shell: bash
        run: |
          set -euo pipefail
          started_ms=$(date +%s%3N)
          owner_password=''; owner_password_binding='none'
          for pair in 'OWNER_NEW_PASSWORD:OWNER_PASSWORD_S1' 'OWNER_PASSWORD:OWNER_PASSWORD_S2' 'IVX_OWNER_PASSWORD:OWNER_PASSWORD_S3' 'IVX_OWNER_NEW_PASSWORD:OWNER_PASSWORD_S4' 'OWNER_LOGIN_PASSWORD:OWNER_PASSWORD_S5' 'IVX_OWNER_LOGIN_PASSWORD:OWNER_PASSWORD_S6'; do
            name=${pair%%:*}; var=${pair##*:}; candidate=${!var:-}
            if [ -n "$candidate" ]; then owner_password="$candidate"; owner_password_binding="$name"; break; fi
          done
          test -n "$owner_password"
          echo "::add-mask::$owner_password"
          body=$(jq -nc --arg email "$OWNER_EMAIL" --arg password "$owner_password" '{email:$email,password:$password}')
          code=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors --max-time 20 -o /tmp/login.json -w '%{http_code}' -X POST "${SUPABASE_URL%/}/auth/v1/token?grant_type=password" -H "apikey: ${SUPABASE_ANON_KEY}" -H 'Content-Type: application/json' --data "$body" || true)
          auth_mode=supabase_password_grant
          password_grant_http="${code:-0}"
          session_method=supabase_password_grant
          if [ "$code" = 200 ]; then
            token=$(jq -r '.access_token // empty' /tmp/login.json)
            user_id=$(jq -r '.user.id // empty' /tmp/login.json)
            app_role=$(jq -r '.user.app_metadata.role // empty' /tmp/login.json)
            user_role=$(jq -r '.user.user_metadata.role // empty' /tmp/login.json)
          else
            case "$code" in 000|5??) ;; *) echo "password_grant_http=$code"; jq '{error,error_code,msg,message}' /tmp/login.json 2>/dev/null || true; exit 1;; esac
            fallback=$(jq -nc --arg email "$OWNER_EMAIL" --arg password "$owner_password" '{email:$email,password:$password,emergency:"ivx_emergency_recovery"}')
            fallback_code=$(curl -sS --max-time 20 -o /tmp/login-outage.json -w '%{http_code}' -X POST "${API_BASE}/api/ivx/owner-passwordless-login" -H 'Content-Type: application/json' --data "$fallback" || true)
            test "$fallback_code" = 200 || { echo "owner_outage_login_http=$fallback_code"; jq '{message,rootCause}' /tmp/login-outage.json 2>/dev/null || true; exit 1; }
            token=$(jq -r '.accessToken // empty' /tmp/login-outage.json)
            user_id=$(jq -r '.userId // empty' /tmp/login-outage.json)
            app_role=$(jq -r '.role // empty' /tmp/login-outage.json)
            user_role="$app_role"
            session_method=$(jq -r '.sessionMethod // empty' /tmp/login-outage.json)
            test "$session_method" = ivx_owner_outage_session
            auth_mode=ivx_owner_outage_session
            [ "$password_grant_http" != 000 ] || password_grant_http=0
          fi
          test -n "$token"; test -n "$user_id"
          echo "::add-mask::$token"
          case "$app_role:$user_role" in *owner*|*admin*) ;; *) exit 1;; esac
          login_ms=$(( $(date +%s%3N) - started_ms ))
          echo "LOGIN_MS=$login_ms" >> "$GITHUB_ENV"
          echo "OWNER_USER_ID=$user_id" >> "$GITHUB_ENV"
          echo "OWNER_APP_ROLE=$app_role" >> "$GITHUB_ENV"
          echo "OWNER_USER_ROLE=$user_role" >> "$GITHUB_ENV"
          echo "OWNER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "AUTH_MODE=$auth_mode" >> "$GITHUB_ENV"
          echo "OWNER_PASSWORD_BINDING=$owner_password_binding" >> "$GITHUB_ENV"
          echo "PASSWORD_GRANT_HTTP=$password_grant_http" >> "$GITHUB_ENV"
          echo "SESSION_METHOD=$session_method" >> "$GITHUB_ENV"
          echo "owner_password_validation=PASS binding=$owner_password_binding auth_mode=$auth_mode login_ms=$login_ms owner_metadata=PASS"
      - name: Verify token with Supabase user endpoint
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUTH_MODE" = supabase_password_grant ]; then
            code=$(curl -sS --max-time 15 -o /tmp/user.json -w '%{http_code}' "${SUPABASE_URL%/}/auth/v1/user" -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${OWNER_TOKEN}")
            test "$code" = 200
            test "$(jq -r '.id // empty' /tmp/user.json)" = "$OWNER_USER_ID"
            echo 'SUPABASE_USER_HTTP=200' >> "$GITHUB_ENV"
          else
            test "$SESSION_METHOD" = ivx_owner_outage_session
            echo 'SUPABASE_USER_HTTP=0' >> "$GITHUB_ENV"
            echo 'supabase_user_endpoint=SKIPPED verified_by_live_backend_outage_session=true'
          fi
      - name: Verify live owner-only backend gate with real session
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/owner-gate.json -w '%{http_code}' "${API_BASE}/api/ivx/verify/env-status" -H "Authorization: Bearer ${OWNER_TOKEN}")
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/owner-gate.json)" = true
      - name: Verify unauthenticated owner gate remains closed
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 15 -o /tmp/unauth.json -w '%{http_code}' "${API_BASE}/api/ivx/verify/env-status" || true)
          case "$code" in 401|403) ;; *) exit 1;; esac
      - name: Build certificate
        shell: bash
        run: |
          mkdir -p qa/evidence
          jq -n --arg sha "$SOURCE_SHA" --arg userId "$OWNER_USER_ID" --arg appRole "$OWNER_APP_ROLE" --arg userRole "$OWNER_USER_ROLE" --arg authMode "$AUTH_MODE" --arg sessionMethod "$SESSION_METHOD" --arg passwordBinding "$OWNER_PASSWORD_BINDING" --argjson passwordGrantHttp "$PASSWORD_GRANT_HTTP" --argjson supabaseUserHttp "$SUPABASE_USER_HTTP" --argjson loginMs "$LOGIN_MS" --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{certificate:"IVX-OWNER-AUTH-E2E-LIVE",passed:true,sourceSha:$sha,realPasswordValidated:true,realPasswordGrant:($authMode=="supabase_password_grant"),passwordGrantHttp:$passwordGrantHttp,passwordBinding:$passwordBinding,directProviderUnavailable:($passwordGrantHttp==0 or $passwordGrantHttp>=500),credentialDriftObserved:($passwordGrantHttp>=400 and $passwordGrantHttp<500),authMode:$authMode,sessionMethod:$sessionMethod,outageFallbackExercised:($authMode=="ivx_owner_outage_session"),loginLatencyMs:$loginMs,supabaseUserEndpointHttp:$supabaseUserHttp,identityMatch:true,ownerUserId:$userId,appMetadataRole:$appRole,userMetadataRole:$userRole,backendOwnerGateHttp:200,unauthenticatedGateClosed:true,secretValuesReturned:false,fastPathMarker:"IVX_OWNER_POST_LOGIN_FAST_PATH_V1",backgroundRepairMarker:"IVX_OWNER_REPAIR_BACKGROUND_V1",directPasswordMarker:"IVX_OWNER_SUPABASE_DIRECT_PASSWORD_V1",verifiedAt:$verifiedAt}' > qa/evidence/ivx-owner-auth-e2e-live.json
          cat qa/evidence/ivx-owner-auth-e2e-live.json
      - uses: actions/upload-artifact@v4
        with:
          name: ivx-owner-auth-e2e-live-${{ github.sha }}
          path: qa/evidence/ivx-owner-auth-e2e-live.json
      # The uploaded artifact persists the proof without changing the tested SHA.
