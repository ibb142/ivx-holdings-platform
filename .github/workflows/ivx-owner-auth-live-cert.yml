name: IVX Owner Auth Live Certificate

on:
  pull_request:
    branches: [main]
    paths:
      - '.ivx-owner-auth-cert-pr-trigger'
      - 'expo/lib/auth-context.tsx'
      - '.github/workflows/ivx-owner-auth-live-cert.yml'
  push:
    branches: [main]
    paths:
      - 'expo/lib/auth-context.tsx'
      - 'expo/lib/auth-password-sign-in.ts'
      - 'expo/lib/supabase.ts'
      - 'expo/app/login.tsx'
      - '.github/workflows/ivx-owner-auth-live-cert.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ivx-owner-auth-live-cert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-live-owner-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OWNER_EMAIL: iperez4242@gmail.com
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      API_BASE: https://api.ivxholding.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Resolve auth source SHA
        shell: bash
        run: |
          git fetch origin main
          echo "SOURCE_SHA=$(git log -1 --format=%H origin/main -- expo/lib/auth-context.tsx)" >> "$GITHUB_ENV"
      - name: Verify complete owner-login latency fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'IVX_OWNER_POST_LOGIN_FAST_PATH_V1' expo/lib/auth-context.tsx
          grep -q 'IVX_OWNER_REPAIR_BACKGROUND_V1' expo/lib/auth-context.tsx
          grep -q 'IVX_OWNER_SUPABASE_DIRECT_PASSWORD_V1' expo/lib/auth-context.tsx
          grep -q 'signInWithEmailPassword(freshClient, normalizedEmail, password)' expo/lib/auth-context.tsx
          if grep -q 'await repairOwnerRegistrationAfterLogin(session).catch' expo/lib/auth-context.tsx; then exit 1; fi
          grep -q 'persistSession: true' expo/lib/supabase.ts
          grep -q "readEnv('IVX_OWNER_PASSWORD') || readEnv('OWNER_NEW_PASSWORD')" backend/api/ivx-owner-passwordless-login.ts
          grep -q "getIVXOwnerVariableRuntimeValue('OWNER_NEW_PASSWORD')" backend/api/ivx-owner-passwordless-login.ts
          grep -q 'signInWithPassword' backend/api/ivx-owner-passwordless-login.ts
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
      - name: Real runtime-bound Supabase password grant and latency
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -nc --arg email "$OWNER_EMAIL" '{email:$email,emergency:"ivx_emergency_recovery"}')
          curl -sS --max-time 20 -o /tmp/login.json -w '%{http_code} %{time_total}' -X POST "${API_BASE}/api/ivx/owner-passwordless-login" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$body" > /tmp/login.metrics
          read -r code total < /tmp/login.metrics
          echo "owner_runtime_login_http=$code"
          jq '{success,sessionMethod,credentialBinding,outageMode,hasAccessToken:((.accessToken // "")|length>0),hasRefreshToken:((.refreshToken // "")|length>0),userId,rootCause,message,deploymentMarker}' /tmp/login.json || true
          test "$code" = 200 || exit 1
          test "$(jq -r '.success // false' /tmp/login.json)" = true
          method=$(jq -r '.sessionMethod // empty' /tmp/login.json)
          test "$method" = 'bounded_password_grant' || { echo "sessionMethod=$method"; exit 1; }
          test "$(jq -r '.outageMode // false' /tmp/login.json)" != true
          token=$(jq -r '.accessToken // empty' /tmp/login.json)
          refresh=$(jq -r '.refreshToken // empty' /tmp/login.json)
          user_id=$(jq -r '.userId // empty' /tmp/login.json)
          binding=$(jq -r '.credentialBinding // empty' /tmp/login.json)
          test -n "$token"; test -n "$refresh"; test -n "$user_id"
          login_ms=$(awk -v t="$total" 'BEGIN { printf "%d", t*1000 }')
          echo "LOGIN_MS=$login_ms" >> "$GITHUB_ENV"
          echo "OWNER_USER_ID=$user_id" >> "$GITHUB_ENV"
          echo "OWNER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CREDENTIAL_BINDING=$binding" >> "$GITHUB_ENV"
          echo "owner_runtime_login=PASS sessionMethod=$method login_ms=$login_ms"
      - name: Verify token and owner metadata with Supabase
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 15 -o /tmp/user.json -w '%{http_code}' "${SUPABASE_URL%/}/auth/v1/user" -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${OWNER_TOKEN}")
          echo "supabase_user_http=$code"
          test "$code" = 200
          test "$(jq -r '.id // empty' /tmp/user.json)" = "$OWNER_USER_ID"
          app_role=$(jq -r '.app_metadata.role // empty' /tmp/user.json)
          user_role=$(jq -r '.user_metadata.role // empty' /tmp/user.json)
          case "$app_role:$user_role" in *owner*|*admin*) ;; *) echo "owner metadata missing"; exit 1;; esac
          echo "OWNER_APP_ROLE=$app_role" >> "$GITHUB_ENV"
          echo "OWNER_USER_ROLE=$user_role" >> "$GITHUB_ENV"
      - name: Verify live owner-only backend gate with real session
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/owner-gate.json -w '%{http_code}' "${API_BASE}/api/ivx/live-work/agents?enterpriseDashboard=1&range=24h" -H "Authorization: Bearer ${OWNER_TOKEN}")
          echo "owner_gate_http=$code"
          test "$code" = 200 || { jq '{ok,error,message}' /tmp/owner-gate.json 2>/dev/null || true; exit 1; }
          test "$(jq -r '.ok // false' /tmp/owner-gate.json)" = true
      - name: Verify unauthenticated owner gate remains closed
        shell: bash
        run: |
          code=$(curl -sS --max-time 15 -o /tmp/unauth.json -w '%{http_code}' "${API_BASE}/api/ivx/live-work/agents?enterpriseDashboard=1&range=24h" || true)
          echo "unauth_owner_gate_http=$code"
          case "$code" in 401|403) ;; *) exit 1;; esac
      - name: Build certificate
        shell: bash
        run: |
          mkdir -p qa/evidence
          jq -n --arg sha "$SOURCE_SHA" --arg userId "$OWNER_USER_ID" --arg appRole "$OWNER_APP_ROLE" --arg userRole "$OWNER_USER_ROLE" --arg binding "$CREDENTIAL_BINDING" --argjson loginMs "$LOGIN_MS" --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{certificate:"IVX-OWNER-AUTH-E2E-LIVE",passed:true,sourceSha:$sha,realPasswordGrant:true,passwordGrantMethod:"bounded_password_grant",credentialBinding:$binding,outageSessionRejected:true,loginLatencyMs:$loginMs,supabaseUserEndpointHttp:200,identityMatch:true,ownerUserId:$userId,appMetadataRole:$appRole,userMetadataRole:$userRole,backendOwnerGateHttp:200,unauthenticatedGateClosed:true,secretValuesReturned:false,fastPathMarker:"IVX_OWNER_POST_LOGIN_FAST_PATH_V1",backgroundRepairMarker:"IVX_OWNER_REPAIR_BACKGROUND_V1",directPasswordMarker:"IVX_OWNER_SUPABASE_DIRECT_PASSWORD_V1",verifiedAt:$verifiedAt}' > qa/evidence/ivx-owner-auth-e2e-live.json
          cat qa/evidence/ivx-owner-auth-e2e-live.json
      - uses: actions/upload-artifact@v4
        with:
          name: ivx-owner-auth-e2e-live-${{ github.sha }}
          path: qa/evidence/ivx-owner-auth-e2e-live.json
      - name: Persist certificate
        shell: bash
        run: |
          git config user.name 'IVX Auth Certifier'
          git config user.email 'ivx-auth-certifier@users.noreply.github.com'
          git add qa/evidence/ivx-owner-auth-e2e-live.json
          git diff --cached --quiet && exit 0
          git commit -m "cert(auth): owner E2E live ${SOURCE_SHA:0:12} [skip ci]"
          if [ "${{ github.event_name }}" = "pull_request" ]; then git push origin HEAD:${{ github.event.pull_request.head.ref }}; else git pull --rebase origin main && git push origin HEAD:main; fi
