name: IVX Owner Auth Live Certificate

on:
  push:
    branches: [main]
    paths:
      - 'expo/lib/auth-context.tsx'
      - 'expo/lib/auth-password-sign-in.ts'
      - 'expo/lib/supabase.ts'
      - 'expo/app/login.tsx'
      - '.github/workflows/ivx-owner-auth-live-cert.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ivx-owner-auth-live-cert
  cancel-in-progress: true

jobs:
  certify-live-owner-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OWNER_EMAIL: iperez4242@gmail.com
      OWNER_PASSWORD: ${{ secrets.OWNER_NEW_PASSWORD }}
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      API_BASE: https://api.ivxholding.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify complete owner-login latency fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'IVX_OWNER_POST_LOGIN_FAST_PATH_V1' expo/lib/auth-context.tsx
          grep -q 'IVX_OWNER_REPAIR_BACKGROUND_V1' expo/lib/auth-context.tsx
          grep -q 'IVX_OWNER_SUPABASE_DIRECT_PASSWORD_V1' expo/lib/auth-context.tsx
          grep -q 'signInWithEmailPassword(freshClient, normalizedEmail, password)' expo/lib/auth-context.tsx
          if grep -q 'await repairOwnerRegistrationAfterLogin(session).catch' expo/lib/auth-context.tsx; then
            echo 'Blocking owner repair remains in login critical path.'
            exit 1
          fi
          grep -q 'signInWithPassword' expo/lib/auth-password-sign-in.ts
          grep -q 'persistSession: true' expo/lib/supabase.ts
          test -n "$OWNER_PASSWORD" || { echo 'OWNER_NEW_PASSWORD secret is unavailable'; exit 1; }
          test -n "$SUPABASE_URL" || { echo 'EXPO_PUBLIC_SUPABASE_URL secret is unavailable'; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo 'EXPO_PUBLIC_SUPABASE_ANON_KEY secret is unavailable'; exit 1; }

      - name: Real Supabase password sign-in and latency
        id: login
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -nc --arg email "$OWNER_EMAIL" --arg password "$OWNER_PASSWORD" '{email:$email,password:$password}')
          curl -sS --max-time 15 \
            -o /tmp/login.json \
            -w '%{http_code} %{time_total}' \
            -X POST "${SUPABASE_URL%/}/auth/v1/token?grant_type=password" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$body" > /tmp/login.metrics
          read -r code total < /tmp/login.metrics
          test "$code" = 200 || { echo "password_grant_http=$code"; jq '{error,error_code,msg,message}' /tmp/login.json 2>/dev/null || true; exit 1; }
          token=$(jq -r '.access_token // empty' /tmp/login.json)
          user_id=$(jq -r '.user.id // empty' /tmp/login.json)
          app_role=$(jq -r '.user.app_metadata.role // empty' /tmp/login.json)
          user_role=$(jq -r '.user.user_metadata.role // empty' /tmp/login.json)
          test -n "$token" || { echo 'access_token missing'; exit 1; }
          test -n "$user_id" || { echo 'user_id missing'; exit 1; }
          case "$app_role:$user_role" in *owner*|*admin*) ;; *) echo "owner metadata missing app_role=$app_role user_role=$user_role"; exit 1;; esac
          login_ms=$(awk -v t="$total" 'BEGIN { printf "%d", t*1000 }')
          echo "LOGIN_MS=$login_ms" >> "$GITHUB_ENV"
          echo "OWNER_USER_ID=$user_id" >> "$GITHUB_ENV"
          echo "OWNER_APP_ROLE=$app_role" >> "$GITHUB_ENV"
          echo "OWNER_USER_ROLE=$user_role" >> "$GITHUB_ENV"
          echo "OWNER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "password_grant_http=200 login_ms=$login_ms owner_metadata=PASS"

      - name: Verify token with Supabase user endpoint
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 15 -o /tmp/user.json -w '%{http_code}' \
            "${SUPABASE_URL%/}/auth/v1/user" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${OWNER_TOKEN}")
          test "$code" = 200
          got_id=$(jq -r '.id // empty' /tmp/user.json)
          test "$got_id" = "$OWNER_USER_ID"
          echo 'supabase_user_http=200 identity_match=PASS'

      - name: Verify live owner-only backend gate with real session
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/owner-gate.json -w '%{http_code}' \
            "${API_BASE}/api/ivx/live-work/agents?enterpriseDashboard=1&range=24h" \
            -H "Authorization: Bearer ${OWNER_TOKEN}")
          test "$code" = 200 || { echo "owner_gate_http=$code"; jq '{ok,error}' /tmp/owner-gate.json 2>/dev/null || true; exit 1; }
          ok=$(jq -r '.ok // false' /tmp/owner-gate.json)
          test "$ok" = true
          echo 'owner_gate_http=200 owner_authorization=PASS'

      - name: Verify unauthenticated owner gate remains closed
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 15 -o /tmp/unauth.json -w '%{http_code}' \
            "${API_BASE}/api/ivx/live-work/agents?enterpriseDashboard=1&range=24h" || true)
          case "$code" in 401|403) ;; *) echo "unauth_owner_gate_http=$code"; exit 1;; esac
          echo "unauth_owner_gate_http=$code closed=PASS"

      - name: Build certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg userId "$OWNER_USER_ID" \
            --arg appRole "$OWNER_APP_ROLE" \
            --arg userRole "$OWNER_USER_ROLE" \
            --argjson loginMs "$LOGIN_MS" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{certificate:"IVX-OWNER-AUTH-E2E-LIVE",passed:true,sourceSha:$sha,realPasswordGrant:true,passwordGrantHttp:200,loginLatencyMs:$loginMs,supabaseUserEndpointHttp:200,identityMatch:true,ownerUserId:$userId,appMetadataRole:$appRole,userMetadataRole:$userRole,backendOwnerGateHttp:200,unauthenticatedGateClosed:true,secretValuesReturned:false,fastPathMarker:"IVX_OWNER_POST_LOGIN_FAST_PATH_V1",backgroundRepairMarker:"IVX_OWNER_REPAIR_BACKGROUND_V1",directPasswordMarker:"IVX_OWNER_SUPABASE_DIRECT_PASSWORD_V1",verifiedAt:$verifiedAt}' > qa/evidence/ivx-owner-auth-e2e-live.json
          cat qa/evidence/ivx-owner-auth-e2e-live.json

      - uses: actions/upload-artifact@v4
        with:
          name: ivx-owner-auth-e2e-live-${{ github.sha }}
          path: qa/evidence/ivx-owner-auth-e2e-live.json
          if-no-files-found: error

      - name: Persist certificate to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IVX Auth Certifier'
          git config user.email 'ivx-auth-certifier@users.noreply.github.com'
          git add qa/evidence/ivx-owner-auth-e2e-live.json
          git diff --cached --quiet && exit 0
          git commit -m "cert(auth): owner E2E live ${GITHUB_SHA:0:12} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
