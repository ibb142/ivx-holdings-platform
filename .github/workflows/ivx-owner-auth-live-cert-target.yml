name: IVX Owner Auth Live Certificate Trusted Target

on:
  pull_request_target:
    branches: [main]
    paths:
      - '.ivx-owner-auth-cert-pr-trigger'

permissions:
  contents: write

concurrency:
  group: ivx-owner-auth-live-cert-target
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OWNER_EMAIL: iperez4242@gmail.com
      OWNER_PASSWORD: ${{ secrets.OWNER_NEW_PASSWORD }}
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      API_BASE: https://api.ivxholding.com
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify trusted source fix and secret bindings
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'IVX_OWNER_POST_LOGIN_FAST_PATH_V1' expo/lib/auth-context.tsx
          grep -q 'IVX_OWNER_REPAIR_BACKGROUND_V1' expo/lib/auth-context.tsx
          grep -q 'IVX_OWNER_SUPABASE_DIRECT_PASSWORD_V1' expo/lib/auth-context.tsx
          grep -q 'signInWithEmailPassword(freshClient, normalizedEmail, password)' expo/lib/auth-context.tsx
          if grep -q 'await repairOwnerRegistrationAfterLogin(session).catch' expo/lib/auth-context.tsx; then exit 1; fi
          test -n "$OWNER_PASSWORD" || { echo 'OWNER_NEW_PASSWORD binding missing'; exit 1; }
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL binding missing'; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo 'SUPABASE_ANON_KEY binding missing'; exit 1; }
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Real Supabase password grant
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -nc --arg email "$OWNER_EMAIL" --arg password "$OWNER_PASSWORD" '{email:$email,password:$password}')
          curl -sS --max-time 15 -o /tmp/login.json -w '%{http_code} %{time_total}' -X POST "${SUPABASE_URL%/}/auth/v1/token?grant_type=password" -H "apikey: ${SUPABASE_ANON_KEY}" -H 'Content-Type: application/json' --data "$body" > /tmp/login.metrics
          read -r code total < /tmp/login.metrics
          test "$code" = 200 || { echo "password_grant_http=$code"; jq '{error,error_code,msg,message}' /tmp/login.json 2>/dev/null || true; exit 1; }
          token=$(jq -r '.access_token // empty' /tmp/login.json)
          user_id=$(jq -r '.user.id // empty' /tmp/login.json)
          app_role=$(jq -r '.user.app_metadata.role // empty' /tmp/login.json)
          user_role=$(jq -r '.user.user_metadata.role // empty' /tmp/login.json)
          test -n "$token"; test -n "$user_id"
          case "$app_role:$user_role" in *owner*|*admin*) ;; *) echo 'owner role metadata missing'; exit 1;; esac
          login_ms=$(awk -v t="$total" 'BEGIN { printf "%d", t*1000 }')
          echo "LOGIN_MS=$login_ms" >> "$GITHUB_ENV"
          echo "OWNER_USER_ID=$user_id" >> "$GITHUB_ENV"
          echo "OWNER_APP_ROLE=$app_role" >> "$GITHUB_ENV"
          echo "OWNER_USER_ROLE=$user_role" >> "$GITHUB_ENV"
          echo "OWNER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "password_grant_http=200 login_ms=$login_ms"
      - name: Verify Supabase user identity
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 15 -o /tmp/user.json -w '%{http_code}' "${SUPABASE_URL%/}/auth/v1/user" -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${OWNER_TOKEN}")
          test "$code" = 200
          test "$(jq -r '.id // empty' /tmp/user.json)" = "$OWNER_USER_ID"
      - name: Verify live owner-only gate and unauthenticated denial
        shell: bash
        run: |
          set -euo pipefail
          auth_code=$(curl -sS --max-time 20 -o /tmp/owner.json -w '%{http_code}' "${API_BASE}/api/ivx/live-work/agents?enterpriseDashboard=1&range=24h" -H "Authorization: Bearer ${OWNER_TOKEN}")
          test "$auth_code" = 200
          test "$(jq -r '.ok // false' /tmp/owner.json)" = true
          unauth_code=$(curl -sS --max-time 15 -o /tmp/unauth.json -w '%{http_code}' "${API_BASE}/api/ivx/live-work/agents?enterpriseDashboard=1&range=24h" || true)
          case "$unauth_code" in 401|403) ;; *) echo "unauth_owner_gate_http=$unauth_code"; exit 1;; esac
          echo "OWNER_GATE_HTTP=$auth_code" >> "$GITHUB_ENV"
          echo "UNAUTH_GATE_HTTP=$unauth_code" >> "$GITHUB_ENV"
      - name: Persist live certificate to main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence
          jq -n --arg sha "$SOURCE_SHA" --arg userId "$OWNER_USER_ID" --arg appRole "$OWNER_APP_ROLE" --arg userRole "$OWNER_USER_ROLE" --argjson loginMs "$LOGIN_MS" --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{certificate:"IVX-OWNER-AUTH-E2E-LIVE",passed:true,sourceSha:$sha,realPasswordGrant:true,passwordGrantHttp:200,loginLatencyMs:$loginMs,supabaseUserEndpointHttp:200,identityMatch:true,ownerUserId:$userId,appMetadataRole:$appRole,userMetadataRole:$userRole,backendOwnerGateHttp:200,unauthenticatedGateClosed:true,secretValuesReturned:false,fastPathMarker:"IVX_OWNER_POST_LOGIN_FAST_PATH_V1",backgroundRepairMarker:"IVX_OWNER_REPAIR_BACKGROUND_V1",directPasswordMarker:"IVX_OWNER_SUPABASE_DIRECT_PASSWORD_V1",verifiedAt:$verifiedAt}' > qa/evidence/ivx-owner-auth-e2e-live.json
          cat qa/evidence/ivx-owner-auth-e2e-live.json
          git config user.name 'IVX Auth Certifier'
          git config user.email 'ivx-auth-certifier@users.noreply.github.com'
          git add qa/evidence/ivx-owner-auth-e2e-live.json
          git diff --cached --quiet && exit 0
          git commit -m "cert(auth): owner E2E live ${SOURCE_SHA:0:12} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
