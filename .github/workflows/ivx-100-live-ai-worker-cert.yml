name: IVX 112 Live AI Worker Certificate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  live-112-worker-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE: https://api.ivxholding.com
      EXPECTED_AGENT_COUNT: '112'
    steps:
      - uses: actions/checkout@v4

      - name: Verify no-fake-success runtime invariant
        shell: bash
        run: |
          set -euo pipefail
          grep -q "no fake-success fallback" backend/services/ivx-agent-runtime.ts
          grep -q "simulated: false" backend/services/ivx-agent-runtime.ts
          grep -q "sourceReference" backend/services/ivx-agent-runtime.ts
          grep -q "toolResultId" backend/services/ivx-agent-runtime.ts
          echo 'runtime_no_fake_success_invariant=PASS'

      - name: Acquire GitHub OIDC machine authorization
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(jq -r '.value // empty' <<<"$response")
          test -n "$token"
          echo "::add-mask::$token"
          echo "IVX_GITHUB_OIDC=$token" >> "$GITHUB_ENV"
          echo 'github_oidc_binding=present'

      - name: Wait for production exact SHA
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 120); do
            code=$(curl -sS -m 20 -o /tmp/version.json -w '%{http_code}' "${API_BASE}/version" || true)
            if [ "$code" = "200" ]; then
              ok=$(jq -r '.ok // false' /tmp/version.json 2>/dev/null || echo false)
              commit=$(jq -r '.commit // .version.commit // empty' /tmp/version.json 2>/dev/null || true)
              echo "poll=$i ok=$ok production_sha=${commit:-missing} expected=${GITHUB_SHA}"
              if [ "$ok" = "true" ] && [ "$commit" = "$GITHUB_SHA" ]; then matched=1; break; fi
            fi
            sleep 10
          done
          test "$matched" = "1"
          echo 'exact_sha=PASS'

      - name: Refresh GitHub OIDC immediately before 112 executions
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(jq -r '.value // empty' <<<"$response")
          test -n "$token"
          echo "::add-mask::$token"
          echo "IVX_GITHUB_OIDC=$token" >> "$GITHUB_ENV"
          echo 'github_oidc_refresh=PASS'

      - name: Load and validate every registered agent
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 "${API_BASE}/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = "$EXPECTED_AGENT_COUNT"
          test "$(jq '[.agents[].agentId] | unique | length' /tmp/agents.json)" = "$EXPECTED_AGENT_COUNT"
          test "$(jq '[.agents[].agentNumber] | unique | length' /tmp/agents.json)" = "$EXPECTED_AGENT_COUNT"
          jq -r '.agents[] | [.agentNumber,.agentId] | @tsv' /tmp/agents.json > /tmp/agents.tsv
          echo 'registered_agent_registry=PASS count=112'

      - name: Execute all 112 real agent runtimes with read-only tasks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ivx112 qa/evidence
          export API_BASE IVX_GITHUB_OIDC GITHUB_SHA GITHUB_RUN_ID
          run_one() {
            number="$1"; agent_id="$2"
            name=$(jq -r --arg id "$agent_id" '.agents[] | select(.agentId == $id) | .name // ""' /tmp/agents.json | head -n1)
            contract_http=$(curl -sS --max-time 25 -o "/tmp/ivx112/contract-${number}.json" -w '%{http_code}' "${API_BASE}/api/ivx/agents/${agent_id}/contract" || true)
            if [ "$contract_http" != 200 ]; then
              jq -n --argjson n "$number" --arg id "$agent_id" --arg name "$name" --arg http "$contract_http" '{agentNumber:$n,agentId:$id,name:$name,passed:false,contractHttp:$http,error:"contract_request_failed"}' > "/tmp/ivx112/${number}.json"; return 0
            fi
            task_type=$(jq -r '[.contract.allowedTaskTypes[]? | select(. == "audit" or . == "analysis" or . == "research")] | .[0] // empty' "/tmp/ivx112/contract-${number}.json")
            if [ -z "$task_type" ]; then jq -n --argjson n "$number" --arg id "$agent_id" --arg name "$name" '{agentNumber:$n,agentId:$id,name:$name,passed:false,error:"no_read_only_task_type"}' > "/tmp/ivx112/${number}.json"; return 0; fi
            task_id="live112-${GITHUB_RUN_ID}-$(printf '%03d' "$number")"
            body=$(jq -nc --arg taskType "$task_type" --arg taskId "$task_id" --arg sourceSha "$GITHUB_SHA" '{taskType:$taskType,payload:{__taskId:$taskId,__workflow:"IVX 112 Live AI Worker Certificate",sourceSha:$sourceSha,realExecutionOnly:true,simulatedSuccessAllowed:false,readOnlyCertification:true}}')
            run_http=$(curl -sS --retry 1 --retry-delay 1 --max-time 60 -o "/tmp/ivx112/run-${number}.json" -w '%{http_code}' -X POST "${API_BASE}/api/ivx/agents/${agent_id}/run" -H 'Content-Type: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC}" --data "$body" || true)
            ok=false; final_status=request_failed; source_reference=''; tool_result_id=''; simulated=null; fake_success=false
            if [ "$run_http" = 200 ]; then
              ok=$(jq -r '.ok // false' "/tmp/ivx112/run-${number}.json")
              final_status=$(jq -r '.runRecord.finalStatus // .finalStatus // "unknown"' "/tmp/ivx112/run-${number}.json")
              source_reference=$(jq -r '.runRecord.sourceReference // .sourceReference // empty' "/tmp/ivx112/run-${number}.json")
              tool_result_id=$(jq -r '.runRecord.toolResultId // .toolResultId // empty' "/tmp/ivx112/run-${number}.json")
              simulated=$(jq -r 'if (.runRecord|type=="object") and (.runRecord|has("simulated")) then (.runRecord.simulated|tostring) elif has("simulated") then (.simulated|tostring) else "null" end' "/tmp/ivx112/run-${number}.json")
              raw_fake_success=$(jq -r 'if (.runRecord|type=="object") and (.runRecord|has("fakeSuccess")) then (.runRecord.fakeSuccess|tostring) elif has("fakeSuccess") then (.fakeSuccess|tostring) else "null" end' "/tmp/ivx112/run-${number}.json")
              [ "$raw_fake_success" = true ] && fake_success=true || true
            fi
            passed=false
            if [ "$run_http" = 200 ] && [ "$ok" = true ] && { [ "$final_status" = completed ] || [ "$final_status" = success ] || [ "$final_status" = verified ]; } && [ -n "$source_reference" ] && [ -n "$tool_result_id" ] && [ "$simulated" = false ] && [ "$fake_success" = false ]; then passed=true; fi
            jq -n --argjson n "$number" --arg id "$agent_id" --arg name "$name" --arg taskType "$task_type" --arg taskId "$task_id" --arg http "$run_http" --argjson ok "$ok" --arg finalStatus "$final_status" --arg sourceReference "$source_reference" --arg toolResultId "$tool_result_id" --argjson simulated "$simulated" --argjson fakeSuccess "$fake_success" --argjson passed "$passed" '{agentNumber:$n,agentId:$id,name:$name,taskType:$taskType,taskId:$taskId,runHttp:$http,ok:$ok,finalStatus:$finalStatus,sourceReference:$sourceReference,toolResultId:$toolResultId,simulated:$simulated,fakeSuccess:$fakeSuccess,passed:$passed}' > "/tmp/ivx112/${number}.json"
          }
          export -f run_one
          xargs -P 32 -n 2 bash -c 'run_one "$0" "$1"' < /tmp/agents.tsv
          jq -s 'sort_by(.agentNumber)' /tmp/ivx112/[0-9]*.json > /tmp/ivx112/results.json
          total=$(jq 'length' /tmp/ivx112/results.json); passed=$(jq '[.[]|select(.passed==true)]|length' /tmp/ivx112/results.json); failed=$(jq '[.[]|select(.passed!=true)]|length' /tmp/ivx112/results.json); evidence=$(jq '[.[]|select((.sourceReference//"")!="" and (.toolResultId//"")!="")]|length' /tmp/ivx112/results.json); unique_agents=$(jq '[.[].agentId]|unique|length' /tmp/ivx112/results.json)
          CERTIFIED=false; if [ "$total" = 112 ] && [ "$passed" = 112 ] && [ "$failed" = 0 ] && [ "$evidence" = 112 ] && [ "$unique_agents" = 112 ]; then CERTIFIED=true; fi
          jq -n --argjson certified "$CERTIFIED" --arg githubSha "$GITHUB_SHA" --arg workflowRunId "$GITHUB_RUN_ID" --arg certifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson expectedAgents 112 --argjson totalWorkers "$total" --argjson passedWorkers "$passed" --argjson failedWorkers "$failed" --argjson workersWithEvidence "$evidence" --argjson uniqueAgents "$unique_agents" --slurpfile workers /tmp/ivx112/results.json '{marker:"ivx-112-real-agent-runtime-cert-2026-08-29-v7",githubSha:$githubSha,workflowRunId:$workflowRunId,certifiedAt:$certifiedAt,exactSha:true,expectedAgents:$expectedAgents,totalWorkers:$totalWorkers,passedWorkers:$passedWorkers,failedWorkers:$failedWorkers,workersWithEvidence:$workersWithEvidence,uniqueAgents:$uniqueAgents,certified:$certified,workers:$workers[0]}' > qa/evidence/ivx-112-live-ai-worker-cert.json
          jq '{certified,githubSha,totalWorkers,passedWorkers,failedWorkers,workersWithEvidence,uniqueAgents}' qa/evidence/ivx-112-live-ai-worker-cert.json
          test "$(jq -r '.certified' qa/evidence/ivx-112-live-ai-worker-cert.json)" = true
          echo 'live_112_real_agent_workers=PASS'

      - name: Upload 112-worker live certificate evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivx-112-live-ai-worker-cert-${{ github.sha }}
          path: qa/evidence/ivx-112-live-ai-worker-cert.json
          if-no-files-found: error
