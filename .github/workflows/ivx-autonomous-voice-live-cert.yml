name: IVX Autonomous Voice Live Certificate

on:
  workflow_dispatch:

concurrency:
  group: ivx-autonomous-voice-live-cert
  cancel-in-progress: true

jobs:
  autonomous-voice-live-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://api.ivxholding.com
      TRACE_ID: ivx-autonomous-live-voice-cert-20260816-v1
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production exact SHA
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 90); do
            code=$(curl -sS -m 20 -o /tmp/version.json -w '%{http_code}' "${API_BASE}/version" || true)
            if [ "$code" = "200" ]; then
              VERSION_OK=$(jq -r '.ok // false' /tmp/version.json 2>/dev/null || echo false)
              VERSION_COMMIT=$(jq -r '.commit // empty' /tmp/version.json 2>/dev/null || true)
              echo "poll=$i version_ok=$VERSION_OK production_sha=${VERSION_COMMIT:-missing} expected=${GITHUB_SHA}"
              if [ "$VERSION_OK" = "true" ] && [ "$VERSION_COMMIT" = "$GITHUB_SHA" ]; then matched=1; break; fi
            else
              echo "poll=$i version_http=$code"
            fi
            sleep 10
          done
          if [ "$matched" != "1" ]; then echo "Production did not reach exact GitHub SHA ${GITHUB_SHA}."; exit 1; fi
          echo "production_exact_sha=PASS"

      - name: Wait for real Autonomous voice delivery proof
        shell: bash
        run: |
          set -euo pipefail
          certified=0
          for i in $(seq 1 60); do
            code=$(curl -sS -m 20 -o /tmp/voice-cert.json -w '%{http_code}' "${API_BASE}/api/ivx/certification/autonomous-voice-public?traceId=${TRACE_ID}" || true)
            if [ "$code" = "200" ]; then
              OK=$(jq -r '.ok // false' /tmp/voice-cert.json 2>/dev/null || echo false)
              CERTIFIED=$(jq -r '.certified // false' /tmp/voice-cert.json 2>/dev/null || echo false)
              COMMIT=$(jq -r '.commit // empty' /tmp/voice-cert.json 2>/dev/null || true)
              REQUEST_STATUS=$(jq -r '.requestStatus // empty' /tmp/voice-cert.json 2>/dev/null || true)
              SID_PRESENT=$(jq -r '.callSidPresent // false' /tmp/voice-cert.json 2>/dev/null || echo false)
              CALLBACK=$(jq -r '.callbackReceived // false' /tmp/voice-cert.json 2>/dev/null || echo false)
              if [ "$OK" = "true" ] && [ "$CERTIFIED" = "true" ] && [ "$REQUEST_STATUS" = "queued" ] && [ "$SID_PRESENT" = "true" ] && [ "$CALLBACK" = "true" ] && [ "$COMMIT" = "$GITHUB_SHA" ]; then certified=1; break; fi
            fi
            sleep 10
          done
          if [ "$certified" != "1" ]; then echo "Autonomous live voice delivery was not certified on exact SHA ${GITHUB_SHA}."; exit 1; fi
          echo "autonomous_voice_live=PASS"

      - name: Emit live voice certificate artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence
          jq --arg githubSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" '. + {githubSha:$githubSha, workflowRunId:$runId, exactSha:true, certifiedAt:(now|todateiso8601)}' /tmp/voice-cert.json > qa/evidence/autonomous-voice-live-cert.json

      - name: Upload voice certificate evidence
        uses: actions/upload-artifact@v4
        with:
          name: ivx-autonomous-voice-live-cert-${{ github.sha }}
          path: qa/evidence/autonomous-voice-live-cert.json
          if-no-files-found: error
