name: IVX Autonomous Enterprise Regression Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Landing 112-Agent Autonomous QA War Room
      - IVX Block 1 P0 Certificate
      - IVX 10/10 Full Certification
      - IVX Render Live Certificate
      - IVX 112 Live AI Worker Certificate
      - IVX E2E Acceptance Pipeline
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ivx-autonomous-enterprise-regression-scheduler
  cancel-in-progress: false

jobs:
  schedule-regression-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://api.ivxholding.com
      OIDC_AUDIENCE: ivx-360-autonomous-recovery
      SYSTEM_KEY_PRIMARY: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      SYSTEM_KEY_SECONDARY: ${{ secrets.IVX_SYSTEM_SECRET }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Acquire scoped GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
          curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$token_url" > /tmp/ivx-regression-oidc.json
          token=$(jq -r '.value // empty' /tmp/ivx-regression-oidc.json)
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Audit certified-10/10 regression on current main
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ivx-regression
          current_sha=$(git rev-parse HEAD)
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"

          baseline=false
          if [ -f qa/LANDING_COMPLETE_CERTIFICATE_2026-08-18.md ] && grep -Eq '11/11 PASS|100%' qa/LANDING_COMPLETE_CERTIFICATE_2026-08-18.md; then
            baseline=true
          fi

          critical=(
            'Landing 112-Agent Autonomous QA War Room'
            'IVX Block 1 P0 Certificate'
            'IVX 10/10 Full Certification'
            'IVX Render Live Certificate'
            'IVX E2E Acceptance Pipeline'
          )

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&head_sha=${current_sha}&per_page=100" > /tmp/ivx-regression/runs.json
          : > /tmp/ivx-regression/gates.jsonl
          red=0
          for workflow in "${critical[@]}"; do
            run=$(jq -c --arg workflow "$workflow" '[.workflow_runs[] | select(.name == $workflow)] | sort_by(.created_at) | reverse | .[0] // empty' /tmp/ivx-regression/runs.json)
            if [ -z "$run" ]; then
              red=$((red+1))
              jq -n --arg workflow "$workflow" --arg sha "$current_sha" '{workflow:$workflow,sha:$sha,status:"missing",conclusion:null,green:false}' >> /tmp/ivx-regression/gates.jsonl
              continue
            fi
            status=$(printf '%s' "$run" | jq -r '.status // "unknown"')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
            run_id=$(printf '%s' "$run" | jq -r '.id')
            url=$(printf '%s' "$run" | jq -r '.html_url')
            green=false
            if [ "$status" = completed ] && [ "$conclusion" = success ]; then green=true; else red=$((red+1)); fi
            jq -n --arg workflow "$workflow" --arg sha "$current_sha" --arg status "$status" --arg conclusion "$conclusion" --arg runId "$run_id" --arg url "$url" --argjson green "$green" '{workflow:$workflow,sha:$sha,status:$status,conclusion:$conclusion,runId:$runId,url:$url,green:$green}' >> /tmp/ivx-regression/gates.jsonl
          done

          regression=false
          if [ "$baseline" = true ] && [ "$red" -gt 0 ]; then regression=true; fi
          team_size=0
          severity=GREEN
          if [ "$regression" = true ]; then
            if [ "$red" -ge 5 ]; then team_size=112; severity=CRITICAL;
            elif [ "$red" -ge 3 ]; then team_size=112; severity=HIGH;
            else team_size=24; severity=REGRESSION;
            fi
          fi

          scheduled_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -s --arg sha "$current_sha" --argjson baseline "$baseline" --argjson regression "$regression" --argjson red "$red" --argjson teamSize "$team_size" --arg severity "$severity" --arg scheduledAt "$scheduled_at" '{policy:"certified_10_10_must_self_restore",baseline10of10:$baseline,currentSha:$sha,regressionOpen:$regression,redGateCount:$red,severity:$severity,teamSize:$teamSize,scheduledAt:$scheduledAt,target:"restore_10_10_and_recertify",closeRule:"all current-SHA gates green + production exact-SHA parity + final certificate",gates:.}' /tmp/ivx-regression/gates.jsonl > /tmp/ivx-regression/mission-calendar.json
          cat /tmp/ivx-regression/mission-calendar.json
          echo "regression=$regression" >> "$GITHUB_OUTPUT"
          echo "team_size=$team_size" >> "$GITHUB_OUTPUT"
          echo "red=$red" >> "$GITHUB_OUTPUT"

      - name: Resume 112-agent campaign for regression recovery
        if: ${{ steps.audit.outputs.regression == 'true' }}
        env:
          IVX_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SYSTEM_KEY_PRIMARY:-}" ] && echo "::add-mask::$SYSTEM_KEY_PRIMARY"
          [ -n "${SYSTEM_KEY_SECONDARY:-}" ] && echo "::add-mask::$SYSTEM_KEY_SECONDARY"
          call_resume() {
            key="$1"
            args=(-sS --max-time 30 -o /tmp/ivx-regression/resume.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC}")
            [ -n "$key" ] && args+=( -H "X-IVX-System-Key: $key" )
            curl "${args[@]}" -d '{"action":"resume_all"}' "${API_BASE}/api/ivx/agents/app-completion/control"
          }
          code=$(call_resume "${SYSTEM_KEY_PRIMARY:-}")
          if { [ "$code" = 401 ] || [ "$code" = 403 ]; } && [ -n "${SYSTEM_KEY_SECONDARY:-}" ] && [ "${SYSTEM_KEY_SECONDARY}" != "${SYSTEM_KEY_PRIMARY:-}" ]; then
            code=$(call_resume "$SYSTEM_KEY_SECONDARY")
          fi
          cat /tmp/ivx-regression/resume.json
          echo "resume_all_http=$code"
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/ivx-regression/resume.json)" = true

      - name: Assign and start enterprise recovery team now
        if: ${{ steps.audit.outputs.regression == 'true' }}
        env:
          IVX_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
          TEAM_SIZE: ${{ steps.audit.outputs.team_size }}
          CURRENT_SHA: ${{ steps.audit.outputs.current_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SYSTEM_KEY_PRIMARY:-}" ] && echo "::add-mask::$SYSTEM_KEY_PRIMARY"
          [ -n "${SYSTEM_KEY_SECONDARY:-}" ] && echo "::add-mask::$SYSTEM_KEY_SECONDARY"

          refresh_oidc() {
            local token_url response token
            token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
            response=$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$token_url")
            token=$(jq -r '.value // empty' <<<"$response")
            test -n "$token"
            echo "::add-mask::$token"
            IVX_GITHUB_OIDC="$token"
            export IVX_GITHUB_OIDC
          }

          refresh_oidc
          curl -fsS --max-time 20 "${API_BASE}/api/ivx/agents" > /tmp/ivx-regression/agents.json
          jq -r --argjson n "$TEAM_SIZE" '[.agents[] | select(.disabled != true and .paused != true)] | sort_by(.agentNumber) | .[:$n] | .[].agentId' /tmp/ivx-regression/agents.json > /tmp/ivx-regression/team.txt
          selected=$(wc -l < /tmp/ivx-regression/team.txt | tr -d ' ')
          test "$selected" -gt 0
          : > /tmp/ivx-regression/team-results.jsonl

          run_agent() {
            agent="$1"; payload="$2"; key="$3"
            args=(-sS --max-time 30 -o /tmp/ivx-regression/agent-run.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC}")
            [ -n "$key" ] && args+=( -H "X-IVX-System-Key: $key" )
            curl "${args[@]}" --data "$payload" "${API_BASE}/api/ivx/agents/${agent}/run" || true
          }

          index=0
          while IFS= read -r agent; do
            index=$((index+1))
            if [ "$index" -gt 1 ] && [ $(((index-1) % 20)) -eq 0 ]; then
              refresh_oidc
              echo "oidc_periodic_refresh=PASS before_agent=$index"
            fi

            payload=$(jq -n --arg sha "$CURRENT_SHA" --slurpfile mission /tmp/ivx-regression/mission-calendar.json '{taskType:"audit",payload:{missionType:"enterprise_regression_recovery",surface:"landing",currentSha:$sha,targetScore:"10/10",instruction:"Perform your scoped enterprise audit/diagnostic responsibility against the current-SHA Landing regression. Produce real evidence and actionable findings for the Senior Developer repair owner. Do not claim a fix unless verified by your allowed tools and contract.",missionCalendar:($mission[0] // {})}}')
            code=$(run_agent "$agent" "$payload" "${SYSTEM_KEY_PRIMARY:-}")

            if [ "$code" = 401 ] || [ "$code" = 403 ]; then
              refresh_oidc
              echo "oidc_auth_retry=PASS agent=$agent initial_http=$code"
              code=$(run_agent "$agent" "$payload" "${SYSTEM_KEY_PRIMARY:-}")
            fi
            if { [ "$code" = 401 ] || [ "$code" = 403 ]; } && [ -n "${SYSTEM_KEY_SECONDARY:-}" ] && [ "${SYSTEM_KEY_SECONDARY}" != "${SYSTEM_KEY_PRIMARY:-}" ]; then
              code=$(run_agent "$agent" "$payload" "$SYSTEM_KEY_SECONDARY")
            fi

            if jq -e . /tmp/ivx-regression/agent-run.json >/dev/null 2>&1; then
              jq -n --arg agentId "$agent" --arg http "$code" --slurpfile response /tmp/ivx-regression/agent-run.json '{agentId:$agentId,http:$http,response:($response[0] // {})}' >> /tmp/ivx-regression/team-results.jsonl
            else
              jq -n --arg agentId "$agent" --arg http "$code" '{agentId:$agentId,http:$http,response:{ok:false,error:"invalid_or_empty_agent_response"}}' >> /tmp/ivx-regression/team-results.jsonl
            fi
          done < /tmp/ivx-regression/team.txt

          jq -s '.' /tmp/ivx-regression/team-results.jsonl > /tmp/ivx-regression/team-results.json
          accepted=$(jq '[.[] | select(.http == "200" and .response.ok == true and .response.runRecord != null)] | length' /tmp/ivx-regression/team-results.json)
          rejected=$((selected-accepted))
          echo "selected_agents=$selected accepted_agent_runs=$accepted rejected_agent_runs=$rejected"
          jq -r '.[] | select(.http != "200" or .response.ok != true or .response.runRecord == null) | "agent_rejected=\(.agentId) http=\(.http) error=\(.response.error // \"unknown\")"' /tmp/ivx-regression/team-results.json || true
          test "$accepted" -eq "$selected"

      - name: Delegate closed-loop repair owner to Senior Developer Worker
        if: ${{ steps.audit.outputs.regression == 'true' }}
        env:
          IVX_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
          TEAM_SIZE: ${{ steps.audit.outputs.team_size }}
          CURRENT_SHA: ${{ steps.audit.outputs.current_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SYSTEM_KEY_PRIMARY:-}" ] && echo "::add-mask::$SYSTEM_KEY_PRIMARY"
          [ -n "${SYSTEM_KEY_SECONDARY:-}" ] && echo "::add-mask::$SYSTEM_KEY_SECONDARY"

          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
          response=$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$token_url")
          IVX_GITHUB_OIDC=$(jq -r '.value // empty' <<<"$response")
          test -n "$IVX_GITHUB_OIDC"
          echo "::add-mask::$IVX_GITHUB_OIDC"
          export IVX_GITHUB_OIDC
          echo 'senior_developer_oidc_refresh=PASS'

          goal="ENTERPRISE REGRESSION RECOVERY. Landing has a protected historical 10/10 baseline and current main ${CURRENT_SHA} has one or more non-green certification gates. A ${TEAM_SIZE}-agent recovery audit team has been successfully started with accepted run records. Own the repair mission end-to-end: use their evidence, diagnose real failures, repair safe code, PR/merge, deploy exact main SHA, rerun affected E2E/certificates, and keep the mission open until Landing is restored to 10/10 on the current SHA. Never manufacture green and never close on PR/build/deploy alone."
          payload=$(jq -n --arg goal "$goal" '{goal:$goal,executionMode:"code_change",templateMode:"BUG_FIX",approvePatch:true,approveGitDeploy:true,validationMode:"typecheck",riskLevel:"low",proposedPlan:"Use the scheduled recovery audit team and closed-loop Autonomous policy to restore current-main 10/10 certification.",rollbackOption:"Rollback safe operational deploys automatically if health regresses; never perform destructive rollback without Owner Gate.",filesAffected:["landing-regression","current-sha-certification","safe-operational-deploy"]}')
          call_worker() {
            key="$1"
            args=(-sS --max-time 60 -o /tmp/ivx-regression/senior-worker.json -w '%{http_code}' -X POST "${API_BASE}/api/ivx/senior-developer/worker/jobs" -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC}")
            [ -n "$key" ] && args+=( -H "X-IVX-System-Key: $key" )
            curl "${args[@]}" --data "$payload"
          }
          code=$(call_worker "${SYSTEM_KEY_PRIMARY:-}")
          if { [ "$code" = 401 ] || [ "$code" = 403 ]; } && [ -n "${SYSTEM_KEY_SECONDARY:-}" ] && [ "${SYSTEM_KEY_SECONDARY}" != "${SYSTEM_KEY_PRIMARY:-}" ]; then
            code=$(call_worker "$SYSTEM_KEY_SECONDARY")
          fi
          cat /tmp/ivx-regression/senior-worker.json
          case "$code" in 200|202|409) ;; *) exit 1;; esac

      - name: Enforce mission close rule
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.audit.outputs.regression }}" = true ]; then
            echo "REGRESSION_MISSION_OPEN: current main is below protected 10/10 certification. Recovery team is scheduled and active."
          else
            echo "REGRESSION_MISSION_CLOSED: current main has no detected protected Landing certification regression."
          fi

      - name: Persist enterprise regression calendar and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivx-enterprise-regression-calendar-${{ github.run_id }}
          path: /tmp/ivx-regression
          if-no-files-found: error
          retention-days: 90
