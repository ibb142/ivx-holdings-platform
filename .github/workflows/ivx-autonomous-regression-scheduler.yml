name: IVX Autonomous Enterprise Regression Scheduler

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows:
      - Landing 112-Agent Autonomous QA War Room
      - IVX Block 1 P0 Certificate
      - IVX 10/10 Full Certification
      - IVX Render Live Certificate
      - IVX 112 Live AI Worker Certificate
      - IVX E2E Acceptance Pipeline
      - Landing 112-Agent 3H Enterprise Human-Like QA
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  id-token: write

# P0 invariant: never cancel a healthy in-flight recovery. New gate signals wait
# behind the active pass, then re-audit current main before doing more work.
concurrency:
  group: ivx-autonomous-enterprise-regression-scheduler
  cancel-in-progress: false

jobs:
  schedule-regression-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preserve 112-agent recovery invariant
        run: |
          echo 'P0_QUEUE_INVARIANT=PASS'
          echo 'Active recovery cannot be cancelled by a newer scheduler trigger.'
      - name: Dispatch canonical recovery implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'The full recovery implementation remains owned by the canonical main workflow.'
          echo 'This hotfix changes concurrency semantics only.'
