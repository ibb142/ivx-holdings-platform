name: IVX 112 Force Dispatcher Awake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-112-force-dispatch-now.yml'
      - 'backend/services/ivx-campaign-dispatcher.ts'
      - 'backend/services/ivx-autonomous-runtime-enforcer.ts'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  id-token: write

env:
  API_BASE: https://api.ivxholding.com

concurrency:
  group: ivx-112-force-dispatch-awake
  cancel-in-progress: true

jobs:
  force-refill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read live dispatcher truth
        id: truth
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 20 \
            "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/before.json
          max=$(jq -r '.dispatcher.maxConcurrency // 0' /tmp/before.json)
          running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/before.json)
          queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/before.json)
          owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/before.json)
          test "$max" -eq 112
          echo "max=$max" >> "$GITHUB_OUTPUT"
          echo "running=$running" >> "$GITHUB_OUTPUT"
          echo "queued=$queued" >> "$GITHUB_OUTPUT"
          echo "owner_gate=$owner_gate" >> "$GITHUB_OUTPUT"
          if [ "$owner_gate" -eq 0 ] && [ "$queued" -gt 0 ] && [ "$running" -lt "$max" ]; then
            echo "needs_refill=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_refill=false" >> "$GITHUB_OUTPUT"
          fi
          echo "before max=$max running=$running queued=$queued ownerGate=$owner_gate"

      - name: Obtain bounded recovery identity
        if: steps.truth.outputs.needs_refill == 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsS --max-time 10 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$token_json" | jq -r '.value // empty')
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Force dispatcher refill to available capacity
        if: steps.truth.outputs.needs_refill == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 30 -o /tmp/resume.json -w '%{http_code}' \
              -X POST \
              -H 'content-type: application/json' \
              -H "X-IVX-GitHub-OIDC: $OIDC_TOKEN" \
              -d '{"action":"resume_all"}' \
              "$API_BASE/api/ivx/agents/app-completion/control")
            test "$code" = 200
            test "$(jq -r '.ok // false' /tmp/resume.json)" = true
            sleep 5
            curl -fsS --retry 2 --retry-delay 1 --max-time 20 \
              "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/after.json
            running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/after.json)
            queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/after.json)
            max=$(jq -r '.dispatcher.maxConcurrency // 0' /tmp/after.json)
            echo "attempt=$attempt running=$running queued=$queued max=$max"
            if [ "$running" -gt 0 ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'HARD_FAIL: dispatcher did not start any worker after three refill attempts' >&2
              exit 1
            fi
          done

      - name: Fail closed if executable backlog remains asleep
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --retry-delay 1 --max-time 20 \
            "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/final.json
          max=$(jq -r '.dispatcher.maxConcurrency // 0' /tmp/final.json)
          running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/final.json)
          queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/final.json)
          owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/final.json)
          echo "final max=$max running=$running queued=$queued ownerGate=$owner_gate"
          test "$max" -eq 112
          if [ "$owner_gate" -eq 0 ] && [ "$queued" -gt 0 ] && [ "$running" -eq 0 ]; then
            echo 'HARD_FAIL: executable backlog exists but dispatcher is asleep' >&2
            exit 1
          fi
