name: Landing 112-Agent 500-Check 3H QA
# Supervisor v7 protects one current-main fleet run and releases stale-SHA capacity.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/landing-112-3h-enterprise-human-qa.yml', 'qa/landing-112-agent-war-room.md', 'expo/ivxholding-landing/**']
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: landing-112-500-check-3h
  cancel-in-progress: true
env:
  API_BASE: https://api.ivxholding.com
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
      live_sha: ${{ steps.registry.outputs.live_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Require healthy production and 112 agents
        id: registry
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            curl -fsS --max-time 20 "$API_BASE/health" -o /tmp/health.json || true
            [ "$(jq -r '.ok // false' /tmp/health.json 2>/dev/null || true)" = true ] && break
            [ "$attempt" = 20 ] && exit 1
            sleep 15
          done
          live_sha=$(jq -r '.commit // "unknown"' /tmp/health.json)
          echo "live_sha=$live_sha" >> "$GITHUB_OUTPUT"
          curl -fsS --retry 4 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.totalAgents' /tmp/agents.json)" = 112
          echo "matrix=$(jq -c '{include:[.agents[]|{agentNumber,agentId}]}' /tmp/agents.json)" >> "$GITHUB_OUTPUT"
  qa-112:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 112
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute 4-5 unique checks
        env:
          AGENT_NUMBER: ${{ matrix.agentNumber }}
          AGENT_ID: ${{ matrix.agentId }}
          LIVE_SHA: ${{ needs.prepare.outputs.live_sha }}
        run: |
          set -euo pipefail
          n=$(printf '%03d' "$AGENT_NUMBER")
          assignment=$(grep -E "^$n — " qa/landing-112-agent-war-room.md | head -1 | sed 's/^[0-9][0-9][0-9] — //')
          test -n "$assignment"
          curl -fsS --max-time 20 https://ivxholding.com -o /tmp/live.html
          live_hash=$(sha256sum /tmp/live.html | cut -d' ' -f1)
          refresh_oidc() {
            url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery"
            token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" | jq -r '.value')
            echo "::add-mask::$token"
          }
          refresh_oidc
          mkdir -p evidence
          : > "evidence/agent-$n.jsonl"
          failures=0
          for item in $(seq "$AGENT_NUMBER" 112 500); do
            variant=$(( (item - 1) / 112 ))
            case "$variant" in
              0) dimension=source_contract; tool=code_search; params='{"pattern":"landing","scope":"expo/ivxholding-landing"}' ;;
              1) dimension=production_behavior; tool=code_read; params='{"path":"expo/ivxholding-landing/index.html"}' ;;
              2) dimension=responsive_accessibility; tool=code_read; params='{"path":"expo/ivxholding-landing/ivx-styles.css"}' ;;
              3) dimension=security_failure_paths; tool=code_read; params='{"path":"expo/ivxholding-landing/ivx-app.js"}' ;;
              4) dimension=performance_observability; tool=code_read; params='{"path":"expo/ivxholding-landing/landing-support-chat.js"}' ;;
            esac
            task="LANDING QA $item/500; IA $AGENT_NUMBER/112; $assignment; dimension=$dimension; workflowSha=$GITHUB_SHA; liveSourceSha=$LIVE_SHA; liveHash=$live_hash. Require relevant real evidence; never invent PASS."
            body=$(jq -nc --arg id "landing-$GITHUB_RUN_ID-$item" --arg task "$task" --arg tool "$tool" --argjson params "$params" '{taskType:"audit",payload:{__taskId:$id,__workflow:"Landing 112-Agent 500-Check 3H QA",landingAssignment:$task,__toolId:$tool,__toolParams:$params,realExecutionOnly:true,simulatedSuccessAllowed:false}}')
            passed=false
            http=000; ok=false; status=request_failed; verified=false; source=; result=
            for request_attempt in 1 2 3 4; do
              : > /tmp/run.json
              http=$(curl -sS --max-time 240 -o /tmp/run.json -w '%{http_code}' -X POST "$API_BASE/api/ivx/agents/$AGENT_ID/run" -H 'Content-Type: application/json' -H "X-IVX-GitHub-OIDC: $token" --data "$body" || true)
              if [ "$http" = 401 ] || [ "$http" = 403 ]; then refresh_oidc; fi
              ok=$(jq -r '.ok // false' /tmp/run.json 2>/dev/null || echo false)
              status=$(jq -r '.runRecord.finalStatus // "request_failed"' /tmp/run.json 2>/dev/null || echo request_failed)
              verified=$(jq -r '.runRecord.verifiedOutput // false' /tmp/run.json 2>/dev/null || echo false)
              source=$(jq -r '.runRecord.sourceReference // empty' /tmp/run.json 2>/dev/null || true)
              result=$(jq -r '.runRecord.toolResultId // empty' /tmp/run.json 2>/dev/null || true)
              if [ "$http" = 200 ] && [ "$ok" = true ] && [ "$status" = completed ] && [ "$verified" = true ] && [ -n "$source" ] && [ -n "$result" ]; then passed=true; break; fi
              [ "$request_attempt" = 4 ] || sleep $((request_attempt * 15))
            done
            if [ "$passed" != true ]; then failures=$((failures+1)); fi
            jq -nc --argjson itemId "$item" --argjson agentNumber "$AGENT_NUMBER" --arg assignment "$assignment" --arg dimension "$dimension" --arg sourceSha "$GITHUB_SHA" --arg liveSourceSha "$LIVE_SHA" --arg liveHash "$live_hash" --arg status "$status" --arg sourceReference "$source" --arg toolResultId "$result" --argjson passed "$passed" '{itemId:$itemId,agentNumber:$agentNumber,assignment:$assignment,dimension:$dimension,sourceSha:$sourceSha,liveSourceSha:$liveSourceSha,liveHtmlSha256:$liveHash,status:$status,sourceReference:$sourceReference,toolResultId:$toolResultId,passed:$passed}' >> "evidence/agent-$n.jsonl"
          done
          count=$(wc -l < "evidence/agent-$n.jsonl")
          test "$count" -ge 4
          test "$count" -le 5
          test "$failures" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-500-agent-${{ matrix.agentNumber }}-${{ github.run_id }}
          path: evidence/*.jsonl
          retention-days: 30
  autonomous-manager:
    needs: [prepare, qa-112]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYSTEM_KEY: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      LIVE_SHA: ${{ needs.prepare.outputs.live_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: landing-500-agent-*-${{ github.run_id }}
          path: evidence-all
          merge-multiple: true
      - name: Certify or route defects to Autonomous
        run: |
          set -euo pipefail
          jq -s '.' evidence-all/*.jsonl > /tmp/all.json
          total=$(jq length /tmp/all.json); unique=$(jq '[.[].itemId]|unique|length' /tmp/all.json)
          agents=$(jq '[.[].agentNumber]|unique|length' /tmp/all.json); passed=$(jq '[.[]|select(.passed)]|length' /tmp/all.json)
          failed=$((total-passed))
          test "$total" = 500; test "$unique" = 500; test "$agents" = 112
          if [ "$failed" -gt 0 ]; then
            test -n "$SYSTEM_KEY"
            failures=$(jq -c '[.[]|select(.passed!=true)|{itemId,agentNumber,assignment,dimension,status}]' /tmp/all.json)
            goal=$(jq -nr --arg f "$failures" '"Repair failed Landing QA items, test, open PR, deploy and verify: "+$f')
            payload=$(jq -nc --arg goal "$goal" '{goal:$goal,executionMode:"code_change",templateMode:"BUG_FIX",approvePatch:true,approveGitDeploy:true,validationMode:"typecheck",systemMode:true,ownerApproved:true,riskLevel:"low"}')
            curl -fsS -X POST "$API_BASE/api/ivx/senior-developer/worker/jobs" -H 'Content-Type: application/json' -H "X-IVX-System-Key: $SYSTEM_KEY" --data "$payload" -o /tmp/repair.json
          fi
          mkdir -p certificate
          jq -n --arg sha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg liveSha "$LIVE_SHA" --argjson total "$total" --argjson passed "$passed" --argjson failed "$failed" --argjson agents "$agents" '{certificate:"IVX Landing 500-Check / 112-Agent / 3H QA",workflowSha:$sha,liveSourceSha:$liveSha,runId:$runId,totalChecks:$total,uniqueChecks:$total,agentsParticipating:$agents,passed:$passed,failed:$failed,autonomousManager:true,status:(if $failed==0 then "PASS" else "REPAIR_QUEUED" end),completedAt:(now|todateiso8601)}' > certificate/result.json
          cat certificate/result.json
          test "$failed" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IVX-LANDING-500-CHECK-CERT-${{ github.run_id }}
          path: certificate/
          retention-days: 30
