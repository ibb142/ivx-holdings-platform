name: Landing 112-Agent 3H Enterprise Human-Like QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/landing-112-3h-enterprise-human-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: landing-112-3h-enterprise-human-qa
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    env:
      API_BASE: https://api.ivxholding.com
    steps:
      - uses: actions/checkout@v4
      - name: Load exact 112-agent production registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          test "$(jq '[.agents[].agentNumber] | unique | length' /tmp/agents.json)" = 112
          matrix=$(jq -c '{include:[.agents[] | {agentNumber:.agentNumber,agentId:.agentId,name:.name,role:.role,division:.division}]}' /tmp/agents.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo 'MISSION_REGISTRY=112/112'

  qa-112:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 195
    strategy:
      fail-fast: false
      max-parallel: 112
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      API_BASE: https://api.ivxholding.com
      REQUIRED_SECONDS: '10800'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact enterprise assignment
        id: assignment
        shell: bash
        env:
          AGENT_NUMBER: ${{ matrix.agentNumber }}
        run: |
          set -euo pipefail
          n=$(printf '%03d' "$AGENT_NUMBER")
          line=$(grep -E "^${n} — " qa/landing-112-agent-war-room.md | head -1 || true)
          test -n "$line"
          task=${line#* — }
          echo "task<<EOF" >> "$GITHUB_OUTPUT"
          echo "$task" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
      - name: Build human-like end-to-end QA contract
        id: contract
        shell: bash
        env:
          TASK: ${{ steps.assignment.outputs.task }}
          AGENT_NUMBER: ${{ matrix.agentNumber }}
        run: |
          set -euo pipefail
          cat > /tmp/mission.txt <<'EOF'
          ENTERPRISE HUMAN-LIKE QA MISSION — LANDING PAGE.
          Work continuously for the full campaign window as a senior human QA engineer and developer, not as a shallow checker.
          Validate the assigned item end-to-end against the real IVX code and production-facing behavior.
          Evidence required on every cycle: exact SHA, real tool used, exact files/endpoints checked, verified output, finding severity P0/P1/P2, and a concrete fix/verification instruction for any defect.
          Simulated success is forbidden. Reject mid-quality output and redo until enterprise quality or fail closed.
          EOF
          printf '\nPRIMARY ASSIGNMENT: %s\nAGENT: %s\n' "$TASK" "$AGENT_NUMBER" >> /tmp/mission.txt
          mission=$(cat /tmp/mission.txt)
          echo "mission<<EOF" >> "$GITHUB_OUTPUT"
          echo "$mission" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
      - name: Execute continuous real 3-hour agent mission
        id: work
        shell: bash
        env:
          AGENT_NUMBER: ${{ matrix.agentNumber }}
          AGENT_ID: ${{ matrix.agentId }}
          AGENT_NAME: ${{ matrix.name }}
          MISSION: ${{ steps.contract.outputs.mission }}
        run: |
          set -euo pipefail
          contract_http=$(curl -sS --max-time 25 -o /tmp/contract.json -w '%{http_code}' "$API_BASE/api/ivx/agents/${AGENT_ID}/contract" || true)
          test "$contract_http" = 200
          task_type=$(jq -r '[.contract.allowedTaskTypes[]? | select(. == "audit" or . == "analysis" or . == "research")] | .[0] // .contract.allowedTaskTypes[0] // empty' /tmp/contract.json)
          test -n "$task_type"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery"
          oidc_token=$(curl -fsS --retry 2 --retry-delay 1 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value // empty')
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"
          mkdir -p evidence/cycles
          campaign_started_epoch=$(date +%s)
          campaign_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          deadline_epoch=$((campaign_started_epoch + REQUIRED_SECONDS))
          cycle=0; accepted_cycles=0; rejected_cycles=0; total_request_seconds=0; last_source=''; last_tool_result=''
          while [ "$(date +%s)" -lt "$deadline_epoch" ]; do
            cycle=$((cycle+1)); cycle_passed=false; attempt=1
            while [ "$attempt" -le 3 ]; do
              task_id="landing3h-${GITHUB_RUN_ID}-$(printf '%03d' "$AGENT_NUMBER")-c${cycle}-a${attempt}"
              body=$(jq -nc --arg taskType "$task_type" --arg taskId "$task_id" --arg sourceSha "$GITHUB_SHA" --arg mission "$MISSION" --argjson cycle "$cycle" '{taskType:$taskType,payload:{__taskId:$taskId,__runId:("landing3h-"+$taskId),__workflow:"Landing 112-Agent 3H Enterprise Human-Like QA",sourceSha:$sourceSha,landingAssignment:$mission,cycle:$cycle,__toolId:"run_tests",__toolParams:{target:"backend"},realExecutionOnly:true,simulatedSuccessAllowed:false,qualityPolicy:"enterprise_human_like",requiredEvidence:["sourceSha","sourceReference","toolResultId","realToolUsed","verifiedOutput"]}}')
              req_start=$(date +%s)
              http=$(curl -sS --retry 1 --retry-delay 1 --max-time 240 -o /tmp/run.json -w '%{http_code}' -X POST "$API_BASE/api/ivx/agents/${AGENT_ID}/run" -H 'Content-Type: application/json' -H "X-IVX-GitHub-OIDC: ${oidc_token}" --data "$body" || true)
              req_end=$(date +%s); req_seconds=$((req_end-req_start)); total_request_seconds=$((total_request_seconds+req_seconds))
              ok=false; final_status='request_failed'; source=''; tool_result=''; simulated='null'; real_tool='null'; verified='null'
              if [ "$http" = 200 ]; then
                ok=$(jq -r '.ok // false' /tmp/run.json); final_status=$(jq -r '.runRecord.finalStatus // "unknown"' /tmp/run.json); source=$(jq -r '.runRecord.sourceReference // empty' /tmp/run.json); tool_result=$(jq -r '.runRecord.toolResultId // empty' /tmp/run.json); simulated=$(jq -r 'if .runRecord.simulated != null then (.runRecord.simulated|tostring) elif .simulated != null then (.simulated|tostring) else "null" end' /tmp/run.json); real_tool=$(jq -r 'if .runRecord.realToolUsed != null then (.runRecord.realToolUsed|tostring) elif .realToolUsed != null then (.realToolUsed|tostring) else "null" end' /tmp/run.json); verified=$(jq -r 'if .runRecord.verifiedOutput != null then (.runRecord.verifiedOutput|tostring) elif .verifiedOutput != null then (.verifiedOutput|tostring) else "null" end' /tmp/run.json)
              fi
              jq -n --argjson cycle "$cycle" --argjson attempt "$attempt" --arg http "$http" --arg finalStatus "$final_status" --arg sourceReference "$source" --arg toolResultId "$tool_result" --arg simulated "$simulated" --arg realToolUsed "$real_tool" --arg verifiedOutput "$verified" --argjson requestSeconds "$req_seconds" '{cycle:$cycle,attempt:$attempt,http:$http,finalStatus:$finalStatus,sourceReference:$sourceReference,toolResultId:$toolResultId,simulated:$simulated,realToolUsed:$realToolUsed,verifiedOutput:$verifiedOutput,requestSeconds:$requestSeconds}' >> "evidence/cycles/agent-${AGENT_NUMBER}.jsonl"
              if [ "$http" = 200 ] && [ "$ok" = true ] && [ "$final_status" = completed ] && [ -n "$source" ] && [ -n "$tool_result" ] && [ "$simulated" = false ] && [ "$real_tool" = true ] && [ "$verified" = true ]; then cycle_passed=true; accepted_cycles=$((accepted_cycles+1)); last_source="$source"; last_tool_result="$tool_result"; break; fi
              attempt=$((attempt+1))
            done
            if [ "$cycle_passed" != true ]; then rejected_cycles=$((rejected_cycles+1)); fi
            now=$(date +%s); elapsed=$((now-campaign_started_epoch)); remaining=$((deadline_epoch-now)); [ "$remaining" -lt 0 ] && remaining=0
            echo "CAMPAIGN_PROGRESS agent=$AGENT_NUMBER cycle=$cycle accepted=$accepted_cycles rejected=$rejected_cycles elapsedSeconds=$elapsed remainingSeconds=$remaining"
          done
          campaign_completed_epoch=$(date +%s); campaign_completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ); wall_seconds=$((campaign_completed_epoch-campaign_started_epoch)); quality='REJECTED'
          if [ "$wall_seconds" -ge "$REQUIRED_SECONDS" ] && [ "$accepted_cycles" -gt 0 ] && [ "$rejected_cycles" -eq 0 ]; then quality='ENTERPRISE_PASS'; fi
          jq -n --argjson agentNumber "$AGENT_NUMBER" --arg agentId "$AGENT_ID" --arg name "$AGENT_NAME" --arg sourceSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg campaignStartedAt "$campaign_started_at" --arg campaignCompletedAt "$campaign_completed_at" --argjson requiredSeconds "$REQUIRED_SECONDS" --argjson wallSeconds "$wall_seconds" --argjson totalRequestSeconds "$total_request_seconds" --argjson cycles "$cycle" --argjson acceptedCycles "$accepted_cycles" --argjson rejectedCycles "$rejected_cycles" --arg sourceReference "$last_source" --arg toolResultId "$last_tool_result" --arg quality "$quality" '{agentNumber:$agentNumber,agentId:$agentId,name:$name,sourceSha:$sourceSha,runId:$runId,campaignStartedAt:$campaignStartedAt,campaignCompletedAt:$campaignCompletedAt,requiredSeconds:$requiredSeconds,wallSeconds:$wallSeconds,totalRequestSeconds:$totalRequestSeconds,cycles:$cycles,acceptedCycles:$acceptedCycles,rejectedCycles:$rejectedCycles,sourceReference:$sourceReference,toolResultId:$toolResultId,quality:$quality,passed:($quality=="ENTERPRISE_PASS"),simulatedSuccessAllowed:false}' > "evidence/agent-${AGENT_NUMBER}.json"
          cat "evidence/agent-${AGENT_NUMBER}.json"
          test "$quality" = ENTERPRISE_PASS
      - name: Upload per-agent enterprise evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-3h-agent-${{ matrix.agentNumber }}-${{ github.run_id }}
          path: |
            evidence/agent-${{ matrix.agentNumber }}.json
            evidence/cycles/agent-${{ matrix.agentNumber }}.jsonl
          retention-days: 14

  certificate:
    needs: [prepare, qa-112]
    if: ${{ always() && needs.prepare.result == 'success' && needs.qa-112.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: landing-3h-agent-*-${{ github.run_id }}
          path: evidence-all
          merge-multiple: true
      - name: Fail-closed 112/112 real 3-hour enterprise certificate
        shell: bash
        run: |
          set -euo pipefail
          count=$(find evidence-all -maxdepth 1 -type f -name 'agent-*.json' | wc -l | tr -d ' ')
          test "$count" = 112
          jq -s '.' evidence-all/agent-*.json > /tmp/all.json
          test "$(jq 'length' /tmp/all.json)" = 112
          test "$(jq '[.[].agentNumber] | unique | length' /tmp/all.json)" = 112
          test "$(jq --arg sha "$GITHUB_SHA" '[.[] | select(.sourceSha == $sha)] | length' /tmp/all.json)" = 112
          test "$(jq '[.[] | select(.passed == true and .quality == "ENTERPRISE_PASS" and .wallSeconds >= 10800 and .acceptedCycles > 0 and .rejectedCycles == 0 and (.sourceReference|length)>0 and (.toolResultId|length)>0)] | length' /tmp/all.json)" = 112
          total_wall_seconds=$(jq '[.[].wallSeconds] | add' /tmp/all.json); test "$total_wall_seconds" -ge $((112*10800))
          mkdir -p certificate
          jq -n --arg sha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson fleetWallSeconds "$total_wall_seconds" '{certificate:"IVX Landing 112-Agent REAL 3H Enterprise Human-Like QA",sourceSha:$sha,runId:$runId,agents:112,enterprisePass:112,requiredSecondsPerAgent:10800,fleetWallSeconds:$fleetWallSeconds,minimumFleetAgentHours:336,simulatedSuccessAllowed:false,quality:"ENTERPRISE",completedAt:$completedAt,status:"PASS"}' > certificate/landing-112-3h-enterprise-certificate.json
          cat certificate/landing-112-3h-enterprise-certificate.json
      - uses: actions/upload-artifact@v4
        with:
          name: IVX-LANDING-112-REAL-3H-ENTERPRISE-CERT-${{ github.run_id }}
          path: certificate/landing-112-3h-enterprise-certificate.json
          retention-days: 30
