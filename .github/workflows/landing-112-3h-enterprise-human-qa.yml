name: Landing 112-Agent Live E2E 3H QA
# Supervisor v7 protects one current-main fleet run and releases stale-SHA capacity.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/landing-112-3h-enterprise-human-qa.yml', 'qa/landing-live-e2e-agent.mjs', 'qa/landing-112-agent-war-room.md', 'expo/ivxholding-landing/**']
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: landing-112-500-check-3h
  cancel-in-progress: false
env:
  API_BASE: https://api.ivxholding.com
  LANDING_URL: https://ivxholding.com
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
      live_sha: ${{ steps.registry.outputs.live_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Require healthy production and 112 agents
        id: registry
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            curl -fsS --max-time 20 "$API_BASE/health" -o /tmp/health.json || true
            [ "$(jq -r '.ok // false' /tmp/health.json 2>/dev/null || true)" = true ] && break
            [ "$attempt" = 20 ] && exit 1
            sleep 15
          done
          live_sha=$(jq -r '.commit // "unknown"' /tmp/health.json)
          echo "live_sha=$live_sha" >> "$GITHUB_OUTPUT"
          curl -fsS --retry 4 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.totalAgents' /tmp/agents.json)" = 112
          echo "matrix=$(jq -c '{include:[.agents[]|{agentNumber,agentId}]}' /tmp/agents.json)" >> "$GITHUB_OUTPUT"
  qa-112:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Release all 112 assignments together. GitHub runner availability still
      # determines how many execute at the exact same instant.
      max-parallel: 112
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked browser QA dependencies
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute assigned live-browser E2E gate
        env:
          AGENT_NUMBER: ${{ matrix.agentNumber }}
          AGENT_ID: ${{ matrix.agentId }}
          LIVE_SHA: ${{ needs.prepare.outputs.live_sha }}
        run: |
          set -euo pipefail
          n=$(printf '%03d' "$AGENT_NUMBER")
          assignment=$(grep -E "^$n — " qa/landing-112-agent-war-room.md | head -1 | sed 's/^[0-9][0-9][0-9] — //')
          test -n "$assignment"
          node qa/landing-live-e2e-agent.mjs "$AGENT_NUMBER"
      - name: Execute evidence-backed code audit through assigned IA
        env:
          AGENT_NUMBER: ${{ matrix.agentNumber }}
          AGENT_ID: ${{ matrix.agentId }}
          LIVE_SHA: ${{ needs.prepare.outputs.live_sha }}
        run: |
          set -euo pipefail
          n=$(printf '%03d' "$AGENT_NUMBER")
          assignment=$(grep -E "^$n — " qa/landing-112-agent-war-room.md | head -1 | sed 's/^[0-9][0-9][0-9] — //')
          browser_evidence="evidence/landing-live-e2e/agent-$n.json"
          test -s "$browser_evidence"
          browser_hash=$(sha256sum "$browser_evidence" | cut -d' ' -f1)
          refresh_oidc() {
            url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery"
            token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" | jq -r '.value')
            echo "::add-mask::$token"
          }
          refresh_oidc
          : > "evidence/agent-$n.jsonl"
          item="$AGENT_NUMBER"
          dimension=$(jq -r '.group' "$browser_evidence")
          task="LANDING LIVE E2E IA $AGENT_NUMBER/112; $assignment; dimension=$dimension; workflowSha=$GITHUB_SHA; liveSourceSha=$LIVE_SHA; browserEvidenceSha256=$browser_hash. Browser gate passed; now verify the relevant implementation source. Never invent PASS."
          case "$dimension" in
            performance|accessibility) tool=code_read; params='{"path":"expo/ivxholding-landing/ivx-styles.css"}' ;;
            chat) tool=code_read; params='{"path":"expo/ivxholding-landing/landing-support-chat.js"}' ;;
            *) tool=code_read; params='{"path":"expo/ivxholding-landing/ivx-app.js"}' ;;
          esac
          body=$(jq -nc --arg id "landing-live-$GITHUB_RUN_ID-$item" --arg task "$task" --arg tool "$tool" --argjson params "$params" '{taskType:"audit",payload:{__taskId:$id,__workflow:"Landing 112-Agent Live E2E QA",landingAssignment:$task,__toolId:$tool,__toolParams:$params,realExecutionOnly:true,simulatedSuccessAllowed:false}}')
            passed=false
            http=000; ok=false; status=request_failed; verified=false; source=; result=
            for request_attempt in 1 2 3 4; do
              : > /tmp/run.json
              http=$(curl -sS --max-time 240 -o /tmp/run.json -w '%{http_code}' -X POST "$API_BASE/api/ivx/agents/$AGENT_ID/run" -H 'Content-Type: application/json' -H "X-IVX-GitHub-OIDC: $token" --data "$body" || true)
              if [ "$http" = 401 ] || [ "$http" = 403 ]; then refresh_oidc; fi
              ok=$(jq -r '.ok // false' /tmp/run.json 2>/dev/null || echo false)
              status=$(jq -r '.runRecord.finalStatus // "request_failed"' /tmp/run.json 2>/dev/null || echo request_failed)
              verified=$(jq -r '.runRecord.verifiedOutput // false' /tmp/run.json 2>/dev/null || echo false)
              source=$(jq -r '.runRecord.sourceReference // empty' /tmp/run.json 2>/dev/null || true)
              result=$(jq -r '.runRecord.toolResultId // empty' /tmp/run.json 2>/dev/null || true)
              if [ "$http" = 200 ] && [ "$ok" = true ] && [ "$status" = completed ] && [ "$verified" = true ] && [ -n "$source" ] && [ -n "$result" ]; then passed=true; break; fi
              [ "$request_attempt" = 4 ] || sleep $((request_attempt * 15))
            done
          jq -nc --argjson itemId "$item" --argjson agentNumber "$AGENT_NUMBER" --arg assignment "$assignment" --arg dimension "$dimension" --arg sourceSha "$GITHUB_SHA" --arg liveSourceSha "$LIVE_SHA" --arg browserEvidenceSha256 "$browser_hash" --arg status "$status" --arg sourceReference "$source" --arg toolResultId "$result" --argjson passed "$passed" '{itemId:$itemId,agentNumber:$agentNumber,assignment:$assignment,dimension:$dimension,sourceSha:$sourceSha,liveSourceSha:$liveSourceSha,browserEvidenceSha256:$browserEvidenceSha256,status:$status,sourceReference:$sourceReference,toolResultId:$toolResultId,passed:$passed}' >> "evidence/agent-$n.jsonl"
          test "$passed" = true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-500-agent-${{ matrix.agentNumber }}-${{ github.run_id }}
          path: |
            evidence/*.jsonl
            evidence/landing-live-e2e/*.json
          retention-days: 30
  dispatcher:
    name: Dispatcher — collect and repair every 5 minutes
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 190
    env:
      GH_TOKEN: ${{ github.token }}
      SYSTEM_KEY: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
    steps:
      - name: Collect completed agent deliveries and dispatch validated repairs
        run: |
          set -euo pipefail
          test -n "$SYSTEM_KEY"
          mkdir -p /tmp/dispatcher/zips /tmp/dispatcher/evidence
          touch /tmp/dispatcher/seen
          for cycle in $(seq 1 38); do
            echo "Dispatcher cycle $cycle at $(date -u +%FT%TZ)"
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("landing-500-agent-")) | [.id,.name] | @tsv' > /tmp/dispatcher/artifacts.tsv
            new_deliveries=0
            while IFS=    needs: [prepare, qa-112]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYSTEM_KEY: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      LIVE_SHA: ${{ needs.prepare.outputs.live_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: landing-500-agent-*-${{ github.run_id }}
          path: evidence-all
          merge-multiple: true
      - name: Certify or route defects to Autonomous
        run: |
          set -euo pipefail
          find evidence-all -name '*.jsonl' -type f -print0 | xargs -0 -r jq -s '.' > /tmp/all.json
          [ -s /tmp/all.json ] || echo '[]' > /tmp/all.json
          total=$(jq length /tmp/all.json); unique=$(jq '[.[].itemId]|unique|length' /tmp/all.json)
          agents=$(jq '[.[].agentNumber]|unique|length' /tmp/all.json); passed=$(jq '[.[]|select(.passed)]|length' /tmp/all.json)
          failed=$((total-passed))
          browser_total=$(find evidence-all -path '*/landing-live-e2e/agent-*.json' -type f | wc -l | tr -d ' ')
          browser_passed=$(find evidence-all -path '*/landing-live-e2e/agent-*.json' -type f -print0 | xargs -0 -r jq -s '[.[]|select(.passed==true)]|length')
          browser_p0=$(find evidence-all -path '*/landing-live-e2e/agent-*.json' -type f -print0 | xargs -0 -r jq -s '[.[].p0Failures]|add')
          browser_passed=${browser_passed:-0}
          browser_p0=${browser_p0:-0}
          missing_agents=$((112-browser_total))
          if [ "$failed" -gt 0 ] || [ "$total" -ne 112 ] || [ "$unique" -ne 112 ] || [ "$agents" -ne 112 ] || [ "$browser_passed" -ne 112 ] || [ "$browser_p0" -ne 0 ]; then
            test -n "$SYSTEM_KEY"
            browser_failures=$(find evidence-all -path '*/landing-live-e2e/agent-*.json' -type f -print0 | xargs -0 -r jq -s '[.[]|select(.passed!=true)|{agentNumber,group,p0Failures,failures:[.evidence[]|select(.passed!=true)|{name,severity,detail}]}]')
            browser_failures=${browser_failures:-[]}
            failures=$(jq -c '[.[]|select(.passed!=true)|{itemId,agentNumber,assignment,dimension,status}]' /tmp/all.json)
            goal=$(jq -nr --arg bf "$browser_failures" --arg cf "$failures" --arg missing "$missing_agents" '"P0/P1 Landing marketing launch repair. Live-browser failures="+$bf+"; code-audit failures="+$cf+"; missingAgentEvidence="+$missing+". Fix actual source, run browser E2E, open PR, deploy, verify production SHA parity, then rerun the 112-agent gate. Never certify from code-read alone."')
            payload=$(jq -nc --arg goal "$goal" '{goal:$goal,executionMode:"code_change",templateMode:"BUG_FIX",approvePatch:true,approveGitDeploy:true,validationMode:"typecheck",systemMode:true,ownerApproved:true,riskLevel:"low"}')
            curl -fsS -X POST "$API_BASE/api/ivx/senior-developer/worker/jobs" -H 'Content-Type: application/json' -H "X-IVX-System-Key: $SYSTEM_KEY" --data "$payload" -o /tmp/repair.json
          fi
          mkdir -p certificate
          jq -n --arg sha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg liveSha "$LIVE_SHA" --argjson total "$total" --argjson passed "$passed" --argjson failed "$failed" --argjson agents "$agents" --argjson browserTotal "$browser_total" --argjson browserPassed "$browser_passed" --argjson browserP0 "$browser_p0" '{certificate:"IVX Landing 112-Agent Live Browser E2E QA",workflowSha:$sha,liveSourceSha:$liveSha,runId:$runId,agentAudits:$total,agentsParticipating:$agents,agentAuditsPassed:$passed,agentAuditsFailed:$failed,browserRuns:$browserTotal,browserRunsPassed:$browserPassed,p0Failures:$browserP0,autonomousManager:true,status:(if $total==112 and $agents==112 and $failed==0 and $browserTotal==112 and $browserPassed==112 and $browserP0==0 and $liveSha==$sha then "PASS" else "REPAIR_REQUIRED" end),completedAt:(now|todateiso8601)}' > certificate/result.json
          cat certificate/result.json
          test "$(jq -r '.status' certificate/result.json)" = PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IVX-LANDING-500-CHECK-CERT-${{ github.run_id }}
          path: certificate/
          retention-days: 30
\t' read -r artifact_id artifact_name; do
              [ -n "$artifact_id" ] || continue
              grep -qx "$artifact_id" /tmp/dispatcher/seen && continue
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "/tmp/dispatcher/zips/$artifact_id.zip"
              mkdir -p "/tmp/dispatcher/evidence/$artifact_id"
              unzip -oq "/tmp/dispatcher/zips/$artifact_id.zip" -d "/tmp/dispatcher/evidence/$artifact_id"
              echo "$artifact_id" >> /tmp/dispatcher/seen
              new_deliveries=$((new_deliveries+1))
            done < /tmp/dispatcher/artifacts.tsv
            delivered=$(wc -l < /tmp/dispatcher/seen | tr -d ' ')
            echo "Delivered agents: $delivered/112; new this cycle: $new_deliveries"
            if [ "$new_deliveries" -gt 0 ]; then
              code_failures=$(find /tmp/dispatcher/evidence -name 'agent-*.jsonl' -type f -print0 | xargs -0 -r jq -s '[.[]|select(.passed!=true)|{agentNumber,assignment,dimension,status}]')
              browser_failures=$(find /tmp/dispatcher/evidence -path '*/landing-live-e2e/agent-*.json' -type f -print0 | xargs -0 -r jq -s '[.[]|select(.passed!=true)|{agentNumber,group,p0Failures}]')
              code_failures=$(printf '%s' "$code_failures" | jq -c '. // []')
              browser_failures=$(printf '%s' "$browser_failures" | jq -c '. // []')
              failure_count=$(jq -n --argjson code "$code_failures" --argjson browser "$browser_failures" '($code|length)+($browser|length)')
              if [ "$failure_count" -gt 0 ]; then
                goal=$(jq -nr --arg cf "$code_failures" --arg bf "$browser_failures" --arg delivered "$delivered" '"Five-minute dispatcher repair cycle. Delivered="+$delivered+"/112; codeFailures="+$cf+"; browserFailures="+$bf+". Fix actual source, validate E2E, open PR, merge and deploy only a verified non-empty patch, then verify production SHA. Never fabricate PASS and never overlap an active deploy."')
                payload=$(jq -nc --arg goal "$goal" '{goal:$goal,executionMode:"code_change",templateMode:"BUG_FIX",approvePatch:true,approveGitDeploy:true,validationMode:"typecheck",systemMode:true,ownerApproved:true,riskLevel:"low"}')
                curl -fsS -X POST "$API_BASE/api/ivx/senior-developer/worker/jobs" -H 'Content-Type: application/json' -H "X-IVX-System-Key: $SYSTEM_KEY" --data "$payload" -o "/tmp/dispatcher/repair-$cycle.json"
                jq '{accepted:(.ok // true),jobId:(.jobId // .id // null)}' "/tmp/dispatcher/repair-$cycle.json"
              fi
            fi
            [ "$delivered" -ge 112 ] && break
            sleep 300
          done
  autonomous-manager:
    needs: [prepare, qa-112]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYSTEM_KEY: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      LIVE_SHA: ${{ needs.prepare.outputs.live_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: landing-500-agent-*-${{ github.run_id }}
          path: evidence-all
          merge-multiple: true
      - name: Certify or route defects to Autonomous
        run: |
          set -euo pipefail
          find evidence-all -name '*.jsonl' -type f -print0 | xargs -0 -r jq -s '.' > /tmp/all.json
          [ -s /tmp/all.json ] || echo '[]' > /tmp/all.json
          total=$(jq length /tmp/all.json); unique=$(jq '[.[].itemId]|unique|length' /tmp/all.json)
          agents=$(jq '[.[].agentNumber]|unique|length' /tmp/all.json); passed=$(jq '[.[]|select(.passed)]|length' /tmp/all.json)
          failed=$((total-passed))
          browser_total=$(find evidence-all -path '*/landing-live-e2e/agent-*.json' -type f | wc -l | tr -d ' ')
          browser_passed=$(find evidence-all -path '*/landing-live-e2e/agent-*.json' -type f -print0 | xargs -0 -r jq -s '[.[]|select(.passed==true)]|length')
          browser_p0=$(find evidence-all -path '*/landing-live-e2e/agent-*.json' -type f -print0 | xargs -0 -r jq -s '[.[].p0Failures]|add')
          browser_passed=${browser_passed:-0}
          browser_p0=${browser_p0:-0}
          missing_agents=$((112-browser_total))
          if [ "$failed" -gt 0 ] || [ "$total" -ne 112 ] || [ "$unique" -ne 112 ] || [ "$agents" -ne 112 ] || [ "$browser_passed" -ne 112 ] || [ "$browser_p0" -ne 0 ]; then
            test -n "$SYSTEM_KEY"
            browser_failures=$(find evidence-all -path '*/landing-live-e2e/agent-*.json' -type f -print0 | xargs -0 -r jq -s '[.[]|select(.passed!=true)|{agentNumber,group,p0Failures,failures:[.evidence[]|select(.passed!=true)|{name,severity,detail}]}]')
            browser_failures=${browser_failures:-[]}
            failures=$(jq -c '[.[]|select(.passed!=true)|{itemId,agentNumber,assignment,dimension,status}]' /tmp/all.json)
            goal=$(jq -nr --arg bf "$browser_failures" --arg cf "$failures" --arg missing "$missing_agents" '"P0/P1 Landing marketing launch repair. Live-browser failures="+$bf+"; code-audit failures="+$cf+"; missingAgentEvidence="+$missing+". Fix actual source, run browser E2E, open PR, deploy, verify production SHA parity, then rerun the 112-agent gate. Never certify from code-read alone."')
            payload=$(jq -nc --arg goal "$goal" '{goal:$goal,executionMode:"code_change",templateMode:"BUG_FIX",approvePatch:true,approveGitDeploy:true,validationMode:"typecheck",systemMode:true,ownerApproved:true,riskLevel:"low"}')
            curl -fsS -X POST "$API_BASE/api/ivx/senior-developer/worker/jobs" -H 'Content-Type: application/json' -H "X-IVX-System-Key: $SYSTEM_KEY" --data "$payload" -o /tmp/repair.json
          fi
          mkdir -p certificate
          jq -n --arg sha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg liveSha "$LIVE_SHA" --argjson total "$total" --argjson passed "$passed" --argjson failed "$failed" --argjson agents "$agents" --argjson browserTotal "$browser_total" --argjson browserPassed "$browser_passed" --argjson browserP0 "$browser_p0" '{certificate:"IVX Landing 112-Agent Live Browser E2E QA",workflowSha:$sha,liveSourceSha:$liveSha,runId:$runId,agentAudits:$total,agentsParticipating:$agents,agentAuditsPassed:$passed,agentAuditsFailed:$failed,browserRuns:$browserTotal,browserRunsPassed:$browserPassed,p0Failures:$browserP0,autonomousManager:true,status:(if $total==112 and $agents==112 and $failed==0 and $browserTotal==112 and $browserPassed==112 and $browserP0==0 and $liveSha==$sha then "PASS" else "REPAIR_REQUIRED" end),completedAt:(now|todateiso8601)}' > certificate/result.json
          cat certificate/result.json
          test "$(jq -r '.status' certificate/result.json)" = PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IVX-LANDING-500-CHECK-CERT-${{ github.run_id }}
          path: certificate/
          retention-days: 30
