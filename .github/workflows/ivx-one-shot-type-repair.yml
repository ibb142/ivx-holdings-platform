name: IVX One-Shot Strict Type Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-one-shot-type-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/enterprise-live-ia-instant-ux-20260816
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Apply exact analytics type repair
        shell: python
        run: |
          from pathlib import Path
          analytics = Path('backend/services/ivx-analytics-brain.ts')
          text = analytics.read_text()
          old = "    contract_address?: string;\n  };"
          new = "    contract_address?: string;\n    contact_info?: string;\n    regulatory_status?: string;\n    pressure_tactics?: string;\n    testimonials?: string;\n    bankruptcy_history?: string;\n    litigation_history?: string;\n    fees?: string;\n    contract_clauses?: string;\n    valuation?: string;\n    escrow?: string;\n  };"
          if old not in text:
              raise SystemExit('analytics asset_data anchor not found')
          analytics.write_text(text.replace(old, new, 1))
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Strict backend TypeScript gate
        run: cd backend && bunx tsc --noEmit
      - name: Commit repair to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ivx-autonomous-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/services/ivx-analytics-brain.ts
          git commit -m 'fix: restore analytics strict type definitions'
          git push origin HEAD:feat/enterprise-live-ia-instant-ux-20260816
