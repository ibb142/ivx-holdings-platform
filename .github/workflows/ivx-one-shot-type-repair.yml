name: IVX One-Shot Strict Type Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-one-shot-type-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Apply exact type repairs
        shell: python
        run: |
          from pathlib import Path

          campaign = Path('backend/services/ivx-autonomous-completion-campaign.ts')
          text = campaign.read_text()
          old = "  total: number;\n  divisionA_verified: number;"
          new = "  total: number;\n  specialists_verified: number;\n  divisionA_verified: number;"
          if old not in text:
              raise SystemExit('completion campaign return type anchor not found')
          campaign.write_text(text.replace(old, new, 1))

          analytics = Path('backend/services/ivx-analytics-brain.ts')
          text = analytics.read_text()
          old = "    contract_address?: string;\n  };"
          new = "    contract_address?: string;\n    contact_info?: string;\n    regulatory_status?: string;\n    pressure_tactics?: string;\n    testimonials?: string;\n    bankruptcy_history?: string;\n    litigation_history?: string;\n    fees?: string;\n    contract_clauses?: string;\n    valuation?: string;\n    escrow?: string;\n  };"
          if old not in text:
              raise SystemExit('analytics asset_data anchor not found')
          analytics.write_text(text.replace(old, new, 1))
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Strict backend TypeScript gate
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ivx-one-shot-type-repair.yml
          git config user.name 'ivx-autonomous-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/services/ivx-autonomous-completion-campaign.ts backend/services/ivx-analytics-brain.ts .github/workflows/ivx-one-shot-type-repair.yml
          git commit -m 'fix: restore strict backend typecheck'
          git push origin HEAD:main
