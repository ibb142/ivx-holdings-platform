name: IVX No Idle Intelligence 1000

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-no-idle-intelligence.yml'
      - '.github/workflows/ivx-112-per-agent-20h-no-sleep-sla.yml'
      - 'backend/services/ivx-agent-runtime.ts'
      - 'backend/services/ivx-autonomous-truth-control.ts'
      - 'backend/services/ivx-github-actions-oidc.ts'
      - 'backend/services/ivx-project-vision.ts'
      - 'backend/api/ivx-autonomous-mode.ts'
      - 'backend/api/ivx-autonomous-control-plane.ts'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: ivx-no-idle-intelligence-1000
  cancel-in-progress: true

env:
  API_BASE: https://api.ivxholding.com
  TARGET_AGENTS: '112'
  MAX_PARALLEL_FILL: '24'

jobs:
  no-idle-intelligence:
    name: Keep real agents productively occupied toward IVX completion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire scoped GitHub OIDC machine identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(jq -r '.value // empty' <<<"$response")
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Prime Autonomous with permanent end-to-end project mission
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mission='Continue completing IVX Holdings end to end. Discover unfinished work even when the known queue is empty. Prioritize customer trust, safety, correctness, reliability, performance, clear UX, retention, and global scale. Execute the next highest-value safe engineering gap, verify exact production evidence, learn, then continue discovery. Never count narrative, no-op, workflow existence, or ALREADY_VERIFIED as new work. Financial scale is an ambition, never a fabricated guarantee.'
          body=$(jq -nc --arg task "$mission" '{task:$task,conversationId:"autonomous-project-vision",includeMission:true}')
          code=$(curl -sS --max-time 300 -o /tmp/mission.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
            --data "$body" \
            "${API_BASE}/api/ivx/autonomous-mode/run" || true)
          cat /tmp/mission.json 2>/dev/null || true
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/mission.json)" = true
          test "$(jq -r '.mission.continuousDiscoveryRequired // false' /tmp/mission.json)" = true
          test "$(jq -r '.mission.emptyQueueMeansDone // true' /tmp/mission.json)" = false

      - name: Resume dispatcher and load 112-agent truth snapshot
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/resume.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
            -d '{"action":"resume_all"}' \
            "${API_BASE}/api/ivx/agents/app-completion/control")
          cat /tmp/resume.json
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/resume.json)" = true
          curl -fsS --retry 3 --retry-delay 2 --max-time 30 \
            -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
            "${API_BASE}/api/ivx/autonomous/control-plane" -o /tmp/truth.json
          test "$(jq -r '.ok // false' /tmp/truth.json)" = true
          test "$(jq -r '.agents.total // 0' /tmp/truth.json)" = "$TARGET_AGENTS"
          test "$(jq '[.agents.items[].agentNumber] | unique | length' /tmp/truth.json)" = "$TARGET_AGENTS"

      - name: Find genuinely non-working agents
        id: idle
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.agents.items[] | select(.presence=="IDLE" or .presence=="STALE" or .presence=="ATTENTION") | [.agentId,.agentNumber,.presence] | @tsv' /tmp/truth.json > /tmp/nonworking.tsv
          count=$(wc -l < /tmp/nonworking.tsv | tr -d ' ')
          echo "nonworking_count=$count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Dispatch evidence-backed mission work to non-working agents
        if: ${{ steps.idle.outputs.count != '0' }}
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/no-idle-results
          export API_BASE OIDC_TOKEN SOURCE_SHA RUN_ID
          cat > /tmp/run-agent.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          agent_id="$1"
          agent_number="$2"
          state="$3"
          safe_id=$(printf '%s' "$agent_id" | tr -c 'A-Za-z0-9_.-' '_')
          instruction='Advance the permanent IVX completion mission with real evidence-backed engineering. If the known queue is empty, discover a fresh gap across code, UX, APIs, data, security, performance, mobile/web parity, production telemetry, and customer-critical journeys. Prioritize trust/safety/correctness/reliability before cosmetic work. Do not mutate guarded production resources without approval. Do not fabricate success and do not count ALREADY_VERIFIED or no-op activity as new work.'
          payload=$(jq -n --arg sha "$SOURCE_SHA" --arg run "$RUN_ID" --arg state "$state" --arg instruction "$instruction" --argjson n "$agent_number" '{taskType:"audit",payload:{missionType:"ivx_project_completion",readOnly:true,requireEvidence:true,continuousDiscovery:true,emptyQueueMeansDone:false,sourceSha:$sha,controllerRunId:$run,agentNumber:$n,recoveredFromState:$state,instruction:$instruction}}')
          http=$(curl -sS --retry 1 --retry-delay 1 --max-time 75 -o "/tmp/no-idle-results/${safe_id}.json" -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
            --data "$payload" \
            "${API_BASE}/api/ivx/agents/${agent_id}/run" || true)
          ok=false; evidence=0; run_id=''
          if [ "$http" = 200 ] && jq -e . "/tmp/no-idle-results/${safe_id}.json" >/dev/null 2>&1; then
            ok=$(jq -r '.ok // false' "/tmp/no-idle-results/${safe_id}.json")
            evidence=$(jq -r '(.runRecord.evidence // []) | length' "/tmp/no-idle-results/${safe_id}.json")
            run_id=$(jq -r '.runRecord.runId // .runRecord.taskId // .runRecord.id // empty' "/tmp/no-idle-results/${safe_id}.json")
          fi
          passed=false
          if [ "$http" = 200 ] && [ "$ok" = true ] && [ "$evidence" -gt 0 ] && [ -n "$run_id" ]; then passed=true; fi
          jq -n --arg agentId "$agent_id" --argjson agentNumber "$agent_number" --arg previousState "$state" --arg http "$http" --argjson ok "$ok" --argjson evidence "$evidence" --arg runId "$run_id" --argjson passed "$passed" '{agentId:$agentId,agentNumber:$agentNumber,previousState:$previousState,http:$http,ok:$ok,evidenceCount:$evidence,runId:$runId,passed:$passed}' > "/tmp/no-idle-results/${safe_id}.result.json"
          test "$passed" = true
          SCRIPT
          chmod +x /tmp/run-agent.sh
          xargs -r -P "$MAX_PARALLEL_FILL" -n 3 /tmp/run-agent.sh < /tmp/nonworking.tsv
          jq -s '.' /tmp/no-idle-results/*.result.json > /tmp/no-idle-results.json
          total=$(jq 'length' /tmp/no-idle-results.json)
          passed=$(jq '[.[]|select(.passed==true)]|length' /tmp/no-idle-results.json)
          echo "mission_work_dispatched=$total evidence_verified=$passed"
          test "$total" = "$passed"

      - name: Verify post-fill truth and emit evidence
        if: always()
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sleep 5
          curl -fsS --retry 3 --retry-delay 2 --max-time 30 \
            -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
            "${API_BASE}/api/ivx/autonomous/control-plane" -o /tmp/truth-after.json
          test "$(jq -r '.ok // false' /tmp/truth-after.json)" = true
          test "$(jq -r '.agents.total // 0' /tmp/truth-after.json)" = "$TARGET_AGENTS"
          nonworking=$(jq '[.agents.items[] | select(.presence=="IDLE" or .presence=="STALE" or .presence=="ATTENTION")] | length' /tmp/truth-after.json)
          real_working=$(jq -r '.enterprise.realWorkingAgents // 0' /tmp/truth-after.json)
          active_jobs=$(jq -r '.enterprise.activeJobs // 0' /tmp/truth-after.json)
          dispatched=0; evidenced=0
          if [ -f /tmp/no-idle-results.json ]; then
            dispatched=$(jq 'length' /tmp/no-idle-results.json)
            evidenced=$(jq '[.[]|select(.passed==true)]|length' /tmp/no-idle-results.json)
          fi
          mission_ok=false
          if [ -f /tmp/mission.json ]; then mission_ok=$(jq -r '.ok // false' /tmp/mission.json); fi
          jq -n --arg certificate 'IVX-NO-IDLE-INTELLIGENCE-1000' --arg sourceSha "$GITHUB_SHA" --arg githubRunId "$GITHUB_RUN_ID" --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson totalAgents 112 --argjson fallbackAuditsDispatched "$dispatched" --argjson fallbackAuditsWithEvidence "$evidenced" --argjson remainingNonWorking "$nonworking" --argjson realWorkingAgents "$real_working" --argjson activeJobs "$active_jobs" --argjson missionInjected "$mission_ok" --slurpfile truth /tmp/truth-after.json '{ok:($missionInjected and $totalAgents==112 and $fallbackAuditsDispatched==$fallbackAuditsWithEvidence),certificate:$certificate,sourceSha:$sourceSha,githubRunId:$githubRunId,generatedAt:$generatedAt,totalAgents:$totalAgents,missionInjected:$missionInjected,fallbackAuditsDispatched:$fallbackAuditsDispatched,fallbackAuditsWithEvidence:$fallbackAuditsWithEvidence,remainingNonWorking:$remainingNonWorking,realWorkingAgents:$realWorkingAgents,activeJobs:$activeJobs,truthSnapshot:$truth[0],safeguards:{continuousDiscovery:true,emptyQueueMeansDone:false,evidenceRequired:true,noSyntheticProductivity:true,ownerStopRespectedByRuntimeEnforcer:true}}' > evidence/ivx-no-idle-intelligence-latest.json
          cat evidence/ivx-no-idle-intelligence-latest.json
          test "$(jq -r '.ok' evidence/ivx-no-idle-intelligence-latest.json)" = true

      - name: Upload no-idle evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivx-no-idle-intelligence-${{ github.run_id }}
          path: evidence/ivx-no-idle-intelligence-latest.json
          if-no-files-found: error
          retention-days: 30
