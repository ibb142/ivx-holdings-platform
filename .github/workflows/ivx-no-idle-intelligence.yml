name: IVX No Idle Intelligence 1000

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ivx-no-idle-intelligence-1000
  cancel-in-progress: false

env:
  API_BASE: https://api.ivxholding.com
  TARGET_AGENTS: '112'
  IDLE_AFTER_SECONDS: '300'
  MAX_PARALLEL_FILL: '24'
  OIDC_AUDIENCE: ivx-360-autonomous-recovery

jobs:
  no-idle-intelligence:
    name: Keep real agents productively occupied
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
      IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
    steps:
      - name: Acquire scoped GitHub OIDC machine identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
          curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$token_url" > /tmp/ivx-oidc.json
          token=$(jq -r '.value // empty' /tmp/ivx-oidc.json)
          test -n "$token"
          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/ivx-oidc-token
          chmod 600 /tmp/ivx-oidc-token

      - name: Resolve protected machine authorization fallback
        shell: bash
        run: |
          set -euo pipefail
          owner_key="${IVX_AI_SYSTEM_SECRET:-${IVX_SYSTEM_SECRET:-}}"
          if [ -n "$owner_key" ]; then
            echo "::add-mask::$owner_key"
            printf '%s' "$owner_key" > /tmp/ivx-owner-key
            chmod 600 /tmp/ivx-owner-key
          fi

      - name: Wake dispatcher and synchronize real campaign assignments
        shell: bash
        run: |
          set -euo pipefail
          oidc_token=$(cat /tmp/ivx-oidc-token)

          curl -fsS --retry 3 --retry-delay 2 --max-time 45 \
            "$API_BASE/api/ivx/agents/app-completion/dashboard" \
            -o /tmp/dashboard-before.json
          test "$(jq -r '.ok // false' /tmp/dashboard-before.json)" = true

          args=(-sS --retry 2 --retry-delay 2 --max-time 45 -o /tmp/resume.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: $oidc_token")
          if [ -s /tmp/ivx-owner-key ]; then
            owner_key=$(cat /tmp/ivx-owner-key)
            args+=( -H "x-ivx-owner-key: $owner_key" )
          fi
          code=$(curl "${args[@]}" -d '{"action":"resume_all"}' "$API_BASE/api/ivx/agents/app-completion/control")
          echo "resume_http=$code"
          cat /tmp/resume.json
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/resume.json)" = true

      - name: Find genuinely idle agents without inventing work
        id: idle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 45 \
            "$API_BASE/api/ivx/agents" -o /tmp/agents.json

          total=$(jq -r '.totalAgents // 0' /tmp/agents.json)
          test "$total" = "$TARGET_AGENTS"

          jq '[.dispatcher.activeJobs[]? | select(.status == "RUNNING" or .status == "QUEUED") | .agentNumber] | unique' \
            /tmp/dashboard-before.json > /tmp/campaign-active.json

          now=$(date -u +%s)
          jq -r \
            --argjson active "$(cat /tmp/campaign-active.json)" \
            --argjson now "$now" \
            --argjson idle "$IDLE_AFTER_SECONDS" '
              .agents[]
              | select((.paused // false) == false and (.disabled // false) == false)
              | select((.agentNumber as $n | ($active | index($n))) == null)
              | ((.lastHeartbeat // "") as $hb
                  | if $hb == "" then 0 else (try ($hb | fromdateiso8601) catch 0) end) as $hbEpoch
              | select($hbEpoch == 0 or ($now - $hbEpoch) >= $idle)
              | [.agentId, (.agentNumber|tostring), (.name // ""), (.role // ""), (.lastHeartbeat // "")]
              | @tsv
            ' /tmp/agents.json > /tmp/idle-agents.tsv

          idle_count=$(wc -l < /tmp/idle-agents.tsv | tr -d ' ')
          active_count=$(jq 'length' /tmp/campaign-active.json)
          echo "registered=$total campaign_active=$active_count idle_candidates=$idle_count"
          echo "idle_count=$idle_count" >> "$GITHUB_OUTPUT"

      - name: Dispatch bounded evidence-backed audits to idle agents
        if: ${{ steps.idle.outputs.idle_count != '0' }}
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          oidc_token=$(cat /tmp/ivx-oidc-token)
          owner_key=''
          if [ -s /tmp/ivx-owner-key ]; then owner_key=$(cat /tmp/ivx-owner-key); fi
          export API_BASE SOURCE_SHA RUN_ID owner_key oidc_token
          mkdir -p /tmp/no-idle-results

          cat > /tmp/run-idle-agent.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          agent_id="$1"
          agent_number="$2"
          safe_id=$(printf '%s' "$agent_id" | tr -c 'A-Za-z0-9_.-' '_')
          payload=$(jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg runId "$RUN_ID" \
            --argjson agentNumber "$agent_number" \
            '{
              taskType:"audit",
              payload:{
                mission:"IVX_NO_IDLE_INTELLIGENCE_1000",
                purpose:"Use otherwise-idle capacity for a real low-risk evidence-backed audit. Do not fabricate success and do not mutate production.",
                controlled:true,
                readOnly:true,
                requireEvidence:true,
                sourceSha:$sourceSha,
                controllerRunId:$runId,
                agentNumber:$agentNumber
              }
            }')

          args=(-sS --retry 2 --retry-delay 1 --max-time 90 -o "/tmp/no-idle-results/${safe_id}.json" -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: $oidc_token")
          if [ -n "$owner_key" ]; then args+=( -H "x-ivx-owner-key: $owner_key" ); fi
          http=$(curl "${args[@]}" --data "$payload" "$API_BASE/api/ivx/agents/$agent_id/run" || true)

          jq -n \
            --arg agentId "$agent_id" \
            --argjson agentNumber "$agent_number" \
            --arg http "$http" \
            --slurpfile body "/tmp/no-idle-results/${safe_id}.json" \
            '{agentId:$agentId,agentNumber:$agentNumber,http:$http,body:($body[0] // {})}' \
            > "/tmp/no-idle-results/${safe_id}.result.json"

          test "$http" = 200
          test "$(jq -r '.ok // false' "/tmp/no-idle-results/${safe_id}.json")" = true
          test "$(jq -r '(.runRecord.evidence // []) | length' "/tmp/no-idle-results/${safe_id}.json")" -gt 0
          test -n "$(jq -r '.runRecord.runId // empty' "/tmp/no-idle-results/${safe_id}.json")"
          SCRIPT
          chmod +x /tmp/run-idle-agent.sh

          cut -f1,2 /tmp/idle-agents.tsv | \
            xargs -r -n2 -P "$MAX_PARALLEL_FILL" /tmp/run-idle-agent.sh

          jq -s '.' /tmp/no-idle-results/*.result.json > /tmp/no-idle-dispatch-results.json
          dispatched=$(jq 'length' /tmp/no-idle-dispatch-results.json)
          evidenced=$(jq '[.[] | select(.http == "200" and (.body.ok == true) and ((.body.runRecord.evidence // []) | length > 0))] | length' /tmp/no-idle-dispatch-results.json)
          test "$dispatched" = "$evidenced"
          echo "no_idle_dispatched=$dispatched evidence_verified=$evidenced"

      - name: Build fail-closed no-idle checkpoint
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p evidence

          curl -fsS --retry 3 --retry-delay 2 --max-time 45 \
            "$API_BASE/api/ivx/agents/app-completion/dashboard" \
            -o /tmp/dashboard-after.json
          curl -fsS --retry 3 --retry-delay 2 --max-time 45 \
            "$API_BASE/api/ivx/agents" \
            -o /tmp/agents-after.json

          total=$(jq -r '.totalAgents // 0' /tmp/agents-after.json)
          test "$total" = "$TARGET_AGENTS"

          if [ -f /tmp/no-idle-dispatch-results.json ]; then
            dispatched=$(jq 'length' /tmp/no-idle-dispatch-results.json)
            evidenced=$(jq '[.[] | select(.http == "200" and (.body.ok == true) and ((.body.runRecord.evidence // []) | length > 0))] | length' /tmp/no-idle-dispatch-results.json)
            active_ms=$(jq '[.[].body.runRecord.durationMs // 0] | add // 0' /tmp/no-idle-dispatch-results.json)
          else
            dispatched=0
            evidenced=0
            active_ms=0
          fi

          jq -n \
            --arg certificate 'IVX-NO-IDLE-INTELLIGENCE-1000' \
            --arg sourceSha "$SOURCE_SHA" \
            --arg githubRunId "$RUN_ID" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson totalAgents "$total" \
            --argjson idleCandidates "${{ steps.idle.outputs.idle_count }}" \
            --argjson dispatched "$dispatched" \
            --argjson evidenceVerified "$evidenced" \
            --argjson verifiedActiveMilliseconds "$active_ms" \
            --slurpfile before /tmp/dashboard-before.json \
            --slurpfile after /tmp/dashboard-after.json \
            '{
              ok: ($totalAgents == 112 and $dispatched == $evidenceVerified),
              certificate:$certificate,
              sourceSha:$sourceSha,
              githubRunId:$githubRunId,
              generatedAt:$generatedAt,
              totalAgents:$totalAgents,
              idleCandidatesDetected:$idleCandidates,
              fallbackAuditsDispatched:$dispatched,
              fallbackAuditsWithRealEvidence:$evidenceVerified,
              verifiedFallbackActiveMilliseconds:$verifiedActiveMilliseconds,
              dispatcherBefore:($before[0].dispatcher // {}),
              dispatcherAfter:($after[0].dispatcher // {}),
              safeguards:{
                mutationFallbackForbidden:true,
                ownerEmergencyStopPreserved:true,
                fakeProductivityForbidden:true,
                evidenceRequired:true,
                slaHoursNotInferredFromPresence:true
              },
              truthNote:"No-Idle Intelligence only fills otherwise-idle capacity with real read-only evidence-backed audits. It does not count connected/registered time as productive time and does not by itself certify the 2,000-hour SLA."
            }' > evidence/ivx-no-idle-intelligence-latest.json

          cat evidence/ivx-no-idle-intelligence-latest.json
          test "$(jq -r '.ok' evidence/ivx-no-idle-intelligence-latest.json)" = true

      - name: Upload no-idle evidence
        uses: actions/upload-artifact@v4
        with:
          name: ivx-no-idle-intelligence-${{ github.run_id }}
          path: evidence/ivx-no-idle-intelligence-latest.json
          if-no-files-found: error
          retention-days: 30
