# Runtime credential re-certification trigger: 2026-09-02T21:55:00Z
name: Landing Render Runtime Certificate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'expo/ivxholding-landing/**'
      - 'expo/assets/images/**'
      - 'backend/api/ivx-landing-full-deploy.ts'
      - 'backend/services/ivx-cloudfront-invalidation.ts'
      - '.github/workflows/landing-render-runtime-cert.yml'
      - '.github/workflows/landing-navigation-browser.yml'
      - 'qa/landing-runtime-publish*'
      - 'expo/scripts/landing-cloudfront-invalidation.mjs'

permissions:
  contents: read

concurrency:
  group: landing-s3-production
  cancel-in-progress: false

jobs:
  deploy-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the requested IVX backend commit
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/version.json -w '%{http_code}' --max-time 15 https://api.ivxholding.com/version || true)
            if [ "$code" = "200" ] && node -e 'const v=JSON.parse(require("fs").readFileSync("/tmp/version.json","utf8")); process.exit(v.commit===process.env.GITHUB_SHA?0:1)'; then
              echo "Backend commit PASS: $GITHUB_SHA"
              exit 0
            fi
            echo "Backend not ready (HTTP $code), retry $i/30"
            sleep 10
          done
          echo '::error::Production backend did not become healthy.'
          exit 1

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.9' }

      - name: Install reviewed deployment dependencies
        run: bun install --frozen-lockfile

      - name: Configure existing GitHub AWS deployment access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify IVX AWS account
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '206818124217'
          echo 'IVX_DEPLOY_IDENTITY_GATE=PASS'

      - name: Publish reviewed assets directly to AWS
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_ADS_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_ADS_KEY }}
          EXPO_PUBLIC_META_PIXEL_ID: ${{ secrets.EXPO_PUBLIC_META_PIXEL_ID }}
          EXPO_PUBLIC_TIKTOK_PIXEL_ID: ${{ secrets.EXPO_PUBLIC_TIKTOK_PIXEL_ID }}
          EXPO_PUBLIC_LINKEDIN_PARTNER_ID: ${{ secrets.EXPO_PUBLIC_LINKEDIN_PARTNER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node qa/landing-runtime-publish.mjs | tee /tmp/deploy.json
          node - <<'NODE'
          const d = JSON.parse(require('fs').readFileSync('/tmp/deploy.json', 'utf8'));
          if (d.sourceCommitSha !== process.env.GITHUB_SHA || d.uploads < 1 ||
              !d.invalidationId || d.invalidationStatus !== 'Completed') {
            throw new Error('Deployment evidence is incomplete');
          }
          console.log('CERT_DEPLOY_PASS');
          NODE

      - name: Verify live CloudFront website
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          curl -fsS --max-time 30 -D /tmp/index.headers -o /tmp/index.html 'https://ivxholding.com/?ivx_cert=${{ github.sha }}'
          grep -qi '^content-type:.*text/html' /tmp/index.headers
          test $(wc -c < /tmp/index.html) -gt 1000
          grep -Fq "name=\"ivx-deployment-sha\" content=\"${GITHUB_SHA}\"" /tmp/index.html

          curl -fsS --max-time 30 -D /tmp/js.headers -o /tmp/ivx-app.js 'https://ivxholding.com/ivx-app.js?ivx_cert=${{ github.sha }}'
          grep -qi '^content-type:.*\(javascript\|text/javascript\)' /tmp/js.headers
          test $(wc -c < /tmp/ivx-app.js) -gt 100

          curl -fsS --max-time 30 -D /tmp/robots.headers -o /tmp/robots.txt 'https://ivxholding.com/robots.txt?ivx_cert=${{ github.sha }}'
          grep -qi '^content-type:.*text/plain' /tmp/robots.headers
          grep -qi 'Sitemap:' /tmp/robots.txt

          curl -fsS --max-time 30 -D /tmp/sitemap.headers -o /tmp/sitemap.xml 'https://ivxholding.com/sitemap.xml?ivx_cert=${{ github.sha }}'
          grep -qi '^content-type:.*\(application/xml\|text/xml\)' /tmp/sitemap.headers
          grep -qi '<urlset' /tmp/sitemap.xml

          echo "LIVE_CLOUDFRONT_CERT_PASS commit=${GITHUB_SHA}"

      - name: Certificate summary
        if: success()
        shell: bash
        run: |
          echo '## IVX Landing Production Certificate' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Exact Render backend commit: **PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Direct GitHub-to-AWS publication: **PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- CloudFront invalidation: **PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Live index/html: **PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Live JS MIME/content: **PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- robots.txt: **PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- sitemap.xml: **PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Result: **CERTIFIED PASS**' >> "$GITHUB_STEP_SUMMARY"
