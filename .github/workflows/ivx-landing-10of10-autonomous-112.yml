name: IVX Landing 10of10 Autonomous 112

on:
  push:
    branches: ['fix/**']
    paths:
      - 'qa/autonomous/landing-10of10-mission.json'
      - 'scripts/ivx-autonomous-governance.mjs'
      - 'scripts/__tests__/ivx-autonomous-governance.test.mjs'
      - '.github/workflows/ivx-landing-10of10-autonomous-112.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  API_BASE: https://api.ivxholding.com
  IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
  IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
  PROGRAM_ID: IVX-LANDING-10OF10-2026-08-19

concurrency:
  group: ivx-landing-10of10-autonomous-112-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autonomous-audit:
    name: Governed autonomous audit — no production mutation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove autonomous governance regression suite
        run: |
          set -euo pipefail
          node --check scripts/ivx-autonomous-governance.mjs
          node --check scripts/__tests__/ivx-autonomous-governance.test.mjs
          node --test scripts/__tests__/ivx-autonomous-governance.test.mjs

      - name: Validate mission and autonomous safety contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.programId' qa/autonomous/landing-10of10-mission.json)" = "$PROGRAM_ID"
          test "$(jq '.gaps | length' qa/autonomous/landing-10of10-mission.json)" = 40
          test "$(jq -r '.executionPolicy.workers' qa/autonomous/landing-10of10-mission.json)" = 112
          test "$(jq -r '.executionPolicy.simulatedSuccessAllowed' qa/autonomous/landing-10of10-mission.json)" = false
          test "$(jq '.finalGates | length' qa/autonomous/landing-10of10-mission.json)" -ge 30
          node --input-type=module <<'NODE'
          import { assertAutonomousTask } from './scripts/ivx-autonomous-governance.mjs';
          const decision = assertAutonomousTask({
            taskId: `landing-audit-${process.env.GITHUB_RUN_ID}`,
            sourceSha: process.env.GITHUB_SHA,
            actions: ['audit_code', 'run_qa', 'collect_evidence'],
            riskClass: 'LOW',
            targetBranch: process.env.GITHUB_REF_NAME,
            realExecutionOnly: true,
            simulatedSuccessAllowed: false,
            evidenceRequired: true,
            exactSourceShaRequired: true,
            realFundsAllowed: false,
            production: false,
          });
          console.log(JSON.stringify(decision));
          NODE

      - name: Enforce workflow has no production mutation bypass
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/ivx-landing-10of10-autonomous-112.yml'
          ! grep -q 'api.render.com/v1/services/.*/deploys' "$workflow"
          ! grep -q 'render_trigger_deploy' "$workflow"
          ! grep -q 'git push origin HEAD:main' "$workflow"
          ! grep -q 'contents: write' "$workflow"
          ! grep -q 'actions: write' "$workflow"
          echo 'autonomous_production_mutation_bypass=ABSENT'

      - name: Bind runtime system credential for controlled QA only
        shell: bash
        run: |
          set -euo pipefail
          SYSTEM_KEY="${IVX_AI_SYSTEM_SECRET:-${IVX_SYSTEM_SECRET:-}}"
          test -n "$SYSTEM_KEY"
          echo "::add-mask::$SYSTEM_KEY"
          echo "SYSTEM_KEY=$SYSTEM_KEY" >> "$GITHUB_ENV"

      - name: Verify live 112 registry read-only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "${API_BASE}/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          test "$(jq '[.agents[].agentId] | unique | length' /tmp/agents.json)" = 112
          jq -r '.agents | sort_by(.agentNumber)[] | [.agentNumber,.agentId] | @tsv' /tmp/agents.json > /tmp/agents.tsv

      - name: Execute 112 governed evidence-bearing audit runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/landing10-results
          export API_BASE SYSTEM_KEY PROGRAM_ID GITHUB_SHA GITHUB_RUN_ID GITHUB_REF_NAME
          run_one() {
            number="$1"
            agent_id="$2"
            gap=$(( ((number - 1) % 40) + 1 ))
            task_id="landing10-audit-gap-$(printf '%02d' "$gap")-agent-$(printf '%03d' "$number")-${GITHUB_RUN_ID}"
            node --input-type=module - "$task_id" <<'NODE'
          import { assertAutonomousTask } from './scripts/ivx-autonomous-governance.mjs';
          const taskId = process.argv[2];
          assertAutonomousTask({
            taskId,
            sourceSha: process.env.GITHUB_SHA,
            actions: ['audit_code', 'run_qa', 'collect_evidence'],
            riskClass: 'LOW',
            targetBranch: process.env.GITHUB_REF_NAME,
            realExecutionOnly: true,
            simulatedSuccessAllowed: false,
            evidenceRequired: true,
            exactSourceShaRequired: true,
            realFundsAllowed: false,
            production: false,
          });
          NODE
            contract_file="/tmp/landing10-results/contract-${number}.json"
            run_file="/tmp/landing10-results/run-${number}.json"
            result_file="/tmp/landing10-results/result-${number}.json"
            contract_http=$(curl -sS --max-time 25 -o "$contract_file" -w '%{http_code}' "${API_BASE}/api/ivx/agents/${agent_id}/contract" || true)
            if [ "$contract_http" != 200 ]; then
              jq -n --argjson agentNumber "$number" --arg agentId "$agent_id" --argjson gapId "$gap" --arg contractHttp "$contract_http" '{agentNumber:$agentNumber,agentId:$agentId,gapId:$gapId,ok:false,contractHttp:$contractHttp,error:"contract_failed"}' > "$result_file"
              return 0
            fi
            task_type=$(jq -r '.contract.allowedTaskTypes[0] // "audit"' "$contract_file")
            body=$(jq -nc --arg taskType "$task_type" --arg token "$SYSTEM_KEY" --arg sourceSha "$GITHUB_SHA" --arg taskId "$task_id" --arg runId "landing10-audit-${GITHUB_RUN_ID}" --argjson gapId "$gap" '{taskType:$taskType,ownerApprovalToken:$token,payload:{programId:env.PROGRAM_ID,gapId:$gapId,sourceSha:$sourceSha,__taskId:$taskId,__runId:$runId,__workflow:"IVX Landing 10of10 Autonomous 112",__autonomous:true,actions:["audit_code","run_qa","collect_evidence"],riskClass:"LOW",realExecutionOnly:true,simulatedSuccessAllowed:false,evidenceRequired:true,exactSourceShaRequired:true,realFundsAllowed:false}}')
            run_http=$(curl -sS --retry 1 --retry-delay 1 --max-time 75 -o "$run_file" -w '%{http_code}' -X POST "${API_BASE}/api/ivx/agents/${agent_id}/run" -H 'Content-Type: application/json' -H "x-ivx-owner-key: ${SYSTEM_KEY}" --data "$body" || true)
            jq -n --argjson agentNumber "$number" --arg agentId "$agent_id" --argjson gapId "$gap" --argjson contractHttp "$contract_http" --argjson runHttp "${run_http:-0}" --slurpfile response "$run_file" '($response[0] // {}) as $r | ($r.runRecord // {}) as $rr | {agentNumber:$agentNumber,agentId:$agentId,gapId:$gapId,contractHttp:$contractHttp,runHttp:$runHttp,ok:($r.ok // false),finalStatus:($rr.finalStatus // "request_failed"),sourceReference:($rr.sourceReference // ""),toolResultId:($rr.toolResultId // ""),simulated:($rr.simulated // true),realToolUsed:($rr.realToolUsed // false),verifiedOutput:($rr.verifiedOutput // false),error:($r.error // $rr.error // "")}' > "$result_file"
          }
          export -f run_one
          xargs -a /tmp/agents.tsv -n2 -P8 bash -c 'run_one "$0" "$1"'
          jq -s 'sort_by(.agentNumber)' /tmp/landing10-results/result-*.json > /tmp/landing10-results/all.json
          test "$(jq 'length' /tmp/landing10-results/all.json)" = 112
          test "$(jq '[.[] | select(.ok == true and .simulated == false and .realToolUsed == true and .verifiedOutput == true and (.sourceReference|length)>0 and (.toolResultId|length)>0)] | length' /tmp/landing10-results/all.json)" = 112

      - name: Build fail-closed audit artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence/autonomous
          cp /tmp/landing10-results/all.json qa/evidence/autonomous/landing-10of10-agent-results.json
          passed=$(jq '[.[] | select(.ok == true and .simulated == false and .realToolUsed == true and .verifiedOutput == true and (.sourceReference|length)>0 and (.toolResultId|length)>0)] | length' /tmp/landing10-results/all.json)
          jq -n --arg programId "$PROGRAM_ID" --arg sourceSha "$GITHUB_SHA" --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson passed "$passed" '{ok:($passed==112),certificate:"IVX-AUTONOMOUS-PHASE1-AUDIT",programId:$programId,sourceSha:$sourceSha,workersExpected:112,workersPassingGovernedAudit:$passed,productionMutationAllowed:false,realFundsAllowed:false,simulatedSuccessAllowed:false,verifiedAt:$verifiedAt}' > qa/evidence/autonomous/phase1-autonomous-governance-audit.json
          test "$(jq -r '.ok' qa/evidence/autonomous/phase1-autonomous-governance-audit.json)" = true
          cat qa/evidence/autonomous/phase1-autonomous-governance-audit.json

      - uses: actions/upload-artifact@v4
        with:
          name: phase1-autonomous-governance-${{ github.sha }}
          path: |
            qa/evidence/autonomous/phase1-autonomous-governance-audit.json
            qa/evidence/autonomous/landing-10of10-agent-results.json
          if-no-files-found: error
