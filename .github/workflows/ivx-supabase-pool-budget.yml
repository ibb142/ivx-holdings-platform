name: IVX Supabase Connection Budget Recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ivx-supabase-pool-budget.yml', 'scripts/ops/supabase-pool-budget*']
  pull_request:
    paths: ['.github/workflows/ivx-supabase-pool-budget.yml', 'scripts/ops/supabase-pool-budget*']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ivx-supabase-pool-budget
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ops/supabase-pool-budget.test.mjs
  recover:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/ops/supabase-pool-budget.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
