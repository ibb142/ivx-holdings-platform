name: IVX 112 Per-Agent Timer Control

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-112-per-agent-timer-control.yml'
      - 'backend/api/ivx-agent-api.ts'
      - 'backend/services/ivx-agent-runtime.ts'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ivx-112-per-agent-timer-control
  cancel-in-progress: true

jobs:
  timer-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://api.ivxholding.com
      IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
      IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      TARGET_HOURS_24H: '20'
    steps:
      - name: Acquire IVX machine identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$token_json" | jq -r '.value // empty')
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Audit real timer for every IA
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          now_ms=$(date +%s%3N)
          cutoff_ms=$((now_ms - 86400000))
          curl -fsS --retry 4 --retry-delay 2 --max-time 30 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" -eq 112
          : > /tmp/timers.jsonl
          stale=0
          below_target=0
          total_ms=0
          while IFS=$'\t' read -r n id heartbeat paused disabled; do
            curl -fsS --retry 2 --retry-delay 1 --max-time 20 "$API_BASE/api/ivx/agents/runs/${id}?limit=500" -o "/tmp/runs-${n}.json" || echo '{"ok":false,"records":[]}' > "/tmp/runs-${n}.json"
            worked_ms=$(jq --argjson cutoff "$cutoff_ms" '[.records[]? | select((.endTime // .startTime // "") != "") | ((.endTime // .startTime) | fromdateiso8601 * 1000) as $ended | select($ended >= $cutoff) | select((.evidence // []) | length > 0) | (.durationMs // 0)] | add // 0' "/tmp/runs-${n}.json" 2>/dev/null || echo 0)
            worked_ms=${worked_ms%.*}
            [ -n "$worked_ms" ] || worked_ms=0
            total_ms=$((total_ms + worked_ms))
            hours=$(awk -v ms="$worked_ms" 'BEGIN { printf "%.2f", ms/3600000 }')
            target_ok=$(awk -v h="$hours" -v t="$TARGET_HOURS_24H" 'BEGIN { print (h+0 >= t+0) ? "true" : "false" }')
            if [ "$target_ok" != true ]; then below_target=$((below_target + 1)); fi
            recent=$(jq --argjson cutoff "$cutoff_ms" '[.records[]? | ((.endTime // .startTime // "") | fromdateiso8601? * 1000) as $t | select(($t // 0) >= $cutoff)] | length' "/tmp/runs-${n}.json" 2>/dev/null || echo 0)
            if [ "$recent" -eq 0 ] && [ "$paused" != true ] && [ "$disabled" != true ]; then stale=$((stale + 1)); fi
            jq -n --argjson agentNumber "$n" --arg agentId "$id" --argjson workedMs24h "$worked_ms" --arg hours24h "$hours" --argjson recentRuns "$recent" --arg heartbeat "$heartbeat" --argjson paused "$paused" --argjson disabled "$disabled" --argjson targetMet "$target_ok" '{agentNumber:$agentNumber,agentId:$agentId,workedMs24h:$workedMs24h,hours24h:($hours24h|tonumber),recentRuns:$recentRuns,lastHeartbeat:$heartbeat,paused:$paused,disabled:$disabled,target20hMet:$targetMet}' >> /tmp/timers.jsonl
          done < <(jq -r '.agents[] | [.agentNumber,.agentId,(.lastHeartbeat // ""),(.paused // false),(.disabled // false)] | @tsv' /tmp/agents.json)
          jq -s --arg generatedAt "$(date -u +%FT%TZ)" --argjson stale "$stale" --argjson below "$below_target" --argjson totalMs "$total_ms" '{ok:true,generatedAt:$generatedAt,totalAgents:length,staleAgents:$stale,below20hAgents:$below,totalWorkedHours24h:($totalMs/3600000),agents:.}' /tmp/timers.jsonl | tee /tmp/per-agent-timers.json
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          echo "below=$below_target" >> "$GITHUB_OUTPUT"
          test "$(jq -r '.totalAgents' /tmp/per-agent-timers.json)" -eq 112

      - name: Recover every stale IA individually
        if: steps.audit.outputs.stale != '0'
        shell: bash
        run: |
          set -euo pipefail
          owner_key="${IVX_SYSTEM_SECRET:-${IVX_AI_SYSTEM_SECRET:-}}"
          if [ -z "$owner_key" ]; then
            echo 'Owner system secret unavailable; individual retry is blocked.'
            exit 1
          fi
          failures=0
          while read -r n; do
            code=$(curl -sS --max-time 20 -o "/tmp/retry-${n}.json" -w '%{http_code}' -X POST -H 'content-type: application/json' -H "x-ivx-owner-key: $owner_key" -d "{\"action\":\"retry_agent\",\"agentNumber\":${n}}" "$API_BASE/api/ivx/agents/app-completion/control") || code=000
            if [ "$code" != 200 ] || [ "$(jq -r '.ok // false' "/tmp/retry-${n}.json" 2>/dev/null || echo false)" != true ]; then failures=$((failures + 1)); fi
          done < <(jq -r '.agents[] | select(.recentRuns == 0 and .paused == false and .disabled == false) | .agentNumber' /tmp/per-agent-timers.json)
          echo "individual_retry_failures=$failures"
          test "$failures" -eq 0

      - name: Resume fleet after timer audit
        if: steps.audit.outputs.stale != '0'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/resume.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: $OIDC_TOKEN" -d '{"action":"resume_all"}' "$API_BASE/api/ivx/agents/app-completion/control")
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/resume.json)" = true

      - name: Require fleet activity after recovery
        if: steps.audit.outputs.stale != '0'
        shell: bash
        run: |
          set -euo pipefail
          started=false
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            curl -fsS --retry 2 --retry-delay 1 --max-time 20 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/after.json
            running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/after.json)
            if [ "$running" -gt 0 ]; then started=true; break; fi
          done
          test "$started" = true

      - name: Upload per-agent timer evidence
        uses: actions/upload-artifact@v4
        with:
          name: ivx-112-per-agent-timers
          path: /tmp/per-agent-timers.json
          retention-days: 30

      - name: Fail closed if any active IA has zero real runs in rolling 24h
        shell: bash
        run: |
          set -euo pipefail
          stale=$(jq -r '.staleAgents' /tmp/per-agent-timers.json)
          if [ "$stale" -gt 0 ]; then
            echo "IVX_112_TIMER_RED: ${stale} active agents had zero evidence-backed runs in the rolling 24h window before recovery."
            exit 1
          fi
          echo 'IVX_112_PER_AGENT_TIMER=GREEN'
