name: IVX 112 Per-Agent Timer Control

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/ivx-112-per-agent-timer-control.yml'
      - 'scripts/ivx-per-agent-timer-control.mjs'
      - 'scripts/__tests__/ivx-per-agent-timer-control.test.mjs'

permissions:
  contents: read

# GitHub schedules can be delayed. The production worker owns continuous dispatch.
concurrency:
  group: ivx-112-per-agent-timer-control-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  timer-contract:
    name: Per-agent timer regression tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/__tests__/ivx-per-agent-timer-control.test.mjs

  timer-control:
    if: >-
      github.repository == 'ibb142/ivx-holdings-platform' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_HOURS_24H: '20'
    steps:
      - name: Checkout workflow revision
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Acquire scoped GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$token_json" | jq -er '.value | select(type == "string" and length > 0)')
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Observe durable QA timers and owner control state
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        env:
          IVX_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
        run: node scripts/ivx-per-agent-timer-control.mjs

      - name: Preserve timer evidence, including unavailable observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivx-112-per-agent-timers-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/evidence/per-agent-timers/timers.json
          if-no-files-found: error
          retention-days: 7
