name: IVX Supabase Recovery Patch

on:
  push:
    branches: [agent/supabase-recovery]

permissions:
  contents: write

jobs:
  qa-integrity-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supabase-recovery
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Make QA-AUTH-001 proof strict
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('qa/ivx-qa-runner.ts')
          text = p.read_text()
          old1 = "return { actual: 'Owner password not configured on backend runtime (503)', status: 'SKIP' as TestStatus, evidenceRef: 'owner-password-not-configured' };"
          new1 = "return { actual: `Owner password binding unavailable: ${rootCause || 'HTTP 503'}`, status: 'FAIL' as TestStatus, evidenceRef: 'owner-password-binding-unavailable' };"
          old2 = "return { actual: `Owner login error: ${String(err).slice(0, 200)}`, status: 'SKIP' as TestStatus, evidenceRef: 'owner-login-error' };"
          new2 = "return { actual: `Owner login error: ${String(err).slice(0, 200)}`, status: 'ERROR' as TestStatus, evidenceRef: 'owner-login-error' };"
          if old1 in text:
              text = text.replace(old1, new1, 1)
          elif 'owner-password-binding-unavailable' not in text:
              raise SystemExit('QA owner binding SKIP anchor missing')
          if old2 in text:
              text = text.replace(old2, new2, 1)
          elif "status: 'ERROR' as TestStatus, evidenceRef: 'owner-login-error'" not in text:
              raise SystemExit('QA owner exception SKIP anchor missing')
          p.write_text(text)
          PY

      - name: Install root dependencies
        run: bun install

      - name: Verify core Supabase repair still typechecks
        run: cd backend && bunx tsc --noEmit

      - name: Run Supabase resilience tests
        run: bun test backend/ivx-supabase-resilience-static.test.ts --reporter=dots

      - name: Verify QA owner-auth gate cannot skip binding failures
        shell: bash
        run: |
          set -euo pipefail
          grep -q "owner-password-binding-unavailable" qa/ivx-qa-runner.ts
          grep -q "status: 'ERROR' as TestStatus, evidenceRef: 'owner-login-error'" qa/ivx-qa-runner.ts
          if grep -q "owner-password-not-configured.*status: 'SKIP'" qa/ivx-qa-runner.ts; then
            echo 'QA-AUTH-001 still hides owner binding failure as SKIP'
            exit 1
          fi

      - name: Run owner auth regression tests
        run: cd expo && bun install && bun test __tests__/auth-timeout-fix.test.ts --reporter=dots

      - name: Commit strict QA gate and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IVX Recovery Bot'
          git config user.email 'ivx-recovery@users.noreply.github.com'
          git add qa/ivx-qa-runner.ts
          git rm .github/workflows/ivx-supabase-recovery-patch.yml
          git commit -m 'fix(qa): require real owner auth proof during production QA'
          git push origin HEAD:agent/supabase-recovery
