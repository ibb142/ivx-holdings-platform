name: IVX Autonomous Database Credential Sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-autonomous-db-sync.yml'
      - 'scripts/ops/autonomous-db-sync.mjs'
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/ivx-autonomous-db-sync.yml'
      - 'scripts/ops/autonomous-db-sync*'
permissions:
  contents: read
concurrency:
  group: ivx-autonomous-database-credential-sync
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node --test scripts/ops/autonomous-db-sync.test.mjs
  audit-sync:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit and sync verified same-project database configuration
        run: node scripts/ops/autonomous-db-sync.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          IVX_RENDER_API_KEY: ${{ secrets.IVX_RENDER_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IVX_OWNER_VARIABLES_ENCRYPTION_KEY: ${{ secrets.IVX_OWNER_VARIABLES_ENCRYPTION_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
