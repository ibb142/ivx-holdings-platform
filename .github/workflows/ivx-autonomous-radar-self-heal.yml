name: IVX Autonomous Radar Self-Heal

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Landing 112-Agent Autonomous QA War Room
      - IVX Enterprise Line-by-Line Quality Audit
      - IVX Enterprise QA
      - IVX Dashboard + IA Chat End-to-End Certificate
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  issues: write
  id-token: write

concurrency:
  group: ivx-autonomous-predictive-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://api.ivxholding.com
      SYSTEM_KEY: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      OWNER_KEY: ${{ secrets.IVX_SYSTEM_SECRET }}
      OWNER_TOKEN: ${{ secrets.IVX_OWNER_TOKEN }}
      OIDC_AUDIENCE: ivx-360-autonomous-recovery
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Acquire scoped GitHub OIDC machine identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
          curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$token_url" > /tmp/ivx-oidc.json
          token=$(jq -r '.value // empty' /tmp/ivx-oidc.json)
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Predictive five-sample endpoint window
        id: predictive
        env:
          IVX_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ivx-radar
          : > /tmp/ivx-radar/samples.jsonl
          for i in 1 2 3 4 5; do
            started=$(date +%s%3N)
            code=$(curl -sS --max-time 4 -o /tmp/ivx-radar/body-${i}.txt -D /tmp/ivx-radar/headers-${i}.txt -w '%{http_code}' \
              -H 'Accept: application/json' \
              -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC}" \
              "${API_BASE}/api/ivx/autonomous/control-plane" || printf '000')
            ended=$(date +%s%3N)
            latency=$((ended-started))
            content_type=$(grep -i '^content-type:' /tmp/ivx-radar/headers-${i}.txt 2>/dev/null | tail -1 | tr -d '\r' | cut -d: -f2- | xargs || true)
            json_valid=false
            ok=false
            if jq -e . /tmp/ivx-radar/body-${i}.txt >/dev/null 2>&1; then json_valid=true; fi
            if [ "$code" = '200' ] && [ "$json_valid" = true ] && printf '%s' "$content_type" | grep -Eiq 'application/json|\+json'; then ok=true; fi
            jq -n --argjson sample "$i" --argjson latencyMs "$latency" --arg status "$code" --arg contentType "$content_type" --argjson jsonValid "$json_valid" --argjson ok "$ok" \
              '{sample:$sample,latencyMs:$latencyMs,status:$status,contentType:$contentType,jsonValid:$jsonValid,ok:$ok}' >> /tmp/ivx-radar/samples.jsonl
            sleep 2
          done

          failures=$(jq -s '[.[] | select(.ok != true)] | length' /tmp/ivx-radar/samples.jsonl)
          bad_json=$(jq -s '[.[] | select(.jsonValid != true)] | length' /tmp/ivx-radar/samples.jsonl)
          avg_latency=$(jq -s '([.[].latencyMs] | add) / length | floor' /tmp/ivx-radar/samples.jsonl)
          first_avg=$(jq -s '([.[0:2][].latencyMs] | add) / 2' /tmp/ivx-radar/samples.jsonl)
          last_avg=$(jq -s '([.[3:5][].latencyMs] | add) / 2' /tmp/ivx-radar/samples.jsonl)
          trend=$(awk -v a="$first_avg" -v b="$last_avg" 'BEGIN { if (a<=0) print 1; else printf "%.2f", b/a }')

          level=GREEN
          action=observe
          if [ "$failures" -ge 3 ] || [ "$bad_json" -ge 2 ]; then level=CRITICAL; action=self_heal;
          elif [ "$failures" -ge 1 ] || [ "$avg_latency" -ge 2500 ]; then level=WARNING; action=self_heal;
          elif [ "$avg_latency" -ge 1200 ] || awk -v t="$trend" 'BEGIN{exit !(t>=1.7)}'; then level=WATCH; action=preflight;
          fi

          jq -s --arg level "$level" --arg action "$action" --argjson failures "$failures" --argjson badJson "$bad_json" --argjson avgLatencyMs "$avg_latency" --arg trend "$trend" \
            '{level:$level,action:$action,failures:$failures,badJson:$badJson,avgLatencyMs:$avgLatencyMs,latencyTrend:($trend|tonumber),samples:.}' \
            /tmp/ivx-radar/samples.jsonl > /tmp/ivx-radar/predictive-assessment.json
          cat /tmp/ivx-radar/predictive-assessment.json
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Detect failed source jobs
        id: source
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | {id,name,failedSteps:[.steps[]? | select(.conclusion == "failure") | .name]}' \
            > /tmp/ivx-radar/failed-jobs.jsonl
          count=$(wc -l < /tmp/ivx-radar/failed-jobs.jsonl | tr -d ' ')
          echo "failed_count=$count" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg workflow "$SOURCE_WORKFLOW" \
            --arg runId "$SOURCE_RUN_ID" \
            --arg headSha "$SOURCE_HEAD_SHA" \
            --arg url "$SOURCE_URL" \
            --arg conclusion "$SOURCE_CONCLUSION" \
            '{workflow:$workflow,runId:$runId,headSha:$headSha,url:$url,conclusion:$conclusion}' \
            > /tmp/ivx-radar/source-run.json
          cat /tmp/ivx-radar/source-run.json
          if grep -Eiq 'secret|credential|auth|permission|payment|stripe|migration|database destructive|infrastructure|iam|cloudfront|route53|security policy|rollback' /tmp/ivx-radar/failed-jobs.jsonl; then
            echo 'owner_gate_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'owner_gate_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Owner Gate for high-risk source failure
        if: ${{ github.event_name == 'workflow_run' && steps.source.outputs.owner_gate_required == 'true' }}
        run: |
          echo 'OWNER_GATE_REQUIRED: high-risk auth/permissions/security/infrastructure incident.'
          exit 1

      - name: Build predictive mission
        if: ${{ steps.predictive.outputs.action != 'observe' || (github.event_name == 'workflow_run' && steps.source.outputs.failed_count != '0' && steps.source.outputs.owner_gate_required != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          assessment=$(cat /tmp/ivx-radar/predictive-assessment.json)
          source_failures='[]'
          source_run='null'
          if [ -s /tmp/ivx-radar/failed-jobs.jsonl ]; then source_failures=$(jq -s -c '.' /tmp/ivx-radar/failed-jobs.jsonl); fi
          if [ -s /tmp/ivx-radar/source-run.json ]; then source_run=$(jq -c '.' /tmp/ivx-radar/source-run.json); fi
          jq -n --arg event "$GITHUB_EVENT_NAME" --argjson assessment "$assessment" --argjson failures "$source_failures" --argjson sourceRun "$source_run" \
            '{event:$event,predictive:$assessment,sourceRun:$sourceRun,sourceFailures:$failures,policy:{failClosed:true,ownerGate:true,maxRepairAttempts:3,neverWeakenQuality:true,rerunAfterRepair:true}}' \
            > /tmp/ivx-radar/mission.json
          cat /tmp/ivx-radar/mission.json

      - name: Resume bounded 112-agent campaign when self-heal is required
        if: ${{ steps.source.outputs.owner_gate_required != 'true' && (steps.predictive.outputs.action == 'self_heal' || (github.event_name == 'workflow_run' && steps.source.outputs.failed_count != '0')) }}
        env:
          IVX_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner_key="${OWNER_KEY:-${SYSTEM_KEY:-${OWNER_TOKEN:-}}}"
          args=(-sS --max-time 30 -o /tmp/ivx-radar/resume.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC}")
          if [ -n "$owner_key" ]; then
            echo "::add-mask::$owner_key"
            args+=( -H "x-ivx-owner-key: $owner_key" )
          fi
          code=$(curl "${args[@]}" -d '{"action":"resume_all"}' "${API_BASE}/api/ivx/agents/app-completion/control")
          echo "autonomous_resume_http=$code"
          cat /tmp/ivx-radar/resume.json
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/ivx-radar/resume.json)" = true

      - name: Delegate predictive preflight or safe self-heal
        if: ${{ steps.predictive.outputs.action != 'observe' || (github.event_name == 'workflow_run' && steps.source.outputs.failed_count != '0' && steps.source.outputs.owner_gate_required != 'true') }}
        env:
          IVX_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mission=$(cat /tmp/ivx-radar/mission.json)
          if [ "${{ steps.predictive.outputs.action }}" = 'preflight' ] && [ "${{ steps.source.outputs.failed_count }}" = '0' ]; then
            execution=qa_only
            approve_patch=false
            approve_deploy=false
          else
            execution=code_change
            approve_patch=true
            approve_deploy=false
          fi
          goal="IVX AUTONOMOUS CLOSED-LOOP RECOVERY. Treat any subscribed workflow failure as an actionable repair event, not a terminal report. Diagnose exact failed job/step and source SHA. For low-risk code defects, repair the code or test harness, run focused tests, create/update the repair PR, and ensure the original certificate reruns from the repaired source. Never weaken tests or assertions to manufacture green. Never change secrets/IAM/payments/destructive migrations/security policy or production infrastructure without Owner Gate. Evidence required. Mission: ${mission}"
          payload=$(jq -n --arg goal "$goal" --arg execution "$execution" --argjson approvePatch "$approve_patch" --argjson approveGitDeploy "$approve_deploy" \
            '{goal:$goal,executionMode:$execution,templateMode:"BUG_FIX",approvePatch:$approvePatch,approveGitDeploy:$approveGitDeploy,validationMode:"typecheck",riskLevel:"low",proposedPlan:"Closed-loop failure diagnosis, safe code repair, focused validation, repair PR, and source certificate rerun with Owner Gates preserved.",rollbackOption:"Revert autonomous repair PR if any regression appears.",filesAffected:["workflow-failure-source","certificate-harness","runtime-code-if-required"]}')
          args=(-sS --max-time 60 -o /tmp/ivx-radar/job-start.json -w '%{http_code}' -X POST "${API_BASE}/api/ivx/senior-developer/worker/jobs" -H 'Content-Type: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC}")
          if [ -n "${SYSTEM_KEY:-}" ]; then
            echo "::add-mask::$SYSTEM_KEY"
            args+=( -H "X-IVX-System-Key: $SYSTEM_KEY" )
          fi
          http=$(curl "${args[@]}" --data "$payload")
          case "$http" in 200|202|409) ;; *) cat /tmp/ivx-radar/job-start.json; exit 1;; esac
          jq -e '.jobId // .activeJobId // .job.jobId' /tmp/ivx-radar/job-start.json >/dev/null
          cat /tmp/ivx-radar/job-start.json

      - name: Persist predictive radar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivx-predictive-radar-${{ github.run_id }}
          path: /tmp/ivx-radar
          if-no-files-found: error
          retention-days: 30