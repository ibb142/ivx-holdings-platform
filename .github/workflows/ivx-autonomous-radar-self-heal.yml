name: IVX Autonomous Radar Self-Heal

on:
  workflow_run:
    workflows:
      - Landing 112-Agent Autonomous QA War Room
    types:
      - completed
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: ivx-autonomous-radar-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  radar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_BASE: https://api.ivxholding.com
      SYSTEM_KEY: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Radar preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SYSTEM_KEY:-}"
          curl -fsS --retry 3 --retry-delay 2 "${API_BASE}/health" -o /tmp/health.json
          jq -e '.ok == true or .healthy == true or .status == "ok"' /tmp/health.json >/dev/null
          echo 'radar_preflight=PASS'

      - name: Detect failed source jobs
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            echo 'failed_count=0' >> "$GITHUB_OUTPUT"
            echo 'manual_radar_preflight=PASS'
            exit 0
          fi
          test -n "${SOURCE_RUN_ID:-}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | {id,name,failedSteps:[.steps[]? | select(.conclusion == "failure") | .name]}' \
            > /tmp/failed-jobs.jsonl
          count=$(wc -l < /tmp/failed-jobs.jsonl | tr -d ' ')
          echo "failed_count=$count" >> "$GITHUB_OUTPUT"
          if grep -Eiq 'secret|credential|auth|permission|payment|stripe|migration|database destructive|infrastructure|iam|cloudfront|route53|security policy|rollback' /tmp/failed-jobs.jsonl; then
            echo 'owner_gate_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'owner_gate_required=false' >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/failed-jobs.jsonl || true

      - name: Stop at Owner Gate for high-risk incident
        if: ${{ steps.detect.outputs.owner_gate_required == 'true' }}
        run: |
          echo 'owner_gate_required=true'
          exit 1

      - name: Build repair mission
        if: ${{ steps.detect.outputs.failed_count != '0' && steps.detect.outputs.owner_gate_required != 'true' }}
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          summary=$(jq -s -c '.' /tmp/failed-jobs.jsonl)
          jq -n --arg runId "$SOURCE_RUN_ID" --arg sourceSha "$SOURCE_SHA" --argjson failures "$summary" \
            '{runId:$runId,sourceSha:$sourceSha,failures:$failures,policy:{maxRepairAttempts:3,failClosed:true,ownerGate:true}}' > /tmp/radar-mission.json
          cat /tmp/radar-mission.json

      - name: Delegate evidence-backed safe repair
        if: ${{ steps.detect.outputs.failed_count != '0' && steps.detect.outputs.owner_gate_required != 'true' }}
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mission=$(cat /tmp/radar-mission.json)
          goal="IVX AUTONOMOUS RADAR SELF-HEAL for War Room run ${SOURCE_RUN_ID}, SHA ${SOURCE_SHA}. Diagnose root cause and perform only safe low-risk repair. Required: evidence, tests, typecheck, commit/PR/CI/merge/live verification. Never weaken 112/112. Stop for secrets/auth/permissions/payments/destructive migrations/infrastructure/security/critical rollback. Mission: ${mission}"
          payload=$(jq -n --arg goal "$goal" '{goal:$goal,executionMode:"code_change",templateMode:"BUG_FIX",approvePatch:true,approveGitDeploy:true,validationMode:"typecheck",systemMode:true,ownerApproved:true,riskLevel:"low",proposedPlan:"Evidence-backed safe autonomous repair; preserve all Owner Gates."}')
          http=$(curl -sS --max-time 60 -o /tmp/job-start.json -w '%{http_code}' -X POST \
            "${API_BASE}/api/ivx/senior-developer/worker/jobs" \
            -H 'Content-Type: application/json' -H "X-IVX-System-Key: ${SYSTEM_KEY}" --data "$payload")
          case "$http" in 200|202|409) ;; *) cat /tmp/job-start.json; exit 1;; esac
          job_id=$(jq -r '.jobId // .activeJobId // .job.jobId // empty' /tmp/job-start.json)
          test -n "$job_id"
          echo "radar_job_id=$job_id"

      - name: Persist radar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivx-autonomous-radar-${{ github.run_id }}
          path: |
            /tmp/failed-jobs.jsonl
            /tmp/radar-mission.json
            /tmp/job-start.json
          if-no-files-found: ignore
          retention-days: 30
