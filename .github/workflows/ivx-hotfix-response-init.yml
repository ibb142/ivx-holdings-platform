name: IVX ResponseInit Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair Response.json status init
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/hono.ts')
          s = p.read_text()
          old = "Response.json({ success: false, message: 'Login service temporarily unavailable. Please try again.', deploymentMarker: DEPLOYMENT_MARKER }, 503)"
          new = "Response.json({ success: false, message: 'Login service temporarily unavailable. Please try again.', deploymentMarker: DEPLOYMENT_MARKER }, { status: 503 })"
          if old not in s:
              print('hotfix_target_not_present')
          else:
              p.write_text(s.replace(old, new, 1))
              print('hotfix_applied')
          PY
      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet -- backend/hono.ts; then
            echo 'No ResponseInit repair needed.'
            exit 0
          fi
          git config user.name 'IVX Hotfix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/hono.ts
          git commit -m 'fix: use ResponseInit for member login timeout'
          git push origin HEAD:main
