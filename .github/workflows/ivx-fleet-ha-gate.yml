name: Fleet evidence and process fencing
on:
  push:
    branches: [fix/fleet-render-ha-20260908, fix/fleet-backend-ha-20260908]
  pull_request:
    paths: ['backend/**', 'expo/**', 'supabase/migrations/**', 'supabase/repair-functions/**', 'scripts/ivx-senior-commit-recovery-postgres-proof.mjs', 'scripts/ivx-senior-compact-receipt-proof.mjs', 'scripts/ivx-coder-workspace-postgres-proof.ts', 'scripts/ivx-objective-link-postgres-proof.mjs', 'scripts/ivx-fleet-ha-postgres-proof.mjs', 'scripts/ivx-task-recovery-postgres-proof.mjs', 'scripts/ivx-fleet-telemetry-postgres-proof.ts', 'scripts/ivx-mission-history-postgres-proof.ts', 'scripts/ivx-inspection-claim-postgres-proof.mjs', 'scripts/ivx-fleet-ha-live-proof.ts', 'scripts/ivx-fleet-ha-identities.ts', 'scripts/ivx-fleet-ha-identities.test.ts', '.github/workflows/ivx-fleet-ha-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fleet-evidence-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ivx_ha_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install --frozen-lockfile
      - run: bun test scripts/ivx-fleet-ha-identities.test.ts
      - run: bun test backend/services/ivx-fleet-patrol-observations.test.ts
      - run: bun test backend/services/ivx-postgres-deadline.test.ts
      - run: bun test backend/services/ivx-owner-chat-admission.test.ts
      - run: bun test backend/api/ivx-owner-ai-reconciliation.test.ts
      - run: bun test backend/api/ivx-owner-ai-stream.test.ts
      - run: bun test backend/services/ivx-owner-ai-task-queue.test.ts
      - run: bun test backend/services/ivx-owner-text-prompt.test.ts backend/services/ivx-ia-conversation-brain-deep-qa.test.ts
      - run: bun test expo/__tests__/owner-chat-submission.test.ts
      - run: bun test backend/services/ivx-jv-realtime-lifecycle.test.ts
      - name: Bound empty claim polling without reducing 112-lane capacity
        run: node --experimental-strip-types --test backend/services/ivx-empty-claim-cooldown.test.mjs
      - name: Preserve certificate evidence independently of runtime expectations
        run: bun test backend/services/ivx-certificate-provenance.test.ts
      - name: Require observed AI readiness and explicit billing failures
        run: bun test backend/services/ivx-ai-readiness-state.test.ts
      - name: Require a bounded valid completion before provider readiness
        run: bun test backend/services/ivx-ai-completion-probe.test.ts
      - run: bun test backend/services/ivx-autonomous-scheduler.test.ts backend/services/ivx-technical-schedule.test.ts backend/services/ivx-landing-superseded-recovery.test.ts
      - run: bun test backend/services/ivx-coder-workspace.test.ts
      - name: Bound provider attempts and stop cancelled or expired generations
        run: bun test backend/ivx-ai-provider-limits.test.ts backend/services/ivx-ai-queue.test.ts backend/services/ivx-retry-policy.test.ts
      - name: Verify manager identity, terminal writes, admission, planning and recovery
        run: bun test backend/services/ivx-manager-recovery-regressions.test.ts backend/services/ivx-resume-pr-identity.test.ts backend/services/ivx-worker-terminal-phase.test.ts backend/services/ivx-coder-branch.test.ts backend/services/ivx-senior-job-admission.test.ts backend/services/ivx-senior-queue-reconciliation.test.ts backend/services/ivx-senior-committed-recovery-policy.test.ts backend/services/ivx-repair-resume-evidence.test.ts backend/services/ivx-autonomous-planning-continuity.test.ts backend/services/ivx-landing-p0-backlog.test.ts
      - name: Require truthful inspection acceptance and lease ownership
        run: bun test backend/services/ivx-agent-real-engineering-cycle.test.ts backend/services/ivx-autonomous-task-engine.test.ts backend/services/ivx-autonomous-work-manager.test.ts
      - name: Refuse new model work and publication after worker authority is lost
        run: bun test backend/ivx-autonomous-coder.test.ts --test-name-pattern 'authority'
      - run: bun test backend/ivx-final-closeout-resume.test.ts backend/services/ivx-native-intent.test.ts backend/services/ivx-fleet-dashboard-signals.test.ts backend/services/ivx-fleet-slo.test.ts backend/services/ivx-postgres-autonomous-task-store.test.ts backend/services/ivx-render-replicas.test.ts backend/services/ivx-shared-room-storage.test.ts backend/services/ivx-autonomous-control-policy.test.ts
      - run: node scripts/ivx-fleet-ha-postgres-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Recover committed jobs with missing PR identity on PostgreSQL
        run: node scripts/ivx-senior-commit-recovery-postgres-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Verify owner chat admission and response reconciliation on PostgreSQL
        run: bun scripts/ivx-owner-chat-admission-postgres-proof.ts
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Verify compact mutation receipts and retained checkpoints
        run: node scripts/ivx-senior-compact-receipt-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Preserve terminal history before retention and reject late workers
        run: node scripts/ivx-senior-history-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Persist two concurrent repair workspaces under physical leases
        run: bun scripts/ivx-coder-workspace-postgres-proof.ts
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - run: bun scripts/ivx-fleet-telemetry-postgres-proof.ts
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Recover current work with 1200 obsolete blocked inspections
        run: bun scripts/ivx-mission-history-postgres-proof.ts
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Exclude obsolete inspections while preserving Landing and owner priority
        run: node scripts/ivx-inspection-claim-postgres-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - run: |
          bun build scripts/ivx-postgres-deadline-proof.ts --target=node --packages=external --outfile=qa/evidence/fleet-ha/deadline-proof.mjs
          node qa/evidence/fleet-ha/deadline-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - run: bun scripts/ivx-fleet-bounded-claims-proof.ts
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Verify objective linking progresses around occupied tasks
        run: node scripts/ivx-objective-link-postgres-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Preserve task recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            qa/evidence/fleet-ha/task-recovery.json
            qa/evidence/fleet-ha/senior-commit-recovery.json
            qa/evidence/fleet-ha/owner-chat-admission.json
            qa/evidence/fleet-ha/objective-link.json
            qa/evidence/fleet-ha/compact-receipt.json
            qa/evidence/fleet-ha/senior-history.json
            qa/evidence/fleet-ha/coder-workspaces.json
          if-no-files-found: warn
          retention-days: 30
