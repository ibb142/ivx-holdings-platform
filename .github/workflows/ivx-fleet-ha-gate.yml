name: Fleet evidence and process fencing
on:
  push:
    branches: [fix/fleet-render-ha-20260908, fix/fleet-backend-ha-20260908]
  pull_request:
    paths: ['backend/**', 'expo/**', 'supabase/migrations/**', 'supabase/repair-functions/**', 'scripts/ivx-senior-commit-recovery-postgres-proof.mjs', 'scripts/ivx-senior-compact-receipt-proof.mjs', 'scripts/ivx-fleet-ha-postgres-proof.mjs', 'scripts/ivx-task-recovery-postgres-proof.mjs', 'scripts/ivx-fleet-telemetry-postgres-proof.ts', 'scripts/ivx-fleet-ha-live-proof.ts', 'scripts/ivx-fleet-ha-identities.ts', 'scripts/ivx-fleet-ha-identities.test.ts', '.github/workflows/ivx-fleet-ha-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fleet-evidence-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ivx_ha_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install --frozen-lockfile
      - run: bun test scripts/ivx-fleet-ha-identities.test.ts
      - run: bun test backend/services/ivx-postgres-deadline.test.ts
      - run: bun test backend/services/ivx-autonomous-scheduler.test.ts backend/services/ivx-technical-schedule.test.ts backend/services/ivx-landing-superseded-recovery.test.ts
      - run: bun test backend/services/ivx-coder-workspace.test.ts
      - run: bun test backend/ivx-final-closeout-resume.test.ts backend/services/ivx-native-intent.test.ts backend/services/ivx-fleet-dashboard-signals.test.ts backend/services/ivx-fleet-slo.test.ts backend/services/ivx-postgres-autonomous-task-store.test.ts backend/services/ivx-render-replicas.test.ts backend/services/ivx-shared-room-storage.test.ts backend/services/ivx-autonomous-control-policy.test.ts
      - run: node scripts/ivx-fleet-ha-postgres-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Recover committed jobs with missing PR identity on PostgreSQL
        run: node scripts/ivx-senior-commit-recovery-postgres-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Verify compact mutation receipts and retained checkpoints
        run: node scripts/ivx-senior-compact-receipt-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - run: bun scripts/ivx-fleet-telemetry-postgres-proof.ts
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - run: |
          bun build scripts/ivx-postgres-deadline-proof.ts --target=node --packages=external --outfile=qa/evidence/fleet-ha/deadline-proof.mjs
          node qa/evidence/fleet-ha/deadline-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - run: bun scripts/ivx-fleet-bounded-claims-proof.ts
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
      - name: Preserve task recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            qa/evidence/fleet-ha/task-recovery.json
            qa/evidence/fleet-ha/senior-commit-recovery.json
            qa/evidence/fleet-ha/compact-receipt.json
          if-no-files-found: warn
          retention-days: 30
