name: Fleet evidence and process fencing
on:
  push:
    branches: [fix/fleet-backend-ha-20260908]
  pull_request:
    paths: ['backend/**', 'expo/**', 'supabase/migrations/**', 'scripts/ivx-fleet-ha-postgres-proof.mjs', '.github/workflows/ivx-fleet-ha-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fleet-evidence-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ivx_ha_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install --frozen-lockfile
      - run: bun test backend/ivx-final-closeout-resume.test.ts backend/services/ivx-fleet-dashboard-signals.test.ts backend/services/ivx-fleet-slo.test.ts backend/services/ivx-postgres-autonomous-task-store.test.ts backend/services/ivx-render-replicas.test.ts backend/services/ivx-shared-room-storage.test.ts backend/services/ivx-autonomous-control-policy.test.ts
      - run: node scripts/ivx-fleet-ha-postgres-proof.mjs
        env:
          IVX_HA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_ha_test
