name: IVX Final Dashboard Integration

on:
  push:
    branches: [feat/enterprise-live-ia-instant-ux-final-20260816]
    paths:
      - '.github/workflows/ivx-final-dashboard-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Copy QA-verified dashboard files from PR 140 branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/enterprise-live-ia-instant-ux-20260816
          git show origin/feat/enterprise-live-ia-instant-ux-20260816:expo/app/investor-command-center.tsx > expo/app/investor-command-center.tsx
          git show origin/feat/enterprise-live-ia-instant-ux-20260816:expo/app/ivx/autonomous-live.tsx > expo/app/ivx/autonomous-live.tsx
          git show origin/feat/enterprise-live-ia-instant-ux-20260816:docs/IVX-ENTERPRISE-LIVE-IA-INSTANT-UX.md > docs/IVX-ENTERPRISE-LIVE-IA-INSTANT-UX.md
      - name: Apply strict analytics input type repair
        shell: python
        run: |
          from pathlib import Path
          path = Path('backend/services/ivx-analytics-brain.ts')
          text = path.read_text()
          old = "    contract_address?: string;\n  };"
          new = "    contract_address?: string;\n    contact_info?: string;\n    regulatory_status?: string;\n    pressure_tactics?: string;\n    testimonials?: string;\n    bankruptcy_history?: string;\n    litigation_history?: string;\n    fees?: string;\n    contract_clauses?: string;\n    valuation?: string;\n    escrow?: string;\n  };"
          if old in text:
              text = text.replace(old, new, 1)
          elif 'contact_info?: string;' not in text:
              raise SystemExit('analytics type anchor not found')
          path.write_text(text)
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd expo --frozen-lockfile
      - name: Backend TypeScript
        run: bunx tsc --noEmit
      - name: Expo TypeScript
        run: cd expo && bunx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Backend tests
        run: bun test
      - name: Expo lint
        run: cd expo && bun run lint
      - name: Commit verified integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ivx-final-dashboard-integration.yml
          git config user.name 'ivx-autonomous-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/services/ivx-analytics-brain.ts expo/app/investor-command-center.tsx expo/app/ivx/autonomous-live.tsx docs/IVX-ENTERPRISE-LIVE-IA-INSTANT-UX.md .github/workflows/ivx-final-dashboard-integration.yml
          git commit -m 'feat: finalize enterprise live IA dashboard integration'
          git push origin HEAD:feat/enterprise-live-ia-instant-ux-final-20260816
