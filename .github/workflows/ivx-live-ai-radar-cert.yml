name: IVX Live AI Radar 112 Certificate

on:
  pull_request:
    paths:
      - 'expo/app/ivx/autonomous-ops.tsx'
      - 'expo/src/modules/ivx-owner-ai/services/ivxAutonomousOpsService.ts'
      - '.github/workflows/ivx-live-ai-radar-cert.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  certify-radar:
    name: Certify real 112-agent radar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install Expo dependencies
        working-directory: expo
        run: bun install --frozen-lockfile

      - name: Expo TypeScript
        working-directory: expo
        run: bunx tsc --noEmit

      - name: Prove 1-second real-heartbeat radar contract
        shell: bash
        run: |
          set -euo pipefail
          FILE='expo/app/ivx/autonomous-ops.tsx'
          SERVICE='expo/src/modules/ivx-owner-ai/services/ivxAutonomousOpsService.ts'
          grep -q 'const POLL_MS = 1000' "$FILE"
          grep -q "type HeartbeatState = 'LIVE' | 'WARM' | 'STALE' | 'OFFLINE'" "$FILE"
          grep -q 'heartbeatState(agent.lastActivityTime' "$FILE"
          grep -q '112 IA LIVE RADAR' "$FILE"
          grep -q 'lastActivityTime:string|null' "$SERVICE"
          grep -q '/api/ivx/live-work/agents' "$SERVICE"
          if grep -Eqi 'simulate(d)?[ _-]?activity|fake[ _-]?activity|mock[ _-]?heartbeat' "$FILE"; then
            echo 'Simulated/fake activity marker found in radar UI' >&2
            exit 1
          fi
          echo 'radar_contract=PASS'

      - name: Certificate summary
        run: |
          echo 'IVX Live AI Radar 112: source gate PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Telemetry source: durable/runtime heartbeat; UI refresh: 1 second; simulated activity: prohibited.' >> "$GITHUB_STEP_SUMMARY"
