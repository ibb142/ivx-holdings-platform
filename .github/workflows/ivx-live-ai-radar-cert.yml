name: IVX Live AI Radar 112 Certificate

on:
  pull_request:
    paths:
      - 'expo/app/ivx/autonomous-ops.tsx'
      - 'expo/src/modules/ivx-owner-ai/services/ivxAutonomousOpsService.ts'
      - 'backend/api/ivx-autonomous-ops-dashboard.ts'
      - 'backend/services/ivx-autonomous-productivity-intelligence.ts'
      - '.github/workflows/ivx-live-ai-radar-cert.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  certify-radar:
    name: Certify real 112-agent radar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install Expo dependencies
        working-directory: expo
        run: bun install --frozen-lockfile

      - name: Expo TypeScript
        working-directory: expo
        run: bunx tsc --noEmit

      - name: Prove real-heartbeat and productivity radar contract
        shell: bash
        run: |
          set -euo pipefail
          FILE='expo/app/ivx/autonomous-ops.tsx'
          SERVICE='expo/src/modules/ivx-owner-ai/services/ivxAutonomousOpsService.ts'
          BACKEND='backend/api/ivx-autonomous-ops-dashboard.ts'
          INTEL='backend/services/ivx-autonomous-productivity-intelligence.ts'

          grep -Fq 'setInterval(()=>setNow(Date.now()),1000)' "$FILE"
          grep -Fq "type HeartbeatState='LIVE'|'WARM'|'STALE'|'OFFLINE'" "$FILE"
          grep -Fq 'heartbeatState(agent.lastActivityTime' "$FILE"
          grep -Fq 'IVX Autonomous Command Center' "$FILE"
          grep -Fq 'Live 112 IA Radar' "$FILE"
          grep -Fq 'Verified Productivity · Last 24 Hours' "$FILE"
          grep -Fq 'CIRCUIT BREAKER:' "$FILE"
          grep -Fq 'lastActivityTime:string|null' "$SERVICE"
          grep -Fq '/api/ivx/live-work/agents' "$SERVICE"
          grep -Fq 'productivity24h' "$BACKEND"
          grep -Fq 'buildAutonomousProductivity24h' "$BACKEND"
          grep -Fq 'isVerifiedNetExecution' "$INTEL"
          grep -Fq 'tool_result_id' "$INTEL"
          grep -Fq 'source_reference' "$INTEL"
          grep -Fq 'testsPassed' "$INTEL"
          grep -Fq 'commitSha' "$INTEL"
          grep -Fq 'circuitBreakerTriggered' "$INTEL"
          if grep -Eq 'mockHeartbeat|fakeActivity|simulatedActivity[[:space:]]*=|mockAgentTelemetry|fakeAgentTelemetry' "$FILE"; then
            echo 'Synthetic telemetry implementation found in radar UI' >&2
            exit 1
          fi
          echo 'radar_productivity_contract=PASS'

      - name: Productivity intelligence unit tests
        run: bun test backend/services/ivx-autonomous-productivity-intelligence.test.ts

      - name: Certificate summary
        run: |
          echo 'IVX Live AI Radar 112 + productivity intelligence: source gate PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Telemetry source: durable/runtime ledger; 1-second heartbeat UI; verified-net and waste accounting; repeated SHA/error circuit breaker; synthetic telemetry prohibited.' >> "$GITHUB_STEP_SUMMARY"
