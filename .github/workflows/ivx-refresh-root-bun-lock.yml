name: IVX Refresh Root Bun Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-refresh-root-bun-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Regenerate root lockfile from committed manifests
        run: bun install --lockfile-only
      - name: Verify regenerated lockfile is frozen-clean
        run: bun install --frozen-lockfile
      - name: Commit regenerated lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo 'bun.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'chore: refresh root bun lock for Bun 1.3.9'
          git push origin HEAD:main
