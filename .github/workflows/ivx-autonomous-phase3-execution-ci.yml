name: IVX Autonomous Phase 3 Execution QA CI

on:
  push:
    branches: [main, 'fix/**']
    paths:
      - 'backend/scripts/ivx-phase3-execution-cert.ts'
      - 'backend/services/ivx-agent-runtime.ts'
      - 'backend/services/ivx-agent-real-tools.ts'
      - 'backend/services/ivx-agent-persistence.ts'
      - 'backend/services/ivx-agent-least-privilege.ts'
      - 'backend/supabase/migrations/20260820_phase3_autonomous_durable_execution_store.sql'
      - '.github/workflows/ivx-autonomous-phase3-execution-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/scripts/ivx-phase3-execution-cert.ts'
      - 'backend/services/ivx-agent-runtime.ts'
      - 'backend/services/ivx-agent-real-tools.ts'
      - 'backend/services/ivx-agent-persistence.ts'
      - 'backend/services/ivx-agent-least-privilege.ts'
      - 'backend/supabase/migrations/20260820_phase3_autonomous_durable_execution_store.sql'
      - '.github/workflows/ivx-autonomous-phase3-execution-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  phase3-execution-qa:
    name: Phase 3 Autonomous Execution + QA Engine — HARD GATE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      IVX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript — HARD GATE
        run: |
          set -euo pipefail
          cd backend
          bunx tsc --noEmit
          echo 'phase3_typescript=PASS'

      - name: Phase 1 governance regression — HARD GATE
        run: |
          set -euo pipefail
          node --test scripts/__tests__/ivx-autonomous-governance.test.mjs
          echo 'phase3_phase1_regression=PASS'

      - name: Phase 2 least-privilege regression — HARD GATE
        run: |
          set -euo pipefail
          bun test backend/__tests__/ivx-agent-least-privilege.test.ts --reporter=dots
          echo 'phase3_phase2_regression=PASS'

      - name: Supabase persistence binding — HARD GATE
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          DB_URL="${SUPABASE_URL:-${EXPO_PUBLIC_SUPABASE_URL:-}}"
          test -n "$DB_URL"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          echo "PHASE3_DB_URL=${DB_URL%/}" >> "$GITHUB_ENV"
          echo 'phase3_supabase_binding=PASS'

      - name: Full runtime execution + negative controls — HARD GATE
        run: |
          set -euo pipefail
          bun backend/scripts/ivx-phase3-execution-cert.ts
          cert='qa/evidence/autonomous/phase3-autonomous-execution-ci.json'
          jq -e '.ok == true' "$cert" >/dev/null
          jq -e '.runtimePath == "executeAgentRun"' "$cert" >/dev/null
          jq -e '.representativeExecutions == .representativeExecutionPass' "$cert" >/dev/null
          jq -e '.negativeControls == .negativeControlsPass' "$cert" >/dev/null
          jq -e '.staticAuditChecks == .staticAuditPass' "$cert" >/dev/null
          jq -e '.simulatedRuns == 0 and .realFundsMoved == false' "$cert" >/dev/null
          echo 'phase3_full_runtime_execution=PASS'

      - name: Fail-closed provenance contract — HARD GATE
        run: |
          set -euo pipefail
          cert='qa/evidence/autonomous/phase3-autonomous-execution-ci.json'
          jq -e '[.positiveExecutions[] | select(.finalStatus != "SUCCESS")] | length == 0' "$cert" >/dev/null
          jq -e '[.positiveExecutions[] | select((.runRecordId == null) or (.toolResultId == null) or (.sourceReference == null) or (.evidenceSha256 == null))] | length == 0' "$cert" >/dev/null
          jq -e '[.positiveExecutions[] | select(.runtimeCommitSha != .sourceSha)] | length == 0' "$cert" >/dev/null
          jq -e '[.positiveExecutions[] | select(.simulated != false)] | length == 0' "$cert" >/dev/null
          jq -e '[.negativeTests[] | select(.passed != true)] | length == 0' "$cert" >/dev/null
          echo 'phase3_fail_closed_provenance=PASS'

      - name: Durable Supabase execution persistence — HARD GATE
        shell: bash
        run: |
          set -euo pipefail
          cert='qa/evidence/autonomous/phase3-autonomous-execution-ci.json'
          expected=$(jq '.representativeExecutions' "$cert")
          encoded_run_id=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['GITHUB_RUN_ID'], safe=''))
          PY
          )
          url="${PHASE3_DB_URL}/rest/v1/ivx_agent_executions?run_id=eq.${encoded_run_id}&select=task_id,run_id,agent_id,agent_number,final_status,real_tool_used,tool_result_id,source_reference,evidence_sha256,simulated,started_at,finished_at"
          curl -fsS --max-time 30 "$url" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Accept: application/json' \
            -o /tmp/phase3-persisted.json
          jq -e --argjson expected "$expected" 'length >= $expected' /tmp/phase3-persisted.json >/dev/null
          jq -e '[.[] | select(.final_status == "completed" and .real_tool_used == true and .simulated == false and (.tool_result_id|type=="string") and (.tool_result_id|length>0) and (.source_reference|type=="string") and (.source_reference|length>0) and (.evidence_sha256|type=="string") and (.evidence_sha256|length==64) and (.started_at|type=="string") and (.finished_at|type=="string"))] | length >= 8' /tmp/phase3-persisted.json >/dev/null
          jq '{persistedRows:length, completedRealRows:([.[] | select(.final_status == "completed" and .real_tool_used == true and .simulated == false)] | length), taskIds:[.[].task_id]}' /tmp/phase3-persisted.json > qa/evidence/autonomous/phase3-durable-persistence-ci.json
          echo 'phase3_durable_persistence=PASS'

      - name: Upload Phase 3 certificate evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-autonomous-execution-ci-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            qa/evidence/autonomous/phase3-autonomous-execution-ci.json
            qa/evidence/autonomous/phase3-durable-persistence-ci.json
          if-no-files-found: error
