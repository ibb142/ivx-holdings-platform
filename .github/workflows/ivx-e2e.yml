name: IVX E2E Acceptance Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript typecheck — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install deps (root + expo)
        run: |
          bun install --frozen-lockfile
          bun install --cwd expo --frozen-lockfile
      - name: Typecheck (root) — HARD GATE
        run: |
          set -euo pipefail
          bunx tsc --noEmit
          echo 'root_typecheck=PASS'
      - name: Typecheck (expo) — HARD GATE
        run: |
          set -euo pipefail
          cd expo && bunx tsc --noEmit
          echo 'expo_typecheck=PASS'
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  lint:
    name: Lint — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: cd expo && bun install --frozen-lockfile
      - name: Lint — HARD GATE
        run: |
          set -euo pipefail
          cd expo && bun run lint
          echo 'lint=PASS'

  e2e-playwright:
    name: Playwright E2E (web surface) — HARD GATE
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: cd expo && bun install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: expo
        run: bunx playwright install --with-deps chromium
      - name: Start branch-local landing for PR validation
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory expo/ivxholding-landing > "$RUNNER_TEMP/ivx-landing.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ivx-landing.log" || true
          exit 1
      - name: Validate changed landing flow against PR code — HARD GATE
        if: github.event_name == 'pull_request'
        working-directory: expo
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          bunx playwright test __tests__/e2e/ivx-forgot-password.spec.ts --config=playwright.config.ts
          echo 'playwright_pr_changed_surface=PASS'
      - name: Keep production public smoke green on PR — HARD GATE
        if: github.event_name == 'pull_request'
        working-directory: expo
        env:
          E2E_BASE_URL: https://ivxholding.com
        run: |
          set -euo pipefail
          bunx playwright test __tests__/e2e/ivx-owner-ai-smoke.spec.ts --config=playwright.config.ts
          echo 'playwright_pr_production_smoke=PASS'
      - name: Run full Playwright against production after merge — HARD GATE
        if: github.event_name != 'pull_request'
        working-directory: expo
        env:
          E2E_BASE_URL: https://ivxholding.com
        run: |
          set -euo pipefail
          bunx playwright test --config=playwright.config.ts
          echo 'playwright_production=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: expo/playwright-report

  e2e-maestro:
    name: Maestro E2E (mobile surface) — HARD GATE
    runs-on: macos-latest
    needs: [typecheck]
    timeout-minutes: 38
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: cd expo && bun install --frozen-lockfile

      - name: Select and boot deterministic iOS simulator
        timeout-minutes: 3
        run: |
          set -euo pipefail
          xcrun simctl list devices available > "$RUNNER_TEMP/ivx-simulators.txt"
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json'], text=True))
          for devices in data.get('devices', {}).values():
              for d in devices:
                  if d.get('isAvailable') and str(d.get('name','')).startswith('iPhone'):
                      print(d['udid'])
                      raise SystemExit(0)
          raise SystemExit(1)
          PY
          )
          test -n "$UDID"
          echo "IVX_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          echo "simulator_udid=$UDID state=Booted"

      - name: Generate iOS native project
        working-directory: expo
        timeout-minutes: 8
        env:
          EXPO_PUBLIC_SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf ios
          bunx expo prebuild --platform ios --no-install
          cd ios
          pod install --silent
          echo 'ios_prebuild=PASS'

      - name: Build self-contained iOS simulator app — HARD GATE
        working-directory: expo
        timeout-minutes: 18
        env:
          EXPO_PUBLIC_SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEMES_JSON=$(xcodebuild -workspace "$WORKSPACE" -list -json)
          SCHEME=$(printf '%s' "$SCHEMES_JSON" | python3 -c 'import json,sys,pathlib; d=json.load(sys.stdin); schemes=d["workspace"]["schemes"]; workspace=pathlib.Path(sys.argv[1]).stem; preferred=[workspace,"IVXHoldings"]; print(next((s for s in preferred if s in schemes), next((s for s in schemes if not s.startswith(("Pods-","EX","React","Expo","hermes","RCT","RN","Yoga"))), "")))' "$WORKSPACE")
          test -n "$SCHEME"
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=$IVX_SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/ivx-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/ivx-xcodebuild.log"
          APP=$(find "$RUNNER_TEMP/ivx-derived/Build/Products/Release-iphonesimulator" -maxdepth 2 -type d -name '*.app' -print -quit)
          test -n "$APP"
          echo "IVX_IOS_APP=$APP" >> "$GITHUB_ENV"
          echo 'ios_build=PASS'

      - name: Install and launch IVX app — HARD GATE
        timeout-minutes: 3
        run: |
          set -euo pipefail
          xcrun simctl install "$IVX_SIMULATOR_UDID" "$IVX_IOS_APP"
          xcrun simctl launch "$IVX_SIMULATOR_UDID" com.ivxholdings.app
          sleep 8
          xcrun simctl io "$IVX_SIMULATOR_UDID" screenshot maestro-launch.png
          echo 'ios_install_launch=PASS'

      - name: Install Maestro
        timeout-minutes: 3
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          ~/.maestro/bin/maestro --version
          echo 'maestro_install=PASS'

      - name: Run Maestro launch smoke test — HARD GATE
        timeout-minutes: 5
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          set -euo pipefail
          ~/.maestro/bin/maestro test expo/.maestro/ivx-app-launch.yaml --format junit --output maestro-report.xml
          echo 'maestro_test=PASS'

      - name: Capture Maestro diagnostics
        if: failure()
        run: |
          set +e
          cp "$RUNNER_TEMP/ivx-simulators.txt" maestro-simulators.txt 2>/dev/null || xcrun simctl list devices > maestro-simulators.txt
          cp "$RUNNER_TEMP/ivx-xcodebuild.log" maestro-xcodebuild.log 2>/dev/null || true
          xcrun simctl io "$IVX_SIMULATOR_UDID" screenshot maestro-failure.png 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report-${{ github.sha }}
          path: |
            maestro-report.xml
            maestro-launch.png
            maestro-simulators.txt
            maestro-xcodebuild.log
            maestro-failure.png
          if-no-files-found: warn
