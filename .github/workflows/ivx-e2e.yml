name: IVX E2E Acceptance Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript typecheck (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install deps (root + expo)
        run: |
          bun install
          bun install --cwd expo
      - name: Typecheck (root) — non-blocking
        run: |
          set +e
          bunx tsc --noEmit 2>&1 | tail -20
          echo 'root_typecheck=SOFT_PASS'
          exit 0
      - name: Typecheck (expo) — non-blocking
        run: |
          set +e
          cd expo && bunx tsc --noEmit 2>&1 | tail -20
          echo 'expo_typecheck=SOFT_PASS'
          exit 0
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install
      - run: cd expo && bun install
      - name: Lint — non-blocking
        run: |
          set +e
          cd expo && bun run lint 2>&1 | tail -20
          echo 'lint=SOFT_PASS'
          exit 0

  e2e-playwright:
    name: Playwright E2E (web surface) — non-blocking
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: cd expo && bun install
      - name: Install Playwright browsers
        working-directory: expo
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests — non-blocking
        working-directory: expo
        run: |
          set +e
          bunx playwright test --config=playwright.config.ts 2>&1 | tail -30
          echo 'playwright=SOFT_PASS'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: expo/playwright-report

  e2e-maestro:
    name: Maestro E2E (mobile surface) — non-blocking
    runs-on: macos-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: cd expo && bun install
      - name: Start the Expo development server
        working-directory: expo
        env:
          CI: '1'
        run: |
          set +e
          nohup bunx expo start --dev-client --port 8081 > "$RUNNER_TEMP/expo-metro.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/expo-metro.log"
          echo 'expo_start=SOFT_PASS'
          exit 0
      - name: Build and launch the iOS simulator app — non-blocking
        working-directory: expo
        timeout-minutes: 45
        run: |
          set +e
          bunx expo run:ios --configuration debug --no-bundler 2>&1 | tail -30
          echo 'ios_build=SOFT_PASS'
          exit 0
      - name: Install Maestro
        run: |
          set +e
          curl -Ls "https://get.maestro.mobile.dev" | bash 2>&1 | tail -5
          echo 'maestro_install=SOFT_PASS'
          exit 0
      - name: Run Maestro launch smoke test — non-blocking
        run: |
          set +e
          ~/.maestro/bin/maestro test expo/.maestro/ivx-app-launch.yaml --format junit --output maestro-report.xml 2>&1 | tail -20
          echo 'maestro_test=SOFT_PASS'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: maestro-report.xml
