name: IVX E2E Acceptance Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ivx-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-impact:
    name: Mobile impact classifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mobile: ${{ steps.detect.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          # The PR merge commit and its two parents contain both exact trees.
          fetch-depth: 2
      - name: Verify shallow PR classification
        run: node --test qa/ivx-mobile-impact-shallow.test.mjs
      - name: Detect mobile-impacting changes
        id: detect
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo 'mobile=true' >> "$GITHUB_OUTPUT"
            echo 'MOBILE_IMPACT=FULL_MAIN_GATE'
            exit 0
          fi
          # Classify the exact tested merge. GitHub can advance its first
          # parent while the event still names the PR's earlier base.
          declared_base="${{ github.event.pull_request.base.sha }}"
          declared_head="${{ github.event.pull_request.head.sha }}"
          [[ "$declared_base" =~ ^[0-9a-f]{40}$ && "$declared_head" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t merge_parents < <(git cat-file -p HEAD | awk '/^parent / { print $2 }')
          test "${#merge_parents[@]}" = 2 || {
            echo '::error::Expected the two-parent PR merge commit.'
            exit 1
          }
          base="${merge_parents[0]}"
          test "$declared_head" = "${merge_parents[1]}" || {
            echo '::error::PR head does not match the tested merge commit.'
            exit 1
          }
          if [ "$declared_base" != "$base" ]; then
            # A bounded history fetch proves an ordinary base advance. An
            # unrelated/replaced base still fails and cannot suppress mobile QA.
            if ! git merge-base --is-ancestor "$declared_base" "$base" 2>/dev/null; then
              git fetch --no-tags --depth=64 origin "$base"
            fi
            git merge-base --is-ancestor "$declared_base" "$base" || {
              echo '::error::PR base is not an ancestor of the tested merge base.'
              exit 1
            }
            echo "PR_BASE_ADVANCED=$declared_base..$base"
          fi
          git diff --no-renames --name-only "$base" HEAD > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"
          mobile=false
          while IFS= read -r path; do
            case "$path" in
              # The static public Landing is a web surface. Its own Chromium
              # gate runs below; it must not boot an unrelated iOS simulator.
              expo/ivxholding-landing/*|qa/landing-*|.github/workflows/landing-*) ;;
              # Worker admission is part of the native chat handoff. Changes
              # to that backend path or this gate require the mobile test too.
              expo/*|backend/services/ivx-senior-developer-worker.ts|backend/ivx-shared-owner-lookup.test.ts|.github/workflows/ivx-e2e.yml|package.json|bun.lock|bun.lockb|tsconfig.json) mobile=true; break ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "MOBILE_IMPACT=$mobile"
  typecheck:
    name: TypeScript typecheck — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - name: Install deps (root + expo)
        run: |
          bun install --frozen-lockfile
          bun install --cwd expo --frozen-lockfile
      - name: Typecheck (root) — HARD GATE
        run: bunx tsc --noEmit
      - name: Typecheck (expo) — HARD GATE
        run: cd expo && bunx tsc --noEmit
        env: { NODE_OPTIONS: --max-old-space-size=6144 }
  lint:
    name: Lint — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install --frozen-lockfile
      - run: cd expo && bun install --frozen-lockfile
      - run: cd expo && bun run lint
  e2e-playwright:
    name: Playwright E2E (web surface) — HARD GATE
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: cd expo && bun install --frozen-lockfile
      - name: Isolate Playwright dependencies from the unrelated Chrome APT feed
        run: |
          # Playwright downloads its own Chromium. Keep Ubuntu dependency checks
          # intact while excluding the runner's independently updated Chrome feed.
          sudo python3 - <<'PY'
          from pathlib import Path
          def chrome_feed(text):
              return "dl.google.com/linux/chrome" in text
          for path in Path("/etc/apt/sources.list.d").glob("*"):
              if path.suffix == ".list":
                  lines = path.read_text().splitlines(keepends=True)
                  path.write_text("".join("# Playwright: unrelated Chrome feed disabled " + line if chrome_feed(line) and not line.lstrip().startswith("#") else line for line in lines))
              elif path.suffix == ".sources":
                  blocks = path.read_text().split("\n\n")
                  path.write_text("\n\n".join(block for block in blocks if not chrome_feed(block)))
          PY
      - name: Install Playwright browsers
        working-directory: expo
        run: |
          set -euo pipefail
          # The hosted runner's optional Google Chrome APT source is not needed
          # by Playwright and can intermittently publish mismatched indexes.
          # Disable only that source while Playwright installs Ubuntu libraries.
          chrome_source=/etc/apt/sources.list.d/google-chrome.list
          disabled_source="$RUNNER_TEMP/google-chrome.list.ivx-disabled"
          restore_chrome_source() {
            if [ -f "$disabled_source" ]; then
              sudo mv "$disabled_source" "$chrome_source"
            fi
          }
          trap restore_chrome_source EXIT
          if [ -f "$chrome_source" ]; then
            sudo mv "$chrome_source" "$disabled_source"
          fi
          for attempt in 1 2 3; do
            if bunx playwright install --with-deps chromium; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Start branch-local landing for PR validation
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory expo/ivxholding-landing > "$RUNNER_TEMP/ivx-landing.log" 2>&1 &
          for attempt in {1..20}; do if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Validate changed landing flow against PR code — HARD GATE
        if: github.event_name == 'pull_request'
        working-directory: expo
        env: { E2E_BASE_URL: http://127.0.0.1:4173 }
        run: bunx playwright test __tests__/e2e/ivx-forgot-password.spec.ts --config=playwright.config.ts
      - name: Keep production public smoke green on PR — HARD GATE
        if: github.event_name == 'pull_request'
        working-directory: expo
        env: { E2E_BASE_URL: https://ivxholding.com }
        run: bunx playwright test __tests__/e2e/ivx-owner-ai-smoke.spec.ts --config=playwright.config.ts
      - name: Run full Playwright against production after merge — HARD GATE
        if: github.event_name != 'pull_request'
        working-directory: expo
        env: { E2E_BASE_URL: https://ivxholding.com }
        run: bunx playwright test --config=playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: expo/playwright-report }
  e2e-maestro:
    name: Maestro E2E (mobile surface) — HARD GATE
    if: ${{ github.event_name != 'pull_request' || needs.mobile-impact.outputs.mobile == 'true' }}
    runs-on: macos-latest
    needs: [typecheck, mobile-impact]
    timeout-minutes: 50
    env: { CI: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: cd expo && bun install --frozen-lockfile
      - name: Select and boot deterministic iOS simulator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json'],text=True))
          for devices in data.get('devices',{}).values():
            for d in devices:
              if d.get('isAvailable') and str(d.get('name','')).startswith('iPhone'):
                print(d['udid']); raise SystemExit(0)
          raise SystemExit(1)
          PY
          )
          echo "IVX_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Generate iOS native project
        working-directory: expo
        timeout-minutes: 8
        env:
          EXPO_PUBLIC_SOURCE_COMMIT_SHA: '${{ github.sha }}'
          # React Native 0.81 supports this mirror override. repo1.maven.org
          # returned 404 for the published dependency tarball in this run,
          # while the canonical Maven endpoint redirects to RN's artifact CDN.
          ENTERPRISE_REPOSITORY: https://repo.maven.apache.org/maven2
        run: |
          set -euo pipefail
          rm -rf ios
          bunx expo prebuild --platform ios --no-install
          cd ios
          for attempt in 1 2 3; do
            if pod install --silent; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Build self-contained iOS simulator app — HARD GATE
        working-directory: expo
        timeout-minutes: 32
        env: { EXPO_PUBLIC_SOURCE_COMMIT_SHA: '${{ github.sha }}' }
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEMES_JSON=$(xcodebuild -workspace "$WORKSPACE" -list -json)
          SCHEME=$(printf '%s' "$SCHEMES_JSON" | python3 -c 'import json,sys,pathlib; d=json.load(sys.stdin); s=d["workspace"]["schemes"]; w=pathlib.Path(sys.argv[1]).stem; print(next((x for x in [w,"IVXHoldings"] if x in s), s[0]))' "$WORKSPACE")
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination "id=$IVX_SIMULATOR_UDID" -derivedDataPath "$RUNNER_TEMP/ivx-derived" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP=$(find "$RUNNER_TEMP/ivx-derived/Build/Products/Release-iphonesimulator" -maxdepth 2 -type d -name '*.app' -print -quit)
          echo "IVX_IOS_APP=$APP" >> "$GITHUB_ENV"
      - name: Install and launch IVX app — HARD GATE
        run: |
          xcrun simctl install "$IVX_SIMULATOR_UDID" "$IVX_IOS_APP"
          xcrun simctl launch "$IVX_SIMULATOR_UDID" com.ivxholdings.app
          sleep 8
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Run Maestro launch smoke test — HARD GATE
        timeout-minutes: 15
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
          # XCTest driver compilation on a cold macOS runner can exceed the
          # default startup budget. UI assertions still remain hard failures.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
          MAESTRO_DISABLE_UPDATE_CHECK: 'true'
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$IVX_SIMULATOR_UDID" -b
          ~/.maestro/bin/maestro --device "$IVX_SIMULATOR_UDID" test expo/.maestro/ivx-app-launch.yaml --format junit --output maestro-report.xml 2>&1 | tee maestro-startup.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report-${{ github.sha }}
          path: |
            maestro-report.xml
            maestro-startup.log
          if-no-files-found: warn
