name: IVX E2E Acceptance Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript typecheck — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install deps (root + expo)
        run: |
          bun install --frozen-lockfile
          bun install --cwd expo --frozen-lockfile
      - name: Typecheck (root) — HARD GATE
        run: |
          set -euo pipefail
          bunx tsc --noEmit
          echo 'root_typecheck=PASS'
      - name: Typecheck (expo) — HARD GATE
        run: |
          set -euo pipefail
          cd expo && bunx tsc --noEmit
          echo 'expo_typecheck=PASS'
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  lint:
    name: Lint — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: cd expo && bun install --frozen-lockfile
      - name: Lint — HARD GATE
        run: |
          set -euo pipefail
          cd expo && bun run lint
          echo 'lint=PASS'

  e2e-playwright:
    name: Playwright E2E (web surface) — HARD GATE
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: cd expo && bun install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: expo
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests — HARD GATE
        working-directory: expo
        run: |
          set -euo pipefail
          bunx playwright test --config=playwright.config.ts
          echo 'playwright=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: expo/playwright-report

  e2e-maestro:
    name: Maestro E2E (mobile surface) — HARD GATE
    runs-on: macos-latest
    needs: [typecheck]
    env:
      EXPO_PUBLIC_IVX_OPEN_ACCESS_MODE: 'false'
      EXPO_PUBLIC_IVX_TEST_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: cd expo && bun install --frozen-lockfile
      - name: Build and launch deterministic iOS Release app — HARD GATE
        working-directory: expo
        timeout-minutes: 45
        run: |
          set -euo pipefail
          bunx expo run:ios --configuration Release --no-bundler 2>&1 | tee "$RUNNER_TEMP/maestro-metro.log"
          echo 'ios_build=PASS'
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo 'maestro_install=PASS'
      - name: Capture pre-test evidence
        if: always()
        run: |
          xcrun simctl io booted screenshot screenshot-01-pre-test.png || true
          xcrun simctl spawn booted log show --last 10m > maestro-logcat.txt 2>&1 || true
      - name: Run Maestro launch smoke test — HARD GATE
        run: |
          set -euo pipefail
          ~/.maestro/bin/maestro test expo/.maestro/ivx-app-launch.yaml --format junit --output maestro-report.xml 2>&1 | tee maestro-test.log
          if grep -q '<failure' maestro-report.xml; then
            echo 'Maestro JUnit contains a failure'
            exit 1
          fi
          echo 'maestro_test=PASS'
      - name: Capture post-test evidence
        if: always()
        run: |
          xcrun simctl io booted screenshot screenshot-02-post-test.png || true
          xcrun simctl spawn booted log show --last 10m > maestro-logcat.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-evidence
          path: |
            maestro-report.xml
            maestro-test.log
            maestro-logcat.txt
            screenshot-01-pre-test.png
            screenshot-02-post-test.png
            ${{ runner.temp }}/maestro-metro.log
