name: IVX E2E Acceptance Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript typecheck — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install deps (root + expo)
        run: |
          bun install --frozen-lockfile
          bun install --cwd expo --frozen-lockfile
      - name: Typecheck (root) — HARD GATE
        run: |
          set -euo pipefail
          bunx tsc --noEmit
          echo 'root_typecheck=PASS'
      - name: Typecheck (expo) — HARD GATE
        run: |
          set -euo pipefail
          cd expo && bunx tsc --noEmit
          echo 'expo_typecheck=PASS'
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  lint:
    name: Lint — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: cd expo && bun install --frozen-lockfile
      - name: Lint — HARD GATE
        run: |
          set -euo pipefail
          cd expo && bun run lint
          echo 'lint=PASS'

  e2e-playwright:
    name: Playwright E2E (web surface) — HARD GATE
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: cd expo && bun install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: expo
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests — HARD GATE
        working-directory: expo
        run: |
          set -euo pipefail
          bunx playwright test --config=playwright.config.ts
          echo 'playwright=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: expo/playwright-report

  e2e-maestro:
    name: Maestro E2E (mobile surface) — HARD GATE
    runs-on: macos-latest
    needs: [typecheck]
    env:
      # Root-cause fix: open-access mode defaults ON in development runtime
      # (shared/ivx/access-control.ts DEFAULT_OPEN_ACCESS_MODE_ENABLED = true),
      # which routes the app straight to /(tabs)/home so the login screen never
      # renders and the "Sign In" assertion can never pass. Pin it OFF for the
      # E2E gate regardless of build configuration.
      EXPO_PUBLIC_IVX_OPEN_ACCESS_MODE: 'false'
      EXPO_PUBLIC_IVX_TEST_MODE: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: cd expo && bun install --frozen-lockfile
      # Release configuration embeds the JS bundle into the app at build time:
      # no Metro at runtime, no Expo dev launcher (expo-dev-client is not
      # installed), no bundle-URL resolution. __DEV__ is false in Release, so
      # the app runs in production runtime and shows the real cold-launch
      # login path the flow asserts against.
      - name: Build standalone iOS simulator app (Release, embedded bundle) — HARD GATE
        working-directory: expo
        timeout-minutes: 45
        run: |
          set -o pipefail
          bunx expo run:ios --configuration Release --no-bundler 2>&1 | tee maestro-metro.log
          echo 'ios_build=PASS'
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo 'maestro_install=PASS'
      - name: Capture pre-test diagnostics
        run: |
          xcrun simctl io booted screenshot screenshot-01-pre-test.png || true
          xcrun simctl spawn booted log show --last 5m > maestro-logcat.txt 2>&1 || true
          echo "=== Installed app ==="
          xcrun simctl listapps booted | grep -A1 ivxholdings || true
      - name: Run Maestro launch smoke test — HARD GATE
        run: |
          set -o pipefail
          ~/.maestro/bin/maestro test expo/.maestro/ivx-app-launch.yaml --format junit --output maestro-report.xml 2>&1 | tee maestro-test.log
          MAESTRO_EXIT=${PIPESTATUS[0]}
          echo "=== Maestro exit code: $MAESTRO_EXIT ==="
          if [ "$MAESTRO_EXIT" -ne 0 ]; then
            echo '::error::Maestro flow failed'
            exit 1
          fi
          if grep -q '<failure' maestro-report.xml 2>/dev/null; then
            echo '::error::Maestro JUnit report contains failures'
            exit 1
          fi
          echo 'maestro_test=PASS'
      - name: Capture post-test diagnostics
        if: always()
        run: |
          xcrun simctl io booted screenshot screenshot-02-post-test.png || true
          xcrun simctl spawn booted log show --last 5m > maestro-logcat.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            maestro-test.log
            maestro-metro.log
            maestro-logcat.txt
            screenshot-*.png
