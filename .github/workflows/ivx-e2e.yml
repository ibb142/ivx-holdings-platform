name: IVX E2E Acceptance Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript typecheck — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install deps (root + expo)
        run: |
          bun install --frozen-lockfile
          bun install --cwd expo --frozen-lockfile
      - name: Typecheck (root) — HARD GATE
        run: |
          set -euo pipefail
          bunx tsc --noEmit
          echo 'root_typecheck=PASS'
      - name: Typecheck (expo) — HARD GATE
        run: |
          set -euo pipefail
          cd expo && bunx tsc --noEmit
          echo 'expo_typecheck=PASS'
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  lint:
    name: Lint — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: cd expo && bun install --frozen-lockfile
      - name: Lint — HARD GATE
        run: |
          set -euo pipefail
          cd expo && bun run lint
          echo 'lint=PASS'

  live-landing-critical:
    name: Landing register/sign-in/wire live — HARD GATE
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Live landing + member auth + wire — HARD GATE
        run: |
          set -euo pipefail
          node scripts/ivx-live-qa.mjs --json | tee live-landing-qa.json
          node -e "const f=require('fs');const r=JSON.parse(f.readFileSync('live-landing-qa.json','utf8'));if(r.certified!==true||r.failed!==0)process.exit(1);console.log('landing_live_critical=PASS total='+r.total)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-landing-qa
          path: live-landing-qa.json

  e2e-playwright:
    name: Playwright E2E (web surface) — HARD GATE
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: cd expo && bun install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: expo
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests — HARD GATE
        working-directory: expo
        run: |
          set -euo pipefail
          bunx playwright test --config=playwright.config.ts
          echo 'playwright=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: expo/playwright-report

  e2e-maestro:
    name: Maestro E2E (mobile surface) — HARD GATE
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cd expo && bun install --frozen-lockfile
      - name: Start the Expo development server
        working-directory: expo
        env:
          CI: '1'
        run: |
          set -euo pipefail
          nohup bunx expo start --dev-client --port 8081 > "$RUNNER_TEMP/expo-metro.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
              echo 'metro=PASS'
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/expo-metro.log"
          echo 'Expo dev server failed to start'
          exit 1
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          echo 'maestro_install=PASS'
      - name: Build, launch and test Android app — HARD GATE
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            cd expo
            bunx expo run:android --no-bundler
            cd ..
            maestro test expo/.maestro/ivx-app-launch.yaml --format junit --output maestro-report.xml
            echo 'android_build=PASS'
            echo 'maestro_test=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: maestro-report.xml
