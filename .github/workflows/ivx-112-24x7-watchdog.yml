name: IVX 112 24x7 Intelligent Fleet Watchdog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-112-24x7-watchdog.yml'
      - 'qa/autonomous/landing-10of10-mission.json'
  workflow_run:
    workflows:
      - 'IVX Owner Sign In + Home Android Certificate'
      - 'IVX Dashboard + IA Chat End-to-End Certificate'
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ivx-112-24x7-intelligent-fleet-cycle
  cancel-in-progress: true

env:
  API_BASE: https://api.ivxholding.com
  PROGRAM_ID: IVX-INTELLIGENT-112-2026-08-23
  IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
  IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
  IVX_OWNER_TOKEN: ${{ secrets.IVX_OWNER_TOKEN }}
  GH_TOKEN: ${{ github.token }}

jobs:
  intelligent-cycle:
    name: Detect P0 and execute evidence-bearing 112-agent audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve owner/system binding without exposing values
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for name in IVX_AI_SYSTEM_SECRET IVX_SYSTEM_SECRET IVX_OWNER_TOKEN; do
            value="${!name:-}"
            if [ -n "$value" ]; then echo "::add-mask::$value"; found=$((found + 1)); fi
          done
          test "$found" -gt 0
          echo "AUTH_CANDIDATE_COUNT=$found" >> "$GITHUB_ENV"

      - name: Verify production registry before expensive fleet work
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 20 "${API_BASE}/version" -o /tmp/version.json
          curl -fsS --retry 3 --retry-delay 2 --max-time 20 "${API_BASE}/health" -o /tmp/health.json
          curl -fsS --retry 3 --retry-delay 2 --max-time 20 "${API_BASE}/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/health.json)" = true
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          LIVE_SHA=$(jq -r '.commit // .version.commit // empty' /tmp/version.json)
          test -n "$LIVE_SHA"
          echo "LIVE_SHA=$LIVE_SHA" >> "$GITHUB_ENV"

      - name: Run bounded real fleet evidence sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence/autonomous /tmp/ivx112
          jq -r '.agents[] | [.agentNumber,.agentId] | @tsv' /tmp/agents.json > /tmp/agents.tsv
          export API_BASE LIVE_SHA IVX_AI_SYSTEM_SECRET IVX_SYSTEM_SECRET IVX_OWNER_TOKEN
          run_one() {
            number="$1"; agent_id="$2"; http=401; ok=false
            task_id="watchdog-${GITHUB_RUN_ID}-${number}"
            for candidate_name in IVX_AI_SYSTEM_SECRET IVX_SYSTEM_SECRET IVX_OWNER_TOKEN; do
              candidate="${!candidate_name:-}"; [ -n "$candidate" ] || continue
              body=$(jq -nc --arg token "$candidate" --arg sourceSha "$LIVE_SHA" --arg taskId "$task_id" '{taskType:"audit",ownerApprovalToken:$token,payload:{sourceSha:$sourceSha,__taskId:$taskId,__workflow:"IVX 112 24x7 Intelligent Fleet Watchdog",__toolId:"code_search",__toolParams:{pattern:"executeAgentRun",scope:"backend"},realExecutionOnly:true,simulatedSuccessAllowed:false}}')
              http=$(curl -sS --max-time 60 -o "/tmp/ivx112/${number}.response.json" -w '%{http_code}' -X POST "${API_BASE}/api/ivx/agents/${agent_id}/run" -H 'Content-Type: application/json' -H "x-ivx-owner-key: ${candidate}" --data "$body" || true)
              [ "$http" != 401 ] && break
            done
            [ "$http" = 200 ] && ok=$(jq -r '.ok // false' "/tmp/ivx112/${number}.response.json")
            jq -n --argjson n "$number" --arg id "$agent_id" --arg http "$http" --argjson ok "$ok" '{agentNumber:$n,agentId:$id,httpStatus:$http,ok:$ok}' > "/tmp/ivx112/${number}.json"
          }
          export -f run_one
          while IFS=$'\t' read -r number agent_id; do printf '%s\t%s\n' "$number" "$agent_id"; done < /tmp/agents.tsv | xargs -P 16 -n 2 bash -c 'run_one "$0" "$1"'
          jq -s 'sort_by(.agentNumber)' /tmp/ivx112/[0-9]*.json > qa/evidence/autonomous/ivx-112-watchdog-results.json
          total=$(jq 'length' qa/evidence/autonomous/ivx-112-watchdog-results.json)
          success=$(jq '[.[] | select(.ok == true)] | length' qa/evidence/autonomous/ivx-112-watchdog-results.json)
          echo "total=$total success=$success"
          test "$total" = 112
          test "$success" = 112

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivx-112-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/evidence/autonomous/ivx-112-watchdog-results.json
          if-no-files-found: warn
