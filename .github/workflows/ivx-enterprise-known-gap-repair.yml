name: IVX Enterprise Known-Gap Repair

on:
  push:
    branches: [main]
    paths:
      - 'qa/ivx-enterprise-known-gap-repair.mjs'
      - '.github/workflows/ivx-enterprise-known-gap-repair.yml'
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ivx-enterprise-known-gap-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Apply deterministic Quality Firewall repairs
        run: node qa/ivx-enterprise-known-gap-repair.mjs

      - name: Verify structural gates now pass
        run: node qa/ivx-enterprise-structural-gates.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Backend typecheck
        run: bunx tsc --noEmit

      - name: Expo typecheck
        working-directory: expo
        run: bunx tsc --noEmit

      - name: Focused chat and worker regressions
        run: |
          bun test \
            backend/api/ivx-senior-developer-worker.test.ts \
            expo/__tests__/ivx-chat-turn-isolation.test.ts \
            expo/__tests__/chat-certificate-flow-regression.test.ts

      - name: Open evidence-backed repair PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IVX Autonomous Quality'
          git config user.email 'ivx-autonomous@users.noreply.github.com'
          git add \
            backend/services/ivx-owner-conversation-state.ts \
            expo/src/modules/ivx-owner-ai/services/ivxOwnerMemoryService.ts \
            qa/ivx-qa-runner.ts
          if git diff --cached --quiet; then
            echo 'KNOWN_GAPS_ALREADY_FIXED=true'
            exit 0
          fi
          branch="autonomous/enterprise-quality-repair-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m 'fix(quality): close stale-state and cross-room memory gaps'
          git push origin "$branch"
          url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title 'fix(quality): close confirmed enterprise P0/P1 gaps' \
            --body "Automated enterprise Quality Firewall repair from run ${GITHUB_RUN_ID}. Fixes terminal-action stale pointer, cross-room owner memory contamination, and fail-open QA SKIP behavior. Backend + Expo typecheck and focused chat/worker regressions passed before PR creation.")
          echo "REPAIR_PR=$url"
