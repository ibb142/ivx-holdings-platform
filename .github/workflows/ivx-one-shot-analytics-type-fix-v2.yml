name: IVX One Shot Analytics Type Fix V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-one-shot-analytics-type-fix-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch and publish branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/services/ivx-analytics-brain.ts')
          s = p.read_text()
          old = """  const sb = getSupabase();\n  const identifier = event.user_id ? { user_id: event.user_id } : { anonymous_id: event.anonymous_id };\n  if (!event.user_id && !event.anonymous_id) return;\n\n  // Try to fetch existing profile\n  const { data: existing } = await sb\n    .from('member_behavior_profiles')\n    .select('*')\n    .match(identifier as Record<string, string>)\n    .maybeSingle();"""
          new = """  const sb = getSupabase();\n  if (!event.user_id && !event.anonymous_id) return;\n  const identifier: Record<string, string> = event.user_id\n    ? { user_id: event.user_id }\n    : { anonymous_id: event.anonymous_id! };\n\n  // Try to fetch existing profile\n  const { data: existing } = await sb\n    .from('member_behavior_profiles')\n    .select('*')\n    .match(identifier)\n    .maybeSingle();"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'IVX Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b fix/analytics-strict-typing
          git add backend/services/ivx-analytics-brain.ts
          git diff --cached --check
          git commit -m 'fix: satisfy strict analytics profile identifier typing'
          git push --force origin HEAD:fix/analytics-strict-typing
