name: P0 Task Engine Supabase Stability Verification

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: p0-task-engine-supabase-stability-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify task-engine resilience policy
        run: bun test backend/services/ivx-owner-ai-task-queue.test.ts backend/services/ivx-autonomous-task-engine.test.ts

      - name: Verify TypeScript
        run: bunx tsc --noEmit
