name: P0 Task Engine Supabase Stability Hotfix

on:
  push:
    branches:
      - fix/p0-task-engine-supabase-stability-20260905
    paths:
      - .github/workflows/p0-task-engine-supabase-stability-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-task-engine-supabase-stability-hotfix
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-task-engine-supabase-stability-20260905
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Apply fail-closed + read-cache + timeout alignment
        shell: python {0}
        run: |
          from pathlib import Path

          task = Path('backend/services/ivx-autonomous-task-engine.ts')
          s = task.read_text()

          anchor = "let taskMutationTail: Promise<void> = Promise.resolve();\n"
          insert = """let taskMutationTail: Promise<void> = Promise.resolve();

// P0 2026-09-05: collapse concurrent truth/dispatcher reads onto a short-lived
// process-local snapshot. Writes refresh the cache only after durable persistence
// succeeds. Supabase failures remain fail-closed; we never manufacture an empty queue.
const TASK_READ_CACHE_TTL_MS = 1_500;
let taskReadCache: { value: Task[]; at: number } | null = null;
"""
          if 'TASK_READ_CACHE_TTL_MS' not in s:
              if anchor not in s:
                  raise SystemExit('task cache insertion anchor not found')
              s = s.replace(anchor, insert, 1)

          old_read = """async function readAllTasks(): Promise<Task[]> {
  if (isDurableStoreConfigured()) {
    try {
      const data = await readDurableJson<Task[]>(TASKS_KEY, []);
      return Array.isArray(data) ? data : [];
    } catch {
      return [];
    }
  }
"""
          new_read = """async function readAllTasks(): Promise<Task[]> {
  if (isDurableStoreConfigured()) {
    const now = Date.now();
    if (taskReadCache && now - taskReadCache.at <= TASK_READ_CACHE_TTL_MS) {
      return taskReadCache.value;
    }
    const data = await readDurableJson<Task[]>(TASKS_KEY, []);
    if (!Array.isArray(data)) {
      throw new Error('task_engine_durable_payload_not_array');
    }
    taskReadCache = { value: data, at: Date.now() };
    return data;
  }
"""
          if old_read in s:
              s = s.replace(old_read, new_read, 1)
          elif 'task_engine_durable_payload_not_array' not in s:
              raise SystemExit('readAllTasks fail-open block not found')

          old_write = """  if (isDurableStoreConfigured()) {
    await writeDurableJson(TASKS_KEY, tasks);
    return;
  }
"""
          new_write = """  if (isDurableStoreConfigured()) {
    await writeDurableJson(TASKS_KEY, tasks);
    taskReadCache = { value: tasks, at: Date.now() };
    return;
  }
"""
          if old_write in s:
              s = s.replace(old_write, new_write, 1)
          elif 'taskReadCache = { value: tasks' not in s:
              raise SystemExit('writeAllTasks durable block not found')

          task.write_text(s)

          truth = Path('backend/services/ivx-autonomous-truth-control.ts')
          t = truth.read_text()
          t = t.replace("ivx-autonomous-truth-control-2026-09-05-v11-owner-24x7", "ivx-autonomous-truth-control-2026-09-05-v12-supabase-stability")
          t = t.replace("export const IVX_AUTONOMOUS_TRUTH_DEPENDENCY_TIMEOUT_MS = 2_500;", "export const IVX_AUTONOMOUS_TRUTH_DEPENDENCY_TIMEOUT_MS = 12_000;")
          if 'IVX_AUTONOMOUS_TRUTH_DEPENDENCY_TIMEOUT_MS = 12_000' not in t:
              raise SystemExit('truth timeout replacement failed')
          truth.write_text(t)

      - name: Verify no task-engine fail-open empty queue remains
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('backend/services/ivx-autonomous-task-engine.ts').read_text()
          target = "const data = await readDurableJson<Task[]>(TASKS_KEY, []);\n      return Array.isArray(data) ? data : [];\n    } catch {\n      return [];"
          if target in s:
              raise SystemExit('FAIL: durable read still converts Supabase failure to []')
          assert 'task_engine_durable_payload_not_array' in s
          assert 'TASK_READ_CACHE_TTL_MS = 1_500' in s
          t = Path('backend/services/ivx-autonomous-truth-control.ts').read_text()
          assert 'IVX_AUTONOMOUS_TRUTH_DEPENDENCY_TIMEOUT_MS = 12_000' in t
          print('P0 static invariants PASS')
          PY

      - name: Install
        run: bun install --frozen-lockfile

      - name: Task-engine regression tests
        run: bun test backend/services/ivx-autonomous-task-engine.test.ts

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Commit verified patch
        run: |
          if git diff --quiet -- backend/services/ivx-autonomous-task-engine.ts backend/services/ivx-autonomous-truth-control.ts; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'IVX Autonomous P0 Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/services/ivx-autonomous-task-engine.ts backend/services/ivx-autonomous-truth-control.ts
          git commit -m 'fix(p0): fail closed and reduce Supabase task pressure [p0-stability-applied]'
          git push origin HEAD:fix/p0-task-engine-supabase-stability-20260905
