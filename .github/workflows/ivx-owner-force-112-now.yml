name: IVX Owner Force 112 Now
# Owner activation: 2026-09-06 13:45 ET - current-production hard start

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-owner-force-112-now.yml'
  workflow_dispatch: {}

concurrency:
  group: ivx-owner-force-112-now
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  API_BASE: https://api.ivxholding.com
  TARGET_AGENTS: '112'
  PARALLEL: '112'

jobs:
  owner-force-112:
    name: Owner command - Autonomous + all 112 IA work now
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve current production SHA
        id: prod
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS --max-time 20 -o /tmp/version.json -w '%{http_code}' "${API_BASE}/version" || true)
            if [ "$code" = 200 ]; then
              ok=$(jq -r '.ok // false' /tmp/version.json 2>/dev/null || echo false)
              sha=$(jq -r '.commit // .version.commit // empty' /tmp/version.json 2>/dev/null || true)
              if [ "$ok" = true ] && [ -n "$sha" ]; then
                echo "production_sha=$sha"
                echo "sha=$sha" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Unable to resolve current production SHA' >&2
          exit 1

      - name: Acquire GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(jq -r '.value // empty' <<<"$response")
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Give Autonomous the owner command
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          command='OWNER P0 COMMAND: Put all 112 IA to productive engineering work now. Audit GitHub and production end to end, QA unfinished work, assign concrete non-overlapping tasks, and keep every agent productively working. Do not count narrative, queued workflows, ALREADY_VERIFIED, no-op activity, or synthetic minutes as work. Each agent must return a real task id, positive productive minutes, and evidence. Never fabricate success.'
          body=$(jq -nc --arg task "$command" '{task:$task,conversationId:"owner-force-112-now-20260906",includeMission:true}')
          code=$(curl -sS --max-time 300 -o /tmp/autonomous.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
            --data "$body" \
            "${API_BASE}/api/ivx/autonomous-mode/run" || true)
          cat /tmp/autonomous.json 2>/dev/null || true
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/autonomous.json)" = true

      - name: Resume all agents and load exact registry
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/resume.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
            -d '{"action":"resume_all"}' \
            "${API_BASE}/api/ivx/agents/app-completion/control" || true)
          cat /tmp/resume.json
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/resume.json)" = true
          curl -fsS --retry 3 --retry-delay 2 --max-time 30 "${API_BASE}/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = "$TARGET_AGENTS"
          test "$(jq '[.agents[].agentId] | unique | length' /tmp/agents.json)" = "$TARGET_AGENTS"
          jq -r '.agents[] | [.agentId,.agentNumber] | @tsv' /tmp/agents.json > /tmp/agents.tsv

      - name: Force real work to all 112 IA in parallel
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SOURCE_SHA: ${{ steps.prod.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/force112
          cat > /tmp/force-one.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          agent_id="$1"
          agent_number="$2"
          safe_id=$(printf '%s' "$agent_id" | tr -c 'A-Za-z0-9_.-' '_')
          source="${SOURCE_SHA}:${RUN_ID}:${agent_id}:OWNER_FORCE_NOW"
          http=000
          for attempt in $(seq 1 12); do
            body=$(jq -nc --arg sourceSha "$source:$attempt" '{sourceSha:$sourceSha}')
            http=$(curl -sS --max-time 240 -o "/tmp/force112/${safe_id}.json" -w '%{http_code}' -X POST \
              -H 'content-type: application/json' \
              -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
              --data "$body" \
              "${API_BASE}/api/ivx/agents/${agent_id}/engineering-cycle" || true)
            [ "$http" = 200 ] && break
            if [[ ! "$http" =~ ^(000|408|425|429|500|502|503|504)$ ]]; then break; fi
            sleep $((4 + attempt * 2))
          done
          action='HTTP_FAIL'; productive=0; evidence=0; task_id=''; states=''
          if [ "$http" = 200 ] && jq -e . "/tmp/force112/${safe_id}.json" >/dev/null 2>&1; then
            action=$(jq -r '.result.action // "CYCLE_ERROR"' "/tmp/force112/${safe_id}.json")
            productive=$(jq -r '.result.productiveMinutes // 0' "/tmp/force112/${safe_id}.json")
            evidence=$(jq -r '(.result.evidenceIds // []) | length' "/tmp/force112/${safe_id}.json")
            task_id=$(jq -r '.result.taskId // empty' "/tmp/force112/${safe_id}.json")
            states=$(jq -r '.result.states // [] | join(",")' "/tmp/force112/${safe_id}.json")
          fi
          passed=false
          if [ "$http" = 200 ] && [ "$action" = TASK_COMPLETED ] && awk "BEGIN{exit !($productive > 0)}" && [ "$evidence" -gt 0 ] && [ -n "$task_id" ] && [[ ",$states," != *,ALREADY_VERIFIED,* ]]; then passed=true; fi
          jq -n --arg agentId "$agent_id" --argjson agentNumber "$agent_number" --arg http "$http" --arg action "$action" --arg taskId "$task_id" --argjson productiveMinutes "$productive" --argjson evidenceCount "$evidence" --arg states "$states" --argjson passed "$passed" '{agentId:$agentId,agentNumber:$agentNumber,http:$http,action:$action,taskId:$taskId,productiveMinutes:$productiveMinutes,evidenceCount:$evidenceCount,states:$states,passed:$passed}' > "/tmp/force112/${safe_id}.result.json"
          test "$passed" = true
          SCRIPT
          chmod +x /tmp/force-one.sh
          export API_BASE OIDC_TOKEN SOURCE_SHA RUN_ID
          set +e
          xargs -P "$PARALLEL" -n 2 /tmp/force-one.sh < /tmp/agents.tsv
          worker_rc=$?
          set -e
          jq -s 'sort_by(.agentNumber)' /tmp/force112/*.result.json > /tmp/force112-results.json
          total=$(jq 'length' /tmp/force112-results.json)
          passed=$(jq '[.[]|select(.passed==true)]|length' /tmp/force112-results.json)
          productive=$(jq '[.[].productiveMinutes]|add // 0' /tmp/force112-results.json)
          evidence=$(jq '[.[].evidenceCount]|add // 0' /tmp/force112-results.json)
          echo "OWNER_FORCE_112 total=$total passed=$passed productiveMinutes=$productive evidence=$evidence sourceSha=$SOURCE_SHA"
          test "$worker_rc" = 0
          test "$total" = "$TARGET_AGENTS"
          test "$passed" = "$TARGET_AGENTS"
          awk "BEGIN{exit !($productive > 0)}"
          test "$evidence" -gt 0

      - name: Emit owner 112 certificate
        if: always()
        env:
          PRODUCTION_SHA: ${{ steps.prod.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          [ -f /tmp/force112-results.json ] || echo '[]' > /tmp/force112-results.json
          total=$(jq 'length' /tmp/force112-results.json)
          passed=$(jq '[.[]|select(.passed==true)]|length' /tmp/force112-results.json)
          productive=$(jq '[.[].productiveMinutes]|add // 0' /tmp/force112-results.json)
          evidence_count=$(jq '[.[].evidenceCount]|add // 0' /tmp/force112-results.json)
          jq -n --arg certificate 'IVX-OWNER-FORCE-112-NOW' --arg workflowSha "$GITHUB_SHA" --arg productionSha "$PRODUCTION_SHA" --arg runId "$GITHUB_RUN_ID" --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson total "$total" --argjson passed "$passed" --argjson productiveMinutes "$productive" --argjson evidenceCount "$evidence_count" --slurpfile agents /tmp/force112-results.json '{ok:($total==112 and $passed==112 and $productiveMinutes>0 and $evidenceCount>0),certificate:$certificate,workflowSha:$workflowSha,productionSha:$productionSha,runId:$runId,generatedAt:$generatedAt,totalAgents:$total,passedAgents:$passed,productiveMinutes:$productiveMinutes,evidenceCount:$evidenceCount,agents:$agents[0]}' > evidence/ivx-owner-force-112-now.json
          cat evidence/ivx-owner-force-112-now.json

      - name: Upload owner-force evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivx-owner-force-112-now-${{ github.run_id }}
          path: evidence/ivx-owner-force-112-now.json
          if-no-files-found: error
          retention-days: 30
