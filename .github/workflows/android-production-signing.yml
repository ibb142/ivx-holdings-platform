name: Android Production Signing

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/production-signed-owner-home'
    paths:
      - '.github/workflows/android-production-signing.yml'

permissions:
  contents: read

jobs:
  signed-release:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      IVX_RELEASE_KEYSTORE_BASE64: ${{ secrets.IVX_RELEASE_KEYSTORE_BASE64 }}
      IVX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.IVX_RELEASE_KEYSTORE_PASSWORD }}
      IVX_RELEASE_KEY_ALIAS: ${{ secrets.IVX_RELEASE_KEY_ALIAS }}
      IVX_RELEASE_KEY_PASSWORD: ${{ secrets.IVX_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate protected release signing inputs
        shell: bash
        run: |
          set -euo pipefail
          for variable in IVX_RELEASE_KEYSTORE_BASE64 IVX_RELEASE_KEYSTORE_PASSWORD IVX_RELEASE_KEY_ALIAS IVX_RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Required protected release-signing input is unavailable: $variable"
              exit 1
            fi
          done
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/ivx-release.keystore"
          printf '%s' "$IVX_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$IVX_RELEASE_KEYSTORE_PASSWORD" -alias "$IVX_RELEASE_KEY_ALIAS" >/dev/null
          echo "IVX_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Release key validated without printing signing material."

      - name: Build signed release APK and AAB
        working-directory: expo/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon -x lint

      - name: Verify signed artifacts
        working-directory: expo/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -strict "$AAB"
          sha256sum "$APK" "$AAB"

      - uses: actions/upload-artifact@v4
        with:
          name: ivx-android-production-signed-${{ github.sha }}
          path: |
            expo/android/app/build/outputs/apk/release/app-release.apk
            expo/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
