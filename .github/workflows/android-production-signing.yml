name: Android Production Signing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'expo/components/HomeScreenContent.tsx'
      - 'expo/components/InvestorFirstFeed.tsx'
      - 'expo/lib/home-feed.ts'
      - 'expo/app.config.ts'
      - 'expo/android/app/build.gradle'
      - '.github/workflows/android-production-signing.yml'

permissions:
  contents: read

jobs:
  signed-release:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      IVX_RELEASE_KEYSTORE_BASE64: ${{ secrets.IVX_RELEASE_KEYSTORE_BASE64 }}
      IVX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.IVX_RELEASE_KEYSTORE_PASSWORD }}
      IVX_RELEASE_KEY_ALIAS: ${{ secrets.IVX_RELEASE_KEY_ALIAS }}
      IVX_RELEASE_KEY_PASSWORD: ${{ secrets.IVX_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install application dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install
          cd expo
          bun install
          bun scripts/apply-patches.mjs

      - name: Validate protected release signing inputs
        shell: bash
        run: |
          set -euo pipefail
          for variable in IVX_RELEASE_KEYSTORE_BASE64 IVX_RELEASE_KEYSTORE_PASSWORD IVX_RELEASE_KEY_ALIAS IVX_RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Required protected release-signing input is unavailable: $variable"
              exit 1
            fi
          done
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/ivx-release.keystore"
          printf '%s' "$IVX_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$IVX_RELEASE_KEYSTORE_PASSWORD" -alias "$IVX_RELEASE_KEY_ALIAS" >/dev/null
          echo "IVX_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Release key validated without printing signing material."

      - name: Build signed release APK and AAB
        working-directory: expo/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon -x lint

      - name: Verify signed artifacts
        working-directory: expo/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"
          sha256sum "$APK" "$AAB"

      - name: Boot emulator, install production APK, and certify cold launch
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          # Avoid the runner's unstable pre-script settings calls; the app
          # launch verifier does not depend on animation timing.
          disable-animations: false
          disable-linux-hw-accel: false
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/expo/scripts/certify-android-launch.sh" "$GITHUB_WORKSPACE/expo/android/app/build/outputs/apk/release/app-release.apk" com.ivxholdings.app android-production-launch.png android-runtime-logcat.txt android-launch.txt android-package-version.txt

      - name: Upload production runtime certificate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivx-android-production-runtime-certificate-${{ github.sha }}
          path: |
            android-launch.txt
            android-runtime-logcat.txt
            android-production-launch.png
            android-package-version.txt
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivx-android-production-signed-${{ github.sha }}
          path: |
            expo/android/app/build/outputs/apk/release/app-release.apk
            expo/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
