name: IVX QA Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa-suite:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install root dependencies
        run: bun install

      - name: Install expo dependencies
        run: cd expo && bun install

      - name: '1. TypeScript typecheck (backend)'
        run: |
          cd backend && bunx tsc --noEmit

      - name: '2. Backend unit tests — process isolated'
        shell: bash
        run: |
          set -euo pipefail
          : > backend-test-results.txt
          failed=0
          count=0
          while IFS= read -r test_file; do
            count=$((count + 1))
            safe_name=$(printf '%s' "$test_file" | tr '/ ' '__')
            test_root="${GITHUB_WORKSPACE}/.tmp/ivx-qa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${count}"
            rm -rf "$test_root"
            mkdir -p "$test_root"
            echo "=== $test_file ===" | tee -a backend-test-results.txt
            if ! IVX_DATA_DIR="$test_root" NODE_ENV=test bun test "$test_file" --reporter=dots 2>&1 | tee ".tmp/${safe_name}.log"; then
              cat ".tmp/${safe_name}.log" >> backend-test-results.txt
              failed=$((failed + 1))
              echo "FAILED_FILE=$test_file" | tee -a backend-test-results.txt
            else
              cat ".tmp/${safe_name}.log" >> backend-test-results.txt
            fi
            rm -rf "$test_root"
          done < <(find backend -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print | sort)
          echo "isolated_test_files=$count failed_files=$failed" | tee -a backend-test-results.txt
          if [ "$failed" -ne 0 ]; then exit 1; fi

      - name: '3. Expo unit tests'
        run: |
          set -o pipefail
          cd expo && bun test --reporter=dots 2>&1 | tee ../expo-test-results.txt

      - name: '4. Critical file protection test'
        run: |
          bun test qa/ivx-critical-file-protection.test.ts --reporter=dots

      - name: '5. QA matrix (production)'
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          bun run qa/ivx-qa-runner.ts 2>&1 | tee qa-results.txt
        env:
          IVX_COMMIT_SHA: ${{ github.sha }}
          NODE_ENV: ci

      - name: '6. Evidence generation'
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          bun run qa/ivx-evidence-generator.ts 2>&1 | tee evidence-results.txt

      - name: '7. Upload QA results'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: |
            backend-test-results.txt
            expo-test-results.txt
            qa-results.txt
            evidence-results.txt
            qa/latest-run.json
            qa/evidence/latest.json

      - name: '8. Fail CI if critical files deleted'
        run: |
          bun test qa/ivx-critical-file-protection.test.ts --reporter=dots
