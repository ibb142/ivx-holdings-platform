name: IVX Owner Binding Deploy Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-owner-binding-deploy-now.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  bind-deploy-recertify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE: https://api.ivxholding.com
      OWNER_NEW_PASSWORD: ${{ secrets.OWNER_NEW_PASSWORD }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      IVX_RENDER_API_KEY: ${{ secrets.IVX_RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      DEFAULT_RENDER_SERVICE_ID: srv-d7t9ivreo5us73ftose0
      IVX_OWNER_VARIABLES_ENCRYPTION_KEY: ${{ secrets.IVX_OWNER_VARIABLES_ENCRYPTION_KEY }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Render credentials without exposing them
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = await import('node:crypto');
          const fs = await import('node:fs');
          const envOut = process.env.GITHUB_ENV;
          const direct = (process.env.RENDER_API_KEY || process.env.IVX_RENDER_API_KEY || '').trim();
          const directSid = (process.env.RENDER_SERVICE_ID || process.env.DEFAULT_RENDER_SERVICE_ID || '').trim();
          if (direct) {
            fs.appendFileSync(envOut, `RENDER_KEY=${direct}\nRENDER_SID=${directSid}\n`);
            console.log('render_credential_source=github_secret');
            process.exit(0);
          }
          const base = (process.env.EXPO_PUBLIC_SUPABASE_URL || '').replace(/\/+$/, '');
          const service = (process.env.SUPABASE_SERVICE_ROLE_KEY || '').trim();
          if (!base || !service) throw new Error('Supabase recovery bindings missing');
          const candidates = [process.env.IVX_OWNER_VARIABLES_ENCRYPTION_KEY, process.env.APP_SECRET, process.env.JWT_SECRET].filter(Boolean);
          if (!candidates.length) throw new Error('Owner variable decrypt key missing');
          const keyCandidates = [...new Set(candidates)].map(s => crypto.createHash('sha256').update(s, 'utf8').digest());
          const aad = Buffer.from('ivx_owner_variables:v1', 'utf8');
          const res = await fetch(`${base}/rest/v1/ivx_owner_variables?select=name,encrypted_value,value_iv,value_tag,value_hash&name=in.%28RENDER_API_KEY%2CRENDER_SERVICE_ID%29`, {headers:{apikey:service,Authorization:`Bearer ${service}`}});
          if (!res.ok) throw new Error(`owner variable read HTTP ${res.status}`);
          const rows = await res.json(); const by = new Map(rows.map(r => [r.name,r]));
          const dec = name => {
            const r = by.get(name); if (!r) throw new Error(`${name} row missing`);
            for (const k of keyCandidates) {
              try {
                const d=crypto.createDecipheriv('aes-256-gcm',k,Buffer.from(r.value_iv,'base64')); d.setAAD(aad); d.setAuthTag(Buffer.from(r.value_tag,'base64'));
                const v=Buffer.concat([d.update(Buffer.from(r.encrypted_value,'base64')),d.final()]).toString('utf8').trim();
                if (crypto.createHash('sha256').update(v).digest('hex')===r.value_hash) return v;
              } catch {}
            }
            throw new Error(`${name} decrypt failed`);
          };
          const key=dec('RENDER_API_KEY'); const sid=directSid || dec('RENDER_SERVICE_ID');
          fs.appendFileSync(envOut, `RENDER_KEY=${key}\nRENDER_SID=${sid}\n`);
          console.log('render_credential_source=owner_variables_store');
          NODE

      - name: Bind OWNER_NEW_PASSWORD to Render merge-safe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OWNER_NEW_PASSWORD:-}"
          echo "::add-mask::$OWNER_NEW_PASSWORD"
          echo "::add-mask::$RENDER_KEY"
          env_url="https://api.render.com/v1/services/${RENDER_SID}/env-vars"
          curl -fsS "$env_url" -H "Authorization: Bearer ${RENDER_KEY}" -H 'Accept: application/json' -o /tmp/render-env.json
          jq --arg pwd "$OWNER_NEW_PASSWORD" '
            map(.envVar // .) |
            map({key:.key,value:(.value // "")}) |
            (map(select(.key != "OWNER_NEW_PASSWORD")) + [{key:"OWNER_NEW_PASSWORD",value:$pwd}])
          ' /tmp/render-env.json > /tmp/render-env-put.json
          curl -fsS -X PUT "$env_url" -H "Authorization: Bearer ${RENDER_KEY}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary @/tmp/render-env-put.json -o /tmp/render-env-put-response.json
          curl -fsS "$env_url" -H "Authorization: Bearer ${RENDER_KEY}" -H 'Accept: application/json' -o /tmp/render-env-verify.json
          present=$(jq --arg pwd "$OWNER_NEW_PASSWORD" '[.[] | (.envVar // .) | select(.key=="OWNER_NEW_PASSWORD" and .value==$pwd)] | length' /tmp/render-env-verify.json)
          test "$present" = 1
          echo 'owner_password_binding_sync=PASS'

      - name: Trigger exact-SHA Render deployment
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SID}/deploys" -H "Authorization: Bearer ${RENDER_KEY}" -H 'Accept: application/json' -H 'Content-Type: application/json' --data '{"clearCache":"do_not_clear"}')
          deploy_id=$(printf '%s' "$response" | jq -r '.id // .deploy.id // empty')
          test -n "$deploy_id"
          echo "render_deploy_trigger=PASS id=$deploy_id"

      - name: Wait for exact production SHA and certified member auth
        shell: bash
        run: |
          set -euo pipefail
          sha_ok=false
          auth_ok=false
          for i in $(seq 1 120); do
            version_code=$(curl -sS -m 20 -o /tmp/version.json -w '%{http_code}' "${API_BASE}/version" || true)
            live=''
            if [ "$version_code" = 200 ]; then live=$(jq -r '.commit // .version.commit // empty' /tmp/version.json); fi
            cert_code=$(curl -sS -m 30 -o /tmp/member-cert.json -w '%{http_code}' "${API_BASE}/api/ivx/certification/member-auth-public" || true)
            certified=false
            if [ "$cert_code" = 200 ]; then certified=$(jq -r '.certified // false' /tmp/member-cert.json); fi
            echo "poll=$i live=${live:-missing} expected=$GITHUB_SHA member_auth_certified=$certified"
            if [ "$live" = "$GITHUB_SHA" ]; then sha_ok=true; fi
            if [ "$certified" = true ]; then auth_ok=true; fi
            if [ "$sha_ok" = true ] && [ "$auth_ok" = true ]; then
              jq '{certified,commit,checks:{runtimeConfig:.checks.runtimeConfig,ownerLogin:.checks.ownerLogin,memberRegistration:.checks.memberRegistration,memberLogin:.checks.memberLogin,memberPersistence:.checks.memberPersistence}}' /tmp/member-cert.json
              echo 'exact_sha_and_member_auth=PASS'
              exit 0
            fi
            sleep 10
          done
          echo 'exact_sha_and_member_auth=FAIL'
          exit 1

      - name: Dispatch Block 1 on exact live SHA
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ivx-block1-p0-cert.yml --ref main
          echo 'block1_dispatch=PASS'

      - name: Wait for Block 1 exact-SHA success
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&head_sha=${GITHUB_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.name=="IVX Block 1 P0 Certificate")] | sort_by(.created_at) | reverse | .[0] // empty')
            if [ -n "$run" ]; then
              status=$(printf '%s' "$run" | jq -r '.status'); conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""'); id=$(printf '%s' "$run" | jq -r '.id');
              echo "block1 poll=$i run=$id status=$status conclusion=${conclusion:-pending}"
              if [ "$status" = completed ] && [ "$conclusion" = success ]; then echo 'block1_exact_sha=PASS'; exit 0; fi
              if [ "$status" = completed ] && [ "$conclusion" != success ]; then echo 'block1_exact_sha=FAIL'; exit 1; fi
            fi
            sleep 10
          done
          exit 1

      - name: Dispatch Full 10/10 Certification
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ivx-10of10-cert.yml --ref main
          echo 'full_10of10_dispatch=PASS'
