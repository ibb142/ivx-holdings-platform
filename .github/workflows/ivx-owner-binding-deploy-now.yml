name: IVX Owner Binding Deploy Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-owner-binding-deploy-now.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  bind-deploy-recertify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE: https://api.ivxholding.com
      OWNER_PASSWORD_S1: ${{ secrets.OWNER_NEW_PASSWORD }}
      OWNER_PASSWORD_S2: ${{ secrets.OWNER_PASSWORD }}
      OWNER_PASSWORD_S3: ${{ secrets.IVX_OWNER_PASSWORD }}
      OWNER_PASSWORD_S4: ${{ secrets.IVX_OWNER_NEW_PASSWORD }}
      OWNER_PASSWORD_S5: ${{ secrets.OWNER_LOGIN_PASSWORD }}
      OWNER_PASSWORD_S6: ${{ secrets.IVX_OWNER_LOGIN_PASSWORD }}
      IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve owner password alias without exposing it
        shell: bash
        run: |
          set -euo pipefail
          for name in OWNER_PASSWORD_S1 OWNER_PASSWORD_S2 OWNER_PASSWORD_S3 OWNER_PASSWORD_S4 OWNER_PASSWORD_S5 OWNER_PASSWORD_S6; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              echo "OWNER_PASSWORD_BIND_VALUE=$value" >> "$GITHUB_ENV"
              echo "owner_password_secret_source=$name"
              exit 0
            fi
          done
          echo 'No owner password GitHub secret alias is populated.'
          exit 1

      - name: Bind owner password through backend Render runtime tool
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OWNER_PASSWORD_BIND_VALUE:-}"
          test -n "${IVX_AI_SYSTEM_SECRET:-}"
          echo "::add-mask::$OWNER_PASSWORD_BIND_VALUE"
          echo "::add-mask::$IVX_AI_SYSTEM_SECRET"
          for key in OWNER_NEW_PASSWORD IVX_OWNER_PASSWORD; do
            payload=$(jq -n --arg key "$key" --arg value "$OWNER_PASSWORD_BIND_VALUE" '{action:"render_upsert_env_var",input:{key:$key,value:$value},confirm:true,confirmText:"CONFIRM_IVX_RENDER_SERVICE_UPDATE",reason:"Owner-authorized restoration of the existing owner password binding for Block 1 certification."}')
            code=$(curl -sS --max-time 60 -o "/tmp/${key}.json" -w '%{http_code}' -X POST "${API_BASE}/api/ivx/developer-deploy/action" -H 'content-type: application/json' -H "X-IVX-System-Key: ${IVX_AI_SYSTEM_SECRET}" --data "$payload" || true)
            echo "render_upsert_env_var key=$key http=$code"
            jq 'del(.result.value,.value,.input)' "/tmp/${key}.json" || cat "/tmp/${key}.json"
            test "$code" = 200
            test "$(jq -r '.ok // false' "/tmp/${key}.json")" = true
          done
          echo 'owner_password_binding_sync=PASS'

      - name: Trigger exact-SHA Render deployment through backend runtime tool
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n '{action:"render_trigger_deploy",input:{clearCache:false},confirm:true,confirmText:"CONFIRM_IVX_RENDER_DEPLOY",reason:"Deploy the owner password binding and recertify current main."}')
          code=$(curl -sS --max-time 60 -o /tmp/render-deploy.json -w '%{http_code}' -X POST "${API_BASE}/api/ivx/developer-deploy/action" -H 'content-type: application/json' -H "X-IVX-System-Key: ${IVX_AI_SYSTEM_SECRET}" --data "$payload" || true)
          echo "render_trigger_deploy http=$code"
          cat /tmp/render-deploy.json
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/render-deploy.json)" = true
          echo 'render_deploy_trigger=PASS'

      - name: Wait for exact production SHA and certified member auth
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            version_code=$(curl -sS -m 20 -o /tmp/version.json -w '%{http_code}' "${API_BASE}/version" || true)
            live=''
            if [ "$version_code" = 200 ]; then live=$(jq -r '.commit // .version.commit // empty' /tmp/version.json); fi
            cert_code=$(curl -sS -m 30 -o /tmp/member-cert.json -w '%{http_code}' "${API_BASE}/api/ivx/certification/member-auth-public" || true)
            certified=false
            if [ "$cert_code" = 200 ]; then certified=$(jq -r '.certified // false' /tmp/member-cert.json); fi
            echo "poll=$i live=${live:-missing} expected=$GITHUB_SHA member_auth_certified=$certified"
            if [ "$live" = "$GITHUB_SHA" ] && [ "$certified" = true ]; then
              jq '{certified,commit,checks:{runtimeConfig:.checks.runtimeConfig,ownerLogin:.checks.ownerLogin,memberRegistration:.checks.memberRegistration,memberLogin:.checks.memberLogin,memberPersistence:.checks.memberPersistence}}' /tmp/member-cert.json
              echo 'exact_sha_and_member_auth=PASS'
              exit 0
            fi
            sleep 10
          done
          echo 'exact_sha_and_member_auth=FAIL'
          exit 1

      - name: Dispatch Block 1 on exact live SHA
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ivx-block1-p0-cert.yml --ref main
          echo 'block1_dispatch=PASS'

      - name: Wait for Block 1 exact-SHA success
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&head_sha=${GITHUB_SHA}&per_page=100" > /tmp/runs.json
            run=$(jq -c '[.workflow_runs[] | select(.name=="IVX Block 1 P0 Certificate")] | sort_by(.created_at) | reverse | .[0] // empty' /tmp/runs.json)
            if [ -n "$run" ]; then
              status=$(printf '%s' "$run" | jq -r '.status'); conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""'); id=$(printf '%s' "$run" | jq -r '.id');
              echo "block1 poll=$i run=$id status=$status conclusion=${conclusion:-pending}"
              if [ "$status" = completed ] && [ "$conclusion" = success ]; then echo 'block1_exact_sha=PASS'; exit 0; fi
              if [ "$status" = completed ] && [ "$conclusion" != success ]; then echo 'block1_exact_sha=FAIL'; exit 1; fi
            fi
            sleep 10
          done
          exit 1

      - name: Dispatch Full 10/10 Certification
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ivx-10of10-cert.yml --ref main
          echo 'full_10of10_dispatch=PASS'
