name: IVX 112 Per-Agent 20H No-Sleep SLA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-112-per-agent-20h-no-sleep-sla.yml'
      - '.github/workflows/ivx-no-idle-intelligence.yml'
      - 'backend/services/ivx-agent-work-ledger.ts'
      - 'backend/services/ivx-autonomous-truth-control.ts'
      - 'backend/services/ivx-github-actions-oidc.ts'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: ivx-112-per-agent-20h-no-sleep-sla
  cancel-in-progress: false

env:
  API_BASE: https://api.ivxholding.com
  MIN_AGENT_HOURS_24H: '20'
  TARGET_AGENT_HOURS_24H: '22'
  MAX_PARALLEL_FILL: '24'

jobs:
  enforce-per-agent-sla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtain bounded Autonomous OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(jq -r '.value // empty' <<<"$response")
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Read canonical 112-agent productive-time ledger
        id: before
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --max-time 30 \
            -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
            "${API_BASE}/api/ivx/autonomous/agent-ledger" -o /tmp/ledger.json
          test "$(jq -r '.ok // false' /tmp/ledger.json)" = true
          test "$(jq -r '.rowCount // 0' /tmp/ledger.json)" = 112
          test "$(jq '.agents | length' /tmp/ledger.json)" = 112
          test "$(jq '[.agents[].agentNumber] | unique | length' /tmp/ledger.json)" = 112
          min_ms=$((20*60*60*1000)); target_ms=$((22*60*60*1000))
          jq --argjson min "$min_ms" --argjson target "$target_ms" '[.agents[] | {agentNumber,agentId,agentName,status,currentTask,lastHeartbeatAt,productiveMs24h,idleMs24h,evidenceState,qualityState,belowMinimum:((.productiveMs24h // 0)<$min),belowTarget:((.productiveMs24h // 0)<$target)}]' /tmp/ledger.json > /tmp/per-agent.json
          below_min=$(jq '[.[] | select(.belowMinimum)] | length' /tmp/per-agent.json)
          below_target=$(jq '[.[] | select(.belowTarget)] | length' /tmp/per-agent.json)
          idle=$(jq '[.[] | select(.status == "IDLE")] | length' /tmp/per-agent.json)
          echo "BEFORE below20h=$below_min below22h=$below_target idle=$idle"
          echo "below_min=$below_min" >> "$GITHUB_OUTPUT"
          echo "below_target=$below_target" >> "$GITHUB_OUTPUT"
          echo "idle=$idle" >> "$GITHUB_OUTPUT"

      - name: Resume global dispatcher when any IA is under SLA or idle
        if: ${{ steps.before.outputs.below_min != '0' || steps.before.outputs.idle != '0' }}
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/resume.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
            -d '{"action":"resume_all"}' \
            "${API_BASE}/api/ivx/agents/app-completion/control")
          cat /tmp/resume.json
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/resume.json)" = true

      - name: Dispatch evidence-backed work to under-SLA idle agents
        if: ${{ steps.before.outputs.below_min != '0' || steps.before.outputs.idle != '0' }}
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.[] | select(.belowMinimum and (.status=="IDLE" or .status=="STALE" or .status=="UNKNOWN" or .currentTask==null)) | [.agentId,.agentNumber,.status] | @tsv' /tmp/per-agent.json > /tmp/under-sla-idle.tsv
          count=$(wc -l < /tmp/under-sla-idle.tsv | tr -d ' ')
          echo "under_sla_idle_candidates=$count"
          if [ "$count" = 0 ]; then exit 0; fi
          mkdir -p /tmp/20h-results
          export API_BASE OIDC_TOKEN SOURCE_SHA RUN_ID
          cat > /tmp/run-under-sla.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          agent_id="$1"; agent_number="$2"; previous_status="$3"
          safe_id=$(printf '%s' "$agent_id" | tr -c 'A-Za-z0-9_.-' '_')
          payload=$(jq -n --arg sha "$SOURCE_SHA" --arg run "$RUN_ID" --arg status "$previous_status" --argjson n "$agent_number" '{taskType:"audit",payload:{missionType:"per_agent_20h_sla_recovery",readOnly:true,requireEvidence:true,sourceSha:$sha,controllerRunId:$run,agentNumber:$n,previousStatus:$status,instruction:"Perform real evidence-backed low-risk work within your capability. This run is productive only if runtime evidence is returned. Do not fabricate time or completion."}}')
          http=$(curl -sS --retry 1 --retry-delay 1 --max-time 75 -o "/tmp/20h-results/${safe_id}.json" -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
            --data "$payload" \
            "${API_BASE}/api/ivx/agents/${agent_id}/run" || true)
          ok=false; evidence=0; run_id=''
          if [ "$http" = 200 ] && jq -e . "/tmp/20h-results/${safe_id}.json" >/dev/null 2>&1; then
            ok=$(jq -r '.ok // false' "/tmp/20h-results/${safe_id}.json")
            evidence=$(jq -r '(.runRecord.evidence // []) | length' "/tmp/20h-results/${safe_id}.json")
            run_id=$(jq -r '.runRecord.runId // .runRecord.taskId // empty' "/tmp/20h-results/${safe_id}.json")
          fi
          passed=false
          if [ "$http" = 200 ] && [ "$ok" = true ] && [ "$evidence" -gt 0 ] && [ -n "$run_id" ]; then passed=true; fi
          jq -n --arg agentId "$agent_id" --argjson agentNumber "$agent_number" --arg previousStatus "$previous_status" --arg http "$http" --argjson evidence "$evidence" --arg runId "$run_id" --argjson passed "$passed" '{agentId:$agentId,agentNumber:$agentNumber,previousStatus:$previousStatus,http:$http,evidenceCount:$evidence,runId:$runId,passed:$passed}' > "/tmp/20h-results/${safe_id}.result.json"
          test "$passed" = true
          SCRIPT
          chmod +x /tmp/run-under-sla.sh
          xargs -r -P "$MAX_PARALLEL_FILL" -n 3 /tmp/run-under-sla.sh < /tmp/under-sla-idle.tsv
          jq -s '.' /tmp/20h-results/*.result.json > /tmp/20h-dispatch-results.json
          total=$(jq 'length' /tmp/20h-dispatch-results.json)
          passed=$(jq '[.[]|select(.passed==true)]|length' /tmp/20h-dispatch-results.json)
          echo "20h_recovery_dispatched=$total evidence_verified=$passed"
          test "$total" = "$passed"

      - name: Re-read ledger and enforce no silent sleeping IA with executable work
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          curl -fsS --retry 4 --retry-delay 2 --max-time 30 \
            -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
            "${API_BASE}/api/ivx/autonomous/agent-ledger" -o /tmp/after.json
          test "$(jq -r '.ok // false' /tmp/after.json)" = true
          test "$(jq -r '.rowCount // 0' /tmp/after.json)" = 112
          min_ms=$((20*60*60*1000))
          idle=$(jq '[.agents[] | select(.status == "IDLE")] | length' /tmp/after.json)
          below_min=$(jq --argjson min "$min_ms" '[.agents[] | select((.productiveMs24h // 0)<$min)] | length' /tmp/after.json)
          under_sla_idle=$(jq --argjson min "$min_ms" '[.agents[] | select((.productiveMs24h // 0)<$min and .status == "IDLE")] | length' /tmp/after.json)
          echo "AFTER idle=$idle below20h=$below_min underSlaIdle=$under_sla_idle"
          test "$under_sla_idle" -eq 0

      - name: Emit honest per-agent SLA evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          min_ms=$((20*60*60*1000)); target_ms=$((22*60*60*1000))
          jq --arg at "$now" --argjson min "$min_ms" --argjson target "$target_ms" '{certificate:"IVX 112 Per-Agent 20H No-Sleep SLA",checkedAt:$at,totalAgents:.rowCount,totals:.totals,minProductiveMsPerAgent:$min,targetProductiveMsPerAgent:$target,agents:[.agents[]|{agentNumber,agentId,agentName,status,currentTask,lastHeartbeatAt,productiveMs24h,idleMs24h,evidenceState,qualityState,meets20h:((.productiveMs24h//0)>=$min),meets22h:((.productiveMs24h//0)>=$target)}],truthPolicy:"Productive hours come only from the canonical evidence-backed ledger. Registered/connected/elapsed time is never counted as work."}' /tmp/after.json > evidence/ivx-112-per-agent-20h-sla.json
          cat evidence/ivx-112-per-agent-20h-sla.json

      - name: Upload per-agent SLA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IVX-112-PER-AGENT-20H-SLA-${{ github.run_id }}
          path: evidence/ivx-112-per-agent-20h-sla.json
          if-no-files-found: error
          retention-days: 30
