name: IVX Supabase Management Restart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-supabase-management-restart.yml'
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_REF: kvclcdjmjghndxsngfzb
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Verify repository management binding
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is not bound"
            exit 2
          fi
          echo "supabase_management_binding=present"

      - name: Restart Supabase project
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -m 20 -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}" || true)
          echo "management_status_http=$status"
          if [ "$status" != "200" ]; then
            cat /tmp/project.json 2>/dev/null | head -c 300 || true
            echo
            exit 3
          fi

          code=$(curl -sS -m 45 -o /tmp/restart.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart" || true)
          echo "restart_http=$code"
          cat /tmp/restart.json 2>/dev/null | head -c 300 || true
          echo
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
            exit 4
          fi

      - name: Verify data plane recovery
        shell: bash
        env:
          SUPABASE_URL: https://kvclcdjmjghndxsngfzb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -sS -m 15 -o /tmp/rest.json -w '%{http_code}' \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${SUPABASE_URL}/rest/v1/members?select=id&limit=1" || true)
            echo "poll=$i rest_http=$code"
            if [ "$code" = "200" ]; then
              echo "supabase_data_plane=PASS"
              exit 0
            fi
            sleep 10
          done
          cat /tmp/rest.json 2>/dev/null | head -c 500 || true
          echo
          exit 5
