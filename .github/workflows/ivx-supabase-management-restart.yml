name: IVX Supabase Management Restart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-supabase-management-restart.yml'
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_REF: kvclcdjmjghndxsngfzb
      RENDER_SERVICE_ID: srv-d7t9ivreo5us73ftose0
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Verify required Supabase secret bindings
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "SUPABASE_ACCESS_TOKEN repository secret is not bound"; exit 2; }
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || { echo "SUPABASE_SERVICE_ROLE_KEY repository secret is not bound"; exit 2; }
          echo "required_supabase_secret_bindings=present"
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::warning::RENDER_API_KEY not bound; Render env sync will be skipped, but Supabase recovery will continue"
          fi

      - name: Verify Supabase Management API token
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -m 20 -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}" || true)
          echo "management_status_http=$status"
          [ "$status" = "200" ] || { cat /tmp/project.json 2>/dev/null | head -c 300 || true; echo; exit 3; }

      - name: Sync Supabase credentials into Render runtime when available
        if: env.RENDER_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps([
            {"key":"SUPABASE_ACCESS_TOKEN","value":os.environ["SUPABASE_ACCESS_TOKEN"]},
            {"key":"SUPABASE_SERVICE_ROLE_KEY","value":os.environ["SUPABASE_SERVICE_ROLE_KEY"]},
          ]))
          PY
          )
          code=$(curl -sS -m 30 -o /tmp/render-env.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" || true)
          echo "render_env_sync_http=$code"
          case "$code" in 200|201|202) ;; *) cat /tmp/render-env.json 2>/dev/null | head -c 300 || true; echo; exit 4 ;; esac

      - name: Restart Supabase project
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -m 45 -o /tmp/restart.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart" || true)
          echo "restart_http=$code"
          case "$code" in 200|201|202) ;; *) cat /tmp/restart.json 2>/dev/null | head -c 300 || true; echo; exit 5 ;; esac

      - name: Verify data plane recovery
        shell: bash
        env:
          SUPABASE_URL: https://kvclcdjmjghndxsngfzb.supabase.co
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -sS -m 15 -o /tmp/rest.json -w '%{http_code}' \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${SUPABASE_URL}/rest/v1/members?select=id&limit=1" || true)
            echo "poll=$i rest_http=$code"
            if [ "$code" = "200" ]; then
              echo "supabase_data_plane=PASS"
              exit 0
            fi
            sleep 10
          done
          cat /tmp/rest.json 2>/dev/null | head -c 500 || true
          echo
          exit 6
