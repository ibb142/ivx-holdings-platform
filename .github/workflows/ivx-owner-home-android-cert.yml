name: IVX Owner Sign In + Home Android Certificate

on:
  pull_request:
    branches: [main]
    paths:
      - 'expo/app/(tabs)/_layout.tsx'
      - 'expo/app/(tabs)/(home)/**'
      - 'expo/app/(tabs)/home.tsx'
      - 'expo/app/login.tsx'
      - 'expo/lib/auth-context.tsx'
      - 'expo/lib/auth-password-sign-in.ts'
      - 'expo/lib/supabase.ts'
      - 'expo/lib/screen-paint-watchdog.ts'
      - 'expo/.maestro/ivx-owner-home-certificate.yaml'
      - '.github/workflows/ivx-owner-home-android-cert.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_ENV: production
  EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_IVX_OPEN_ACCESS_MODE: 'false'
  OWNER_EMAIL: iperez4242@gmail.com
  OWNER_PASSWORD_S1: ${{ secrets.OWNER_NEW_PASSWORD }}
  OWNER_PASSWORD_S2: ${{ secrets.OWNER_PASSWORD }}
  OWNER_PASSWORD_S3: ${{ secrets.IVX_OWNER_PASSWORD }}
  OWNER_PASSWORD_S4: ${{ secrets.IVX_OWNER_NEW_PASSWORD }}
  OWNER_PASSWORD_S5: ${{ secrets.OWNER_LOGIN_PASSWORD }}
  OWNER_PASSWORD_S6: ${{ secrets.IVX_OWNER_LOGIN_PASSWORD }}

jobs:
  certify-owner-home:
    name: Real owner sign-in reaches Home without black screen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - name: Resolve real owner credential binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OWNER_EMAIL"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          owner_password=''
          binding='none'
          for pair in \
            'OWNER_NEW_PASSWORD:OWNER_PASSWORD_S1' \
            'OWNER_PASSWORD:OWNER_PASSWORD_S2' \
            'IVX_OWNER_PASSWORD:OWNER_PASSWORD_S3' \
            'IVX_OWNER_NEW_PASSWORD:OWNER_PASSWORD_S4' \
            'OWNER_LOGIN_PASSWORD:OWNER_PASSWORD_S5' \
            'IVX_OWNER_LOGIN_PASSWORD:OWNER_PASSWORD_S6'; do
            name=${pair%%:*}
            var=${pair##*:}
            value=${!var:-}
            if [ -n "$value" ]; then
              owner_password="$value"
              binding="$name"
              break
            fi
          done
          test -n "$owner_password"
          echo "::add-mask::$owner_password"
          {
            echo 'OWNER_PASSWORD_EFFECTIVE<<IVX_EOF'
            echo "$owner_password"
            echo 'IVX_EOF'
            echo "OWNER_PASSWORD_BINDING=$binding"
          } >> "$GITHUB_ENV"
          echo "owner_password_binding=$binding"

      - name: Install dependencies for native certification
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd expo
          bun install
          bun scripts/apply-patches.mjs

      - name: Prepare disposable QA signer
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          rm -f "$KEYSTORE"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IVX Owner Home E2E, OU=QA, O=IVX Holdings, L=Miami, ST=Florida, C=US"

      - name: Build Android owner QA APK
        working-directory: expo/android
        env:
          IVX_QA_KEYSTORE: ${{ runner.home }}/.android/debug.keystore
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleQa --no-daemon -x lint
          APK=$(find app/build/outputs/apk/qa -name '*.apk' -type f | head -1)
          test -n "$APK"
          echo "APK_PATH=$(realpath "$APK")" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real owner sign-in and Home black-screen regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          script: |
            set -u
            adb install -r "$APK_PATH"
            curl -Ls https://get.maestro.mobile.dev | bash
            test -x "$HOME/.maestro/bin/maestro"
            "$HOME/.maestro/bin/maestro" --version

            set +e
            timeout 240s "$HOME/.maestro/bin/maestro" test expo/.maestro/ivx-owner-home-certificate.yaml --env OWNER_EMAIL="$OWNER_EMAIL" --env OWNER_PASSWORD="$OWNER_PASSWORD_EFFECTIVE" --format junit --output owner-home-maestro.xml
            rc=$?

            timeout 15s adb exec-out screencap -p > owner-home-after-maestro.png 2>/dev/null || true
            timeout 20s adb logcat -d > owner-home-runtime-logcat.txt 2>&1 || true

            # The physical-device regression appears after Home first paints.
            # A successful immediate Maestro assertion is therefore insufficient.
            # Hold the app alive for 8 more seconds and fail closed unless the
            # Home-ready accessibility node is still present and the process lives.
            if [ "$rc" -eq 0 ]; then
              sleep 8
              if ! timeout 10s adb shell pidof com.ivxholdings.app.owner > owner-home-pid.txt 2>&1; then
                rc=91
              fi
              if ! timeout 20s adb shell uiautomator dump /sdcard/owner-home-after-8s.xml > /dev/null 2>&1; then
                rc=92
              fi
              timeout 20s adb pull /sdcard/owner-home-after-8s.xml owner-home-after-8s.xml > /dev/null 2>&1 || true
              timeout 15s adb exec-out screencap -p > owner-home-after-8s.png 2>/dev/null || true
              if ! grep -q 'Home ready' owner-home-after-8s.xml 2>/dev/null; then
                rc=93
              fi
              timeout 20s adb logcat -d > owner-home-after-8s-logcat.txt 2>&1 || true
            fi
            set -e
            exit "$rc"

      - name: Capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          timeout 10s adb devices > owner-home-adb-devices.txt 2>&1 || true
          timeout 20s adb logcat -d > owner-home-failure-logcat.txt 2>&1 || true
          timeout 15s adb exec-out screencap -p > owner-home-failure.png 2>/dev/null || true

      - name: Build durable certificate
        if: success()
        shell: bash
        run: |
          mkdir -p qa/evidence
          jq -n --arg sha "${{ github.event.pull_request.head.sha || github.sha }}" --arg binding "$OWNER_PASSWORD_BINDING" --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{certificate:"IVX-OWNER-SIGNIN-HOME-ANDROID-E2E",passed:true,sourceSha:$sha,credentialBinding:$binding,realOwnerPasswordEntry:true,homeReadyMarker:true,homeVisibleAfter8Seconds:true,homeTabRetap:true,blackScreenObserved:false,signInFailureDialogObserved:false,secretValuesReturned:false,verifiedAt:$verifiedAt}' > qa/evidence/ivx-owner-home-android-e2e.json
          cat qa/evidence/ivx-owner-home-android-e2e.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivx-owner-home-android-e2e-${{ github.sha }}
          path: |
            owner-home-maestro.xml
            owner-home-after-maestro.png
            owner-home-runtime-logcat.txt
            owner-home-after-8s.xml
            owner-home-after-8s.png
            owner-home-after-8s-logcat.txt
            owner-home-pid.txt
            owner-home-adb-devices.txt
            owner-home-failure.png
            owner-home-failure-logcat.txt
            qa/evidence/ivx-owner-home-android-e2e.json
          if-no-files-found: warn
