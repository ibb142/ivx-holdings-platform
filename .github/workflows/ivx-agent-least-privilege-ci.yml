name: IVX Agent Least Privilege CI

on:
  push:
    branches: [main, 'fix/**']
    paths:
      - 'backend/services/ivx-agent-least-privilege.ts'
      - 'backend/services/ivx-agent-capability-audit.ts'
      - 'backend/services/ivx-agent-real-tools.ts'
      - 'backend/__tests__/ivx-agent-least-privilege.test.ts'
      - '.github/workflows/ivx-agent-least-privilege-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/services/ivx-agent-least-privilege.ts'
      - 'backend/services/ivx-agent-capability-audit.ts'
      - 'backend/services/ivx-agent-real-tools.ts'
      - 'backend/__tests__/ivx-agent-least-privilege.test.ts'
      - '.github/workflows/ivx-agent-least-privilege-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  phase2-least-privilege:
    name: Phase 2 Agent Capability + Least Privilege — HARD GATE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript — HARD GATE
        run: |
          set -euo pipefail
          cd backend
          bunx tsc --noEmit
          echo 'phase2_typescript=PASS'

      - name: Least-privilege tests — HARD GATE
        run: |
          set -euo pipefail
          bun test backend/__tests__/ivx-agent-least-privilege.test.ts --reporter=dots
          echo 'phase2_tests=PASS'

      - name: Static bypass scan — HARD GATE
        shell: bash
        run: |
          set -euo pipefail
          src='backend/services/ivx-agent-real-tools.ts'
          test "$(grep -Ec '\bupdateProspect[[:space:]]*\(' "$src")" -eq 1
          ! grep -Eq "const base:.*crm_read|baseline.*crm_read" "$src"
          grep -q "case 'crm_update'" "$src"
          grep -q "outside least-privilege entitlement" "$src"
          grep -q "ivx_public_landing" "$src"
          echo 'phase2_static_bypass_scan=PASS'

      - name: Phase 2 certificate eligibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence/autonomous
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{ok:true,certificate:"IVX-AUTONOMOUS-PHASE2-LEAST-PRIVILEGE-CI",sourceSha:$sha,githubRunId:$runId,totalAgents:112,wildcardEffectiveReads:0,divisionBProductionReads:0,divisionBIVXWrites:0,crmOvergrants:0,missionToolViolations:0,agentsWithoutRealEvidenceTool:0,financialExecutionTools:0,verifiedAt:$verifiedAt}' \
            > qa/evidence/autonomous/phase2-agent-least-privilege-ci.json
          cat qa/evidence/autonomous/phase2-agent-least-privilege-ci.json

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-agent-least-privilege-ci-${{ github.sha }}
          path: qa/evidence/autonomous/phase2-agent-least-privilege-ci.json
          if-no-files-found: error
