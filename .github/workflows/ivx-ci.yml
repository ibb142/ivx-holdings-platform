# Core IVX CI. Push execution is path-scoped so workflow-only/autonomous-control
# changes cannot fan out four unrelated runner jobs.
name: IVX CI

on:
  workflow_dispatch:
    inputs:
      testTarget:
        description: Backend test files or directories to run
        required: false
        default: default
      buildApk:
        description: Also build the Android release APK (set to "true")
        required: false
        default: "false"
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'expo/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'bun.lockb'

concurrency:
  group: ivx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (bun)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install
      - name: Backend TypeScript typecheck — HARD GATE
        run: cd backend && bunx tsc --noEmit
      - name: Run env-independent backend tests
        run: |
          TARGET="${{ github.event.inputs.testTarget || 'default' }}"
          if [ "$TARGET" = "default" ] || [ "$TARGET" = "all" ]; then
            bun test backend/ivx-registration-orchestrator.test.ts backend/ivx-timezone.test.ts backend/ivx-senior-developer-capabilities.test.ts backend/ivx-ci-build-runner.test.ts backend/ivx-growth-autonomous-ops.test.ts backend/services/ivx-agent-certification.test.ts backend/services/ivx-owner-ai-intent-router.test.ts
          else
            bun test $TARGET
          fi
      - name: Senior Developer Quality Gate — HARD GATE
        run: node --test scripts/__tests__/ivx-senior-quality-gate.test.mjs

  chat-tests:
    name: Chat + intent + performance tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: cd expo && bun install
      - run: cd expo && bun test src/modules/ivx-owner-ai/services/ivxOwnerIntentClassifier.test.ts
      - run: cd expo && bun test src/modules/ivx-owner-ai/services/ivxChatPerformanceOptimizer.test.ts
      - run: cd expo && bun test __tests__/chat-canonical-order.test.ts

  release-consistency:
    name: Android release consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: node expo/scripts/verify-apk-release-consistency.mjs
      - run: cd expo && bun install

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install
      - name: Scan for leaked secrets
        shell: bash
        run: |
          set -euo pipefail
          EXIT_CODE=0
          patterns=('ghp_[A-Za-z0-9]{36}' 'github_pat_[A-Za-z0-9_]{40,}' 'sk-[A-Za-z0-9]{32,}' 'rnd_[A-Za-z0-9]{20,}' 'sbp_[A-Za-z0-9_-]{30,}' 'vck_[A-Za-z0-9_-]{20,}' 'PT[A-Za-z0-9_-]{30,}' 'PT[0-9A-Fa-f]{48}')
          includes=('--include=*.ts' '--include=*.tsx' '--include=*.js' '--include=*.mjs' '--include=*.json' '--include=*.yml' '--include=*.yaml')
          for pattern in "${patterns[@]}"; do
            FOUND=$(grep -r "${includes[@]}" --exclude-dir=node_modules --exclude-dir=.git --exclude='.env.example' --exclude='.env.production.template' --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.spec.ts' --exclude='*.spec.tsx' -E "$pattern" . 2>/dev/null || true)
            if [ -n "$FOUND" ]; then
              echo "SECRET LEAK DETECTED (pattern: $pattern)"
              printf '%s\n' "$FOUND" | sed -E 's/(ghp_|github_pat_|sk-|rnd_|sbp_|vck_|PT)[A-Za-z0-9_-]+/\1[REDACTED]/g'
              EXIT_CODE=1
            fi
          done
          exit "$EXIT_CODE"

  android-apk:
    name: Android release APK
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.buildApk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-35 build-tools;35.0.0' }
      - run: bun install
      - run: cd expo && bun install
      - run: cd expo/android && ./gradlew assembleRelease --no-daemon -x lint
      - run: sha256sum expo/android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ivx-holdings-apk
          path: expo/android/app/build/outputs/apk/release/*.apk
