name: IVX 112 Concurrent Worker Fix

on:
  push:
    branches:
      - fix/112-campaign-real-worker-dispatch
    paths:
      - '.github/workflows/ivx-112-concurrent-worker-fix.yml'
      - 'backend/services/ivx-senior-developer-worker.ts'
      - 'expo/ivxholding-landing/ivx-portal.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ivx-112-concurrent-worker-fix
  cancel-in-progress: false

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/112-campaign-real-worker-dispatch
          fetch-depth: 0

      - name: Verify bounded worker and repair stale status surface
        shell: python
        run: |
          from pathlib import Path
          path = Path('backend/services/ivx-senior-developer-worker.ts')
          text = path.read_text()
          required = [
              'export function getWorkerMaxConcurrency(): number',
              'const claimedJobIds = new Set<string>()',
              'claimedJobIds.add(job.jobId)',
              'const maxConcurrent = getWorkerMaxConcurrency()',
              'const results = await Promise.all(batch)',
          ]
          missing = [m for m in required if m not in text]
          if missing:
              raise SystemExit(f'CONCURRENCY_IMPLEMENTATION_MISSING: {missing}')
          old = """    concurrency: {
      globalExecutionSlots: 1,
      independentRuntimeCount: 0,
      classification: 'SHARED_WORKER_WITH_ROLE',
      note: 'The current worker is intentionally single-flight until isolated runtime leases are deployed and evidenced.',
    },
"""
          new = """    concurrency: {
      globalExecutionSlots: getWorkerMaxConcurrency(),
      independentRuntimeCount: getWorkerMaxConcurrency(),
      classification: 'BOUNDED_CONCURRENT_WORKER_LANES',
      note: 'Queued jobs use in-process claim isolation and per-owner single-flight; concurrency is bounded by IVX_WORKER_MAX_CONCURRENCY.',
    },
"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('STATUS_SURFACE_ANCHOR_MISSING')
          path.write_text(text)

      - name: Verify forgot-password source repair
        shell: python
        run: |
          from pathlib import Path
          path = Path('expo/ivxholding-landing/ivx-portal.js')
          text = path.read_text()
          good = "var showingForgot = window.getComputedStyle(forgotView).display === 'none';"
          if good not in text:
              raise SystemExit('FORGOT_PASSWORD_SOURCE_FIX_MISSING')
          print('FORGOT_PASSWORD_SOURCE_FIX_PRESENT')

      - name: Static assertions
        run: |
          set -euo pipefail
          grep -q "export function getWorkerMaxConcurrency" backend/services/ivx-senior-developer-worker.ts
          grep -q "const results = await Promise.all(batch)" backend/services/ivx-senior-developer-worker.ts
          grep -q "globalExecutionSlots: getWorkerMaxConcurrency()" backend/services/ivx-senior-developer-worker.ts
          grep -q "window.getComputedStyle(forgotView).display === 'none'" expo/ivxholding-landing/ivx-portal.js

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install Expo dependencies
        run: cd expo && bun install --frozen-lockfile

      - name: Backend TypeScript QA
        run: bunx tsc -p backend/tsconfig.json --noEmit

      - name: Focused worker and campaign tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find backend -type f \( -name '*senior-developer-worker*.test.ts' -o -name '*senior-developer-worker*.spec.ts' -o -name '*app-completion-campaign*.test.ts' -o -name '*app-completion-campaign*.spec.ts' \) -print)
          if [ "${#files[@]}" -gt 0 ]; then
            bun test "${files[@]}"
          fi

      - name: Install Playwright Chromium
        run: cd expo && bunx playwright install --with-deps chromium

      - name: Start branch-local landing server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory expo/ivxholding-landing > /tmp/ivx-landing.log 2>&1 &
          echo $! > /tmp/ivx-landing.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ivx-landing.log || true
          exit 1

      - name: Forgot-password Playwright QA against branch-local code
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: cd expo && bunx playwright test __tests__/e2e/ivx-forgot-password.spec.ts --config=playwright.config.ts

      - name: Commit QA-verified worker status repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/services/ivx-senior-developer-worker.ts; then
            echo "No worker source repair required."
            exit 0
          fi
          git config user.name "ivx-ci-worker"
          git config user.email "ivx-ci-worker@users.noreply.github.com"
          git add backend/services/ivx-senior-developer-worker.ts
          git commit -m "fix: expose real bounded worker concurrency"
          git push origin HEAD:fix/112-campaign-real-worker-dispatch
