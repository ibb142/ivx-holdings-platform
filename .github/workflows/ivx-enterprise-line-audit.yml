name: IVX Enterprise Line-by-Line Quality Audit

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'expo/**'
      - 'qa/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'bun.lock'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ivx-enterprise-line-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-line-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Exact repository line audit
        id: line_audit
        continue-on-error: true
        run: node qa/ivx-enterprise-line-audit.mjs

      - name: Enterprise Quality Firewall structural gates
        id: firewall
        continue-on-error: true
        run: node qa/ivx-enterprise-structural-gates.mjs

      - name: Repository consistency
        id: consistency
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.lock'; then
            echo 'Unresolved conflict markers detected.'
            exit 1
          fi

      - name: Backend TypeScript
        id: backend_typecheck
        continue-on-error: true
        run: bunx tsc --noEmit

      - name: Expo TypeScript
        id: expo_typecheck
        continue-on-error: true
        working-directory: expo
        run: bunx tsc --noEmit

      - name: Focused enterprise regression tests
        id: tests
        continue-on-error: true
        run: |
          bun test \
            backend/api/ivx-senior-developer-worker.test.ts \
            backend/ivx-autonomous-coder.test.ts \
            expo/__tests__/ivx-chat-turn-isolation.test.ts \
            expo/__tests__/chat-certificate-flow-regression.test.ts

      - name: Build immutable audit summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence
          jq -n \
            --arg marker 'IVX-ENTERPRISE-LINE-BY-LINE-CERT-GATE-V1' \
            --arg sourceSha "$GITHUB_SHA" \
            --arg lineAudit '${{ steps.line_audit.outcome }}' \
            --arg firewall '${{ steps.firewall.outcome }}' \
            --arg consistency '${{ steps.consistency.outcome }}' \
            --arg backendTypecheck '${{ steps.backend_typecheck.outcome }}' \
            --arg expoTypecheck '${{ steps.expo_typecheck.outcome }}' \
            --arg tests '${{ steps.tests.outcome }}' \
            '{marker:$marker,sourceSha:$sourceSha,generatedAt:(now|todate),gates:{lineAudit:$lineAudit,qualityFirewall:$firewall,repositoryConsistency:$consistency,backendTypecheck:$backendTypecheck,expoTypecheck:$expoTypecheck,focusedTests:$tests},certified:([$lineAudit,$firewall,$consistency,$backendTypecheck,$expoTypecheck,$tests]|all(.=="success"))}' \
            > qa/evidence/enterprise-cert-gate.json
          cat qa/evidence/enterprise-cert-gate.json

      - name: Upload full enterprise evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IVX-ENTERPRISE-LINE-AUDIT-${{ github.sha }}-${{ github.run_id }}
          path: |
            qa/evidence/enterprise-line-audit.json
            qa/evidence/enterprise-line-findings.json
            qa/evidence/enterprise-line-file-ledger.json
            qa/evidence/enterprise-line-ledger.jsonl
            qa/evidence/enterprise-quality-firewall.json
            qa/evidence/enterprise-cert-gate.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed until every enterprise gate is green
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.line_audit.outcome }}' = success
          test '${{ steps.firewall.outcome }}' = success
          test '${{ steps.consistency.outcome }}' = success
          test '${{ steps.backend_typecheck.outcome }}' = success
          test '${{ steps.expo_typecheck.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test "$(jq -r '.certified' qa/evidence/enterprise-cert-gate.json)" = true
          echo 'IVX_ENTERPRISE_LINE_BY_LINE_QUALITY=PASS'
