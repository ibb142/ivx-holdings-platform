name: IVX failed patrol recovery PostgreSQL proof
on:
  pull_request:
    paths:
      - 'scripts/ops/recover-failed-patrols*.mjs'
      - '.github/workflows/ivx-failed-patrol-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ops/recover-failed-patrols*.mjs'
      - '.github/workflows/ivx-failed-patrol-recovery.yml'
permissions:
  contents: read
jobs:
  recovery-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ivx_patrol_recovery_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Prove lease fencing, retry budgets, rollback and immutable evidence
        run: node scripts/ops/recover-failed-patrols.proof.mjs
        env:
          IVX_PATROL_RECOVERY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_patrol_recovery_test
