# IVX Android Emulator QA — GitHub Actions Ubuntu Runner
#
# Uses `npx expo run:android` which handles ALL the complexity:
#   - Expo prebuild (generates native Android project)
#   - Gradle build
#   - Boots an Android emulator
#   - Installs the APK
#   - Launches the app
#
# Then we capture screenshots and run Maestro flows.
#
# Triggers:
#   - Push to main (when chat files, Maestro flows, or this workflow change)
#   - Manual dispatch via GitHub Actions UI
#
# Secrets required (already configured in repo):
#   - EXPO_PUBLIC_SUPABASE_URL
#   - EXPO_PUBLIC_SUPABASE_ANON_KEY

name: Android Emulator QA

on:
  push:
    branches: [main]
    paths:
      - 'expo/app/ivx/chat.tsx'
      - 'expo/src/modules/chat/**'
      - 'expo/.maestro/**'
      - 'expo/eas.json'
      - 'expo/app.config.ts'
      - 'expo/package.json'
      - 'expo/assets/images/**'
      - 'expo/plugins/**'
      - '.github/workflows/android-emulator-qa.yml'
  workflow_dispatch:
    inputs:
      run_full_qa:
        description: 'Run full chat QA (requires OWNER_PASSWORD secret)'
        required: false
        default: false
        type: boolean

env:
  EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_QA_BUILD: 'true'
  OWNER_EMAIL: iperez4242@gmail.com

permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    name: Android Emulator Build + QA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_status: ${{ steps.build.outcome }}
      apk_path: ${{ steps.apk.outputs.path }}
      apk_hash: ${{ steps.apk.outputs.hash }}
      apk_size: ${{ steps.apk.outputs.size }}
      emulator_name: ${{ steps.emu.outputs.name }}
      android_version: ${{ steps.emu.outputs.version }}
      emulator_status: ${{ steps.emu.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        working-directory: expo
        run: |
          npm install --legacy-peer-deps

      - name: Verify Expo CLI
        working-directory: expo
        run: |
          echo "=== Node version ==="
          node --version
          echo "=== Expo CLI version ==="
          npx expo --version
          echo "=== Expo package version ==="
          node -e "console.log('expo:', require('expo/package.json').version)"

      - name: Expo prebuild (generate native Android project)
        working-directory: expo
        run: |
          npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_SOURCE_COMMIT_SHA: ${{ github.sha }}

      - name: Build Android APK (Release — includes JS bundle + assets)
        id: build
        working-directory: expo/android
        timeout-minutes: 30
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -o pipefail
          echo "=== Building RELEASE APK with Gradle (includes JS bundle + assets) ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint 2>&1 | tee gradle-build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "=== Gradle exit code: $GRADLE_EXIT ==="
          echo "build_exit=$GRADLE_EXIT" >> $GITHUB_OUTPUT
          if [ "$GRADLE_EXIT" -eq 0 ]; then
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "build_status=failed" >> $GITHUB_OUTPUT
            echo "=== BUILD FAILED — last 500 lines ==="
            tail -500 gradle-build.log
            echo "### Build Failure — Last 500 Lines" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -500 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Check build result
        working-directory: expo/android
        if: steps.build.outputs.build_status != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::Gradle build failed. Creating diagnostic issue."
          {
            echo "## Android Emulator QA Build Diagnostics"
            echo ""
            echo "**Commit:** ${GITHUB_SHA}"
            echo "**Run:** ${GITHUB_RUN_ID}"
            echo ""
            echo "### Gradle build output (last 400 lines)"
            echo '```'
            tail -400 gradle-build.log 2>/dev/null || echo "not found"
            echo '```'
          } > diagnostic-body.md
          gh label create "android-qa-diagnostic" --color "FBCA04" 2>/dev/null || true
          gh issue create \
            --title "Android QA Build Diagnostics — ${GITHUB_SHA:0:12}" \
            --body-file diagnostic-body.md \
            --label "android-qa-diagnostic" 2>&1 || \
          gh issue create --title "Android QA Build Diagnostics — ${GITHUB_SHA:0:12}" --body-file diagnostic-body.md 2>&1 || true
          exit 1

      - name: Find built APK
        id: apk
        working-directory: expo/android
        run: |
          echo "=== Searching for APK ==="
          # Search release first (has JS bundle), then debug as fallback
          APK_PATH=$(find . -path "*/release/*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found"
            find . -name "*.apk" 2>/dev/null
            exit 1
          fi
          APK_PATH_ABS="$(cd "$(dirname "$APK_PATH")" && pwd)/$(basename "$APK_PATH")"
          echo "path=$APK_PATH_ABS" >> $GITHUB_OUTPUT
          echo "APK found: $APK_PATH_ABS"
          ls -lh "$APK_PATH_ABS"
          # Compute SHA256 hash for verification
          APK_HASH=$(sha256sum "$APK_PATH_ABS" | awk '{print $1}')
          echo "hash=$APK_HASH" >> $GITHUB_OUTPUT
          echo "APK SHA256: $APK_HASH"
          APK_SIZE=$(stat -c%s "$APK_PATH_ABS" 2>/dev/null || stat -f%z "$APK_PATH_ABS" 2>/dev/null || echo 0)
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK size: $APK_SIZE bytes"

      # Upload the APK IMMEDIATELY after finding it, before emulator QA.
      # This ensures the APK artifact is available even if emulator QA fails.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ivx-android-apk-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      # ============================================================
      # Boot Android Emulator + Install + Test — ALL inside the runner
      # script block so the emulator stays alive for every step.
      # reactivecircus/android-emulator-runner@v2 ONLY keeps the emulator
      # booted during its `script` block. Moving steps outside kills adb.
      # NOTE: We do NOT use continue-on-error here. If the emulator QA
      # fails, that's a real failure we need to know about. The APK is
      # already uploaded above so it survives regardless.
      # ============================================================
      - name: Boot Emulator + Install APK + Launch + QA
        id: emu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "=== Emulator booted ==="
            adb devices
            EMU_NAME=$(adb shell getprop ro.product.model 2>/dev/null || echo "unknown")
            ANDROID_VER=$(adb shell getprop ro.build.version.release 2>/dev/null || echo "unknown")
            echo "name=$EMU_NAME" >> $GITHUB_OUTPUT
            echo "version=$ANDROID_VER" >> $GITHUB_OUTPUT
            echo "Emulator: $EMU_NAME (Android $ANDROID_VER)"

            echo "=== Installing APK ==="
            adb install -r "${{ steps.apk.outputs.path }}" || {
              echo "::warning::APK install failed — capturing diagnostics"
              adb logcat -d -t 200 > logcat.txt 2>&1 || true
              adb exec-out screencap -p > screenshot-01-install-fail.png 2>/dev/null || true
              exit 1
            }
            echo "APK installed successfully"

            echo "=== Launching app ==="
            adb shell am start -n com.ivxholdings.app/.MainActivity || {
              echo "::warning::App launch failed — capturing diagnostics"
              adb logcat -d -t 200 > logcat.txt 2>&1 || true
              adb exec-out screencap -p > screenshot-02-launch-fail.png 2>/dev/null || true
              exit 1
            }
            sleep 10
            adb exec-out screencap -p > screenshot-01-launch.png 2>/dev/null || true
            echo "Launch screenshot saved"

            echo "=== Capturing logcat ==="
            adb logcat -d -t 500 > logcat.txt 2>&1 || true

            echo "=== Installing Maestro ==="
            curl -Ls "https://get.maestro.mobile.dev" | bash || {
              echo "::warning::Maestro install failed — skipping Maestro tests"
              echo "maestro_result=skipped" >> $GITHUB_OUTPUT
              adb exec-out screencap -p > screenshot-02-post-test.png 2>/dev/null || true
              exit 0
            }
            echo "$HOME/.maestro/bin" >> $GITHUB_PATH
            export PATH="$HOME/.maestro/bin:$PATH"
            maestro --version || echo "Maestro version check failed"

            echo "=== Running Maestro launch test ==="
            cd "$GITHUB_WORKSPACE/expo"
            maestro test .maestro/ivx-app-launch.yaml --format junit --output maestro-launch-results.xml 2>&1 | tee maestro-launch.log || true
            echo "maestro_result=completed" >> $GITHUB_OUTPUT
            echo "Maestro launch test completed"

            echo "=== Post-test screenshot ==="
            adb exec-out screencap -p > screenshot-02-post-test.png 2>/dev/null || true

      # Create diagnostic issue if emulator QA failed
      - name: Emulator QA diagnostics
        if: steps.emu.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Emulator QA failed or was skipped. Creating diagnostic issue."
          {
            echo "## Android Emulator QA Diagnostics"
            echo ""
            echo "**Commit:** ${GITHUB_SHA}"
            echo "**Run:** ${GITHUB_RUN_ID}"
            echo "**APK:** Built successfully (step 8), found (step 10)"
            echo "**APK Hash:** ${{ steps.apk.outputs.hash }}"
            echo "**APK Size:** ${{ steps.apk.outputs.size }} bytes"
            echo "**Emulator step outcome:** ${{ steps.emu.outcome }}"
            echo ""
            echo "### Logcat (last 200 lines)"
            echo '```'
            tail -200 logcat.txt 2>/dev/null || echo "logcat not found"
            echo '```'
            echo ""
            echo "### Maestro log"
            echo '```'
            tail -50 expo/maestro-launch.log 2>/dev/null || echo "maestro log not found"
            echo '```'
            echo ""
            echo "> The APK was built successfully and is available as the \`ivx-android-apk-${GITHUB_SHA:0:12}\` artifact."
          } > diagnostic-body.md
          gh label create "android-emulator-diagnostic" --color "FBCA04" 2>/dev/null || true
          gh issue create \
            --title "Android Emulator QA Diagnostics — ${GITHUB_SHA:0:12}" \
            --body-file diagnostic-body.md \
            --label "android-emulator-diagnostic" 2>&1 || \
          gh issue create --title "Android Emulator QA Diagnostics — ${GITHUB_SHA:0:12}" --body-file diagnostic-body.md 2>&1 || true

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-qa-${{ github.sha }}
          path: |
            screenshot-*.png
            logcat.txt
            expo/android/gradle-build.log
            expo/maestro-launch-results.xml
            expo/maestro-launch.log
          retention-days: 30

      - name: Generate QA summary
        if: always()
        run: |
          echo "## Android Emulator QA Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Emulator | ${{ steps.emu.outputs.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Version | ${{ steps.emu.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Status | \`${{ steps.build.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Emulator QA | \`${{ steps.emu.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Hash | \`${{ steps.apk.outputs.hash }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | \`${{ steps.apk.outputs.size }} bytes\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- APK: \`ivx-android-apk-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Screenshots: \`screenshot-01-launch.png\`, \`screenshot-02-post-test.png\`" >> $GITHUB_STEP_SUMMARY
          echo "- Logcat: \`logcat.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "- Maestro results: \`maestro-launch-results.xml\`" >> $GITHUB_STEP_SUMMARY
