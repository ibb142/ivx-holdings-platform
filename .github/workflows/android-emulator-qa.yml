# IVX Android QA APK Build + Emulator QA
#
# Builds a disposable QA APK (with JS bundle + assets) using the committed
# expo/android/ directory, then installs it on an emulator and runs Maestro QA.
# Production release signing is handled only by android-production-signing.yml.
#
# Triggers:
#   - Push/PR when mobile certification surfaces change
#   - Manual dispatch via GitHub Actions UI

name: Android Emulator QA

on:
  push:
    branches: [main]
    paths:
      - 'expo/app/ivx/chat.tsx'
      - 'expo/app/login.tsx'
      - 'expo/app/forgot-password.tsx'
      - 'expo/src/modules/chat/**'
      - 'expo/.maestro/**'
      - 'expo/eas.json'
      - 'expo/app.config.ts'
      - 'expo/lib/open-access.ts'
      - 'expo/package.json'
      - 'expo/assets/images/**'
      - 'expo/plugins/**'
      - 'expo/scripts/certify-android-launch.sh'
      - '.github/workflows/android-emulator-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'expo/app/ivx/chat.tsx'
      - 'expo/app/login.tsx'
      - 'expo/app/forgot-password.tsx'
      - 'expo/src/modules/chat/**'
      - 'expo/.maestro/**'
      - 'expo/eas.json'
      - 'expo/app.config.ts'
      - 'expo/lib/open-access.ts'
      - 'expo/package.json'
      - 'expo/assets/images/**'
      - 'expo/plugins/**'
      - 'expo/scripts/certify-android-launch.sh'
      - '.github/workflows/android-emulator-qa.yml'
  workflow_dispatch:

env:
  EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
  NODE_ENV: production
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_QA_BUILD: 'true'
  EXPO_PUBLIC_IVX_OPEN_ACCESS_MODE: 'true'
  OWNER_EMAIL: iperez4242@gmail.com

permissions:
  contents: read

jobs:
  build-and-test:
    name: Android QA APK Build + Emulator QA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd expo
          bun install
          bun scripts/apply-patches.mjs
      - name: Prepare QA signing key
        run: |
          set -euo pipefail
          QA_KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$QA_KEYSTORE")"
          rm -f "$QA_KEYSTORE"
          keytool -genkeypair -v -keystore "$QA_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IVX CI QA, OU=Engineering, O=IVX Holdings, L=Miami, ST=Florida, C=US"
      - name: Build Android QA APK
        working-directory: expo/android
        env:
          IVX_QA_KEYSTORE: ${{ runner.home }}/.android/debug.keystore
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleQa --no-daemon -x lint 2>&1 | tee gradle-build.log
      - name: Find APK
        id: apk
        working-directory: expo/android
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/qa -name '*.apk' -type f | head -1)
          test -n "$APK_PATH"
          APK_PATH_ABS="$(cd "$(dirname "$APK_PATH")" && pwd)/$(basename "$APK_PATH")"
          echo "path=$APK_PATH_ABS" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "$APK_PATH_ABS" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ivx-android-qa-apk-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Emulator + Install APK + Launch + Maestro QA
        id: emu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/expo/scripts/certify-android-launch.sh" "${{ steps.apk.outputs.path }}" com.ivxholdings.app.owner screenshot-01-launch.png logcat.txt android-qa-launch.txt android-qa-package-version.txt "Home ready"
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-qa-${{ github.sha }}
          path: |
            screenshot-*.png
            logcat.txt
            expo/maestro-launch-results.xml
            expo/maestro-launch.log
            expo/android/gradle-build.log
