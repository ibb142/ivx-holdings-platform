name: IVX Feed and Fleet Configuration Inspection
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/inspect-feed-fleet-config.mjs'
      - 'scripts/ops/inspect-feed-fleet-config.test.mjs'
      - '.github/workflows/ivx-feed-fleet-config-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify redaction and read-only requests
        run: node --test scripts/ops/inspect-feed-fleet-config.test.mjs
      - name: Inspect exact IVX services without printing credentials
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/ops/inspect-feed-fleet-config.mjs
