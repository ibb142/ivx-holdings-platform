name: Canonical member read regressions

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/services/ivx-canonical-members.ts'
      - 'backend/api/ivx-canonical-members.ts'
      - 'qa/phase4-members-read-pressure.test.mjs'
      - '.github/workflows/canonical-members-read.yml'
  push:
    branches: [main]
    paths:
      - 'backend/services/ivx-canonical-members.ts'
      - 'backend/api/ivx-canonical-members.ts'
      - 'qa/phase4-members-read-pressure.test.mjs'
      - '.github/workflows/canonical-members-read.yml'

permissions:
  contents: read

jobs:
  member-read-regressions:
    name: Bounded canonical member reads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test qa/phase4-members-read-pressure.test.mjs
