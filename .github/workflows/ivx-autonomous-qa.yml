name: IVX Autonomous Worker QA

on:
  push:
    branches: [main]
    paths:
      - "backend/services/ivx-autonomous-coder*"
      - "backend/services/ivx-senior-developer*"
      - "backend/services/ivx-agent-*"
      - "backend/api/ivx-autonomous*"
      - "backend/api/ivx-agent-*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  autonomous-unit-tests:
    name: Autonomous coder unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install

      - name: Run autonomous coder tests
        run: |
          bun test \
            backend/services/ivx-autonomous-coder.test.ts \
            backend/services/ivx-autonomous-coder-factory.test.ts \
            backend/services/ivx-autonomous-e2e.test.ts \
            --reporter=dots 2>&1 | tail -10

      - name: Run senior developer tests
        run: |
          bun test \
            backend/services/ivx-senior-developer-worker.test.ts \
            backend/ivx-senior-developer-capabilities.test.ts \
            --reporter=dots 2>&1 | tail -10

      - name: Run agent runtime tests
        run: |
          bun test \
            backend/services/ivx-agent-runtime.test.ts \
            backend/services/ivx-agent-contracts.test.ts \
            --reporter=dots 2>&1 | tail -10

  autonomous-e2e-tests:
    name: Autonomous worker E2E (mocked GitHub + Render)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install

      - name: Run full autonomous E2E cycle
        run: |
          bun test \
            backend/services/ivx-autonomous-e2e.test.ts \
            --reporter=detailed 2>&1 | tail -30

  autonomous-rork-independence:
    name: Verify autonomous worker has no Rork dependency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for Rork references in autonomous code
        run: |
          # The autonomous worker must NOT depend on Rork at runtime
          FAILURES=0
          for file in \
            backend/services/ivx-autonomous-coder.ts \
            backend/services/ivx-senior-developer-worker.ts \
            backend/services/ivx-agent-runtime.ts \
            backend/services/ivx-agent-contracts.ts; do
            # Check for Rork API URLs (comments are OK)
            RORK_REFS=$(grep -n "rork\.com\|rork\.app\|@rork-ai\|withRorkMetro" "$file" 2>/dev/null | grep -v "^\s*//" | grep -v "^\s*\*" | wc -l || echo "0")
            if [ "$RORK_REFS" -gt 0 ]; then
              echo "::error::$file has $RORK_REFS runtime Rork references"
              grep -n "rork\.com\|rork\.app\|@rork-ai\|withRorkMetro" "$file" | grep -v "^\s*//" | grep -v "^\s*\*"
              FAILURES=$((FAILURES + 1))
            fi
          done
          if [ "$FAILURES" -gt 0 ]; then
            exit 1
          fi
          echo "✅ Autonomous worker has zero Rork runtime dependencies"

      - name: Verify GitHub token is GITHUB_TOKEN (not RORK_PUBLIC)
        run: |
          # The autonomous worker must read GITHUB_TOKEN, not RORK_PUBLIC_GITHUB_TOKEN
          for file in \
            backend/services/ivx-autonomous-coder.ts \
            backend/services/ivx-senior-developer-worker.ts; do
            if grep -q "RORK_PUBLIC_GITHUB_TOKEN" "$file" 2>/dev/null; then
              echo "::error::$file still references RORK_PUBLIC_GITHUB_TOKEN"
              exit 1
            fi
          done
          echo "✅ Autonomous worker uses GITHUB_TOKEN (no RORK_PUBLIC fallback)"
