name: IVX Android Release Self-Heal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ivx-android-release-selfheal.yml

permissions:
  contents: write

jobs:
  update-landing-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update canonical APK references and remove helper
        shell: bash
        run: |
          set -euo pipefail
          file='expo/ivxholding-landing/index.html'
          old='ivx-holdings-v1.10.4.apk'
          new='ivx-holdings-v1.10.13.apk'
          before=$(grep -oF "$old" "$file" | wc -l | tr -d ' ')
          echo "stale_references=$before"
          if [ "$before" -ne 4 ]; then
            echo "Expected exactly 4 stale APK references; found $before"
            exit 1
          fi
          sed -i "s/${old}/${new}/g" "$file"
          after_old=$(grep -oF "$old" "$file" | wc -l | tr -d ' ' || true)
          after_new=$(grep -oF "$new" "$file" | wc -l | tr -d ' ')
          echo "remaining_stale=$after_old canonical_references=$after_new"
          if [ "$after_old" -ne 0 ] || [ "$after_new" -lt 4 ]; then
            echo 'Landing APK reference rewrite failed verification'
            exit 1
          fi
          rm -f .github/workflows/ivx-android-release-selfheal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file" .github/workflows/ivx-android-release-selfheal.yml
          git commit -m 'fix(android): align landing APK references with 1.10.13'
          git push origin HEAD:main
