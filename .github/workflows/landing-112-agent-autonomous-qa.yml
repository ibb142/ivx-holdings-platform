name: Landing 112-Agent Autonomous QA War Room

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/landing-112-agent-autonomous-qa.yml'
      - 'qa/landing-112-agent-war-room.md'
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    env:
      API_BASE: https://api.ivxholding.com
    steps:
      - uses: actions/checkout@v4

      - name: Load exact 112-agent registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = 'true'
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = '112'
          test "$(jq '[.agents[].agentNumber] | unique | length' /tmp/agents.json)" = '112'
          matrix=$(jq -c '{include:[.agents[] | {agentNumber:.agentNumber,agentId:.agentId,name:.name,role:.role,division:.division}]}' /tmp/agents.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo 'registry_112=PASS'

  activate-112:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      API_BASE: https://api.ivxholding.com
      IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve owner/system binding without exposing values
        shell: bash
        run: |
          set -euo pipefail
          SYSTEM_KEY="${IVX_AI_SYSTEM_SECRET:-${IVX_SYSTEM_SECRET:-}}"
          test -n "$SYSTEM_KEY"
          echo "::add-mask::$SYSTEM_KEY"
          echo "SYSTEM_KEY=$SYSTEM_KEY" >> "$GITHUB_ENV"

      - name: Resolve exact landing assignment
        id: assignment
        shell: bash
        env:
          AGENT_NUMBER: ${{ matrix.agentNumber }}
        run: |
          set -euo pipefail
          n=$(printf '%03d' "$AGENT_NUMBER")
          line=$(grep -E "^${n} — " qa/landing-112-agent-war-room.md | head -1 || true)
          test -n "$line" || { echo "Missing assignment for agent $n"; exit 1; }
          task=${line#* — }
          echo "task<<EOF" >> "$GITHUB_OUTPUT"
          echo "$task" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
          echo "agent=$n task=$task"

      - name: Execute REAL engineering QA tool through agent runtime
        id: work
        shell: bash
        env:
          AGENT_NUMBER: ${{ matrix.agentNumber }}
          AGENT_ID: ${{ matrix.agentId }}
          AGENT_NAME: ${{ matrix.name }}
          TASK: ${{ steps.assignment.outputs.task }}
        run: |
          set -euo pipefail
          contract_http=$(curl -sS --max-time 25 -o /tmp/contract.json -w '%{http_code}' "${API_BASE}/api/ivx/agents/${AGENT_ID}/contract" || true)
          test "$contract_http" = 200
          task_type=$(jq -r '[.contract.allowedTaskTypes[]? | select(. == "audit" or . == "analysis" or . == "research")] | .[0] // .contract.allowedTaskTypes[0] // empty' /tmp/contract.json)
          test -n "$task_type"

          # Distribute real engineering tools across all 112 workers. Every agent
          # has the read-only engineering toolset; no simulated/public-chat packet.
          mod=$((AGENT_NUMBER % 6))
          case "$mod" in
            0) tool='run_tests'; params='{"target":"backend"}' ;;
            1) tool='code_search'; params='{"pattern":"landing","scope":"expo/ivxholding-landing"}' ;;
            2) tool='code_read'; params='{"path":"expo/ivxholding-landing/index.html"}' ;;
            3) tool='lint'; params='{}' ;;
            4) tool='typecheck'; params='{}' ;;
            5) tool='secret_scan'; params='{}' ;;
          esac

          task_id="landing112-${GITHUB_RUN_ID}-$(printf '%03d' "$AGENT_NUMBER")"
          body=$(jq -nc \
            --arg taskType "$task_type" \
            --arg token "$SYSTEM_KEY" \
            --arg taskId "$task_id" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg assignment "$TASK" \
            --arg toolId "$tool" \
            --argjson toolParams "$params" \
            '{taskType:$taskType,ownerApprovalToken:$token,payload:{__taskId:$taskId,__runId:("landing112-" + $taskId),__workflow:"Landing 112-Agent Autonomous QA War Room",sourceSha:$sourceSha,landingAssignment:$assignment,__toolId:$toolId,__toolParams:$toolParams,realExecutionOnly:true,simulatedSuccessAllowed:false}}')

          http=$(curl -sS --retry 1 --retry-delay 1 --max-time 180 -o /tmp/run.json -w '%{http_code}' \
            -X POST "${API_BASE}/api/ivx/agents/${AGENT_ID}/run" \
            -H 'Content-Type: application/json' \
            -H "x-ivx-owner-key: ${SYSTEM_KEY}" \
            --data "$body" || true)

          ok=false
          final_status='request_failed'
          source=''
          tool_result=''
          simulated='null'
          if [ "$http" = 200 ]; then
            ok=$(jq -r '.ok // false' /tmp/run.json)
            final_status=$(jq -r '.runRecord.finalStatus // "unknown"' /tmp/run.json)
            source=$(jq -r '.runRecord.sourceReference // empty' /tmp/run.json)
            tool_result=$(jq -r '.runRecord.toolResultId // empty' /tmp/run.json)
            simulated=$(jq -r 'if .runRecord.simulated == null then "null" else (.runRecord.simulated|tostring) end' /tmp/run.json)
          fi

          passed=false
          if [ "$http" = 200 ] && [ "$ok" = true ] && [ "$final_status" = completed ] && [ -n "$source" ] && [ -n "$tool_result" ] && [ "$simulated" = false ]; then
            passed=true
          fi

          mkdir -p evidence
          jq -n \
            --argjson agentNumber "$AGENT_NUMBER" \
            --arg agentId "$AGENT_ID" \
            --arg name "$AGENT_NAME" \
            --arg assignment "$TASK" \
            --arg toolId "$tool" \
            --arg taskType "$task_type" \
            --arg http "$http" \
            --argjson ok "$ok" \
            --arg finalStatus "$final_status" \
            --arg sourceReference "$source" \
            --arg toolResultId "$tool_result" \
            --argjson simulated "$simulated" \
            --argjson passed "$passed" \
            '{agentNumber:$agentNumber,agentId:$agentId,name:$name,assignment:$assignment,toolId:$toolId,taskType:$taskType,http:$http,ok:$ok,finalStatus:$finalStatus,sourceReference:$sourceReference,toolResultId:$toolResultId,simulated:$simulated,passed:$passed}' \
            > "evidence/agent-${AGENT_NUMBER}.json"

          cat "evidence/agent-${AGENT_NUMBER}.json"
          test "$passed" = true

      - name: Upload real agent QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-agent-${{ matrix.agentNumber }}-${{ github.run_id }}
          path: evidence/agent-${{ matrix.agentNumber }}.json
          if-no-files-found: warn
          retention-days: 7

  summary:
    needs: [prepare, activate-112]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: War-room status
        shell: bash
        run: |
          set -euo pipefail
          echo 'Landing 112-agent REAL engineering QA cycle completed or attempted.'
          echo 'Each PASS requires /api/ivx/agents/:id/run + a real engineering tool + sourceReference + toolResultId + simulated=false.'
          echo 'Production GO still requires deterministic landing hard gates and any discovered P0/P1 fixes.'
