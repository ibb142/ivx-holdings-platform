name: Landing 112-Agent Autonomous QA War Room

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/landing-112-agent-autonomous-qa.yml'
      - 'qa/landing-112-agent-war-room.md'
      - 'backend/api/ivx-agent-api.ts'
      - 'backend/services/ivx-github-actions-oidc.ts'
      - 'backend/services/ivx-agent-real-tools.ts'
      - 'backend/services/ivx-agent-engineering-tools.ts'
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    env:
      API_BASE: https://api.ivxholding.com
    steps:
      - uses: actions/checkout@v4
      - name: Load exact 112-agent registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = 'true'
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = '112'
          test "$(jq '[.agents[].agentNumber] | unique | length' /tmp/agents.json)" = '112'
          matrix=$(jq -c '{include:[.agents[] | {agentNumber:.agentNumber,agentId:.agentId,name:.name,role:.role,division:.division}]}' /tmp/agents.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo 'registry_112=PASS'

  activate-112:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      API_BASE: https://api.ivxholding.com
    steps:
      - uses: actions/checkout@v4
      - name: Run durable real engineering cycles to queue drain (fail-closed)
        id: realwork
        shell: bash
        env:
          AGENT_NUMBER: ${{ matrix.agentNumber }}
          AGENT_ID: ${{ matrix.agentId }}
          AGENT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          contract_http=$(curl -sS --max-time 25 -o /tmp/contract.json -w '%{http_code}' "${API_BASE}/api/ivx/agents/${AGENT_ID}/contract" || true)
          test "$contract_http" = 200

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery"
          oidc_token=$(curl -fsS --retry 2 --retry-delay 1 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value // empty')
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"

          mkdir -p evidence/cycles
          completed=0; gated=0; failed=0; productive="0.0"; cycles=0; first_task=''; modules='[]'; http='000'
          # Durable engineering loop: claim -> analyze -> verify -> complete or
          # OWNER_GATE -> immediately claim the next task. Success is defined by
          # durable task-engine records, never by workflow conclusion.
          while [ "$cycles" -lt 12 ]; do
            cycles=$((cycles + 1))
            body=$(jq -nc --arg sourceSha "$GITHUB_SHA" '{sourceSha:$sourceSha}')
            http=$(curl -sS --retry 1 --retry-delay 2 --max-time 240 -o /tmp/cycle.json -w '%{http_code}' -X POST "${API_BASE}/api/ivx/agents/${AGENT_ID}/engineering-cycle" -H 'Content-Type: application/json' -H "X-IVX-GitHub-OIDC: ${oidc_token}" --data "$body" || true)
            if [ "$http" != 200 ]; then echo "CYCLE_HTTP_FAIL agent=$AGENT_NUMBER http=$http"; failed=$((failed + 1)); break; fi
            action=$(jq -r '.result.action // "CYCLE_ERROR"' /tmp/cycle.json)
            cp /tmp/cycle.json "evidence/cycles/cycle-${cycles}.json"
            case "$action" in
              TASK_COMPLETED)
                completed=$((completed + 1))
                tid=$(jq -r '.result.taskId // empty' /tmp/cycle.json); [ -n "$tid" ] && [ -z "$first_task" ] && first_task="$tid"
                mods=$(jq -c '[.result.filesInspected[]?]' /tmp/cycle.json); modules=$(jq -nc --argjson a "$modules" --argjson b "$mods" '$a + b | unique')
                pm=$(jq -r '.result.productiveMinutes // 0' /tmp/cycle.json); productive=$(awk -v a="$productive" -v b="$pm" 'BEGIN{printf "%.1f", a+b}')
                ;;
              TASK_OWNER_GATE)
                gated=$((gated + 1))
                pm=$(jq -r '.result.productiveMinutes // 0' /tmp/cycle.json); productive=$(awk -v a="$productive" -v b="$pm" 'BEGIN{printf "%.1f", a+b}')
                ;;
              NO_TASK_AVAILABLE)
                break
                ;;
              *)
                failed=$((failed + 1))
                echo "CYCLE_REJECTED agent=$AGENT_NUMBER action=$action"
                break
                ;;
            esac
          done

          # Real-work gate: at least one durable, evidence-backed engineering task.
          real_work=false
          if [ "$completed" -gt 0 ] || [ "$gated" -gt 0 ]; then real_work=true; fi
          quality='REJECTED'
          if [ "$real_work" = true ]; then quality='DURABLE_ENGINEERING_PASS'; fi
          jq -n --argjson agentNumber "$AGENT_NUMBER" --arg agentId "$AGENT_ID" --arg name "$AGENT_NAME" --arg sourceSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg authSource 'github_oidc' --arg workDefinition 'durable_engineering_cycle' --arg taskId "$first_task" --argjson cycles "$cycles" --argjson tasksCompleted "$completed" --argjson tasksOwnerGated "$gated" --argjson tasksFailed "$failed" --argjson productiveMinutes "$productive" --argjson modules "$modules" --argjson realWork "$real_work" --argjson ok "$real_work" --argjson passed "$real_work" --arg quality "$quality" --arg finalStatus "$quality" --arg http "$http" '{agentNumber:$agentNumber,agentId:$agentId,name:$name,sourceSha:$sourceSha,runId:$runId,authSource:$authSource,workDefinition:$workDefinition,taskId:$taskId,cycles:$cycles,tasksCompleted:$tasksCompleted,tasksOwnerGated:$tasksOwnerGated,tasksFailed:$tasksFailed,productiveMinutes:$productiveMinutes,modules:$modules,realWork:$realWork,http:$http,ok:$ok,finalStatus:$finalStatus,simulated:false,realToolUsed:$realWork,verifiedOutput:$realWork,passed:$passed,quality:$quality}' > "evidence/agent-${AGENT_NUMBER}.json"
          cat "evidence/agent-${AGENT_NUMBER}.json"
          test "$real_work" = true
      - name: Upload real agent QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-agent-${{ matrix.agentNumber }}-${{ github.run_id }}
          path: evidence/agent-${{ matrix.agentNumber }}.json
          if-no-files-found: warn
          retention-days: 7

  radar:
    needs: [prepare, activate-112]
    if: ${{ always() && needs.prepare.result == 'success' && needs.activate-112.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://api.ivxholding.com
      SYSTEM_KEY: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
    steps:
      - name: Download all agent evidence
        uses: actions/download-artifact@v4
        with:
          pattern: landing-agent-*-${{ github.run_id }}
          path: radar-evidence
          merge-multiple: true
      - name: Diagnose and classify rejected work
        id: diagnose
        shell: bash
        run: |
          set -euo pipefail
          jq -s '[.[] | select(.passed != true or .quality != "DURABLE_ENGINEERING_PASS")]' radar-evidence/agent-*.json > /tmp/failures.json
          count=$(jq 'length' /tmp/failures.json)
          test "$count" -gt 0
          echo "failed_count=$count" >> "$GITHUB_OUTPUT"
          if jq -e '[.[] | (.assignment + " " + .toolId + " " + .name)] | join(" ") | test("secret|credential|auth|permission|payment|stripe|migration|destructive|infrastructure|iam|cloudfront|route53|security policy|rollback"; "i")' /tmp/failures.json >/dev/null; then gate=true; else gate=false; fi
          echo "owner_gate_required=$gate" >> "$GITHUB_OUTPUT"
          jq '{rejectedAgents:length, agents:[.[]|{agentNumber,agentId,name,assignment,toolId,http,finalStatus,quality,attempts}]}' /tmp/failures.json
      - name: Owner Gate high-risk failures
        if: ${{ steps.diagnose.outputs.owner_gate_required == 'true' }}
        run: |
          echo 'RADAR=OWNER_GATE_REQUIRED'
          exit 1
      - name: Delegate rejected work for correct redo
        if: ${{ steps.diagnose.outputs.owner_gate_required != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SYSTEM_KEY:-}"
          failures=$(jq -c '.' /tmp/failures.json)
          goal="IVX ENTERPRISE QUALITY REDO. Source run ${GITHUB_RUN_ID}, exact SHA ${GITHUB_SHA}. The following agent work was rejected as failed, shallow, mid-quality, bad-quality, or unverified. Diagnose root cause and REDO the actual assigned work. Do not weaken tests, evidence, quality gates, or 112/112. Do not mark complete until task-specific tests/typecheck/lint/evidence prove enterprise quality. Produce commit/PR/CI/merge/live exact-SHA proof for safe low-risk fixes. Stop only for secrets/auth/permissions/payments/destructive migrations/infrastructure/security/critical rollback. Rejected work: ${failures}"
          payload=$(jq -n --arg goal "$goal" '{goal:$goal,executionMode:"code_change",templateMode:"BUG_FIX",approvePatch:true,approveGitDeploy:true,validationMode:"typecheck",systemMode:true,ownerApproved:true,riskLevel:"low",proposedPlan:"Reject weak output; redo assigned work from root cause; preserve Owner Gates and fail-closed 112/112 enterprise certification."}')
          http=$(curl -sS --max-time 60 -o /tmp/self-heal.json -w '%{http_code}' -X POST "${API_BASE}/api/ivx/senior-developer/worker/jobs" -H 'Content-Type: application/json' -H "X-IVX-System-Key: ${SYSTEM_KEY}" --data "$payload")
          case "$http" in 200|202|409) ;; *) cat /tmp/self-heal.json; exit 1;; esac
          job_id=$(jq -r '.jobId // .activeJobId // .job.jobId // empty' /tmp/self-heal.json)
          test -n "$job_id"
          echo "enterprise_redo_job=$job_id"
      - name: Persist inline radar evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IVX-INLINE-RADAR-${{ github.run_id }}
          path: |
            /tmp/failures.json
            /tmp/self-heal.json
          if-no-files-found: ignore
          retention-days: 30

  certificate:
    needs: [prepare, activate-112, radar]
    if: ${{ always() && needs.prepare.result == 'success' && needs.activate-112.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all 112 evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: landing-agent-*-${{ github.run_id }}
          path: evidence-all
          merge-multiple: true
      - name: Build fail-closed 112/112 enterprise-quality certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certificate
          count=$(find evidence-all -maxdepth 1 -type f -name 'agent-*.json' | wc -l | tr -d ' ')
          test "$count" = 112
          jq -s '.' evidence-all/agent-*.json > /tmp/all.json
          test "$(jq 'length' /tmp/all.json)" = 112
          test "$(jq '[.[].agentNumber] | unique | length' /tmp/all.json)" = 112
          test "$(jq --arg sha "$GITHUB_SHA" '[.[] | select(.sourceSha == $sha)] | length' /tmp/all.json)" = 112
          test "$(jq --arg run "$GITHUB_RUN_ID" '[.[] | select(.runId == $run)] | length' /tmp/all.json)" = 112
          test "$(jq '[.[] | select(.passed == true and .realWork == true and .quality == "DURABLE_ENGINEERING_PASS" and .simulated == false and .authSource == "github_oidc" and ((.tasksCompleted + .tasksOwnerGated) >= 1) and ((.cycles|type) == "number") and ((.productiveMinutes|type) == "number")] | length' /tmp/all.json)" = 112
          # Fleet-level durable gate: at least one real engineering task completed
          # in the durable task engine across the fleet this run.
          test "$(jq '[.[].tasksCompleted] | add' /tmp/all.json)" -ge 1
          jq -n --arg marker 'IVX-LANDING-112-ENTERPRISE-QUALITY-CERTIFICATE' --arg sourceSha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg repository "$GITHUB_REPOSITORY" --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --slurpfile agents /tmp/all.json '{marker:$marker,sourceSha:$sourceSha,runId:$runId,repository:$repository,generatedAt:$generatedAt,totalAgents:112,uniqueAgents:112,passedAgents:112,rejectedAgents:0,simulatedAgents:0,realToolAgents:112,verifiedOutputAgents:112,enterpriseQualityAgents:112,status:"PASS",agents:$agents[0]}' > "certificate/LANDING-112-ENTERPRISE-QUALITY-CERTIFICATE-${GITHUB_SHA}.json"
          sha256sum "certificate/LANDING-112-ENTERPRISE-QUALITY-CERTIFICATE-${GITHUB_SHA}.json" > certificate/SHA256SUMS.txt
      - name: Upload durable 112/112 enterprise certificate
        uses: actions/upload-artifact@v4
        with:
          name: LANDING-112-ENTERPRISE-QUALITY-CERTIFICATE-${{ github.sha }}
          path: certificate/
          if-no-files-found: error
          retention-days: 30
      - name: Publish certificate summary
        run: |
          echo '## Landing 112/112 enterprise-quality certificate' >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo '- Quality policy: MID/BAD/UNVERIFIED = REJECT + REDO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Agents: 112/112 ENTERPRISE_PASS' >> "$GITHUB_STEP_SUMMARY"
