name: Android v1.10.32 Mission Control Delivery

on:
  push:
    branches: [main]
    paths:
      - 'expo/app/ivx/landing-workers-live.tsx'
      - 'expo/shared/ivx/live-fleet-dashboard.ts'
      - 'expo/__tests__/live-fleet-dashboard.test.ts'
      - 'qa/ivx-phase2-mission.ts'
      - 'qa/ivx-phase3-4-500-mission.ts'
      - 'qa/ivx-runtime-orchestrator.ts'
      - '.github/workflows/ivx-runtime-activation.yml'
      - '.github/workflows/android-v11031-dashboard-delivery.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-certify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    outputs:
      apk_hash: ${{ steps.apk.outputs.hash }}
    env:
      IVX_RELEASE_KEYSTORE_BASE64: ${{ secrets.IVX_RELEASE_KEYSTORE_BASE64 }}
      IVX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.IVX_RELEASE_KEYSTORE_PASSWORD }}
      IVX_RELEASE_KEY_ALIAS: ${{ secrets.IVX_RELEASE_KEY_ALIAS }}
      IVX_RELEASE_KEY_PASSWORD: ${{ secrets.IVX_RELEASE_KEY_PASSWORD }}
      NODE_ENV: production
      EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun install
          cd expo
          bun install
          bun scripts/apply-patches.mjs

      - name: Dashboard source hard gate
        run: |
          set -euo pipefail
          test -f expo/app/ivx/landing-workers-live.tsx
          grep -q 'IVX MISSION CONTROL' expo/app/ivx/landing-workers-live.tsx
          grep -Fq '/api/ivx/live-work/agents?enterpriseDashboard=1&view=live' expo/app/ivx/landing-workers-live.tsx
          grep -Fq 'currentLiveFleet(payload, error, now)' expo/app/ivx/landing-workers-live.tsx
          grep -q 'POLL_MS = 5_000' expo/app/ivx/landing-workers-live.tsx
          cd expo
          bun test __tests__/live-fleet-dashboard.test.ts
          bunx tsc --noEmit

      - name: Validate production signing
        run: |
          set -euo pipefail
          for variable in IVX_RELEASE_KEYSTORE_BASE64 IVX_RELEASE_KEYSTORE_PASSWORD IVX_RELEASE_KEY_ALIAS IVX_RELEASE_KEY_PASSWORD; do
            test -n "${!variable}"
          done
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/ivx-release.keystore"
          printf '%s' "$IVX_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$IVX_RELEASE_KEYSTORE_PASSWORD" -alias "$IVX_RELEASE_KEY_ALIAS" >/dev/null
          echo "IVX_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Pin native APK version to 1.10.32 / 130
        working-directory: expo
        run: |
          set -euo pipefail
          sed -E -i 's/versionCode [0-9]+/versionCode 130/' android/app/build.gradle
          sed -E -i 's/versionName "[^"]+"/versionName "1.10.32"/' android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle | head

      - name: Build signed production APK
        working-directory: expo/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint 2>&1 | tee "$GITHUB_WORKSPACE/gradle-v11032.log"

      - name: Verify signing and package APK
        id: apk
        working-directory: expo/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apksigner-v11032.txt"
          HASH=$(sha256sum "$APK" | awk '{print $1}')
          cp "$APK" "$GITHUB_WORKSPACE/IVX-Holdings-v1.10.32-MISSION-CONTROL.apk"
          echo "$HASH  IVX-Holdings-v1.10.32-MISSION-CONTROL.apk" > "$GITHUB_WORKSPACE/IVX-Holdings-v1.10.32-MISSION-CONTROL.sha256"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: IVX-Holdings-v1.10.32-MISSION-CONTROL-${{ github.sha }}
          path: |
            IVX-Holdings-v1.10.32-MISSION-CONTROL.apk
            IVX-Holdings-v1.10.32-MISSION-CONTROL.sha256
            apksigner-v11032.txt
            gradle-v11032.log
          retention-days: 30
          if-no-files-found: error

  android-launch:
    name: Signed APK Android emulator gate
    needs: build-certify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the signed APK from this run
        uses: actions/download-artifact@v4
        with:
          name: IVX-Holdings-v1.10.32-MISSION-CONTROL-${{ github.sha }}
          path: apk-under-test
      - name: Verify the tested APK matches the build receipt
        working-directory: apk-under-test
        env:
          EXPECTED_APK_SHA256: ${{ needs.build-certify.outputs.apk_hash }}
        run: |
          set -euo pipefail
          sha256sum --check IVX-Holdings-v1.10.32-MISSION-CONTROL.sha256
          test "$(sha256sum IVX-Holdings-v1.10.32-MISSION-CONTROL.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold-launch the signed APK twice and verify visible Sign In
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          script: bash expo/scripts/certify-android-launch.sh apk-under-test/IVX-Holdings-v1.10.32-MISSION-CONTROL.apk com.ivxholdings.app android-launch.png android-runtime-logcat.txt android-launch.txt android-package-version.txt "Sign In"
      - name: Preserve Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-emulator-${{ github.sha }}
          path: |
            android-launch*.png
            android-launch*.txt
            android-launch*-ui.xml
            android-runtime-logcat.txt
            android-package-version.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Write dashboard APK certificate
        env:
          APK_SHA256: ${{ needs.build-certify.outputs.apk_hash }}
        run: |
          set -euo pipefail
          mkdir -p qa/evidence
          jq -n \
            --arg marker 'IVX-MISSION-CONTROL-APK-CERTIFICATE' \
            --arg sourceSha "$GITHUB_SHA" \
            --arg version '1.10.32' \
            --argjson versionCode 130 \
            --arg apkSha256 "$APK_SHA256" \
            --arg artifact "IVX-Holdings-v1.10.32-MISSION-CONTROL-${GITHUB_SHA}" \
            '{marker:$marker,sourceSha:$sourceSha,version:$version,versionCode:$versionCode,apkSha256:$apkSha256,artifact:$artifact,signed:true,typecheck:true,androidEmulator:true,coldLaunches:2,visibleScreen:"Sign In",authenticatedHomeVerified:false,certificateScope:"Production signature, source checks and unauthenticated Android cold launch. Authenticated Home and fleet continuity require separate evidence.",dashboardRoute:"/ivx/landing-workers-live",status:"PASS"}' \
            > qa/evidence/ivx-mission-control-apk-certificate.json

      - name: Upload certificate
        uses: actions/upload-artifact@v4
        with:
          name: IVX-MISSION-CONTROL-APK-CERTIFICATE-${{ github.sha }}
          path: qa/evidence/ivx-mission-control-apk-certificate.json
          retention-days: 30
          if-no-files-found: error

# rebuild trigger: latest dashboard APK requested 2026-09-05
# rebuild trigger: include all merged updates through PR #1019 and latest main
# rebuild trigger: human QA realtime crash + owner control modules fixed through PR #1022
