name: Android v1.10.34 Mission Control Delivery

on:
  push:
    branches: [main]
    paths:
      - 'expo/app/ivx/landing-workers-live.tsx'
      - 'qa/ivx-phase2-mission.ts'
      - 'qa/ivx-phase3-4-500-mission.ts'
      - 'qa/ivx-runtime-orchestrator.ts'
      - '.github/workflows/ivx-runtime-activation.yml'
      - '.github/workflows/android-v11031-dashboard-delivery.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-certify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      IVX_RELEASE_KEYSTORE_BASE64: ${{ secrets.IVX_RELEASE_KEYSTORE_BASE64 }}
      IVX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.IVX_RELEASE_KEYSTORE_PASSWORD }}
      IVX_RELEASE_KEY_ALIAS: ${{ secrets.IVX_RELEASE_KEY_ALIAS }}
      IVX_RELEASE_KEY_PASSWORD: ${{ secrets.IVX_RELEASE_KEY_PASSWORD }}
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=6144
      EXPO_PUBLIC_IVX_OPEN_ACCESS_MODE: 'false'
      EXPO_PUBLIC_SOURCE_COMMIT_SHA: ${{ github.sha }}
      IVX_APP_ID: com.ivxholdings.app
      OWNER_EMAIL: iperez4242@gmail.com
      OWNER_PASSWORD_S1: ${{ secrets.OWNER_NEW_PASSWORD }}
      OWNER_PASSWORD_S2: ${{ secrets.OWNER_PASSWORD }}
      OWNER_PASSWORD_S3: ${{ secrets.IVX_OWNER_PASSWORD }}
      OWNER_PASSWORD_S4: ${{ secrets.IVX_OWNER_NEW_PASSWORD }}
      OWNER_PASSWORD_S5: ${{ secrets.OWNER_LOGIN_PASSWORD }}
      OWNER_PASSWORD_S6: ${{ secrets.IVX_OWNER_LOGIN_PASSWORD }}
      EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
      EXPO_PUBLIC_IVX_API_BASE_URL: https://api.ivxholding.com
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd expo
          bun install --frozen-lockfile
          bun scripts/apply-patches.mjs

      - name: Dashboard source hard gate
        run: |
          set -euo pipefail
          test -f expo/app/ivx/landing-workers-live.tsx
          grep -q 'IVX MISSION CONTROL' expo/app/ivx/landing-workers-live.tsx
          grep -q 'durable agent execution ledger' expo/app/ivx/landing-workers-live.tsx
          grep -q 'Operational radar visualization only' expo/app/ivx/landing-workers-live.tsx
          grep -q 'POLL_MS = 5_000' expo/app/ivx/landing-workers-live.tsx
          python3 scripts/__tests__/test_maestro_route_results.py
          python3 scripts/__tests__/test_native_handoff_identity.py
          node --test scripts/__tests__/ivx-dashboard-read-live-cert.test.mjs
          bun test backend/services/ivx-dashboard-read-cache.test.ts backend/services/ivx-chat-autonomous-handoff.regression.test.ts
          cd expo
          bunx tsc --noEmit
          bun test __tests__/native-intent-routing.test.ts __tests__/chat-certificate-flow-regression.test.ts __tests__/chat-transport-reliability.test.ts __tests__/public-chat-owner-stream.test.ts __tests__/live-telemetry-request.test.ts __tests__/bounded-shared-read.test.ts __tests__/deferred-auth-listener.test.ts src/modules/ivx-owner-ai/services/ivxOwnerIntentClassifier.test.ts

      - name: Resolve real owner credential binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OWNER_EMAIL"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          owner_password=''
          binding='none'
          for pair in \
            'OWNER_NEW_PASSWORD:OWNER_PASSWORD_S1' \
            'OWNER_PASSWORD:OWNER_PASSWORD_S2' \
            'IVX_OWNER_PASSWORD:OWNER_PASSWORD_S3' \
            'IVX_OWNER_NEW_PASSWORD:OWNER_PASSWORD_S4' \
            'OWNER_LOGIN_PASSWORD:OWNER_PASSWORD_S5' \
            'IVX_OWNER_LOGIN_PASSWORD:OWNER_PASSWORD_S6'; do
            name=${pair%%:*}
            var=${pair##*:}
            value=${!var:-}
            if [ -n "$value" ]; then owner_password="$value"; binding="$name"; break; fi
          done
          test -n "$owner_password"
          echo "::add-mask::$owner_password"
          {
            echo 'OWNER_PASSWORD_EFFECTIVE<<IVX_EOF'
            echo "$owner_password"
            echo 'IVX_EOF'
            echo "OWNER_PASSWORD_BINDING=$binding"
          } >> "$GITHUB_ENV"
          echo "owner_password_binding=$binding"

      - name: Validate production signing
        run: |
          set -euo pipefail
          for variable in IVX_RELEASE_KEYSTORE_BASE64 IVX_RELEASE_KEYSTORE_PASSWORD IVX_RELEASE_KEY_ALIAS IVX_RELEASE_KEY_PASSWORD; do
            test -n "${!variable}"
          done
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/ivx-release.keystore"
          printf '%s' "$IVX_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$IVX_RELEASE_KEYSTORE_PASSWORD" -alias "$IVX_RELEASE_KEY_ALIAS" >/dev/null
          echo "IVX_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Pin native APK version to 1.10.34 / 132
        working-directory: expo
        run: |
          set -euo pipefail
          sed -E -i 's/versionCode [0-9]+/versionCode 132/' android/app/build.gradle
          sed -E -i 's/versionName "[^"]+"/versionName "1.10.34"/' android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle | head

      - name: Build signed production APK
        working-directory: expo/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint 2>&1 | tee "$GITHUB_WORKSPACE/gradle-v11034.log"

      - name: Verify signing and package APK
        id: apk
        working-directory: expo/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apksigner-v11034.txt"
          HASH=$(sha256sum "$APK" | awk '{print $1}')
          cp "$APK" "$GITHUB_WORKSPACE/IVX-Holdings-v1.10.34-MISSION-CONTROL.apk"
          echo "$HASH  IVX-Holdings-v1.10.34-MISSION-CONTROL.apk" > "$GITHUB_WORKSPACE/IVX-Holdings-v1.10.34-MISSION-CONTROL.sha256"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "APK_PATH=$GITHUB_WORKSPACE/IVX-Holdings-v1.10.34-MISSION-CONTROL.apk" >> "$GITHUB_ENV"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" > "$GITHUB_WORKSPACE/apk-metadata-v11034.txt"
          grep -q "package: name='com.ivxholdings.app' versionCode='132' versionName='1.10.34'" "$GITHUB_WORKSPACE/apk-metadata-v11034.txt"
          grep -qi 'ae0b4cd7b4252b08207e163ba5156b4136330c5f0efcb516c278d0008e9fe8ee' "$GITHUB_WORKSPACE/apksigner-v11034.txt"

      - name: Wait for exact production SHA on main
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          ready=false
          for i in $(seq 1 120); do
            body=$(curl -fsS --max-time 8 https://api.ivxholding.com/version || true)
            live=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "poll=$i live=${live:-missing} expected=$expected"
            if [ "$live" = "$expected" ]; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify this signed release APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ivx-dashboard-chat-android-e2e.sh

      - name: Write dashboard APK certificate
        run: |
          set -euo pipefail
          mkdir -p qa/evidence
          CERT=qa/evidence/dashboard-chat/certificate.json
          test "$(jq -r '.passed' "$CERT")" = true
          test "$(jq -r '.sourceSha' "$CERT")" = "$GITHUB_SHA"
          test "$(jq -r '.apkSha256' "$CERT")" = '${{ steps.apk.outputs.hash }}'
          test "$(jq -r '.appId' "$CERT")" = com.ivxholdings.app
          test "$(jq -r '.passed' qa/evidence/dashboard-chat/autonomous-handoff.json)" = true
          jq -n \
            --arg marker 'IVX-MISSION-CONTROL-APK-CERTIFICATE' \
            --arg sourceSha "$GITHUB_SHA" \
            --arg version '1.10.34' \
            --argjson versionCode 132 \
            --arg apkSha256 '${{ steps.apk.outputs.hash }}' \
            --arg artifact "IVX-Holdings-v1.10.34-MISSION-CONTROL-${GITHUB_SHA}" \
            '{marker:$marker,sourceSha:$sourceSha,version:$version,versionCode:$versionCode,apkSha256:$apkSha256,artifact:$artifact,signed:true,typecheck:true,sameApkAndroidE2E:true,liveChatReply:true,chatPersistenceAfterRestart:true,autonomousHandoffCompleted:true,missionRoster112:true,allRoutesPassed:true,dashboardRoute:"/autonomous-dashboard",status:"PASS"}' \
            > qa/evidence/ivx-mission-control-apk-certificate.json

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: IVX-Holdings-v1.10.34-MISSION-CONTROL-${{ github.sha }}
          path: |
            IVX-Holdings-v1.10.34-MISSION-CONTROL.apk
            IVX-Holdings-v1.10.34-MISSION-CONTROL.sha256
            apksigner-v11034.txt
            gradle-v11034.log
          retention-days: 30
          if-no-files-found: error

      - name: Upload certificate
        uses: actions/upload-artifact@v4
        with:
          name: IVX-MISSION-CONTROL-APK-CERTIFICATE-${{ github.sha }}
          path: |
            qa/evidence/ivx-mission-control-apk-certificate.json
            qa/evidence/dashboard-chat
            qa/evidence/all-routes-human-e2e
            apk-metadata-v11034.txt
          retention-days: 30
          if-no-files-found: error


      - name: Preserve device failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ivx-v11034-verification-failure-${{ github.sha }}
          path: |
            qa/evidence/dashboard-chat
            qa/evidence/all-routes-human-e2e
            gradle-v11034.log
          if-no-files-found: warn
          retention-days: 14
