name: IVX Candidate Lease and Evidence Contracts
on:
  push:
    branches: [fix/candidate-lease-store-20260913]
  pull_request:
    paths:
      - 'backend/services/ivx-candidate-store*'
      - 'backend/services/ivx-database-pools.ts'
      - 'backend/services/ivx-postgres-deadline.ts'
      - 'supabase/migrations/*candidate_lease_evidence_store.sql'
      - 'qa/candidate-store-postgres.test.mjs'
      - '.github/workflows/ivx-candidate-store-contracts.yml'
permissions:
  contents: read
jobs:
  candidate-postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ivx_candidate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.3.9}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify adapter validation and unknown commit outcomes
        run: bun test backend/services/ivx-candidate-store.test.ts
      - name: Verify database races, retained evidence, permissions and indexed lookup
        run: node --test qa/candidate-store-postgres.test.mjs
        env:
          IVX_CANDIDATE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivx_candidate_test
