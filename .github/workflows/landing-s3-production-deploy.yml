name: Landing S3 Production Deploy

on:
  workflow_dispatch:
    inputs:
      deployWebApp:
        description: 'Also build and deploy the Expo web app to /app/'
        required: false
        default: 'true'
        type: string
  push:
    branches: [main]
    paths:
      - 'expo/ivxholding-landing/**'
      - 'expo/assets/images/**'
      - 'expo/deploy-s3-direct.mjs'
      - 'expo/app/**'
      - 'expo/app.config.ts'
      - 'expo/metro.config.js'
      - 'expo/scripts/apply-patches.mjs'
      - 'expo/patches/**'
      - 'expo/deploy-web-app.mjs'
      - '.github/workflows/landing-s3-production-deploy.yml'
      - '.ivx-production-certification-trigger'

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CLOUDFRONT_DISTRIBUTION_ID: E1C0DEI0VKCUYN
  S3_BUCKET_NAME: ivxholding.com
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_GOOGLE_ADS_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_ADS_KEY }}
  EXPO_PUBLIC_META_PIXEL_ID: ${{ secrets.EXPO_PUBLIC_META_PIXEL_ID }}
  EXPO_PUBLIC_TIKTOK_PIXEL_ID: ${{ secrets.EXPO_PUBLIC_TIKTOK_PIXEL_ID }}
  EXPO_PUBLIC_LINKEDIN_PARTNER_ID: ${{ secrets.EXPO_PUBLIC_LINKEDIN_PARTNER_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Validate required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || { echo 'AWS_ACCESS_KEY_ID missing'; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo 'AWS_SECRET_ACCESS_KEY missing'; exit 1; }
          test "$CLOUDFRONT_DISTRIBUTION_ID" = 'E1C0DEI0VKCUYN' || { echo 'CloudFront distribution mismatch'; exit 1; }
          test "$S3_BUCKET_NAME" = 'ivxholding.com' || { echo 'S3 bucket mismatch'; exit 1; }
      - name: Install Expo deployment dependencies
        working-directory: expo
        run: bun install --frozen-lockfile
      - name: Apply node_modules patches (Watchman + ai-sdk web fixes)
        working-directory: expo
        run: bun scripts/apply-patches.mjs
      - name: Prepare deployment script runtime path
        shell: bash
        run: |
          sudo mkdir -p /home/user/rork-app
          sudo ln -s "$GITHUB_WORKSPACE/expo" /home/user/rork-app/expo
      - name: Deploy all landing assets to S3 and invalidate CloudFront
        working-directory: expo
        shell: bash
        run: |
          set -euo pipefail
          bun run deploy-s3-direct.mjs 2>&1 | tee /tmp/ivx-s3-deploy.log
          if grep -q 'CloudFront invalidation FAILED' /tmp/ivx-s3-deploy.log; then
            echo '::error::CloudFront invalidation failed; deployment cannot be certified.'
            exit 1
          fi
          if ! grep -q 'CloudFront invalidated:' /tmp/ivx-s3-deploy.log; then
            echo '::error::CloudFront invalidation success evidence is missing.'
            exit 1
          fi
      - name: Verify www redirects to apex over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          headers=$(curl -sSI --max-time 20 https://www.ivxholding.com/ || true)
          printf '%s\n' "$headers"
          status=$(printf '%s\n' "$headers" | head -n 1 | awk '{print $2}')
          location=$(printf '%s\n' "$headers" | grep -i '^location:' | head -n 1 | sed -E 's/^[Ll]ocation:[[:space:]]*//; s/\r$//' || true)
          case "$status" in
            301|302|307|308) ;;
            *) echo "::error::www.ivxholding.com did not return an HTTP redirect (status=${status:-missing})."; exit 1 ;;
          esac
          case "$location" in
            https://ivxholding.com|https://ivxholding.com/|https://ivxholding.com/*) ;;
            *) echo "::error::www redirect target is not the apex domain (location=${location:-missing})."; exit 1 ;;
          esac
          echo "www_redirect=PASS status=$status location=$location"
      - name: Build Expo web app
        if: github.event.inputs.deployWebApp != 'false'
        working-directory: expo
        run: bun x expo export --platform web
      - name: Deploy Expo web app to /app/
        if: github.event.inputs.deployWebApp != 'false'
        working-directory: expo
        run: bun run deploy-web-app.mjs
