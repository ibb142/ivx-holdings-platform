name: IVX Environment Secret Presence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-environment-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        environment:
          - production
          - 'Production – ibb142-rork-global-real-estate-invest'
          - 'Production – rork-global-real-estate-invest'
          - 'Production – rork-global-real-estate-invest-642s'
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    env:
      IVX_AI_GATEWAY_KEY: ${{ secrets.IVX_AI_GATEWAY_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      IVX_OWNER_VARIABLES_ENCRYPTION_KEY: ${{ secrets.IVX_OWNER_VARIABLES_ENCRYPTION_KEY }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          echo "environment=${{ matrix.environment }}"
          for name in IVX_AI_GATEWAY_KEY AI_GATEWAY_API_KEY IVX_OWNER_VARIABLES_ENCRYPTION_KEY APP_SECRET JWT_SECRET RENDER_API_KEY RENDER_SERVICE_ID SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL; do
            if [ -n "${!name:-}" ]; then echo "$name=PRESENT"; else echo "$name=MISSING"; fi
          done
