name: IVX Environment Secret Presence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-environment-secret-presence.yml'
      - '.ivx-production-certification-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        environment:
          - production
          - 'Production – ibb142-rork-global-real-estate-invest'
          - 'Production – rork-global-real-estate-invest'
          - 'Production – rork-global-real-estate-invest-642s'
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    env:
      IVX_OPENAI_API_KEY: ${{ secrets.IVX_OPENAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IVX_ANTHROPIC_API_KEY: ${{ secrets.IVX_ANTHROPIC_API_KEY }}
      IVX_AI_GATEWAY_KEY: ${{ secrets.IVX_AI_GATEWAY_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      IVX_VERCEL_TOKEN: ${{ secrets.IVX_VERCEL_TOKEN }}
      IVX_OWNER_VARIABLES_ENCRYPTION_KEY: ${{ secrets.IVX_OWNER_VARIABLES_ENCRYPTION_KEY }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      IVX_RELEASE_KEYSTORE_BASE64: ${{ secrets.IVX_RELEASE_KEYSTORE_BASE64 }}
      IVX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.IVX_RELEASE_KEYSTORE_PASSWORD }}
      IVX_RELEASE_KEY_ALIAS: ${{ secrets.IVX_RELEASE_KEY_ALIAS }}
      IVX_RELEASE_KEY_PASSWORD: ${{ secrets.IVX_RELEASE_KEY_PASSWORD }}
      EXPO_PUBLIC_GOOGLE_ADS_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_ADS_KEY }}
      EXPO_PUBLIC_META_PIXEL_ID: ${{ secrets.EXPO_PUBLIC_META_PIXEL_ID }}
      EXPO_PUBLIC_TIKTOK_PIXEL_ID: ${{ secrets.EXPO_PUBLIC_TIKTOK_PIXEL_ID }}
      EXPO_PUBLIC_LINKEDIN_PARTNER_ID: ${{ secrets.EXPO_PUBLIC_LINKEDIN_PARTNER_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_ACCESS_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          echo "environment=${{ matrix.environment }}"
          for name in \
            IVX_OPENAI_API_KEY OPENAI_API_KEY IVX_ANTHROPIC_API_KEY IVX_AI_GATEWAY_KEY AI_GATEWAY_API_KEY \
            VERCEL_TOKEN VERCEL_API_TOKEN IVX_VERCEL_TOKEN \
            IVX_OWNER_VARIABLES_ENCRYPTION_KEY APP_SECRET JWT_SECRET \
            RENDER_API_KEY RENDER_SERVICE_ID SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL \
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION \
            IVX_RELEASE_KEYSTORE_BASE64 IVX_RELEASE_KEYSTORE_PASSWORD IVX_RELEASE_KEY_ALIAS IVX_RELEASE_KEY_PASSWORD \
            EXPO_PUBLIC_GOOGLE_ADS_KEY EXPO_PUBLIC_META_PIXEL_ID EXPO_PUBLIC_TIKTOK_PIXEL_ID EXPO_PUBLIC_LINKEDIN_PARTNER_ID \
            EXPO_TOKEN EAS_ACCESS_TOKEN ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_PRIVATE_KEY GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -n "${!name:-}" ]; then echo "$name=PRESENT"; else echo "$name=MISSING"; fi
          done
