name: IVX Final Gap Repair PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply deterministic repair
        run: |
          python3 scripts/fix-final-cert-gap.py
          python3 scripts/fix-112-cert-oidc.py
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair diff required.'
            exit 0
          fi
          git config user.name 'ivx-cert-repair-bot'
          git config user.email 'ivx-cert-repair-bot@users.noreply.github.com'
          git add expo/ivxholding-landing/index.html backend/services/ivx-signalwire-service.ts backend/api/ivx-agent-api.ts .github/workflows/ivx-ci.yml .github/workflows/ivx-render-live-cert.yml .github/workflows/ivx-112-final-live-cert.yml
          git add backend/services/ivx-github-actions-oidc.ts backend/services/ivx-github-actions-oidc.test.ts .github/workflows/ivx-112-exact-sha-autodeploy-cert.yml scripts/fix-112-cert-oidc.py
          git add -f expo/android/app/build.gradle
          git commit -m 'fix(cert): authorize exact-SHA 112 run with scoped GitHub OIDC'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
