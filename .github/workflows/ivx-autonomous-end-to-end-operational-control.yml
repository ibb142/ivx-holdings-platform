name: IVX Autonomous End-to-End Operational Control

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: ivx-autonomous-end-to-end-operational-control
  cancel-in-progress: true

env:
  API_BASE: https://api.ivxholding.com
  REPO: ibb142/ivx-holdings-platform
  OWNER_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
  OWNER_SECRET_FALLBACK: ${{ secrets.IVX_AI_SYSTEM_SECRET }}

jobs:
  full-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtain trusted IVX OIDC machine identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          raw=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$raw" | jq -r '.value // empty')
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Audit inside and outside dependencies
        id: audit
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          errors=0
          warn(){ echo "::error::$1"; errors=$((errors+1)); }
          pass(){ echo "PASS $1"; }

          main_sha="${GITHUB_SHA}"
          echo "MAIN_SHA=$main_sha"

          # 1-2 external production reachability + SHA parity
          if curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$API_BASE/health" -o /tmp/health.json; then
            pass '01 production /health reachable'
            prod_sha=$(jq -r '.commit // .sha // .gitSha // .version.commit // empty' /tmp/health.json)
            healthy=$(jq -r '.healthy // .ok // false' /tmp/health.json)
            [ "$healthy" = true ] || warn '02 production health is not healthy'
            [ -n "$prod_sha" ] || warn '03 production SHA missing from /health'
            if [ -n "$prod_sha" ] && [ "$prod_sha" != "$main_sha" ]; then warn "04 production SHA mismatch: $prod_sha != $main_sha"; else pass '04 production SHA parity'; fi
          else
            warn '01 production /health unreachable'
            warn '02 production health unknown'
            warn '03 production SHA unknown'
            warn '04 production SHA parity unknown'
          fi

          curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$API_BASE/version" -o /tmp/version.json && pass '05 production /version reachable' || warn '05 production /version unreachable'

          # 6-12 live dispatcher / fleet control
          if curl -fsS --retry 3 --retry-delay 2 --max-time 25 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/dashboard.json; then
            test "$(jq -r '.ok // false' /tmp/dashboard.json)" = true || warn '06 dispatcher dashboard returned non-ok'
            max=$(jq -r '.dispatcher.maxConcurrency // 0' /tmp/dashboard.json)
            paused=$(jq -r '.dispatcher.paused // false' /tmp/dashboard.json)
            emergency=$(jq -r '.dispatcher.emergencyStop // false' /tmp/dashboard.json)
            running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/dashboard.json)
            queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/dashboard.json)
            blocked=$(jq -r '.dispatcher.totals.blocked // 0' /tmp/dashboard.json)
            failed=$(jq -r '.dispatcher.totals.failed // 0' /tmp/dashboard.json)
            [ "$max" -eq 112 ] || warn "07 max concurrency is $max not 112"
            [ "$paused" = false ] || warn '08 dispatcher is paused'
            [ "$emergency" = false ] || warn '09 emergency stop is active'
            if [ "$running" -eq 0 ] && [ "$queued" -gt 0 ]; then warn "10 queue starvation: queued=$queued running=0"; else pass '10 worker queue is being consumed or empty'; fi
            [ "$failed" -eq 0 ] || warn "11 failed dispatcher jobs=$failed"
            [ "$blocked" -eq 0 ] || warn "12 blocked dispatcher jobs=$blocked"
            echo "RUNNING_NOW=$running" >> "$GITHUB_ENV"
            echo "QUEUED_NOW=$queued" >> "$GITHUB_ENV"
          else
            warn '06 dispatcher dashboard unreachable'
            warn '07 concurrency unknown'
            warn '08 pause state unknown'
            warn '09 emergency-stop state unknown'
            warn '10 queue consumption unknown'
            warn '11 failed jobs unknown'
            warn '12 blocked jobs unknown'
            echo 'RUNNING_NOW=0' >> "$GITHUB_ENV"
            echo 'QUEUED_NOW=0' >> "$GITHUB_ENV"
          fi

          # 13-16 per-agent truth, timers, pause/disable, heartbeats
          if curl -fsS --retry 3 --retry-delay 2 --max-time 25 -H "X-IVX-GitHub-OIDC: $OIDC_TOKEN" "$API_BASE/api/ivx/autonomous/agent-ledger" -o /tmp/ledger.json; then
            rows=$(jq -r '.rowCount // 0' /tmp/ledger.json)
            [ "$rows" -eq 112 ] || warn "13 ledger has $rows agents, expected 112"
            paused_agents=$(jq '[.agents[]? | select((.status|ascii_downcase)=="paused" or (.paused==true))] | length' /tmp/ledger.json)
            disabled_agents=$(jq '[.agents[]? | select((.status|ascii_downcase)=="disabled" or (.disabled==true))] | length' /tmp/ledger.json)
            stale_agents=$(jq '[.agents[]? | select((.status|ascii_downcase)=="stale" or (.evidenceState|ascii_downcase)=="stale")] | length' /tmp/ledger.json)
            [ "$paused_agents" -eq 0 ] || warn "14 paused agents=$paused_agents"
            [ "$disabled_agents" -eq 0 ] || warn "15 disabled agents=$disabled_agents"
            [ "$stale_agents" -eq 0 ] || warn "16 stale/evidence-stale agents=$stale_agents"
          else
            warn '13 per-agent ledger unavailable'
            warn '14 paused-agent state unavailable'
            warn '15 disabled-agent state unavailable'
            warn '16 heartbeat/timer evidence unavailable'
          fi

          # 17 durable engineering evidence
          if curl -fsS --retry 3 --retry-delay 2 --max-time 25 "$API_BASE/api/ivx/agents/engineering-fleet/metrics" -o /tmp/metrics.json; then
            test "$(jq -r '.ok // false' /tmp/metrics.json)" = true || warn '17 engineering metrics non-ok'
          else
            warn '17 durable engineering metrics unavailable'
          fi

          # 18 current-SHA critical workflow failures
          runs=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs?head_sha=$main_sha&per_page=100")
          critical_failures=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out" or .conclusion=="startup_failure" or .conclusion=="action_required")] | length')
          [ "$critical_failures" -eq 0 ] || warn "18 current-SHA workflow failures=$critical_failures"

          # 19 Supabase recovery workflow must not be failed on current SHA when present
          sb_fail=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.name=="IVX Supabase Management Restart" and (.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="cancelled"))] | length')
          [ "$sb_fail" -eq 0 ] || warn "19 Supabase management recovery failing=$sb_fail"

          # 20 Autonomous trust guard must not be RED on current SHA
          trust_fail=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.name=="IVX Autonomous Certificate Trust Guard" and (.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="cancelled"))] | length')
          [ "$trust_fail" -eq 0 ] || warn "20 Autonomous Trust Guard failing=$trust_fail"

          echo "ERROR_COUNT=$errors" >> "$GITHUB_ENV"
          echo "error_count=$errors" >> "$GITHUB_OUTPUT"

      - name: Recover fleet immediately when any operational gap is detected
        if: steps.audit.outputs.error_count != '0'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          owner_key="${OWNER_SECRET:-${OWNER_SECRET_FALLBACK:-}}"

          # Always resume the global campaign with trusted machine identity.
          curl -fsS --max-time 30 -X POST \
            -H 'content-type: application/json' \
            -H "X-IVX-GitHub-OIDC: $OIDC_TOKEN" \
            -d '{"action":"resume_all"}' \
            "$API_BASE/api/ivx/agents/app-completion/control" -o /tmp/resume.json || true

          # Recycle per-agent repairable states when owner secret is present.
          if [ -n "$owner_key" ]; then
            for agent in $(seq 1 112); do
              curl -sS --max-time 8 -X POST \
                -H 'content-type: application/json' \
                -H "x-ivx-owner-key: $owner_key" \
                -d "{\"action\":\"retry_agent\",\"agentNumber\":$agent}" \
                "$API_BASE/api/ivx/agents/app-completion/control" >/dev/null || true
            done
          fi

          # Re-run every failed current-SHA workflow except this workflow itself.
          curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=100" -o /tmp/runs.json
          jq -r '.workflow_runs[] | select((.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out" or .conclusion=="startup_failure" or .conclusion=="action_required") and .name!="IVX Autonomous End-to-End Operational Control") | .id' /tmp/runs.json | sort -u | while read -r id; do
            [ -n "$id" ] || continue
            curl -sS -o /dev/null -w "rerun $id -> %{http_code}\n" -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/actions/runs/$id/rerun-failed-jobs" || true
          done

      - name: Verify recovery made forward progress
        if: steps.audit.outputs.error_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          started=false
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            if curl -fsS --max-time 20 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/after.json; then
              running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/after.json)
              queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/after.json)
              if [ "$running" -gt 0 ] || [ "$queued" -eq 0 ]; then started=true; break; fi
            fi
          done
          echo "recovery_forward_progress=$started"
          test "$started" = true

      - name: Fail closed until all 20 operational controls are green
        if: steps.audit.outputs.error_count != '0'
        shell: bash
        run: |
          echo "AUTONOMOUS_OPERATIONAL_RED: ${ERROR_COUNT} inside/outside control gap(s) detected on MAIN $GITHUB_SHA. Recovery was dispatched; GREEN is forbidden until a clean rerun."
          exit 1
