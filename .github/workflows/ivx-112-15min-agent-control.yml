name: IVX 112 15-Minute Agent Control

# Immediate activation marker: 2026-09-02 owner-requested restart
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-112-15min-agent-control.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  id-token: write

env:
  API_BASE: https://api.ivxholding.com

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    steps:
      - id: registry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          echo "matrix=$(jq -c '{include:[.agents[]|{agentNumber:.agentNumber,agentId:.agentId}]}' /tmp/agents.json)" >> "$GITHUB_OUTPUT"

  work:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Acquire approved GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(jq -r '.value // empty' <<<"$response")
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run real durable engineering work
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          AGENT_ID: ${{ matrix.agentId }}
          AGENT_NUMBER: ${{ matrix.agentNumber }}
        run: |
          set -euo pipefail
          useful=0
          for cycle in $(seq 1 12); do
            source="${GITHUB_SHA}:${AGENT_ID}:${GITHUB_RUN_ID}:${cycle}"
            body=$(jq -nc --arg sourceSha "$source" '{sourceSha:$sourceSha}')
            http=$(curl -sS --retry 2 --retry-delay 2 --retry-all-errors --max-time 240 \
              -o /tmp/cycle.json -w '%{http_code}' \
              -X POST "$API_BASE/api/ivx/agents/${AGENT_ID}/engineering-cycle" \
              -H 'Content-Type: application/json' \
              -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
              --data "$body" || true)
            if [ "$http" != 200 ]; then
              cat /tmp/cycle.json 2>/dev/null || true
              echo "CYCLE_HTTP_FAIL agent=${AGENT_NUMBER} http=${http}"
              exit 1
            fi
            action=$(jq -r '.result.action // "CYCLE_ERROR"' /tmp/cycle.json)
            echo "agent=${AGENT_NUMBER} cycle=${cycle} action=${action}"
            case "$action" in
              TASK_COMPLETED|TASK_OWNER_GATE) useful=$((useful+1)) ;;
              NO_TASK_AVAILABLE) break ;;
              *) cat /tmp/cycle.json; exit 1 ;;
            esac
          done
          test "$useful" -gt 0
          echo "real_work=PASS agent=${AGENT_NUMBER} useful_cycles=${useful}"
