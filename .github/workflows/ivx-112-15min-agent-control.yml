name: IVX 112 15-Minute Agent Control

# Immediate activation marker: 2026-09-02 owner-requested restart
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-112-15min-agent-control.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  id-token: write

env:
  API_BASE: https://api.ivxholding.com

jobs:
  deploy-exact-main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      DEFAULT_RENDER_SERVICE_ID: srv-d7t9ivreo5us73ftose0
      OWNER_EMAIL: iperez4242@gmail.com
      OWNER_PASSWORD_S1: ${{ secrets.OWNER_NEW_PASSWORD }}
      OWNER_PASSWORD_S2: ${{ secrets.OWNER_PASSWORD }}
      OWNER_PASSWORD_S3: ${{ secrets.IVX_OWNER_PASSWORD }}
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Deploy exact workflow SHA to Render when production is stale
        shell: bash
        run: |
          set -euo pipefail
          live=$(curl -fsS --retry 3 --retry-delay 2 "$API_BASE/version" | jq -r '.commit // empty')
          if [ "$live" = "$GITHUB_SHA" ]; then
            echo "production_sha=PASS sha=$live"
            exit 0
          fi
          if [ -n "${RENDER_API_KEY:-}" ]; then
            service_id="${RENDER_SERVICE_ID:-$DEFAULT_RENDER_SERVICE_ID}"
            response=$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
              -X POST "https://api.render.com/v1/services/${service_id}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"${GITHUB_SHA}\"}")
            deploy_id=$(jq -r '.id // .deploy.id // empty' <<<"$response")
            test -n "$deploy_id"
            echo "render_deploy_trigger=PASS mode=direct id=$deploy_id sha=$GITHUB_SHA"
          else
            owner_password="${OWNER_PASSWORD_S1:-${OWNER_PASSWORD_S2:-${OWNER_PASSWORD_S3:-}}}"
            test -n "$owner_password"; test -n "$SUPABASE_URL"; test -n "$SUPABASE_ANON_KEY"
            echo "::add-mask::$owner_password"
            login_body=$(jq -nc --arg email "$OWNER_EMAIL" --arg password "$owner_password" '{email:$email,password:$password}')
            login_code=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors --max-time 25 \
              -o /tmp/owner-login.json -w '%{http_code}' \
              -X POST "${SUPABASE_URL%/}/auth/v1/token?grant_type=password" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H 'Content-Type: application/json' --data "$login_body" || true)
            test "$login_code" = 200
            owner_token=$(jq -r '.access_token // empty' /tmp/owner-login.json)
            test -n "$owner_token"; echo "::add-mask::$owner_token"
            source_payload=$(jq -nc '{action:"render_update_source",input:{repoUrl:"https://github.com/ibb142/ivx-holdings-platform.git",branch:"main",autoDeploy:"yes"},confirm:true,confirmText:"CONFIRM_IVX_RENDER_SERVICE_UPDATE",reason:"Bind the IVX production service to the owner-controlled main branch before exact-SHA deployment."}')
            source_code=$(curl -sS --retry 2 --retry-delay 2 --retry-all-errors --max-time 60 \
              -o /tmp/render-source.json -w '%{http_code}' \
              -X POST "$API_BASE/api/ivx/developer-deploy/action" \
              -H 'Content-Type: application/json' -H "Authorization: Bearer ${owner_token}" \
              --data "$source_payload" || true)
            test "$source_code" = 200
            test "$(jq -r '.ok // false' /tmp/render-source.json)" = true
            echo 'render_source_binding=PASS repo=ibb142/ivx-holdings-platform branch=main'
            payload=$(jq -nc --arg commitId "$GITHUB_SHA" '{action:"render_trigger_deploy",input:{clearCache:false,commitId:$commitId},confirm:true,confirmText:"CONFIRM_IVX_RENDER_DEPLOY",reason:"Deploy exact main before the existing 112-agent control run."}')
            deploy_code=$(curl -sS --retry 2 --retry-delay 2 --retry-all-errors --max-time 60 \
              -o /tmp/render-deploy.json -w '%{http_code}' \
              -X POST "$API_BASE/api/ivx/developer-deploy/action" \
              -H 'Content-Type: application/json' -H "Authorization: Bearer ${owner_token}" \
              --data "$payload" || true)
            test "$deploy_code" = 200
            test "$(jq -r '.ok // false' /tmp/render-deploy.json)" = true
            echo "render_deploy_trigger=PASS mode=owner_bridge sha=$GITHUB_SHA"
          fi

      - name: Wait for exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          for poll in $(seq 1 120); do
            code=$(curl -sS --max-time 20 -o /tmp/version.json -w '%{http_code}' "$API_BASE/version" || true)
            live=$(jq -r '.commit // empty' /tmp/version.json 2>/dev/null || true)
            echo "poll=$poll live=${live:-missing} expected=$GITHUB_SHA http=$code"
            if [ "$code" = 200 ] && [ "$live" = "$GITHUB_SHA" ]; then
              echo "exact_production_sha=PASS sha=$live"
              exit 0
            fi
            sleep 10
          done
          echo 'Exact production SHA did not become live.'
          exit 1

  prepare:
    needs: deploy-exact-main
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    steps:
      - id: registry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          echo "matrix=$(jq -c '{include:[.agents[]|{agentNumber:.agentNumber,agentId:.agentId}]}' /tmp/agents.json)" >> "$GITHUB_OUTPUT"

  work:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # The Render API stores the durable task ledger as one shared document.
      # Keep enough real concurrency for the fleet without overwhelming the
      # single production API with 16 simultaneous long-running scans.
      max-parallel: 16
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Acquire approved GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(jq -r '.value // empty' <<<"$response")
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run real durable engineering work
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          AGENT_ID: ${{ matrix.agentId }}
          AGENT_NUMBER: ${{ matrix.agentNumber }}
        run: |
          set -euo pipefail
          useful=0
          for cycle in $(seq 1 12); do
            source="${GITHUB_SHA}:${AGENT_ID}:${GITHUB_RUN_ID}:${cycle}"
            body=$(jq -nc --arg sourceSha "$source" '{sourceSha:$sourceSha}')
            http=$(curl -sS --retry 2 --retry-delay 2 --retry-all-errors --max-time 240 \
              -o /tmp/cycle.json -w '%{http_code}' \
              -X POST "$API_BASE/api/ivx/agents/${AGENT_ID}/engineering-cycle" \
              -H 'Content-Type: application/json' \
              -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
              --data "$body" || true)
            if [ "$http" != 200 ]; then
              cat /tmp/cycle.json 2>/dev/null || true
              echo "CYCLE_HTTP_FAIL agent=${AGENT_NUMBER} http=${http}"
              exit 1
            fi
            action=$(jq -r '.result.action // "CYCLE_ERROR"' /tmp/cycle.json)
            echo "agent=${AGENT_NUMBER} cycle=${cycle} action=${action}"
            case "$action" in
              TASK_COMPLETED|TASK_OWNER_GATE) useful=$((useful+1)) ;;
              NO_TASK_AVAILABLE) break ;;
              *) cat /tmp/cycle.json; exit 1 ;;
            esac
          done
          test "$useful" -gt 0
          echo "real_work=PASS agent=${AGENT_NUMBER} useful_cycles=${useful}"
