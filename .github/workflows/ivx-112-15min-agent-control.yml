name: IVX 112 15-Minute Agent Control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-112-15min-agent-control.yml'
      - '.github/workflows/ivx-no-idle-intelligence.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows:
      - 'IVX No Idle Intelligence 1000'
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  API_BASE: https://api.ivxholding.com
  PROGRAM_ID: IVX-LANDING-10OF10-2026-08-19

concurrency:
  group: ivx-112-15min-agent-control
  cancel-in-progress: false

jobs:
  audit-112:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - name: Verify production and 112-agent registry
        shell: bash
        run: |
          set -euo pipefail
          CHECKPOINT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "CHECKPOINT_AT=$CHECKPOINT_AT" >> "$GITHUB_ENV"
          curl -fsS --max-time 30 "$API_BASE/health" -o /tmp/health.json
          curl -fsS --max-time 30 "$API_BASE/version" -o /tmp/version.json
          curl -fsS --max-time 30 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/health.json)" = true
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          test "$(jq '[.agents[].agentId] | unique | length' /tmp/agents.json)" = 112
          LIVE_SHA=$(jq -r '.commit // .version.commit // empty' /tmp/version.json)
          test -n "$LIVE_SHA"
          echo "LIVE_SHA=$LIVE_SHA" >> "$GITHUB_ENV"

      - name: Audit each agent with persisted run evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence/autonomous /tmp/ivx112
          jq -c '.agents | sort_by(.agentNumber // 999999, .agentId)[]' /tmp/agents.json > /tmp/ivx112/agents.ndjson
          : > /tmp/ivx112/records.ndjson
          number=0
          now_epoch=$(date -u +%s)
          while IFS= read -r agent; do
            number=$((number + 1))
            agent_id=$(jq -r '.agentId' <<<"$agent")
            name=$(jq -r '.name // ""' <<<"$agent")
            status=$(jq -r '.status // .state // .health // "UNKNOWN"' <<<"$agent")
            paused=$(jq -r '.paused // false' <<<"$agent")
            disabled=$(jq -r '.disabled // false' <<<"$agent")
            last_heartbeat=$(jq -r '.lastHeartbeat // .lastHeartbeatAt // .heartbeatAt // .lastSeenAt // ""' <<<"$agent")
            total_runs=$(jq -r '.totalRuns // .stats.totalRuns // 0' <<<"$agent")
            successful_runs=$(jq -r '.successfulRuns // .stats.successfulRuns // 0' <<<"$agent")

            runs_http=$(curl -sS --retry 2 --retry-delay 1 --max-time 30 -o "/tmp/ivx112/runs-${number}.json" -w '%{http_code}' "$API_BASE/api/ivx/agents/runs/$agent_id" || true)
            source_reference=''
            tool_result_id=''
            current_task='null'
            if [ "$runs_http" = 200 ]; then
              latest=$(jq -c '(.runs // .records // .runRecords // []) | map(select((.sourceReference // "") != "" and (.toolResultId // "") != "")) | sort_by(.completedAt // .finishedAt // .startedAt // .createdAt // "") | last // null' "/tmp/ivx112/runs-${number}.json")
              if [ "$latest" != null ]; then
                source_reference=$(jq -r '.sourceReference // ""' <<<"$latest")
                tool_result_id=$(jq -r '.toolResultId // ""' <<<"$latest")
                current_task=$(jq -c '{taskId:(.taskId // .runId // null), taskType:(.taskType // null), finalStatus:(.finalStatus // null), completedAt:(.completedAt // .finishedAt // null)}' <<<"$latest")
              fi
            fi

            task_report_available=false
            if [ "$current_task" != null ]; then task_report_available=true; fi
            evidence_available=false
            if [ -n "$source_reference" ] && [ -n "$tool_result_id" ]; then evidence_available=true; fi
            heartbeat_fresh=false
            if [ -n "$last_heartbeat" ]; then
              hb_epoch=$(date -u -d "$last_heartbeat" +%s 2>/dev/null || echo 0)
              if [ "$hb_epoch" -gt 0 ] && [ $((now_epoch-hb_epoch)) -le 1800 ]; then heartbeat_fresh=true; fi
            fi
            jq -n --argjson sequence "$number" --arg agentId "$agent_id" --arg name "$name" --arg status "$status" --arg checkpointAt "$CHECKPOINT_AT" --arg lastHeartbeatAt "$last_heartbeat" --arg sourceReference "$source_reference" --arg toolResultId "$tool_result_id" --arg runsHttp "$runs_http" --argjson paused "$paused" --argjson disabled "$disabled" --argjson currentTask "$current_task" --argjson taskReportAvailable "$task_report_available" --argjson evidenceAvailable "$evidence_available" --argjson heartbeatFresh "$heartbeat_fresh" --argjson totalRuns "$total_runs" --argjson successfulRuns "$successful_runs" '{sequence:$sequence,agentId:$agentId,name:$name,status:$status,checkpointAt:$checkpointAt,lastHeartbeatAt:$lastHeartbeatAt,paused:$paused,disabled:$disabled,currentTask:$currentTask,taskReportAvailable:$taskReportAvailable,evidenceAvailable:$evidenceAvailable,heartbeatFresh:$heartbeatFresh,totalRuns:$totalRuns,successfulRuns:$successfulRuns,sourceReference:$sourceReference,toolResultId:$toolResultId,runsHttp:$runsHttp}' >> /tmp/ivx112/records.ndjson
          done < /tmp/ivx112/agents.ndjson
          jq -s '.' /tmp/ivx112/records.ndjson > /tmp/ivx112/records.json
          test "$(jq 'length' /tmp/ivx112/records.json)" = 112
          test "$(jq '[.[] | select(.runsHttp == "200")] | length' /tmp/ivx112/records.json)" = 112

      - name: Build truth-preserving 15-minute checkpoint certificate
        shell: bash
        run: |
          set -euo pipefail
          active=$(jq '[.[] | select(.disabled==false and .paused==false)] | length' /tmp/ivx112/records.json)
          paused=$(jq '[.[] | select(.paused==true)] | length' /tmp/ivx112/records.json)
          disabled=$(jq '[.[] | select(.disabled==true)] | length' /tmp/ivx112/records.json)
          fresh=$(jq '[.[] | select(.heartbeatFresh==true)] | length' /tmp/ivx112/records.json)
          productive=$(jq '[.[] | select((.successfulRuns // 0) > 0 or .taskReportAvailable==true)] | length' /tmp/ivx112/records.json)
          evidence=$(jq '[.[] | select(.evidenceAvailable==true)] | length' /tmp/ivx112/records.json)
          CERT_OK=false
          if [ "$active" = 112 ] && [ "$paused" = 0 ] && [ "$disabled" = 0 ] && [ "$fresh" = 112 ] && [ "$productive" = 112 ] && [ "$evidence" = 112 ]; then CERT_OK=true; fi
          mkdir -p qa/evidence/autonomous
          jq -n --argjson ok "$CERT_OK" --arg certificate 'IVX-112-15MIN-AGENT-CONTROL' --arg programId "$PROGRAM_ID" --arg checkpointAt "$CHECKPOINT_AT" --arg productionSha "$LIVE_SHA" --arg controllerSha "$GITHUB_SHA" --arg githubRunId "$GITHUB_RUN_ID" --arg trigger "$GITHUB_EVENT_NAME" --argjson total 112 --argjson active "$active" --argjson paused "$paused" --argjson disabled "$disabled" --argjson fresh "$fresh" --argjson productive "$productive" --argjson evidence "$evidence" --slurpfile agents /tmp/ivx112/records.json '{ok:$ok,certificate:$certificate,programId:$programId,checkpointAt:$checkpointAt,productionSha:$productionSha,controllerSha:$controllerSha,githubRunId:$githubRunId,trigger:$trigger,totalAgents:$total,activeAgents:$active,pausedAgents:$paused,disabledAgents:$disabled,freshHeartbeatsWithin30m:$fresh,agentsWithProductiveActivity:$productive,agentsWithEvidence:$evidence,agents:$agents[0],truthNote:"PASS requires all 112 active, no paused/disabled agents, 112 fresh heartbeats, 112 productive activity records and 112 persisted evidence records. The controller is also triggered immediately after a successful No-Idle repair cycle so repaired capacity is certified without waiting for the next cron."}' > qa/evidence/autonomous/ivx-112-15min-latest.json
          cat qa/evidence/autonomous/ivx-112-15min-latest.json
          test "$(jq -r '.ok' qa/evidence/autonomous/ivx-112-15min-latest.json)" = true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivx-112-15min-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/evidence/autonomous/ivx-112-15min-latest.json
          if-no-files-found: error
