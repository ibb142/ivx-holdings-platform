name: IVX Autonomous Out-of-Band Rescue

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  id-token: write

env:
  API_BASE: https://api.ivxholding.com
  SUPABASE_URL: https://kvclcdjmjghndxsngfzb.supabase.co
  PROJECT_REF: kvclcdjmjghndxsngfzb
  REPO: ibb142/ivx-holdings-platform
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SYSTEM_KEY: ${{ secrets.IVX_SYSTEM_SECRET }}
  SYSTEM_KEY_FALLBACK: ${{ secrets.IVX_AI_SYSTEM_SECRET }}

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ivx-autonomous-out-of-band-rescue
      cancel-in-progress: true
    steps:
      - name: Acquire trusted machine identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          raw=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$raw" | jq -r '.value // empty')
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Audit canonical durable data plane without IVX backend
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          unhealthy=false
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo '::error::SUPABASE_SERVICE_ROLE_KEY is not bound; out-of-band recovery cannot verify the durable data plane.'
            unhealthy=true
          else
            code=$(curl -sS --max-time 20 -o /tmp/rest.json -w '%{http_code}' \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${SUPABASE_URL}/rest/v1/ivx_durable_documents?select=doc_key&limit=1" || true)
            echo "supabase_durable_data_plane_http=$code"
            if [ "$code" != 200 ]; then
              cat /tmp/rest.json 2>/dev/null | head -c 500 || true
              echo
              unhealthy=true
            fi
          fi
          echo "unhealthy=$unhealthy" >> "$GITHUB_OUTPUT"

      - name: Restart Supabase directly only when durable data plane is genuinely unhealthy
        if: steps.audit.outputs.unhealthy == 'true'
        id: restart
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo '::error::SUPABASE_ACCESS_TOKEN is not bound'; exit 2; }
          auth=$(curl -sS --max-time 20 -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}" || true)
          echo "supabase_management_http=$auth"
          if [ "$auth" = 401 ]; then
            echo '::error::SUPABASE_ACCESS_TOKEN_STALE_OR_REVOKED: rotate the GitHub Actions management token. Durable data-plane health is evaluated independently.'
            exit 3
          fi
          [ "$auth" = 200 ] || { cat /tmp/project.json 2>/dev/null | head -c 500 || true; exit 3; }
          code=$(curl -sS --max-time 45 -o /tmp/restart.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart" || true)
          echo "supabase_restart_http=$code"
          case "$code" in 200|201|202) ;; *) cat /tmp/restart.json 2>/dev/null | head -c 500 || true; exit 4 ;; esac

      - name: Wait for canonical durable data plane recovery
        if: steps.audit.outputs.unhealthy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || exit 2
          for i in $(seq 1 60); do
            code=$(curl -sS --max-time 15 -o /tmp/rest-after.json -w '%{http_code}' \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${SUPABASE_URL}/rest/v1/ivx_durable_documents?select=doc_key&limit=1" || true)
            echo "recovery_poll=$i http=$code"
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          cat /tmp/rest-after.json 2>/dev/null | head -c 500 || true
          exit 5

      - name: Capture 112 IA baseline
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/agents-before.json -w '%{http_code}' "$API_BASE/api/ivx/agents" || true)
          [ "$code" = 200 ] || { echo "::error::agent baseline endpoint http=$code"; exit 6; }
          total=$(jq -r '.totalAgents // (.agents|length) // 0' /tmp/agents-before.json)
          echo "baseline_total_agents=$total"
          [ "$total" -eq 112 ] || { echo "::error::expected 112 registered IA, got $total"; exit 6; }

      - name: Resume 112 IA after infrastructure check or recovery
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          owner_key="${SYSTEM_KEY:-${SYSTEM_KEY_FALLBACK:-}}"
          args=(-sS --max-time 30 -o /tmp/resume.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}")
          if [ -n "$owner_key" ]; then args+=( -H "x-ivx-owner-key: $owner_key" ); fi
          for i in 1 2 3 4 5 6; do
            code=$(curl "${args[@]}" -d '{"action":"resume_all"}' "$API_BASE/api/ivx/agents/app-completion/control" || true)
            echo "resume_attempt=$i http=$code"
            if [ "$code" = 200 ] && [ "$(jq -r '.ok // false' /tmp/resume.json 2>/dev/null)" = true ]; then
              jq '{ok,control,counts,authorization}' /tmp/resume.json || true
              exit 0
            fi
            sleep 10
          done
          cat /tmp/resume.json 2>/dev/null | head -c 1000 || true
          exit 7

      - name: Force all 112 IA lanes back to runnable work
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          owner_key="${SYSTEM_KEY:-${SYSTEM_KEY_FALLBACK:-}}"
          [ -n "$owner_key" ] || { echo '::error::Owner/system key is required to force per-agent retry.'; exit 8; }
          export API_BASE owner_key OIDC_TOKEN
          seq 1 112 | xargs -n1 -P8 -I{} bash -c '
            n="$1"
            out="/tmp/retry-${n}.json"
            code=$(curl -sS --max-time 30 -o "$out" -w "%{http_code}" -X POST \
              -H "content-type: application/json" \
              -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" \
              -H "x-ivx-owner-key: ${owner_key}" \
              -d "{\"action\":\"retry_agent\",\"agentNumber\":${n}}" \
              "${API_BASE}/api/ivx/agents/app-completion/control" || true)
            ok=$(jq -r ".ok // false" "$out" 2>/dev/null || echo false)
            if [ "$code" != 200 ] || [ "$ok" != true ]; then
              echo "retry_agent IA-${n} failed http=${code} ok=${ok}" >&2
              exit 1
            fi
            echo "IA-${n}=retry-dispatched"
          ' _ {}
          echo 'all_112_retry_dispatches=accepted'

      - name: Verify all 112 IA entered real forward progress
        shell: bash
        run: |
          set -euo pipefail
          for poll in $(seq 1 18); do
            agents_code=$(curl -sS --max-time 20 -o /tmp/agents-after.json -w '%{http_code}' "$API_BASE/api/ivx/agents" || true)
            dash_code=$(curl -sS --max-time 20 -o /tmp/dashboard.json -w '%{http_code}' "$API_BASE/api/ivx/agents/app-completion/dashboard" || true)
            if [ "$agents_code" = 200 ] && [ "$dash_code" = 200 ]; then
              total=$(jq -r '.totalAgents // (.agents|length) // 0' /tmp/agents-after.json)
              paused=$(jq '[.agents[] | select(.paused == true)] | length' /tmp/agents-after.json)
              disabled=$(jq '[.agents[] | select(.disabled == true)] | length' /tmp/agents-after.json)
              busy=$(jq '[.agents[] | select((.availability // "") == "busy")] | length' /tmp/agents-after.json)
              progressed=$(jq -n --slurpfile before /tmp/agents-before.json --slurpfile after /tmp/agents-after.json '
                ($before[0].agents // []) as $b |
                ($after[0].agents // []) as $a |
                [ $a[] as $cur |
                  ($b[] | select(.agentNumber == $cur.agentNumber)) as $old |
                  select((($cur.availability // "") == "busy") or (($cur.totalRuns // 0) > ($old.totalRuns // 0)))
                ] | length')
              running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/dashboard.json)
              queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/dashboard.json)
              echo "poll=$poll total=$total paused=$paused disabled=$disabled busy=$busy progressed=$progressed dispatcher_running=$running dispatcher_queued=$queued"
              if [ "$total" -eq 112 ] && [ "$paused" -eq 0 ] && [ "$disabled" -eq 0 ] && [ "$progressed" -eq 112 ]; then
                echo 'AUTONOMOUS_112_FLEET_SATURATED=true'
                exit 0
              fi
            fi
            sleep 10
          done
          echo '::error::AUTONOMOUS_112_FLEET_SATURATION_FAILED: GREEN forbidden until every one of 112 IA shows busy state or a fresh run increment after rescue.'
          exit 9

      - name: Re-run failed current-main workflows after rescue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          gh api "repos/$REPO/actions/runs?branch=main&head_sha=$main_sha&per_page=100" > /tmp/runs.json
          jq -r '.workflow_runs[] | select((.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out" or .conclusion=="startup_failure" or .conclusion=="action_required") and .name!="IVX Autonomous Out-of-Band Rescue") | .id' /tmp/runs.json | sort -u | while read -r id; do
            [ -n "$id" ] || continue
            gh api -X POST "repos/$REPO/actions/runs/$id/rerun-failed-jobs" >/dev/null 2>&1 || true
          done
