name: Autonomous Internal + External E2E Control Tower

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: autonomous-internal-external-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory-control:
    name: INVENTORY - dynamic 360 coverage and OIDC authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Discover every workflow, route, and OIDC control surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ivx-360-inventory
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%P\n' | sort > /tmp/ivx-360-inventory/workflows.txt
          grep -rlE 'X-IVX-GitHub-OIDC|ACTIONS_ID_TOKEN_REQUEST_URL' .github/workflows | sort > /tmp/ivx-360-inventory/oidc-users.txt
          sed -n '/const WORKFLOW_SUFFIXES = \[/,/\] as const/p' backend/services/ivx-github-actions-oidc.ts \
            | grep -oE '\.github/workflows/[^@'"'"']+' | sort -u > /tmp/ivx-360-inventory/oidc-allowlist.txt
          comm -23 /tmp/ivx-360-inventory/oidc-users.txt /tmp/ivx-360-inventory/oidc-allowlist.txt > /tmp/ivx-360-inventory/oidc-missing.txt
          grep -oE "app\.(get|post|put|patch|delete)\('[^']+'" backend/hono.ts | sort -u > /tmp/ivx-360-inventory/backend-routes.txt

          workflow_count=$(wc -l < /tmp/ivx-360-inventory/workflows.txt | tr -d ' ')
          oidc_user_count=$(wc -l < /tmp/ivx-360-inventory/oidc-users.txt | tr -d ' ')
          oidc_allowed_count=$(wc -l < /tmp/ivx-360-inventory/oidc-allowlist.txt | tr -d ' ')
          oidc_missing_count=$(wc -l < /tmp/ivx-360-inventory/oidc-missing.txt | tr -d ' ')
          route_count=$(wc -l < /tmp/ivx-360-inventory/backend-routes.txt | tr -d ' ')
          jq -n --arg sha "$GITHUB_SHA" --argjson workflows "$workflow_count" --argjson oidcUsers "$oidc_user_count" --argjson oidcAllowed "$oidc_allowed_count" --argjson oidcMissing "$oidc_missing_count" --argjson backendRoutes "$route_count" \
            '{sha:$sha,workflowCount:$workflows,oidcWorkflowCount:$oidcUsers,oidcAllowlistCount:$oidcAllowed,oidcMissingCount:$oidcMissing,backendRouteCount:$backendRoutes,internalCoverage:true,externalCoverage:true,status:(if $oidcMissing==0 and $workflows>=100 and $backendRoutes>=1000 then "PASS" else "FAIL" end)}' \
            > /tmp/ivx-360-inventory/coverage.json
          cat /tmp/ivx-360-inventory/coverage.json
          if [ "$oidc_missing_count" -gt 0 ]; then sed 's/^/UNAUTHORIZED_OIDC_WORKFLOW=/' /tmp/ivx-360-inventory/oidc-missing.txt; fi
          test "$workflow_count" -ge 100
          test "$route_count" -ge 1000
          test "$oidc_missing_count" = 0
      - name: Persist discovered 360 inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivx-autonomous-360-inventory-${{ github.run_id }}
          path: /tmp/ivx-360-inventory
          retention-days: 30

  internal-e2e:
    name: INTERNAL - repo, tests, typecheck, lint, 112 registry
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      API_BASE: https://api.ivxholding.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Prove checkout exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "INTERNAL_SHA=$GITHUB_SHA"
      - name: Install dependencies fail-closed
        run: bun install --frozen-lockfile
      - name: Backend full test suite
        run: bun test backend
      - name: Expo typecheck
        run: bun run typecheck
      - name: Expo lint
        run: bun run lint
      - name: Verify exact 112-agent registry from production API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          test "$(jq '[.agents[].agentNumber] | unique | length' /tmp/agents.json)" = 112
          echo 'INTERNAL_112_REGISTRY=PASS'

  external-e2e:
    name: EXTERNAL - live web, API, redirect, exact-SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://api.ivxholding.com
      LANDING: https://ivxholding.com
      WWW: https://www.ivxholding.com
      CHAT: https://chat.ivxholding.com
    steps:
      - name: Landing is publicly reachable
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -L --max-time 30 -o /tmp/landing.html -w '%{http_code}' "$LANDING/")
          test "$code" = 200
          test -s /tmp/landing.html
          echo 'EXTERNAL_LANDING=PASS'
      - name: WWW canonical redirect works
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -I --max-time 30 "$WWW/" -o /tmp/www.headers
          code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}' /tmp/www.headers)
          case "$code" in 301|302|307|308) ;; *) echo "www redirect status=$code"; cat /tmp/www.headers; exit 1;; esac
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/,""); print $2}' /tmp/www.headers | tail -1)
          case "$location" in https://ivxholding.com|https://ivxholding.com/) ;; *) echo "unexpected www location=$location"; exit 1;; esac
          echo 'EXTERNAL_WWW_REDIRECT=PASS'
      - name: Owner chat is publicly reachable
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -L --max-time 30 -o /tmp/chat.html -w '%{http_code}' "$CHAT/")
          test "$code" = 200
          test -s /tmp/chat.html
          echo 'EXTERNAL_CHAT=PASS'
      - name: API health is live
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/health.json -w '%{http_code}' "$API_BASE/health")
          test "$code" = 200
          jq -e '.' /tmp/health.json >/dev/null
          echo 'EXTERNAL_API_HEALTH=PASS'
      - name: Live backend must equal exact GitHub SHA
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/version.json -w '%{http_code}' "$API_BASE/version")
          test "$code" = 200
          live_sha=$(jq -r '.commit // empty' /tmp/version.json)
          test -n "$live_sha"
          if [ "$live_sha" != "$GITHUB_SHA" ]; then
            echo "EXACT_SHA_MISMATCH github=$GITHUB_SHA live=$live_sha"
            cat /tmp/version.json
            exit 1
          fi
          echo "EXTERNAL_EXACT_SHA=PASS $live_sha"
      - name: Production API still exposes exactly 112 agents
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$API_BASE/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          test "$(jq '[.agents[].agentNumber] | unique | length' /tmp/agents.json)" = 112
          echo 'EXTERNAL_112=PASS'

  autonomous-radar:
    name: AUTONOMOUS - diagnose internal/external failure and self-heal safely
    needs: [inventory-control, internal-e2e, external-e2e]
    if: ${{ always() && (needs.inventory-control.result != 'success' || needs.internal-e2e.result != 'success' || needs.external-e2e.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE: https://api.ivxholding.com
      INTERNAL_RESULT: ${{ needs.internal-e2e.result }}
      EXTERNAL_RESULT: ${{ needs.external-e2e.result }}
      INVENTORY_RESULT: ${{ needs.inventory-control.result }}
    steps:
      - name: Fail-closed classification
        shell: bash
        run: |
          set -euo pipefail
          echo "INTERNAL_RESULT=$INTERNAL_RESULT"
          echo "EXTERNAL_RESULT=$EXTERNAL_RESULT"
          echo "INVENTORY_RESULT=$INVENTORY_RESULT"
          test "$INVENTORY_RESULT" = success || echo 'AUTONOMOUS_360_INVENTORY_GAP=DETECTED'
          test "$INTERNAL_RESULT" = success || echo 'AUTONOMOUS_INTERNAL_FAILURE=DETECTED'
          test "$EXTERNAL_RESULT" = success || echo 'AUTONOMOUS_EXTERNAL_FAILURE=DETECTED'
      - name: Acquire scoped GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --max-time 30 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$response" | jq -r '.value // empty')
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo 'AUTONOMOUS_OIDC=ACQUIRED'
      - name: Delegate bounded end-to-end repair mission
        shell: bash
        env:
          IVX_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          test -n "${IVX_GITHUB_OIDC:-}"
          goal="AUTONOMOUS INTERNAL + EXTERNAL E2E CONTROL TOWER. Exact source SHA ${GITHUB_SHA}. Inventory result=${INVENTORY_RESULT}; internal result=${INTERNAL_RESULT}; external result=${EXTERNAL_RESULT}. Discover every workflow, backend route, internal test surface, and public production surface. Inspect failing GitHub Actions jobs and logs, identify exact root cause, repair safe low-risk code/config only, rerun tests/typecheck/lint and live probes, and require exact-SHA parity before certification. Never weaken tests, evidence, 112/112 count, auth, security or owner gates. Stop and require Owner Gate for secrets, IAM, CloudFront/Route53, payments, destructive migrations, security-policy changes, or rollback."
          payload=$(jq -n --arg goal "$goal" '{goal:$goal,executionMode:"code_change",templateMode:"BUG_FIX",approvePatch:true,approveGitDeploy:true,validationMode:"typecheck",systemMode:true,ownerApproved:true,riskLevel:"low",proposedPlan:"Inspect internal CI and external production evidence end-to-end; repair only safe low-risk causes; rerun and prove exact SHA."}')
          http=$(curl -sS --max-time 60 -o /tmp/worker.json -w '%{http_code}' -X POST "$API_BASE/api/ivx/senior-developer/worker/jobs" -H 'Content-Type: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC}" --data "$payload" || true)
          case "$http" in 200|202|409) ;; *) cat /tmp/worker.json || true; exit 1;; esac
          cat /tmp/worker.json

  certificate:
    name: CERTIFICATE - internal + external exact-SHA gate
    needs: [inventory-control, internal-e2e, external-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless both sides are green
        shell: bash
        env:
          INTERNAL_RESULT: ${{ needs.internal-e2e.result }}
          EXTERNAL_RESULT: ${{ needs.external-e2e.result }}
          INVENTORY_RESULT: ${{ needs.inventory-control.result }}
        run: |
          set -euo pipefail
          test "$INVENTORY_RESULT" = success
          test "$INTERNAL_RESULT" = success
          test "$EXTERNAL_RESULT" = success
          echo 'AUTONOMOUS_INTERNAL_EXTERNAL_E2E=PASS'
          echo "EXACT_SHA=$GITHUB_SHA"
          echo 'No internal or external red gate is allowed.'
