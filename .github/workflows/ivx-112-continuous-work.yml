name: IVX 112 Continuous Real Work

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ivx-112-continuous-real-work
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    steps:
      - name: Checkout canonical 112-agent registry fallback
        uses: actions/checkout@v4

      - id: registry
        shell: bash
        run: |
          set -euo pipefail
          api_ok=false
          if curl -fsS --retry 8 --retry-delay 3 --retry-all-errors --max-time 30 \
            https://api.ivxholding.com/api/ivx/agents -o /tmp/agents.json; then
            if [ "$(jq -r '.ok // false' /tmp/agents.json)" = true ] && \
               [ "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112 ]; then
              api_ok=true
            fi
          fi

          if [ "$api_ok" != true ]; then
            echo 'Production registry is temporarily unavailable; using the canonical deterministic registry.'
            jq -n '{ok:true,totalAgents:112,agents:[range(1;113) | {agentNumber:.,agentId:("ivx_holdings_" + (.|tostring))}]}' > /tmp/agents.json
          fi

          test "$(jq '[.agents[].agentNumber] | unique | length' /tmp/agents.json)" = 112
          test "$(jq '[.agents[].agentId] | unique | length' /tmp/agents.json)" = 112
          echo "matrix=$(jq -c '{include:[.agents[]|{agentNumber:.agentNumber,agentId:.agentId}]}' /tmp/agents.json)" >> "$GITHUB_OUTPUT"

  work:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Run real durable engineering work
        shell: bash
        env:
          AGENT_ID: ${{ matrix.agentId }}
          AGENT_NUMBER: ${{ matrix.agentNumber }}
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          response=$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          oidc=$(jq -r '.value // empty' <<<"$response")
          test -n "$oidc"
          echo "::add-mask::$oidc"

          useful=0
          already_verified=0
          for cycle in $(seq 1 12); do
            body=$(jq -nc --arg sourceSha "$GITHUB_SHA" '{sourceSha:$sourceSha}')
            http=000
            for attempt in $(seq 1 12); do
              http=$(curl -sS --max-time 240 -o /tmp/cycle.json -w '%{http_code}' \
                -X POST "https://api.ivxholding.com/api/ivx/agents/${AGENT_ID}/engineering-cycle" \
                -H 'Content-Type: application/json' \
                -H "X-IVX-GitHub-OIDC: ${oidc}" \
                --data "$body" || true)
              if [ "$http" = 200 ]; then break; fi
              if [[ ! "$http" =~ ^(000|408|425|429|500|502|503|504)$ ]]; then break; fi
              echo "CYCLE_TRANSIENT_RETRY agent=${AGENT_NUMBER} cycle=${cycle} http=${http} attempt=${attempt}"
              sleep 10
            done
            if [ "$http" != 200 ]; then
              cat /tmp/cycle.json 2>/dev/null || true
              echo "CYCLE_HTTP_FAIL agent=${AGENT_NUMBER} http=${http}"
              exit 1
            fi

            action=$(jq -r '.result.action // "CYCLE_ERROR"' /tmp/cycle.json)
            productive=$(jq -r '.result.productiveMinutes // 0' /tmp/cycle.json)
            states=$(jq -r '.result.states // [] | join(",")' /tmp/cycle.json)
            echo "agent=${AGENT_NUMBER} cycle=${cycle} action=${action} productiveMinutes=${productive} states=${states}"

            case "$action" in
              TASK_COMPLETED)
                if [[ ",$states," == *,ALREADY_VERIFIED,* ]] || awk -v p="$productive" 'BEGIN { exit !((p+0) <= 0) }'; then
                  already_verified=1
                  echo "NO_PROGRESS_CIRCUIT_BREAKER agent=${AGENT_NUMBER} sha=${GITHUB_SHA} reason=already_verified"
                  break
                fi
                useful=$((useful+1))
                ;;
              TASK_OWNER_GATE)
                cat /tmp/cycle.json
                echo "OWNER_GATE_IS_NOT_SUCCESS agent=${AGENT_NUMBER} sha=${GITHUB_SHA}"
                exit 1
                ;;
              NO_TASK_AVAILABLE)
                break
                ;;
              *)
                cat /tmp/cycle.json
                exit 1
                ;;
            esac
          done

          if [ "$useful" -eq 0 ] && [ "$already_verified" -eq 0 ]; then
            echo "NO_USEFUL_WORK agent=${AGENT_NUMBER}"
            exit 1
          fi
          if [ "$already_verified" -eq 1 ] && [ "$useful" -eq 0 ]; then
            echo "real_work=NO_NEW_WORK agent=${AGENT_NUMBER} sha=${GITHUB_SHA}"
            exit 0
          fi
          echo "real_work=PASS agent=${AGENT_NUMBER} useful_cycles=${useful} sha=${GITHUB_SHA}"
