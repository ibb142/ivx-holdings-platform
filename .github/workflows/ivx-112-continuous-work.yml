name: IVX 112 Continuous Real Work

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    steps:
      - id: registry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 https://api.ivxholding.com/api/ivx/agents -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          echo "matrix=$(jq -c '{include:[.agents[]|{agentNumber:.agentNumber,agentId:.agentId}]}' /tmp/agents.json)" >> "$GITHUB_OUTPUT"

  work:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Run real durable engineering work
        shell: bash
        env:
          AGENT_ID: ${{ matrix.agentId }}
          AGENT_NUMBER: ${{ matrix.agentNumber }}
        run: |
          set -euo pipefail
          oidc=$(curl -fsS --retry 3 --retry-delay 1 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery" | jq -r '.value // empty')
          test -n "$oidc"
          echo "::add-mask::$oidc"
          useful=0
          for cycle in $(seq 1 12); do
            source="${GITHUB_SHA}:${AGENT_ID}:${GITHUB_RUN_ID}:${cycle}"
            body=$(jq -nc --arg sourceSha "$source" '{sourceSha:$sourceSha}')
            http=$(curl -sS --retry 2 --retry-delay 2 --max-time 240 -o /tmp/cycle.json -w '%{http_code}' -X POST "https://api.ivxholding.com/api/ivx/agents/${AGENT_ID}/engineering-cycle" -H 'Content-Type: application/json' -H "X-IVX-GitHub-OIDC: ${oidc}" --data "$body" || true)
            test "$http" = 200
            action=$(jq -r '.result.action // "CYCLE_ERROR"' /tmp/cycle.json)
            echo "agent=${AGENT_NUMBER} cycle=${cycle} action=${action}"
            case "$action" in
              TASK_COMPLETED|TASK_OWNER_GATE) useful=$((useful+1)) ;;
              NO_TASK_AVAILABLE) break ;;
              *) exit 1 ;;
            esac
          done
          test "$useful" -gt 0
          echo "real_work=PASS agent=${AGENT_NUMBER} useful_cycles=${useful}"
