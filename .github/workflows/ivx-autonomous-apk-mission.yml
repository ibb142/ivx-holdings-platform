name: IVX Autonomous APK Delivery Mission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-autonomous-apk-mission.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: ivx-autonomous-apk-delivery
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  APK_WORKFLOW: android-v11031-dashboard-delivery.yml

jobs:
  autonomous-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bind exact current main source SHA
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          test -n "$TARGET_SHA"
          test "$TARGET_SHA" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "APK_MISSION_SOURCE_SHA=$TARGET_SHA"
          # The final release must include same-file Android and handoff QA.
          # A legacy signed package alone cannot satisfy this delivery mission.
          grep -q 'versionCode 132' ".github/workflows/$APK_WORKFLOW"
          grep -q 'sameApkAndroidE2E:true' ".github/workflows/$APK_WORKFLOW"
          grep -q 'autonomousHandoffCompleted:true' ".github/workflows/$APK_WORKFLOW"

      - name: Skip only when exact-SHA APK artifact already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${APK_WORKFLOW}/runs?branch=main&per_page=50" > /tmp/existing-apk-runs.json
          existing_run=$(jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .status=="completed" and .conclusion=="success")][0].id // empty' /tmp/existing-apk-runs.json)
          found=false
          if [ -n "$existing_run" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${existing_run}/artifacts?per_page=100" > /tmp/existing-apk-artifacts.json
            if jq -e --arg sha "$TARGET_SHA" '.artifacts[]? | select(.name == ("IVX-Holdings-v1.10.34-MISSION-CONTROL-" + $sha) and .expired == false)' /tmp/existing-apk-artifacts.json >/dev/null; then found=true; fi
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "existing_run=${existing_run}" >> "$GITHUB_OUTPUT"
          active_run=$(jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested"))][0].id // empty' /tmp/existing-apk-runs.json)
          echo "active_run=$active_run" >> "$GITHUB_OUTPUT"

      - name: Register the deterministic Autonomous build assignment
        if: ${{ steps.existing.outputs.found != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Building an approved revision needs no source mutation or coder lease.
          # A failed build remains failed and retains the exact workflow run evidence.
          jq -n --arg sourceSha "$TARGET_SHA" --arg missionRunId "$GITHUB_RUN_ID" \
            --arg workflow "$APK_WORKFLOW" \
            '{mission:"IVX Autonomous APK Delivery",sourceSha:$sourceSha,missionRunId:$missionRunId,executor:"github_actions",workflow:$workflow,status:"ASSIGNED",sourceMutationRequested:false}' \
            > /tmp/autonomous-apk-task.json

      - name: Dispatch signed APK workflow on exact main
        if: ${{ steps.existing.outputs.found != 'true' && steps.existing.outputs.active_run == '' }}
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_SHA" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          # The release workflow can also start on this same main push. Reuse it
          # after a fresh query so one revision does not build two signed APKs.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${APK_WORKFLOW}/runs?branch=main&per_page=50" > /tmp/apk-before-dispatch.json
          active_run=$(jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha==$sha and (.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested"))][0].id // empty' /tmp/apk-before-dispatch.json)
          if [ -n "$active_run" ]; then
            echo "active_run=$active_run" >> "$GITHUB_OUTPUT"
            echo "APK_BUILD_REUSED=$active_run"
            exit 0
          fi
          date -u +%FT%TZ > /tmp/apk-dispatched-at
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${APK_WORKFLOW}/dispatches" -f ref=main
          echo 'APK_BUILD_DISPATCHED=true'

      - name: Resolve exact-SHA APK workflow run
        if: ${{ steps.existing.outputs.found != 'true' }}
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.existing.outputs.active_run || steps.dispatch.outputs.active_run }}'
          if [ -n "$run_id" ]; then
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "APK_RUN_ID=$run_id"
            exit 0
          fi
          for i in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${APK_WORKFLOW}/runs?branch=main&per_page=30" > /tmp/apk-runs.json
            run_id=$(jq -r --arg sha "$TARGET_SHA" --arg since "$(cat /tmp/apk-dispatched-at)" '[.workflow_runs[] | select(.head_sha==$sha and .created_at >= $since)][0].id // empty' /tmp/apk-runs.json)
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "APK_RUN_ID=$run_id"

      - name: Wait for APK workflow terminal success
        if: ${{ steps.existing.outputs.found != 'true' }}
        env:
          APK_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 360); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${APK_RUN_ID}" > /tmp/apk-run.json
            status=$(jq -r '.status' /tmp/apk-run.json); conclusion=$(jq -r '.conclusion // empty' /tmp/apk-run.json)
            echo "poll=$i status=$status conclusion=${conclusion:-pending}"
            if [ "$status" = completed ]; then test "$conclusion" = success; break; fi
            sleep 20
          done
          test "$(jq -r '.status' /tmp/apk-run.json)" = completed
          test "$(jq -r '.conclusion' /tmp/apk-run.json)" = success
          test "$(jq -r '.head_sha' /tmp/apk-run.json)" = "$TARGET_SHA"

      - name: Verify exact-SHA APK artifact exists
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.existing.outputs.found }}" = true ]; then APK_RUN_ID='${{ steps.existing.outputs.existing_run }}'; else APK_RUN_ID='${{ steps.resolve.outputs.run_id }}'; fi
          test -n "$APK_RUN_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${APK_RUN_ID}/artifacts?per_page=100" > /tmp/apk-artifacts.json
          artifact=$(jq -c --arg sha "$TARGET_SHA" '[.artifacts[] | select(.name == ("IVX-Holdings-v1.10.34-MISSION-CONTROL-" + $sha) and .expired == false)][0] // empty' /tmp/apk-artifacts.json)
          test -n "$artifact"
          test "$TARGET_SHA" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          artifact_id=$(jq -r '.id' <<<"$artifact"); artifact_name=$(jq -r '.name' <<<"$artifact")
          jq -n --arg sourceSha "$TARGET_SHA" --arg runId "$APK_RUN_ID" --arg artifactId "$artifact_id" --arg artifactName "$artifact_name" '{ok:true,mission:"IVX Autonomous APK Delivery",sourceSha:$sourceSha,workflowRunId:$runId,artifactId:$artifactId,artifactName:$artifactName,exactSha:true,olderApkAccepted:false}' > /tmp/autonomous-apk-certificate.json
          cat /tmp/autonomous-apk-certificate.json

      - name: Persist Autonomous APK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IVX-AUTONOMOUS-APK-MISSION-${{ github.sha }}
          path: |
            /tmp/autonomous-apk-task.json
            /tmp/existing-apk-runs.json
            /tmp/existing-apk-artifacts.json
            /tmp/apk-runs.json
            /tmp/apk-run.json
            /tmp/apk-artifacts.json
            /tmp/autonomous-apk-certificate.json
          if-no-files-found: ignore
          retention-days: 30
