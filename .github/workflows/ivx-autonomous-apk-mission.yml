name: IVX Autonomous APK Delivery Mission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-autonomous-apk-mission.yml'
  workflow_run:
    workflows:
      - IVX Autonomous Nervous System
    types: [completed]
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: ivx-autonomous-apk-delivery
  cancel-in-progress: false

env:
  API_BASE: https://api.ivxholding.com
  GH_TOKEN: ${{ github.token }}
  APK_WORKFLOW: android-v11031-dashboard-delivery.yml

jobs:
  autonomous-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bind exact current main source SHA
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          test -n "$TARGET_SHA"
          test "$TARGET_SHA" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "APK_MISSION_SOURCE_SHA=$TARGET_SHA"

      - name: Skip only when exact-SHA APK artifact already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${APK_WORKFLOW}/runs?branch=main&per_page=50" > /tmp/existing-apk-runs.json
          existing_run=$(jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .status=="completed" and .conclusion=="success")][0].id // empty' /tmp/existing-apk-runs.json)
          found=false
          if [ -n "$existing_run" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${existing_run}/artifacts?per_page=100" > /tmp/existing-apk-artifacts.json
            if jq -e --arg sha "$TARGET_SHA" '.artifacts[]? | select(.expired == false) | select(.name | startswith("IVX-Holdings-v1.10.32-MISSION-CONTROL-" + $sha))' /tmp/existing-apk-artifacts.json >/dev/null; then found=true; fi
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "existing_run=${existing_run}" >> "$GITHUB_OUTPUT"

      - name: Capture Senior Developer evidence for this source SHA
        shell: bash
        run: |
          set -euo pipefail
          printf '{"ok":false,"jobs":[]}' > /tmp/autonomous-apk-jobs.json
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery"
          OIDC_TOKEN=$(curl -fsS --max-time 10 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value // empty') || OIDC_TOKEN=''
          if [ -n "$OIDC_TOKEN" ]; then
            code=$(curl -sS --max-time 20 -o /tmp/autonomous-apk-jobs-response.json -w '%{http_code}' "${API_BASE}/api/ivx/senior-developer/worker/jobs" -H "X-IVX-GitHub-OIDC: ${OIDC_TOKEN}" || true)
            if [ "$code" = 200 ] && jq -e '.ok == true and (.jobs | type == "array")' /tmp/autonomous-apk-jobs-response.json >/dev/null 2>&1; then
              cp /tmp/autonomous-apk-jobs-response.json /tmp/autonomous-apk-jobs.json
            fi
          fi
          node scripts/ivx-autonomous-apk-gate.mjs /tmp/autonomous-apk-jobs.json > /tmp/autonomous-apk-senior-evidence.json
          cat /tmp/autonomous-apk-senior-evidence.json

      - name: Dispatch signed APK workflow on exact main
        if: ${{ steps.existing.outputs.found != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "$TARGET_SHA"
          echo "APK_DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${APK_WORKFLOW}/dispatches" -f ref=main
          echo 'APK_BUILD_DISPATCHED=true'

      - name: Resolve exact-SHA APK workflow run
        if: ${{ steps.existing.outputs.found != 'true' }}
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for i in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${APK_WORKFLOW}/runs?branch=main&per_page=30" > /tmp/apk-runs.json
            run_id=$(jq -r --arg sha "$TARGET_SHA" --arg since "$APK_DISPATCHED_AT" '[.workflow_runs[] | select(.head_sha==$sha and .event=="workflow_dispatch" and .created_at >= $since)][0].id // empty' /tmp/apk-runs.json)
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "APK_RUN_ID=$run_id"

      - name: Wait for APK workflow terminal success
        if: ${{ steps.existing.outputs.found != 'true' }}
        env:
          APK_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${APK_RUN_ID}" > /tmp/apk-run.json
            status=$(jq -r '.status' /tmp/apk-run.json); conclusion=$(jq -r '.conclusion // empty' /tmp/apk-run.json)
            echo "poll=$i status=$status conclusion=${conclusion:-pending}"
            if [ "$status" = completed ]; then test "$conclusion" = success; break; fi
            sleep 20
          done
          test "$(jq -r '.status' /tmp/apk-run.json)" = completed
          test "$(jq -r '.conclusion' /tmp/apk-run.json)" = success
          test "$(jq -r '.head_sha' /tmp/apk-run.json)" = "$TARGET_SHA"

      - name: Verify exact-SHA APK artifact exists
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.existing.outputs.found }}" = true ]; then APK_RUN_ID='${{ steps.existing.outputs.existing_run }}'; else APK_RUN_ID='${{ steps.resolve.outputs.run_id }}'; fi
          test -n "$APK_RUN_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${APK_RUN_ID}/artifacts?per_page=100" > /tmp/apk-artifacts.json
          artifact=$(jq -c --arg sha "$TARGET_SHA" '[.artifacts[] | select(.expired == false) | select(.name | startswith("IVX-Holdings-v1.10.32-MISSION-CONTROL-" + $sha))][0] // empty' /tmp/apk-artifacts.json)
          test -n "$artifact"
          artifact_id=$(jq -r '.id' <<<"$artifact"); artifact_name=$(jq -r '.name' <<<"$artifact")
          jq -n --arg sourceSha "$TARGET_SHA" --arg runId "$APK_RUN_ID" --arg artifactId "$artifact_id" --arg artifactName "$artifact_name" --slurpfile senior /tmp/autonomous-apk-senior-evidence.json '{ok:true,scope:"apk_artifact_delivery",mission:"IVX Autonomous APK Delivery",sourceSha:$sourceSha,workflowRunId:$runId,artifactId:$artifactId,artifactName:$artifactName,seniorJobId:$senior[0].jobId,seniorJobCompleted:$senior[0].complete,seniorEvidence:$senior[0],endToEndProductionComplete:false,exactSha:true,olderApkAccepted:false}' > /tmp/autonomous-apk-certificate.json
          cat /tmp/autonomous-apk-certificate.json

      - name: Persist Autonomous APK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IVX-AUTONOMOUS-APK-MISSION-${{ github.sha }}
          path: |
            /tmp/autonomous-apk-jobs.json
            /tmp/autonomous-apk-senior-evidence.json
            /tmp/existing-apk-runs.json
            /tmp/existing-apk-artifacts.json
            /tmp/apk-runs.json
            /tmp/apk-run.json
            /tmp/apk-artifacts.json
            /tmp/autonomous-apk-certificate.json
          if-no-files-found: ignore
          retention-days: 30
