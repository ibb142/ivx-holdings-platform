name: Publish authorized temporary Casa QA video

on:
  push:
    branches: [ops/phase4-temporary-casa-video-20260912]
    paths:
      - '.github/workflows/phase4-casa-temporary-video.yml'
      - 'scripts/ops/publish-casa-temporary-video.mjs'
      - 'qa/fixtures/casa-rosario-temporary-20260912.mp4'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase4-casa-temporary-video.yml'
      - 'scripts/ops/publish-casa-temporary-video.mjs'
      - 'qa/fixtures/casa-rosario-temporary-20260912.mp4'

permissions:
  contents: read

concurrency:
  group: phase4-casa-temporary-video
  cancel-in-progress: false

jobs:
  binary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/ops/publish-casa-temporary-video.mjs --verify-local
  publish-one-object:
    needs: binary-contract
    if: github.repository == 'ibb142/ivx-holdings-platform' && github.event_name == 'push' && github.ref == 'refs/heads/ops/phase4-temporary-casa-video-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Create missing object and verify its exact public bytes
        run: node scripts/ops/publish-casa-temporary-video.mjs --publish-authorized-temporary
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: casa-temporary-video-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/evidence/casa-temporary-video/receipt.json
          if-no-files-found: error
          retention-days: 30
