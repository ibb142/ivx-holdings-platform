name: IVX Repair System Secret Owner Variable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-repair-system-secret-owner-variable.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - name: Rewrite encrypted IVX system secret owner variable
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = await import('node:crypto');
          const base = (process.env.EXPO_PUBLIC_SUPABASE_URL || '').replace(/\/+$/, '');
          const serviceKey = (process.env.SUPABASE_SERVICE_ROLE_KEY || '').trim();
          const systemSecret = (process.env.IVX_AI_SYSTEM_SECRET || '').trim();
          if (!base || !serviceKey || !systemSecret) throw new Error('required repair bindings missing');

          // Match backend/api/ivx-owner-variables.ts exactly:
          // deriveFallbackEncryptionKey() => sha256(`${supabaseUrl}:${serviceRole}`).hex
          // getEncryptionKeyCandidates() => sha256(fallbackSource).bytes
          const fallbackSource = crypto.createHash('sha256').update(`${base}:${serviceKey}`, 'utf8').digest('hex');
          const key = crypto.createHash('sha256').update(fallbackSource, 'utf8').digest();
          const iv = crypto.randomBytes(12);
          const aad = Buffer.from('ivx_owner_variables:v1', 'utf8');
          const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
          cipher.setAAD(aad);
          const encrypted = Buffer.concat([cipher.update(systemSecret, 'utf8'), cipher.final()]);
          const tag = cipher.getAuthTag();
          const hash = crypto.createHash('sha256').update(systemSecret, 'utf8').digest('hex');
          const masked = systemSecret.length <= 8 ? '********' : `${systemSecret.slice(0,4)}***${systemSecret.slice(-4)}`;
          const now = new Date().toISOString();

          const url = `${base}/rest/v1/ivx_owner_variables?on_conflict=name`;
          const headers = {
            apikey: serviceKey,
            Authorization: `Bearer ${serviceKey}`,
            'Content-Type': 'application/json',
            Prefer: 'resolution=merge-duplicates,return=minimal',
          };
          const body = [{
            name: 'IVX_AI_SYSTEM_SECRET',
            provider: 'security',
            encrypted_value: encrypted.toString('base64'),
            value_iv: iv.toString('base64'),
            value_tag: tag.toString('base64'),
            value_hash: hash,
            masked_preview: masked,
            status: 'saved',
            last_test_result: null,
            updated_at: now,
          }];
          const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
          if (!res.ok) throw new Error(`owner variable upsert HTTP ${res.status}: ${(await res.text()).slice(0,160)}`);

          const check = await fetch(`${base}/rest/v1/ivx_owner_variables?select=name,value_hash,status&name=eq.IVX_AI_SYSTEM_SECRET`, {
            headers: { apikey: serviceKey, Authorization: `Bearer ${serviceKey}`, Accept: 'application/json' },
          });
          if (!check.ok) throw new Error(`owner variable verify HTTP ${check.status}`);
          const rows = await check.json();
          if (!Array.isArray(rows) || rows.length !== 1 || rows[0]?.value_hash !== hash || rows[0]?.status !== 'saved') {
            throw new Error('owner variable post-write verification failed');
          }
          console.log('ivx_system_secret_owner_variable_repair=PASS');
          console.log('encryption_source=runtime_fallback');
          console.log('secret_values_returned=false');
          NODE
