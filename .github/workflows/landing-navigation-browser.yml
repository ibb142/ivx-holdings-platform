name: Landing Navigation Browser QA
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'expo/ivxholding-landing/**'
      - 'qa/landing-navigation-browser.mjs'
      - '.github/workflows/landing-navigation-browser.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: landing-navigation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1280]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for this production commit
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 https://api.ivxholding.com/health -o /tmp/health.json; then
              if jq -e --arg sha "$GITHUB_SHA" '.ok == true and .commit == $sha' /tmp/health.json > /dev/null; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production did not reach the workflow commit; browser evidence unavailable.'
          exit 1
      - name: Start local landing for PR validation
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8080 --directory expo/ivxholding-landing > /tmp/landing-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Verify modal controls and browser Back
        env:
          LANDING_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8080' || 'https://ivxholding.com' }}
          VERIFY_PRODUCTION: ${{ github.event_name != 'pull_request' }}
          VIEWPORT_WIDTH: ${{ matrix.width }}
        run: node qa/landing-navigation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-navigation-${{ matrix.width }}-${{ github.run_id }}
          path: evidence/landing-navigation/*.json
          if-no-files-found: warn
          retention-days: 30
