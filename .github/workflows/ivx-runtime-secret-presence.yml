name: IVX Runtime Secret Presence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-runtime-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      IVX_AI_GATEWAY_KEY: ${{ secrets.IVX_AI_GATEWAY_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      IVX_OWNER_VARIABLES_ENCRYPTION_KEY: ${{ secrets.IVX_OWNER_VARIABLES_ENCRYPTION_KEY }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      IVX_OWNER_TOKEN: ${{ secrets.IVX_OWNER_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in IVX_AI_GATEWAY_KEY AI_GATEWAY_API_KEY IVX_OWNER_VARIABLES_ENCRYPTION_KEY APP_SECRET JWT_SECRET IVX_OWNER_TOKEN RENDER_API_KEY SUPABASE_SERVICE_ROLE_KEY EXPO_PUBLIC_SUPABASE_URL SUPABASE_URL; do
            if [ -n "${!name:-}" ]; then echo "$name=PRESENT"; else echo "$name=MISSING"; fi
          done
