name: IVX Autonomous Quality Closeout

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/services/ivx-agent-mutation-tools.ts'
      - 'backend/services/ivx-agent-autonomous-mutation-tools.test.ts'
      - 'backend/services/ivx-agent-engineering-tools.ts'
      - 'backend/services/ivx-autonomous-intelligence-mission-scheduler.ts'
      - 'backend/services/ivx-autonomous-intelligence-mission-scheduler-dedup.test.ts'
      - '.github/workflows/ivx-112-24x7-watchdog.yml'
      - '.github/workflows/ivx-autonomous-quality-closeout.yml'
  push:
    branches: [main]
    paths:
      - 'backend/services/ivx-agent-mutation-tools.ts'
      - 'backend/services/ivx-agent-engineering-tools.ts'
      - 'backend/services/ivx-autonomous-intelligence-mission-scheduler.ts'
      - '.github/workflows/ivx-112-24x7-watchdog.yml'
      - '.github/workflows/ivx-autonomous-quality-closeout.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: 1. Low-risk autonomous coding capability
        shell: bash
        run: |
          set -euo pipefail
          bun test backend/services/ivx-agent-autonomous-mutation-tools.test.ts
          grep -q "autonomous_system" backend/services/ivx-agent-mutation-tools.ts
          grep -q "low_risk_application_code" backend/services/ivx-agent-mutation-tools.ts
          grep -q "verified_low_risk_commit" backend/services/ivx-agent-mutation-tools.ts
          grep -q "non_protected_branch_push" backend/services/ivx-agent-mutation-tools.ts
          echo 'low_risk_autonomous_coding=PASS'

      - name: 2. Role-to-task intelligence
        shell: bash
        run: |
          set -euo pipefail
          grep -q "role_and_incident_context_v1" .github/workflows/ivx-112-24x7-watchdog.yml
          grep -q "role_security_scan" .github/workflows/ivx-112-24x7-watchdog.yml
          grep -q "role_mobile_platform_code" .github/workflows/ivx-112-24x7-watchdog.yml
          grep -q "role_backend_runtime_code" .github/workflows/ivx-112-24x7-watchdog.yml
          grep -q "role_delivery_pipeline_code" .github/workflows/ivx-112-24x7-watchdog.yml
          echo 'role_to_task_intelligence=PASS'

      - name: 3. P0 detection and prioritization
        shell: bash
        run: |
          set -euo pipefail
          grep -q "workflow_run:" .github/workflows/ivx-112-24x7-watchdog.yml
          grep -q "IVX Owner Sign In + Home Android Certificate" .github/workflows/ivx-112-24x7-watchdog.yml
          for n in 10 11 74 79 87 88; do grep -Eq "^[[:space:]]*$n\\)" .github/workflows/ivx-112-24x7-watchdog.yml; done
          grep -q "P0 technical routing failed" .github/workflows/ivx-112-24x7-watchdog.yml
          echo 'p0_detection_prioritization=PASS'

      - name: 4. Technical agents use technical tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in code_read code_search typecheck run_tests lint secret_scan; do grep -q "'$tool'" backend/services/ivx-agent-engineering-tools.ts; done
          grep -q "p0_platform_home_runtime" .github/workflows/ivx-112-24x7-watchdog.yml
          grep -q "p0_qa_certificate_gate" .github/workflows/ivx-112-24x7-watchdog.yml
          grep -q "p0_auth_session_transition" .github/workflows/ivx-112-24x7-watchdog.yml
          grep -q "p0_android_home_runtime" .github/workflows/ivx-112-24x7-watchdog.yml
          grep -q "p0_functional_test_flow" .github/workflows/ivx-112-24x7-watchdog.yml
          grep -q "p0_qa_screen_paint_watchdog" .github/workflows/ivx-112-24x7-watchdog.yml
          echo 'technical_agents_do_technical_work=PASS'

      - name: 5. Senior Developer durable telemetry
        shell: bash
        run: |
          set -euo pipefail
          for field in inspectedFiles changedFiles commitSha prNumber prMerged prMergeCommitSha deployId liveCommit healthOk completedAt error; do grep -q "$field: next.$field" backend/services/ivx-autonomous-intelligence-mission-scheduler.ts; done
          grep -q "appendDurableEvent" backend/services/ivx-autonomous-intelligence-mission-scheduler.ts
          grep -q "writeDurableJson" backend/services/ivx-autonomous-intelligence-mission-scheduler.ts
          echo 'senior_developer_durable_telemetry=PASS'

      - name: 6. Duplicate/repetitive work prevention
        shell: bash
        run: |
          set -euo pipefail
          bun test backend/services/ivx-autonomous-intelligence-mission-scheduler-dedup.test.ts
          grep -q "isCompletedMissionReusable" backend/services/ivx-autonomous-intelligence-mission-scheduler.ts
          grep -q "Duplicate mission submission suppressed" backend/services/ivx-autonomous-intelligence-mission-scheduler.ts
          echo 'duplicate_repetitive_work_prevention=PASS'

      - name: Live 112 registry guard
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://api.ivxholding.com/api/ivx/agents -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          test "$(jq '[.agents[].agentId] | unique | length' /tmp/agents.json)" = 112
          echo 'live_registry=112/112'

      - name: Build closeout certificate
        shell: bash
        run: |
          mkdir -p qa/evidence/autonomous
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{certificate:"IVX-AUTONOMOUS-QUALITY-CLOSEOUT",passed:true,sourceSha:$sha,githubRunId:$runId,lowRiskAutonomousCoding:true,roleToTaskIntelligence:true,p0DetectionPrioritization:true,technicalAgentsDoingTechnicalWork:true,seniorDeveloperDurableTelemetry:true,duplicateRepetitiveWorkPrevention:true,liveRegistry112:true,secretValuesReturned:false,verifiedAt:$verifiedAt}' \
            > qa/evidence/autonomous/ivx-autonomous-quality-closeout.json
          cat qa/evidence/autonomous/ivx-autonomous-quality-closeout.json

      - uses: actions/upload-artifact@v4
        with:
          name: ivx-autonomous-quality-closeout-${{ github.sha }}
          path: qa/evidence/autonomous/ivx-autonomous-quality-closeout.json
          if-no-files-found: error
