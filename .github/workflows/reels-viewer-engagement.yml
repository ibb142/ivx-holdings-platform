name: Reels viewer engagement
on:
  pull_request:
    paths:
      - 'backend/api/ivx-video-platform.ts'
      - 'backend/services/ivx-viewer-engagement.ts'
      - 'backend/ivx-viewer-engagement.test.mjs'
      - '.github/workflows/reels-viewer-engagement.yml'
  push:
    branches: [main]
    paths:
      - 'backend/api/ivx-video-platform.ts'
      - 'backend/services/ivx-viewer-engagement.ts'
      - 'backend/ivx-viewer-engagement.test.mjs'
      - '.github/workflows/reels-viewer-engagement.yml'
permissions:
  contents: read
jobs:
  viewer-engagement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test backend/ivx-viewer-engagement.test.mjs
