name: IVX 360 Early Warning & Autonomous Recovery

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ivx-360-early-warning
  cancel-in-progress: false

jobs:
  observe-and-route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://api.ivxholding.com
      LANDING_URL: https://ivxholding.com
      CHAT_URL: https://chat.ivxholding.com
      SYSTEM_KEY: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
    steps:
      - name: Checkout exact repository SHA
        uses: actions/checkout@v4

      - name: Post-deploy exact-SHA grace window
        id: deploy_grace
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ivx-360
          deployment_ready=false
          for i in $(seq 1 30); do
            code=000
            rm -f /tmp/ivx-360/grace-version.json
            if value=$(curl -sS --max-time 5 -o /tmp/ivx-360/grace-version.json -w '%{http_code}' "${API_BASE}/version"); then
              code="$value"
            fi
            live_sha=""
            ok=false
            if [ "$code" = 200 ] && jq -e . /tmp/ivx-360/grace-version.json >/dev/null 2>&1; then
              live_sha=$(jq -r '.commit // empty' /tmp/ivx-360/grace-version.json)
              ok=$(jq -r '.ok // false' /tmp/ivx-360/grace-version.json)
            fi
            echo "grace_poll=$i http=$code live=${live_sha:-missing} expected=$GITHUB_SHA"
            if [ "$ok" = true ] && [ "$live_sha" = "$GITHUB_SHA" ]; then
              deployment_ready=true
              break
            fi
            sleep 5
          done
          echo "deployment_ready=$deployment_ready" >> "$GITHUB_OUTPUT"
          jq -n --argjson ready "$deployment_ready" --arg expected "$GITHUB_SHA" \
            '{deploymentReady:$ready,expectedSha:$expected}' > /tmp/ivx-360/deploy-grace.json

      - name: Probe IVX 360 surfaces with retry
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ivx-360
          : > /tmp/ivx-360/probes.jsonl

          probe() {
            name="$1"
            url="$2"
            auth="${3:-none}"
            max_attempts="${4:-3}"
            headers="/tmp/ivx-360/${name}.headers"
            body="/tmp/ivx-360/${name}.body"
            code=000
            latency=0
            attempts_used=0

            for attempt in $(seq 1 "$max_attempts"); do
              attempts_used="$attempt"
              started=$(date +%s%3N)
              rm -f "$headers" "$body"
              value=""
              if [ "$auth" = system ]; then
                if value=$(curl -sS --max-time 8 -D "$headers" -o "$body" -w '%{http_code}' \
                  -H 'Accept: application/json' -H "X-IVX-System-Key: ${SYSTEM_KEY}" "$url"); then
                  code="$value"
                else
                  code=000
                fi
              else
                if value=$(curl -sS --max-time 8 -D "$headers" -o "$body" -w '%{http_code}' \
                  -H 'Accept: application/json,text/html;q=0.9,*/*;q=0.8' "$url"); then
                  code="$value"
                else
                  code=000
                fi
              fi
              ended=$(date +%s%3N)
              latency=$((ended-started))
              case "$code" in
                200|204|301|302|307|308) break ;;
              esac
              if [ "$attempt" -lt "$max_attempts" ]; then sleep $((attempt * 2)); fi
            done

            content_type=$(grep -i '^content-type:' "$headers" 2>/dev/null | tail -1 | tr -d '\r' | cut -d: -f2- | xargs || true)
            ok=false
            json_valid=false
            if jq -e . "$body" >/dev/null 2>&1; then json_valid=true; fi
            case "$code" in
              200|204|301|302|307|308) ok=true ;;
            esac
            jq -n \
              --arg name "$name" --arg url "$url" --arg status "$code" \
              --arg contentType "$content_type" --argjson latencyMs "$latency" \
              --argjson attemptsUsed "$attempts_used" --argjson jsonValid "$json_valid" --argjson ok "$ok" \
              '{name:$name,url:$url,status:$status,latencyMs:$latencyMs,attemptsUsed:$attemptsUsed,contentType:$contentType,jsonValid:$jsonValid,ok:$ok}' \
              >> /tmp/ivx-360/probes.jsonl
          }

          test -n "${SYSTEM_KEY:-}"
          probe landing "$LANDING_URL" none 2
          probe chat "$CHAT_URL" none 2
          probe health "$API_BASE/health" none 3
          probe version "$API_BASE/version" none 3
          probe agents "$API_BASE/api/ivx/agents" none 3
          probe control_plane "$API_BASE/api/ivx/autonomous/control-plane" system 3

          failures=$(jq -s '[.[] | select(.ok != true)] | length' /tmp/ivx-360/probes.jsonl)
          rate_limited=$(jq -s '[.[] | select(.status == "429")] | length' /tmp/ivx-360/probes.jsonl)
          server_errors=$(jq -s '[.[] | select(.status | test("^5"))] | length' /tmp/ivx-360/probes.jsonl)
          timeouts=$(jq -s '[.[] | select(.status == "000")] | length' /tmp/ivx-360/probes.jsonl)
          slow=$(jq -s '[.[] | select(.latencyMs >= 2500)] | length' /tmp/ivx-360/probes.jsonl)
          watch=$(jq -s '[.[] | select(.latencyMs >= 1200 and .latencyMs < 2500)] | length' /tmp/ivx-360/probes.jsonl)

          live_sha=""
          version_ok=false
          if jq -e . /tmp/ivx-360/version.body >/dev/null 2>&1; then
            live_sha=$(jq -r '.commit // empty' /tmp/ivx-360/version.body)
            version_ok=$(jq -r '.ok // false' /tmp/ivx-360/version.body)
          fi
          sha_drift=false
          if [ "$version_ok" = true ] && [ -n "$live_sha" ] && [ "$live_sha" != "$GITHUB_SHA" ]; then sha_drift=true; fi

          agents_ok=false
          total_agents=0
          unique_agents=0
          unavailable_agents=0
          if jq -e . /tmp/ivx-360/agents.body >/dev/null 2>&1; then
            total_agents=$(jq -r '.totalAgents // 0' /tmp/ivx-360/agents.body)
            unique_agents=$(jq '[.agents[]?.agentId] | unique | length' /tmp/ivx-360/agents.body)
            unavailable_agents=$(jq '[.agents[]? | select(.paused==true or .disabled==true)] | length' /tmp/ivx-360/agents.body)
            if [ "$total_agents" = 112 ] && [ "$unique_agents" = 112 ] && [ "$unavailable_agents" = 0 ]; then agents_ok=true; fi
          fi

          deployment_ready=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            deployment_ready='${{ steps.deploy_grace.outputs.deployment_ready }}'
            [ -n "$deployment_ready" ] || deployment_ready=false
          fi

          level=GREEN
          action=observe
          reason=healthy
          if [ "$deployment_ready" != true ] || [ "$server_errors" -gt 0 ] || [ "$timeouts" -gt 0 ] || [ "$failures" -ge 2 ] || [ "$sha_drift" = true ] || [ "$agents_ok" != true ]; then
            level=CRITICAL; action=self_heal; reason=terminal_risk
          elif [ "$rate_limited" -gt 0 ] || [ "$slow" -gt 0 ] || [ "$failures" -gt 0 ]; then
            level=WARNING; action=self_heal; reason=degradation
          elif [ "$watch" -gt 0 ]; then
            level=WATCH; action=preflight; reason=early_latency_signal
          fi

          jq -s \
            --arg level "$level" --arg action "$action" --arg reason "$reason" \
            --arg repositorySha "$GITHUB_SHA" --arg liveSha "$live_sha" \
            --argjson deploymentReady "$deployment_ready" \
            --argjson failures "$failures" --argjson rateLimited "$rate_limited" \
            --argjson serverErrors "$server_errors" --argjson timeouts "$timeouts" \
            --argjson slow "$slow" --argjson watch "$watch" \
            --argjson shaDrift "$sha_drift" --argjson agentsOk "$agents_ok" \
            --argjson totalAgents "$total_agents" --argjson uniqueAgents "$unique_agents" \
            --argjson unavailableAgents "$unavailable_agents" \
            '{level:$level,action:$action,reason:$reason,repositorySha:$repositorySha,liveSha:$liveSha,deploymentReady:$deploymentReady,shaDrift:$shaDrift,agentsOk:$agentsOk,totalAgents:$totalAgents,uniqueAgents:$uniqueAgents,unavailableAgents:$unavailableAgents,failures:$failures,rateLimited:$rateLimited,serverErrors:$serverErrors,timeouts:$timeouts,slow:$slow,watch:$watch,probes:.}' \
            /tmp/ivx-360/probes.jsonl > /tmp/ivx-360/assessment.json

          cat /tmp/ivx-360/assessment.json
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Record 112-agent contract surface
        shell: bash
        run: |
          set -euo pipefail
          if jq -e . /tmp/ivx-360/agents.body >/dev/null 2>&1; then
            jq '{ok,totalAgents,uniqueAgents:([.agents[]?.agentId]|unique|length),unavailableAgents:([.agents[]?|select(.paused==true or .disabled==true)]|length)}' \
              /tmp/ivx-360/agents.body > /tmp/ivx-360/agents-contract-evidence.json
          else
            jq -n '{ok:false,reason:"agents_surface_unavailable_or_non_json"}' > /tmp/ivx-360/agents-contract-evidence.json
          fi
          cat /tmp/ivx-360/agents-contract-evidence.json

      - name: Route WATCH to autonomous preflight with retry
        if: ${{ steps.probe.outputs.action == 'preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          assessment=$(cat /tmp/ivx-360/assessment.json)
          goal="IVX 360 EARLY WARNING WATCH. Diagnose the pre-failure signal without production mutation. Inspect latency trend, endpoint contracts, queues, worker heartbeat, rate-limit symptoms, auth dependency symptoms, deploy SHA parity, and recent workflow regressions. Evidence required. Assessment: ${assessment}"
          payload=$(jq -n --arg goal "$goal" '{goal:$goal,executionMode:"qa_only",templateMode:"BUG_FIX",approvePatch:false,approveGitDeploy:false,validationMode:"typecheck",riskLevel:"low",proposedPlan:"360-degree predictive preflight only.",rollbackOption:"No production mutation permitted.",filesAffected:["ivx-360-observability"]}')
          accepted=false
          for attempt in 1 2 3; do
            http=000
            if value=$(curl -sS --max-time 20 -o /tmp/ivx-360/worker.json -w '%{http_code}' -X POST \
              "$API_BASE/api/ivx/senior-developer/worker/jobs" \
              -H 'Content-Type: application/json' -H "X-IVX-System-Key: ${SYSTEM_KEY}" --data "$payload"); then http="$value"; fi
            echo "preflight_dispatch_attempt=$attempt http=$http"
            case "$http" in 200|202|409) accepted=true; break;; esac
            sleep $((attempt * 3))
          done
          jq -n --argjson accepted "$accepted" '{preflightDispatchAccepted:$accepted}' > /tmp/ivx-360/preflight-dispatch.json
          [ "$accepted" = true ]

      - name: Route WARNING or CRITICAL to safe autonomous repair with retry
        if: ${{ steps.probe.outputs.action == 'self_heal' }}
        shell: bash
        run: |
          set -euo pipefail
          assessment=$(cat /tmp/ivx-360/assessment.json)
          goal="IVX 360 EARLY WARNING SELF-HEAL. Diagnose and repair LOW-RISK code defects before user impact. Inspect health/version, public landing/chat reachability, 429/5xx/timeouts, latency, 112-agent availability, queue/worker symptoms and SHA drift. Never change secrets, IAM, auth permissions, payments, destructive migrations, security policy, DNS, CloudFront, Route53 or other production infrastructure without Owner Gate. Never weaken QA. Patch only when evidence identifies a low-risk code defect; test before proposing deploy. Assessment: ${assessment}"
          payload=$(jq -n --arg goal "$goal" '{goal:$goal,executionMode:"code_change",templateMode:"BUG_FIX",approvePatch:true,approveGitDeploy:false,validationMode:"typecheck",riskLevel:"low",proposedPlan:"Evidence-backed low-risk self-heal; high-risk infrastructure/auth remains Owner-gated.",rollbackOption:"Revert autonomous repair PR on regression.",filesAffected:["ivx-360-diagnosis"]}')
          accepted=false
          for attempt in 1 2 3; do
            http=000
            if value=$(curl -sS --max-time 20 -o /tmp/ivx-360/worker.json -w '%{http_code}' -X POST \
              "$API_BASE/api/ivx/senior-developer/worker/jobs" \
              -H 'Content-Type: application/json' -H "X-IVX-System-Key: ${SYSTEM_KEY}" --data "$payload"); then http="$value"; fi
            echo "self_heal_dispatch_attempt=$attempt http=$http"
            case "$http" in 200|202|409) accepted=true; break;; esac
            sleep $((attempt * 3))
          done
          jq -n --argjson accepted "$accepted" '{selfHealDispatchAccepted:$accepted}' > /tmp/ivx-360/self-heal-dispatch.json
          [ "$accepted" = true ]

      - name: Persist immutable 360 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivx-360-evidence-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/ivx-360
          if-no-files-found: error
          retention-days: 30
