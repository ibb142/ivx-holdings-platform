name: IVX 360 Early Warning & Autonomous Recovery

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ivx-360-early-warning
  cancel-in-progress: true

jobs:
  observe-and-route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://api.ivxholding.com
      LANDING_URL: https://ivxholding.com
      CHAT_URL: https://chat.ivxholding.com
      IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
      IVX_OWNER_TOKEN: ${{ secrets.IVX_OWNER_TOKEN }}
    steps:
      - name: Checkout exact repository SHA
        uses: actions/checkout@v4

      - name: Acquire signed GitHub OIDC machine identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          response=$(curl -fsS --retry 2 --retry-delay 1 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$response" | jq -r '.value // empty')
          test -n "$token"
          echo "::add-mask::$token"
          echo "IVX_GITHUB_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Resolve fallback auth candidates without exposing values
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for name in IVX_AI_SYSTEM_SECRET IVX_SYSTEM_SECRET IVX_OWNER_TOKEN; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              found=$((found + 1))
            fi
          done
          echo "count=$found" >> "$GITHUB_OUTPUT"

      - name: Post-deploy exact-SHA stabilization window
        id: deploy_grace
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ivx-360
          deployment_ready=false
          consecutive=0
          for i in $(seq 1 40); do
            code=000
            rm -f /tmp/ivx-360/grace-version.json
            if value=$(curl -sS --max-time 5 -o /tmp/ivx-360/grace-version.json -w '%{http_code}' "${API_BASE}/version"); then code="$value"; fi
            live_sha=""; ok=false
            if [ "$code" = 200 ] && jq -e . /tmp/ivx-360/grace-version.json >/dev/null 2>&1; then
              live_sha=$(jq -r '.commit // empty' /tmp/ivx-360/grace-version.json)
              ok=$(jq -r '.ok // false' /tmp/ivx-360/grace-version.json)
            fi
            if [ "$ok" = true ] && [ "$live_sha" = "$GITHUB_SHA" ]; then consecutive=$((consecutive + 1)); else consecutive=0; fi
            echo "grace_poll=$i http=$code live=${live_sha:-missing} expected=$GITHUB_SHA consecutive=$consecutive"
            if [ "$consecutive" -ge 3 ]; then deployment_ready=true; break; fi
            sleep 5
          done
          echo "deployment_ready=$deployment_ready" >> "$GITHUB_OUTPUT"
          jq -n --argjson ready "$deployment_ready" --arg expected "$GITHUB_SHA" --argjson consecutive "$consecutive" \
            '{deploymentReady:$ready,expectedSha:$expected,consecutiveExactSha:$consecutive}' > /tmp/ivx-360/deploy-grace.json

      - name: Probe IVX 360 surfaces with retry
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ivx-360
          : > /tmp/ivx-360/probes.jsonl

          probe_public() {
            name="$1"; url="$2"; max_attempts="${3:-3}"
            headers="/tmp/ivx-360/${name}.headers"; body="/tmp/ivx-360/${name}.body"
            code=000; latency=0; attempts_used=0
            for attempt in $(seq 1 "$max_attempts"); do
              attempts_used="$attempt"; started=$(date +%s%3N); rm -f "$headers" "$body"; value=""
              if value=$(curl -sS --max-time 8 -D "$headers" -o "$body" -w '%{http_code}' -H 'Accept: application/json,text/html;q=0.9,*/*;q=0.8' "$url"); then code="$value"; else code=000; fi
              ended=$(date +%s%3N); latency=$((ended-started))
              case "$code" in 200|204|301|302|307|308) break;; esac
              if [ "$attempt" -lt "$max_attempts" ]; then sleep $((attempt * 2)); fi
            done
            content_type=$(grep -i '^content-type:' "$headers" 2>/dev/null | tail -1 | tr -d '\r' | cut -d: -f2- | xargs || true)
            ok=false; json_valid=false
            if jq -e . "$body" >/dev/null 2>&1; then json_valid=true; fi
            case "$code" in 200|204|301|302|307|308) ok=true;; esac
            jq -n --arg name "$name" --arg url "$url" --arg status "$code" --arg authSource none --arg contentType "$content_type" --argjson latencyMs "$latency" --argjson attemptsUsed "$attempts_used" --argjson jsonValid "$json_valid" --argjson ok "$ok" \
              '{name:$name,url:$url,status:$status,authSource:$authSource,latencyMs:$latencyMs,attemptsUsed:$attemptsUsed,contentType:$contentType,jsonValid:$jsonValid,ok:$ok}' >> /tmp/ivx-360/probes.jsonl
          }

          probe_machine() {
            name="$1"; url="$2"; headers="/tmp/ivx-360/${name}.headers"; body="/tmp/ivx-360/${name}.body"
            code=000; latency=0; attempts_used=0; auth_source=none

            for attempt in 1 2 3; do
              attempts_used=$((attempts_used + 1)); started=$(date +%s%3N)
              rm -f "$headers" "$body"
              if value=$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' -H 'Accept: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC_TOKEN}" "$url"); then code="$value"; else code=000; fi
              ended=$(date +%s%3N); latency=$((ended-started))
              echo "machine_probe auth=GITHUB_OIDC attempt=$attempt http=$code latencyMs=$latency"
              case "$code" in 200|204) auth_source=GITHUB_OIDC; break;; esac
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
            done

            if [ "$auth_source" != GITHUB_OIDC ]; then
              for candidate_name in IVX_AI_SYSTEM_SECRET IVX_SYSTEM_SECRET IVX_OWNER_TOKEN; do
                candidate="${!candidate_name:-}"; [ -n "$candidate" ] || continue
                attempts_used=$((attempts_used + 1)); started=$(date +%s%3N)
                if value=$(curl -sS --max-time 8 -D "$headers" -o "$body" -w '%{http_code}' -H 'Accept: application/json' -H "X-IVX-System-Key: ${candidate}" "$url"); then code="$value"; else code=000; fi
                ended=$(date +%s%3N); latency=$((ended-started))
                case "$code" in 200|204) auth_source="$candidate_name"; break;; esac
              done
            fi

            content_type=$(grep -i '^content-type:' "$headers" 2>/dev/null | tail -1 | tr -d '\r' | cut -d: -f2- | xargs || true)
            ok=false; json_valid=false
            if jq -e . "$body" >/dev/null 2>&1; then json_valid=true; fi
            case "$code" in 200|204) ok=true;; esac
            jq -n --arg name "$name" --arg url "$url" --arg status "$code" --arg authSource "$auth_source" --arg contentType "$content_type" --argjson latencyMs "$latency" --argjson attemptsUsed "$attempts_used" --argjson jsonValid "$json_valid" --argjson ok "$ok" \
              '{name:$name,url:$url,status:$status,authSource:$authSource,latencyMs:$latencyMs,attemptsUsed:$attemptsUsed,contentType:$contentType,jsonValid:$jsonValid,ok:$ok}' >> /tmp/ivx-360/probes.jsonl
          }

          probe_public landing "$LANDING_URL" 2
          probe_public chat "$CHAT_URL" 2
          probe_public health "$API_BASE/health" 3
          probe_public version "$API_BASE/version" 3
          probe_public agents "$API_BASE/api/ivx/agents" 3
          probe_machine control_plane "$API_BASE/api/ivx/autonomous/control-plane"

          live_sha=""; version_ok=false
          if jq -e . /tmp/ivx-360/version.body >/dev/null 2>&1; then live_sha=$(jq -r '.commit // empty' /tmp/ivx-360/version.body); version_ok=$(jq -r '.ok // false' /tmp/ivx-360/version.body); fi
          if [ "$GITHUB_EVENT_NAME" = push ] && { [ "$version_ok" != true ] || [ "$live_sha" != "$GITHUB_SHA" ]; }; then
            for i in $(seq 1 8); do
              sleep 2
              code=$(curl -sS --max-time 5 -o /tmp/ivx-360/version.body -w '%{http_code}' "$API_BASE/version" || true)
              if [ "$code" = 200 ] && jq -e . /tmp/ivx-360/version.body >/dev/null 2>&1; then
                live_sha=$(jq -r '.commit // empty' /tmp/ivx-360/version.body); version_ok=$(jq -r '.ok // false' /tmp/ivx-360/version.body)
                [ "$version_ok" = true ] && [ "$live_sha" = "$GITHUB_SHA" ] && break
              fi
            done
          fi
          sha_drift=false
          if [ "$version_ok" != true ] || [ -z "$live_sha" ] || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$live_sha" != "$GITHUB_SHA" ]; }; then sha_drift=true; fi

          agents_ok=false; total_agents=0; unique_agents=0; unavailable_agents=0
          if jq -e . /tmp/ivx-360/agents.body >/dev/null 2>&1; then
            total_agents=$(jq -r '.totalAgents // 0' /tmp/ivx-360/agents.body)
            unique_agents=$(jq '[.agents[]?.agentId] | unique | length' /tmp/ivx-360/agents.body)
            unavailable_agents=$(jq '[.agents[]? | select(.paused==true or .disabled==true)] | length' /tmp/ivx-360/agents.body)
            if [ "$total_agents" = 112 ] && [ "$unique_agents" = 112 ] && [ "$unavailable_agents" = 0 ]; then agents_ok=true; fi
          fi

          failures=$(jq -s '[.[] | select(.ok != true)] | length' /tmp/ivx-360/probes.jsonl)
          rate_limited=$(jq -s '[.[] | select(.status == "429")] | length' /tmp/ivx-360/probes.jsonl)
          server_errors=$(jq -s '[.[] | select(.status | test("^5"))] | length' /tmp/ivx-360/probes.jsonl)
          timeouts=$(jq -s '[.[] | select(.status == "000")] | length' /tmp/ivx-360/probes.jsonl)
          slow=$(jq -s '[.[] | select(.latencyMs >= 2500)] | length' /tmp/ivx-360/probes.jsonl)
          watch=$(jq -s '[.[] | select(.latencyMs >= 1200 and .latencyMs < 2500)] | length' /tmp/ivx-360/probes.jsonl)
          deployment_ready=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then deployment_ready='${{ steps.deploy_grace.outputs.deployment_ready }}'; [ -n "$deployment_ready" ] || deployment_ready=false; fi

          level=GREEN; action=observe; reason=healthy
          if [ "$deployment_ready" != true ] || [ "$server_errors" -gt 0 ] || [ "$timeouts" -gt 0 ] || [ "$failures" -ge 2 ] || [ "$sha_drift" = true ] || [ "$agents_ok" != true ]; then level=CRITICAL; action=self_heal; reason=terminal_risk
          elif [ "$rate_limited" -gt 0 ] || [ "$slow" -gt 0 ] || [ "$failures" -gt 0 ]; then level=WARNING; action=self_heal; reason=degradation
          elif [ "$watch" -gt 0 ]; then level=WATCH; action=preflight; reason=early_latency_signal; fi

          jq -s --arg level "$level" --arg action "$action" --arg reason "$reason" --arg repositorySha "$GITHUB_SHA" --arg liveSha "$live_sha" --argjson fallbackAuthCandidates '${{ steps.auth.outputs.count }}' --argjson deploymentReady "$deployment_ready" --argjson failures "$failures" --argjson rateLimited "$rate_limited" --argjson serverErrors "$server_errors" --argjson timeouts "$timeouts" --argjson slow "$slow" --argjson watch "$watch" --argjson shaDrift "$sha_drift" --argjson agentsOk "$agents_ok" --argjson totalAgents "$total_agents" --argjson uniqueAgents "$unique_agents" --argjson unavailableAgents "$unavailable_agents" \
            '{level:$level,action:$action,reason:$reason,repositorySha:$repositorySha,liveSha:$liveSha,githubOidc:true,fallbackAuthCandidates:$fallbackAuthCandidates,deploymentReady:$deploymentReady,shaDrift:$shaDrift,agentsOk:$agentsOk,totalAgents:$totalAgents,uniqueAgents:$uniqueAgents,unavailableAgents:$unavailableAgents,failures:$failures,rateLimited:$rateLimited,serverErrors:$serverErrors,timeouts:$timeouts,slow:$slow,watch:$watch,probes:.}' /tmp/ivx-360/probes.jsonl > /tmp/ivx-360/assessment.json
          cat /tmp/ivx-360/assessment.json
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Record 112-agent contract surface
        shell: bash
        run: |
          set -euo pipefail
          jq '{ok,totalAgents,uniqueAgents:([.agents[]?.agentId]|unique|length),unavailableAgents:([.agents[]?|select(.paused==true or .disabled==true)]|length)}' /tmp/ivx-360/agents.body > /tmp/ivx-360/agents-contract-evidence.json
          cat /tmp/ivx-360/agents-contract-evidence.json

      - name: Route WATCH to autonomous preflight with OIDC
        if: ${{ steps.probe.outputs.action == 'preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          assessment=$(cat /tmp/ivx-360/assessment.json)
          goal="IVX 360 EARLY WARNING WATCH. Diagnose the pre-failure signal without production mutation. Evidence required. Assessment: ${assessment}"
          payload=$(jq -n --arg goal "$goal" '{goal:$goal,executionMode:"qa_only",templateMode:"BUG_FIX",approvePatch:false,approveGitDeploy:false,validationMode:"typecheck",riskLevel:"low",proposedPlan:"360-degree predictive preflight only.",rollbackOption:"No production mutation permitted.",filesAffected:["ivx-360-observability"]}')
          http=$(curl -sS --max-time 30 -o /tmp/ivx-360/worker.json -w '%{http_code}' -X POST "$API_BASE/api/ivx/senior-developer/worker/jobs" -H 'Content-Type: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC_TOKEN}" --data "$payload" || true)
          accepted=false; case "$http" in 200|202|409) accepted=true;; esac
          jq -n --argjson accepted "$accepted" --arg authSource GITHUB_OIDC --arg http "$http" '{preflightDispatchAccepted:$accepted,authSource:$authSource,http:$http}' > /tmp/ivx-360/preflight-dispatch.json
          [ "$accepted" = true ]

      - name: Route WARNING or CRITICAL to autonomous recovery with OIDC
        if: ${{ steps.probe.outputs.action == 'self_heal' }}
        shell: bash
        run: |
          set -euo pipefail
          assessment=$(cat /tmp/ivx-360/assessment.json)
          goal="IVX 360 EARLY WARNING SELF-HEAL. Diagnose and repair evidence-backed app failures before user impact. Owner authorization for this auth-recovery incident was explicitly granted. Preserve security, tests, exact-SHA proof, and Owner Gates outside this incident. Assessment: ${assessment}"
          payload=$(jq -n --arg goal "$goal" '{goal:$goal,executionMode:"code_change",templateMode:"BUG_FIX",approvePatch:true,approveGitDeploy:false,validationMode:"typecheck",riskLevel:"low",proposedPlan:"Evidence-backed autonomous recovery via signed GitHub OIDC machine identity.",rollbackOption:"Revert autonomous repair PR on regression.",filesAffected:["ivx-360-diagnosis"]}')
          http=$(curl -sS --max-time 30 -o /tmp/ivx-360/worker.json -w '%{http_code}' -X POST "$API_BASE/api/ivx/senior-developer/worker/jobs" -H 'Content-Type: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC_TOKEN}" --data "$payload" || true)
          accepted=false; case "$http" in 200|202|409) accepted=true;; esac
          jq -n --argjson accepted "$accepted" --arg authSource GITHUB_OIDC --arg http "$http" '{selfHealDispatchAccepted:$accepted,authSource:$authSource,http:$http}' > /tmp/ivx-360/self-heal-dispatch.json
          [ "$accepted" = true ]

      - name: Enforce 360 certification gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.deploymentReady' /tmp/ivx-360/assessment.json)" = true
          test "$(jq -r '.shaDrift' /tmp/ivx-360/assessment.json)" = false
          test "$(jq -r '.agentsOk' /tmp/ivx-360/assessment.json)" = true
          test "$(jq -r '[.probes[] | select(.name=="control_plane")][0].status' /tmp/ivx-360/assessment.json)" = 200
          test "$(jq -r '[.probes[] | select(.name=="control_plane")][0].authSource' /tmp/ivx-360/assessment.json)" = GITHUB_OIDC
          jq -n --arg sha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" '{certified:true,marker:"IVX-360-CERTIFIED",exactSha:$sha,runId:$runId,controlPlaneAuth:"GITHUB_OIDC",agents:112}' > /tmp/ivx-360/certificate.json

      - name: Persist immutable 360 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivx-360-evidence-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/ivx-360
          if-no-files-found: error
          retention-days: 30
