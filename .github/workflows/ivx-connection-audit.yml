name: IVX connection audit

on:
  pull_request:
    paths:
      - 'scripts/ops/audit-connection-leakage*.mjs'
      - '.github/workflows/ivx-connection-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ops/audit-connection-leakage*.mjs'
      - '.github/workflows/ivx-connection-audit.yml'

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ops/audit-connection-leakage.test.mjs
