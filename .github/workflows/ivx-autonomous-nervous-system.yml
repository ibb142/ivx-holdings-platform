name: IVX Autonomous Nervous System

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  issues: write
  id-token: write

concurrency:
  group: ivx-autonomous-nervous-system
  cancel-in-progress: true

env:
  API_BASE: https://api.ivxholding.com
  GH_TOKEN: ${{ github.token }}
  OIDC_AUDIENCE: ivx-360-autonomous-recovery

jobs:
  nervous-system:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Acquire scoped GitHub OIDC machine identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
          curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$token_url" > /tmp/ivx-nervous-oidc.json
          token=$(jq -r '.value // empty' /tmp/ivx-nervous-oidc.json)
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Layer 1 GPS - surface reachability radar
        id: gps
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/gps.jsonl
          probe_surface() {
            name="$1"; url="$2"; expected="$3"
            code=$(curl -L -sS --max-time 25 -o "/tmp/${name}.body" -w '%{http_code}' "$url" || true)
            ok=false
            case "$expected" in
              2xx) [[ "$code" =~ ^2 ]] && ok=true ;;
              2xx3xx) [[ "$code" =~ ^[23] ]] && ok=true ;;
            esac
            jq -nc --arg layer GPS --arg surface "$name" --arg url "$url" --arg http "$code" --argjson ok "$ok" \
              '{layer:$layer,surface:$surface,url:$url,http:$http,ok:$ok}' >> /tmp/gps.jsonl
          }
          probe_surface api_health "${API_BASE}/health" 2xx
          probe_surface api_version "${API_BASE}/version" 2xx
          probe_surface landing "https://ivxholding.com" 2xx3xx
          probe_surface landing_www "https://www.ivxholding.com" 2xx3xx
          probe_surface owner_chat "https://chat.ivxholding.com" 2xx3xx
          jq -s '.' /tmp/gps.jsonl > /tmp/gps.json
          echo "red=$(jq '[.[] | select(.ok != true)] | length' /tmp/gps.json)" >> "$GITHUB_OUTPUT"

      - name: Layer 2 NERVOUS - JSON contract and 112 telemetry
        id: nervous
        env:
          IVX_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/nervous.jsonl
          probe_json() {
            name="$1"; url="$2"; auth_mode="$3"
            headers="/tmp/${name}.headers"; body="/tmp/${name}.body"
            args=(-sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' -H 'Accept: application/json')
            if [ "$auth_mode" = machine ]; then args+=(-H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC}"); fi
            code=$(curl "${args[@]}" "$url" || true)
            content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$headers" 2>/dev/null || true)
            preview=$(tr '\n' ' ' < "$body" 2>/dev/null | head -c 180 || true)
            valid_json=false; jq -e . "$body" >/dev/null 2>&1 && valid_json=true
            looks_html=false; grep -Eiq '<!doctype[[:space:]]+html|<html([[:space:]>])' "$body" 2>/dev/null && looks_html=true
            ok=false
            if [[ "$code" =~ ^2 ]] && printf '%s' "$content_type" | grep -Eiq 'application/json|\+json' && [ "$valid_json" = true ] && [ "$looks_html" = false ]; then ok=true; fi
            incident=NONE
            if [ "$code" = 401 ] || [ "$code" = 403 ]; then incident=MACHINE_IDENTITY_REJECTED
            elif [ "$looks_html" = true ]; then incident=NON_JSON_RUNTIME_RESPONSE
            elif [[ ! "$code" =~ ^2 ]]; then incident=HTTP_ERROR
            elif ! printf '%s' "$content_type" | grep -Eiq 'application/json|\+json'; then incident=NON_JSON_CONTENT_TYPE
            elif [ "$valid_json" != true ]; then incident=INVALID_JSON
            fi
            jq -nc --arg layer NERVOUS --arg surface "$name" --arg url "$url" --arg http "$code" --arg incident "$incident" --arg preview "$preview" --argjson ok "$ok" \
              '{layer:$layer,surface:$surface,url:$url,http:$http,incident:$incident,preview:$preview,ok:$ok}' >> /tmp/nervous.jsonl
          }
          probe_json health "${API_BASE}/health" none
          probe_json version "${API_BASE}/version" none
          probe_json agents "${API_BASE}/api/ivx/agents" none
          probe_json owner_audit_control_plane "${API_BASE}/api/ivx/autonomous/control-plane" machine
          probe_json owner_audit_worker_jobs "${API_BASE}/api/ivx/senior-developer/worker/jobs" machine
          jq -s '.' /tmp/nervous.jsonl > /tmp/nervous.json
          echo "red=$(jq '[.[] | select(.ok != true)] | length' /tmp/nervous.json)" >> "$GITHUB_OUTPUT"
          echo "identity_red=$(jq '[.[] | select(.incident == "MACHINE_IDENTITY_REJECTED")] | length' /tmp/nervous.json)" >> "$GITHUB_OUTPUT"

      - name: Internal Actions and repository radar
        id: internal
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.lock' > /tmp/conflicts.txt; then conflicts=$(wc -l < /tmp/conflicts.txt | tr -d ' '); else : > /tmp/conflicts.txt; conflicts=0; fi
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" > /tmp/actions-pages.json
          jq '[.workflow_runs[]? | select(.status=="completed")][0:40] | [.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | {id,name,conclusion,head_sha,html_url,created_at}]' /tmp/actions-pages.json > /tmp/recent-red.json || echo '[]' > /tmp/recent-red.json
          echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"

      - name: Layer 3 AUTONOMOUS - classify incidents
        id: diagnosis
        shell: bash
        run: |
          set -euo pipefail
          gps_red='${{ steps.gps.outputs.red }}'; nervous_red='${{ steps.nervous.outputs.red }}'; conflicts='${{ steps.internal.outputs.conflicts }}'; identity_red='${{ steps.nervous.outputs.identity_red }}'
          total=$((gps_red + nervous_red + conflicts))
          jq -n --arg sourceSha "$GITHUB_SHA" --slurpfile gps /tmp/gps.json --slurpfile nervous /tmp/nervous.json --slurpfile actions /tmp/recent-red.json --rawfile conflicts /tmp/conflicts.txt \
            '{sourceSha:$sourceSha,layers:{gps:$gps[0],nervous:$nervous[0]},recentActionFailures:$actions[0],conflictMarkers:$conflicts,policy:{failClosed:true,ownerGateHighRiskOnly:true,maxRepairAttempts:3,githubNativeFallback:true}}' > /tmp/nervous-system-diagnosis.json
          owner_gate=false
          # A transient rejection of this workflow's own short-lived machine identity is recoverable.
          # Owner Gate is reserved for explicit policy/secret/IAM/payment/destructive/infra/security changes.
          if jq -e '[.layers.nervous[] | select(.ok != true) | (.preview // "")] | join(" ") | test("secret rotation|iam policy|payment|stripe|destructive migration|cloudfront mutation|route53 mutation|security policy change|critical rollback";"i")' /tmp/nervous-system-diagnosis.json >/dev/null; then owner_gate=true; fi
          echo "total_incidents=$total" >> "$GITHUB_OUTPUT"
          echo "identity_incidents=$identity_red" >> "$GITHUB_OUTPUT"
          echo "owner_gate_required=$owner_gate" >> "$GITHUB_OUTPUT"

      - name: Owner Gate only for high-risk mutation
        if: ${{ steps.diagnosis.outputs.total_incidents != '0' && steps.diagnosis.outputs.owner_gate_required == 'true' }}
        run: |
          echo 'AUTONOMOUS_NERVOUS_SYSTEM=OWNER_GATE_REQUIRED_HIGH_RISK'
          exit 1

      - name: Delegate safe self-heal through backend worker
        id: remedy
        if: ${{ steps.diagnosis.outputs.total_incidents != '0' && steps.diagnosis.outputs.owner_gate_required != 'true' && steps.diagnosis.outputs.identity_incidents == '0' }}
        env:
          IVX_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          diagnosis=$(jq -c '.' /tmp/nervous-system-diagnosis.json)
          goal="IVX SAFE SELF-HEAL. Diagnose the evidence, patch only low-risk defects, run typecheck/tests, preserve all quality gates, create/merge only evidence-backed low-risk repair, verify exact SHA. High-risk auth policy/secrets/IAM/payments/destructive migrations/infrastructure/security/critical rollback require Owner Gate. Diagnosis: ${diagnosis}"
          payload=$(jq -n --arg goal "$goal" '{goal:$goal,executionMode:"code_change",templateMode:"BUG_FIX",approvePatch:true,approveGitDeploy:true,validationMode:"typecheck",riskLevel:"low",proposedPlan:"Fail-closed low-risk autonomous repair with exact-SHA verification.",rollbackOption:"Revert autonomous repair commit/PR."}')
          http=$(curl -sS --max-time 60 -o /tmp/remedy-start.json -w '%{http_code}' -X POST "${API_BASE}/api/ivx/senior-developer/worker/jobs" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC}" --data "$payload" || true)
          case "$http" in 200|202|409) ;; *) echo "backend_worker_unavailable_http=$http"; echo 'backend_unavailable=true' >> "$GITHUB_OUTPUT"; exit 0;; esac
          task_id=$(jq -r '.task.taskId // .taskId // .jobId // .activeJobId // .job.jobId // empty' /tmp/remedy-start.json)
          if [ -n "$task_id" ]; then echo "task_id=$task_id" >> "$GITHUB_OUTPUT"; else echo 'backend_unavailable=true' >> "$GITHUB_OUTPUT"; fi

      - name: GitHub-native circuit breaker fallback
        if: ${{ steps.diagnosis.outputs.total_incidents != '0' && steps.diagnosis.outputs.owner_gate_required != 'true' && (steps.diagnosis.outputs.identity_incidents != '0' || steps.remedy.outputs.backend_unavailable == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'AUTONOMOUS_FALLBACK=GITHUB_NATIVE'
          # Do not recursively call the broken backend. Preserve evidence and retry only the failed source run once.
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            source_id='${{ github.event.workflow_run.id }}'
            source_conclusion='${{ github.event.workflow_run.conclusion }}'
            if [ "$source_conclusion" = failure ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${source_id}/rerun-failed-jobs" || true
              echo "source_failed_jobs_rerun=$source_id"
            fi
          fi
          jq -n --arg sha "$GITHUB_SHA" --arg reason "machine_identity_or_backend_worker_unavailable" '{fallback:"github_native",sourceSha:$sha,reason:$reason,backendMutationAttempted:false,ownerGateBypassed:false}' > /tmp/github-native-fallback.json

      - name: Wait for backend remedy terminal result
        id: wait
        if: ${{ steps.remedy.outputs.task_id != '' }}
        env:
          TASK_ID: ${{ steps.remedy.outputs.task_id }}
          IVX_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          terminal=false
          for i in $(seq 1 30); do
            code=$(curl -sS --max-time 30 -o /tmp/remedy-status.json -w '%{http_code}' "${API_BASE}/api/ivx/senior-developer/worker/jobs/${TASK_ID}" -H 'Accept: application/json' -H "X-IVX-GitHub-OIDC: ${IVX_GITHUB_OIDC}" || true)
            if [ "$code" = 200 ] && jq -e . /tmp/remedy-status.json >/dev/null 2>&1; then
              status=$(jq -r '.task.status // .status // "unknown"' /tmp/remedy-status.json)
              terminal_flag=$(jq -r '.task.terminal // .terminal // false' /tmp/remedy-status.json)
              if [ "$status" = WAITING_APPROVAL ]; then exit 1; fi
              if [ "$terminal_flag" = true ]; then terminal=true; break; fi
            fi
            sleep 10
          done
          test "$terminal" = true
          status=$(jq -r '.task.status // .status // "unknown"' /tmp/remedy-status.json)
          echo "terminal_status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in COMPLETED|SUCCESS|SUCCEEDED) ;; *) cat /tmp/remedy-status.json; exit 1;; esac

      - name: Re-run War Room after safe completed remedy
        if: ${{ steps.wait.outputs.terminal_status == 'COMPLETED' || steps.wait.outputs.terminal_status == 'SUCCESS' || steps.wait.outputs.terminal_status == 'SUCCEEDED' }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/landing-112-agent-autonomous-qa.yml/dispatches" -f ref=main

      - name: Persist nervous-system evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IVX-3-LAYER-NERVOUS-${{ github.run_id }}
          path: |
            /tmp/gps.json
            /tmp/nervous.json
            /tmp/recent-red.json
            /tmp/nervous-system-diagnosis.json
            /tmp/remedy-start.json
            /tmp/remedy-status.json
            /tmp/github-native-fallback.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Healthy three-layer summary
        if: ${{ steps.diagnosis.outputs.total_incidents == '0' }}
        run: echo 'IVX_3_LAYER_NERVOUS=GREEN_GPS_JSON_CONTRACT_AUTONOMOUS'
