name: Phase 1 bounded dependency recovery
on:
  push:
    branches: [fix/phase1-supabase-diagnostics-20260911]
    paths:
      - '.github/workflows/phase1-dependency-recovery.yml'
      - 'scripts/ops/phase1-recover-dependencies*.mjs'
permissions:
  contents: read
concurrency:
  group: ivx-supabase-management-restart
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'ibb142/ivx-holdings-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovery preconditions and single-attempt behavior
        run: node --test scripts/ops/phase1-recover-dependencies.test.mjs
      - name: Recover confirmed dependency outage
        env:
          PROJECT_REF: kvclcdjmjghndxsngfzb
          PHASE1_RECOVERY: kvclcdjmjghndxsngfzb
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ops/phase1-recover-dependencies.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-dependency-recovery
          path: phase1-dependency-recovery.json
          if-no-files-found: error
