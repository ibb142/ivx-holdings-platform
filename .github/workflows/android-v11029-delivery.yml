name: Android v1.10.29 Delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-v11029-delivery.yml'
      - 'expo/app.config.ts'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  build-certify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      IVX_RELEASE_KEYSTORE_BASE64: ${{ secrets.IVX_RELEASE_KEYSTORE_BASE64 }}
      IVX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.IVX_RELEASE_KEYSTORE_PASSWORD }}
      IVX_RELEASE_KEY_ALIAS: ${{ secrets.IVX_RELEASE_KEY_ALIAS }}
      IVX_RELEASE_KEY_PASSWORD: ${{ secrets.IVX_RELEASE_KEY_PASSWORD }}
      EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          set -euo pipefail
          bun install
          cd expo
          bun install
          bun scripts/apply-patches.mjs

      - name: Validate production signing
        run: |
          set -euo pipefail
          for variable in IVX_RELEASE_KEYSTORE_BASE64 IVX_RELEASE_KEYSTORE_PASSWORD IVX_RELEASE_KEY_ALIAS IVX_RELEASE_KEY_PASSWORD; do
            test -n "${!variable}"
          done
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/ivx-release.keystore"
          printf '%s' "$IVX_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$IVX_RELEASE_KEYSTORE_PASSWORD" -alias "$IVX_RELEASE_KEY_ALIAS" >/dev/null
          echo "IVX_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Pin native APK version to 1.10.29 / 127
        working-directory: expo
        run: |
          set -euo pipefail
          sed -i 's/versionCode 126/versionCode 127/' android/app/build.gradle
          sed -i 's/versionName "1.10.28"/versionName "1.10.29"/' android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle | head

      - name: Build signed APK
        working-directory: expo/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

      - name: Verify APK and record SHA-256
        id: apk
        working-directory: expo/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apksigner.txt"
          HASH=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          cp "$APK" "$GITHUB_WORKSPACE/IVX-Holdings-v1.10.29.apk"
          echo "$HASH  IVX-Holdings-v1.10.29.apk" > "$GITHUB_WORKSPACE/IVX-Holdings-v1.10.29.sha256"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cold-launch certify signed APK
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/expo/scripts/certify-android-launch.sh" "$GITHUB_WORKSPACE/IVX-Holdings-v1.10.29.apk" com.ivxholdings.app android-v11029-launch.png android-v11029-logcat.txt android-v11029-launch.txt android-v11029-package-version.txt

      - name: Upload APK delivery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IVX-Holdings-v1.10.29-${{ github.sha }}
          path: |
            IVX-Holdings-v1.10.29.apk
            IVX-Holdings-v1.10.29.sha256
            apksigner.txt
            android-v11029-launch.png
            android-v11029-logcat.txt
            android-v11029-launch.txt
            android-v11029-package-version.txt
          retention-days: 30

      - name: Publish delivery locator issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS='${{ job.status }}'
          TITLE="APK DELIVERY v1.10.29 - ${GITHUB_SHA:0:12} - ${STATUS}"
          BODY=$(cat <<EOF
          Run ID: ${GITHUB_RUN_ID}
          Source SHA: ${GITHUB_SHA}
          Version: 1.10.29
          Version code: 127
          Job status: ${STATUS}
          APK SHA-256: ${{ steps.apk.outputs.hash }}
          APK size: ${{ steps.apk.outputs.size }}
          Artifact: IVX-Holdings-v1.10.29-${GITHUB_SHA}
          EOF
          )
          gh issue create --title "$TITLE" --body "$BODY" || true
