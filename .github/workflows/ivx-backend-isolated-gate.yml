name: IVX Backend Isolated Gate

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'backend-test-preload.ts'
      - 'bunfig.toml'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/ivx-backend-isolated-tests*'
      - '.github/workflows/ivx-backend-isolated-gate.yml'
      - '.github/workflows/autonomous-internal-external-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/ivx-backend-isolated-tests*'
      - '.github/workflows/ivx-backend-isolated-gate.yml'
      - '.github/workflows/autonomous-internal-external-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ivx-backend-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Every backend test file in its own process
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.4' }
      - run: bun install --frozen-lockfile
      - run: bun install --cwd expo --frozen-lockfile
      - run: node --test scripts/ivx-backend-isolated-tests.test.mjs
      - run: node scripts/ivx-backend-isolated-tests.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-isolated-${{ github.sha }}-${{ github.run_attempt }}
          path: qa/evidence/backend-isolated/
          if-no-files-found: error
          retention-days: 14
