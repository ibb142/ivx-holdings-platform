name: Owner chat production receipt and streaming proof
on:
  push:
    branches: [main]
    paths:
      - 'backend/api/ivx-owner-ai*'
      - 'backend/services/ivx-owner-chat-admission.ts'
      - 'backend/services/ivx-owner-runtime-evidence.ts'
      - 'scripts/ivx-owner-chat-live-proof.mjs'
      - '.github/workflows/ivx-owner-chat-live-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-chat-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  production-owner-chat:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Wait for the tested production commit
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD)
          deployed=''
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 https://api.ivxholding.com/health -o "$RUNNER_TEMP/owner-chat-health.json"; then
              deployed=$(jq -r '.commit // empty' "$RUNNER_TEMP/owner-chat-health.json")
              if [ "$deployed" = "$expected" ]; then break; fi
            fi
            sleep 10
          done
          test "$deployed" = "$expected"
      - name: Verify real owner, concurrent requests, replica replay and streaming
        run: node scripts/ivx-owner-chat-live-proof.mjs
        env:
          OWNER_NEW_PASSWORD: ${{ secrets.OWNER_NEW_PASSWORD }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          IVX_OWNER_PASSWORD: ${{ secrets.IVX_OWNER_PASSWORD }}
          IVX_OWNER_NEW_PASSWORD: ${{ secrets.IVX_OWNER_NEW_PASSWORD }}
          OWNER_LOGIN_PASSWORD: ${{ secrets.OWNER_LOGIN_PASSWORD }}
          IVX_OWNER_LOGIN_PASSWORD: ${{ secrets.IVX_OWNER_LOGIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-chat-live-${{ github.sha }}-${{ github.run_attempt }}
          path: qa/evidence/owner-chat-live/proof.json
          if-no-files-found: error
          retention-days: 30
