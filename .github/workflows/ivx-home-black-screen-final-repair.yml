name: IVX Home Black Screen Final Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-home-black-screen-final-repair.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

env:
  NODE_ENV: production
  EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
  EXPO_PUBLIC_IVX_OPEN_ACCESS_MODE: 'false'
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  OWNER_EMAIL: iperez4242@gmail.com
  OWNER_PASSWORD_S1: ${{ secrets.OWNER_NEW_PASSWORD }}
  OWNER_PASSWORD_S2: ${{ secrets.IVX_OWNER_PASSWORD }}
  OWNER_PASSWORD_S3: ${{ secrets.OWNER_PASSWORD }}
  OWNER_PASSWORD_S4: ${{ secrets.IVX_OWNER_NEW_PASSWORD }}
  OWNER_PASSWORD_S5: ${{ secrets.OWNER_LOGIN_PASSWORD }}
  OWNER_PASSWORD_S6: ${{ secrets.IVX_OWNER_LOGIN_PASSWORD }}
  IVX_RELEASE_KEYSTORE_BASE64: ${{ secrets.IVX_RELEASE_KEYSTORE_BASE64 }}
  IVX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.IVX_RELEASE_KEYSTORE_PASSWORD }}
  IVX_RELEASE_KEY_ALIAS: ${{ secrets.IVX_RELEASE_KEY_ALIAS }}
  IVX_RELEASE_KEY_PASSWORD: ${{ secrets.IVX_RELEASE_KEY_PASSWORD }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET_NAME: ivxholding.com
  CLOUDFRONT_DISTRIBUTION_ID: E1C0DEI0VKCUYN

jobs:
  repair-certify-deploy:
    name: Real owner login -> Home -> signed APK -> production deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - name: Resolve owner credential binding without values
        shell: bash
        run: |
          set -euo pipefail
          owner_password=''
          binding='none'
          for pair in \
            'OWNER_NEW_PASSWORD:OWNER_PASSWORD_S1' \
            'IVX_OWNER_PASSWORD:OWNER_PASSWORD_S2' \
            'OWNER_PASSWORD:OWNER_PASSWORD_S3' \
            'IVX_OWNER_NEW_PASSWORD:OWNER_PASSWORD_S4' \
            'OWNER_LOGIN_PASSWORD:OWNER_PASSWORD_S5' \
            'IVX_OWNER_LOGIN_PASSWORD:OWNER_PASSWORD_S6'; do
            name=${pair%%:*}
            var=${pair##*:}
            value=${!var:-}
            if [ -n "$value" ]; then
              owner_password="$value"
              binding="$name"
              break
            fi
          done
          test -n "$owner_password"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          echo "::add-mask::$owner_password"
          {
            echo 'OWNER_PASSWORD_EFFECTIVE<<IVX_EOF'
            echo "$owner_password"
            echo 'IVX_EOF'
            echo "OWNER_PASSWORD_BINDING=$binding"
          } >> "$GITHUB_ENV"
          echo "owner_password_binding=$binding"

      - name: Repair version, APK references, and future production build triggers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('expo/android/app/build.gradle'): [
                  ('versionCode 118', 'versionCode 119'),
                  ('versionName "1.10.21"', 'versionName "1.10.22"'),
              ],
              Path('expo/ivxholding-landing/index.html'): [
                  ('ivx-holdings-v1.10.13.apk', 'ivx-holdings-v1.10.22.apk'),
                  ('ivx-holdings-v1.10.14.apk', 'ivx-holdings-v1.10.22.apk'),
              ],
              Path('expo/deploy-s3-direct.mjs'): [
                  ('/tmp/ivx-holdings-1.10.13.apk', '/tmp/ivx-holdings-1.10.22.apk'),
                  ('/tmp/ivx-holdings-1.10.14.apk', '/tmp/ivx-holdings-1.10.22.apk'),
                  ('ivx-holdings-v1.10.13.apk', 'ivx-holdings-v1.10.22.apk'),
                  ('ivx-holdings-v1.10.14.apk', 'ivx-holdings-v1.10.22.apk'),
              ],
              Path('expo/scripts/ivx-ci-checks.mjs'): [
                  ('ivx-holdings-v1.10.13.apk', 'ivx-holdings-v1.10.22.apk'),
                  ('ivx-holdings-v1.10.14.apk', 'ivx-holdings-v1.10.22.apk'),
                  ('versionCode 118', 'versionCode 119'),
                  ('versionName "1.10.21"', 'versionName "1.10.22"'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)

          prod = Path('.github/workflows/android-production-signing.yml')
          text = prod.read_text()
          anchor = "      - 'expo/app/login.tsx'\n"
          additions = (
              "      - 'expo/app/(tabs)/_layout.tsx'\n"
              "      - 'expo/app/(tabs)/(home)/**'\n"
              "      - 'expo/app/wire-transfer.tsx'\n"
              "      - 'expo/.maestro/ivx-owner-home-certificate.yaml'\n"
          )
          if "expo/app/(tabs)/(home)/**" not in text:
              text = text.replace(anchor, anchor + additions)
          prod.write_text(text)
          PY

          grep -Fq 'versionCode 119' expo/android/app/build.gradle
          grep -Fq 'versionName "1.10.22"' expo/android/app/build.gradle
          grep -Fq 'versionCode: 119' expo/app.config.ts
          grep -Fq 'version: "1.10.22"' expo/app.config.ts
          ! grep -Fq 'ivx-holdings-v1.10.14.apk' expo/ivxholding-landing/index.html
          ! grep -Fq 'ivx-holdings-v1.10.14.apk' expo/deploy-s3-direct.mjs
          grep -Fq "expo/app/(tabs)/(home)/**" .github/workflows/android-production-signing.yml
          echo 'source_release_alignment=PASS'

      - name: Persist repaired source on main
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IVX Home E2E Repair'
          git config user.email 'ivx-home-e2e@users.noreply.github.com'
          git add expo/android/app/build.gradle expo/ivxholding-landing/index.html expo/deploy-s3-direct.mjs expo/scripts/ivx-ci-checks.mjs .github/workflows/android-production-signing.yml
          if git diff --cached --quiet; then
            echo 'No source repair changes required.'
          else
            git commit -m 'fix(release): align Home v1.10.22 production APK and deploy'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install
          cd expo
          bun install
          bun scripts/apply-patches.mjs

      - name: Validate protected release signing inputs
        shell: bash
        run: |
          set -euo pipefail
          for variable in IVX_RELEASE_KEYSTORE_BASE64 IVX_RELEASE_KEYSTORE_PASSWORD IVX_RELEASE_KEY_ALIAS IVX_RELEASE_KEY_PASSWORD; do
            test -n "${!variable}" || { echo "::error::$variable is unavailable"; exit 1; }
          done
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/ivx-release.keystore"
          printf '%s' "$IVX_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$IVX_RELEASE_KEYSTORE_PASSWORD" -alias "$IVX_RELEASE_KEY_ALIAS" >/dev/null
          echo "IVX_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build exact-source signed production APK
        working-directory: expo/android
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING=$("$AAPT" dump badging "$APK" | head -1)
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -Fq "versionCode='119'"
          printf '%s\n' "$BADGING" | grep -Fq "versionName='1.10.22'"
          echo "APK_PATH=$(realpath "$APK")" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Real owner sign-in reaches Home on signed production APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: false
          disable-linux-hw-accel: false
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r "$APK_PATH"
            sed 's/appId: com.ivxholdings.app.owner/appId: com.ivxholdings.app/' expo/.maestro/ivx-owner-home-certificate.yaml > /tmp/ivx-owner-home-production.yaml
            curl -Ls https://get.maestro.mobile.dev | bash
            export PATH="$HOME/.maestro/bin:$PATH"
            maestro test /tmp/ivx-owner-home-production.yaml --env OWNER_EMAIL="$OWNER_EMAIL" --env OWNER_PASSWORD="$OWNER_PASSWORD_EFFECTIVE" --format junit --output production-owner-home.xml
            adb exec-out screencap -p > production-owner-home.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml production-owner-home-ui.xml >/dev/null
            grep -q 'Home ready' production-owner-home-ui.xml
            ! grep -q 'Login service temporarily unavailable' production-owner-home-ui.xml

      - name: Publish tested APK and landing to production S3
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          cp "$APK_PATH" /tmp/ivx-holdings-1.10.22.apk
          cd expo
          bun run deploy-s3-direct.mjs 2>&1 | tee /tmp/ivx-home-prod-deploy.log
          grep -q 'CloudFront invalidated:' /tmp/ivx-home-prod-deploy.log

      - name: Verify live landing exposes v1.10.22 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "https://ivxholding.com/?homefix=${SOURCE_SHA}" -o /tmp/live-homefix.html
          grep -Fq 'ivx-holdings-v1.10.22.apk' /tmp/live-homefix.html
          apk_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 'https://ivxholding.com/apk/ivx-holdings-v1.10.22.apk')
          test "$apk_code" = 200
          echo "live_apk=PASS http=$apk_code"

      - name: Write exact-source Home deployment certificate
        if: success()
        shell: bash
        run: |
          mkdir -p qa/evidence/focused-e2e
          jq -n \
            --arg sha "$SOURCE_SHA" \
            --arg apkSha256 "$APK_SHA256" \
            --arg binding "$OWNER_PASSWORD_BINDING" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{certificate:"IVX-HOME-BLACK-SCREEN-FINAL",passed:true,sourceSha:$sha,version:"1.10.22",versionCode:119,signedProductionApk:true,realOwnerPasswordEntry:true,openAccessBypass:false,homeReadyVisible:true,homeTabRetap:true,blackScreenObserved:false,loginFailureDialogObserved:false,landingApkPublished:true,apkSha256:$apkSha256,credentialBinding:$binding,secretValuesReturned:false,verifiedAt:$verifiedAt}' \
            > qa/evidence/focused-e2e/home-black-screen-final.json
          cat qa/evidence/focused-e2e/home-black-screen-final.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivx-home-black-screen-final-${{ steps.persist.outputs.source_sha }}
          path: |
            qa/evidence/focused-e2e/home-black-screen-final.json
            production-owner-home.xml
            production-owner-home.png
            production-owner-home-ui.xml
          if-no-files-found: warn
