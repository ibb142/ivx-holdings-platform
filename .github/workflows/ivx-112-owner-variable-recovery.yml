name: IVX 112 Owner Variable Recovery

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/ivx-112-owner-variable-recovery.yml
      - scripts/ops/owner-runtime-binding*
      - scripts/ops/owner-recovery-deploy*
      - backend/services/ivx-owner-binding-diagnostic*
      - backend/api/ivx-render-diagnostic.ts
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ivx-112-owner-variable-recovery-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify-owner-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --test scripts/ops/owner-runtime-binding.test.mjs scripts/ops/owner-recovery-deploy.test.mjs
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun test backend/services/ivx-owner-binding-diagnostic.test.ts
  recover-deploy-verify:
    needs: verify-owner-binding
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE: https://api.ivxholding.com
      IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
      IVX_OWNER_VARIABLES_ENCRYPTION_KEY: ${{ secrets.IVX_OWNER_VARIABLES_ENCRYPTION_KEY }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      IVX_RENDER_API_KEY: ${{ secrets.IVX_RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      OWNER_NEW_PASSWORD: ${{ secrets.OWNER_NEW_PASSWORD }}
      IVX_OWNER_PASSWORD: ${{ secrets.IVX_OWNER_PASSWORD }}
      OWNER_EMAIL: iperez4242@gmail.com
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      DEFAULT_RENDER_SERVICE_ID: srv-d7t9ivreo5us73ftose0
    steps:
      - uses: actions/checkout@v4
      - name: Check whether exact SHA is already live
        id: live
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -m 20 -o /tmp/version.json -w '%{http_code}' "${API_BASE}/version" || true)
          live=''; ok=false
          if [ "$code" = 200 ]; then live=$(jq -r '.commit // .version.commit // empty' /tmp/version.json); ok=$(jq -r '.ok // false' /tmp/version.json); fi
          matched=false
          if [ "$ok" = true ] && [ "$live" = "$GITHUB_SHA" ]; then matched=true; fi
          echo "matched=$matched" >> "$GITHUB_OUTPUT"
          echo "production_sha=${live:-missing} expected=$GITHUB_SHA matched=$matched"
      - name: Recover Render credentials as fallback
        id: recover
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const crypto = await import('node:crypto'); const fs = await import('node:fs');
          const out=process.env.GITHUB_OUTPUT, env=process.env.GITHUB_ENV;
          const emit=(k,v)=>{fs.appendFileSync(env,`${k}=${v}\n`);};
          const done=(key,sid)=>{emit('RENDER_API_KEY_RECOVERED',key);emit('RENDER_SERVICE_ID_RECOVERED',sid);fs.appendFileSync(out,'recovered=true\n');};
          const direct=(process.env.RENDER_API_KEY||process.env.IVX_RENDER_API_KEY||'').trim();
          const sid=(process.env.RENDER_SERVICE_ID||process.env.DEFAULT_RENDER_SERVICE_ID||'').trim();
          if(direct){done(direct,sid);console.log('render_credential_source=github_actions_secret');process.exit(0)}
          const base=(process.env.EXPO_PUBLIC_SUPABASE_URL||'').replace(/\/+$/,''); const service=(process.env.SUPABASE_SERVICE_ROLE_KEY||'').trim();
          if(!base||!service) throw new Error('recovery bindings missing');
          const candidates=[process.env.IVX_OWNER_VARIABLES_ENCRYPTION_KEY,process.env.APP_SECRET,process.env.JWT_SECRET].filter(Boolean);
          candidates.push(crypto.createHash('sha256').update(`${base}:${service}`,'utf8').digest('hex'));
          const keys=[...new Set(candidates)].map(s=>crypto.createHash('sha256').update(s,'utf8').digest()); const aad=Buffer.from('ivx_owner_variables:v1');
          const res=await fetch(`${base}/rest/v1/ivx_owner_variables?select=name,encrypted_value,value_iv,value_tag,value_hash&name=in.%28RENDER_API_KEY%2CRENDER_SERVICE_ID%29`,{headers:{apikey:service,Authorization:`Bearer ${service}`}}); if(!res.ok) throw new Error(`owner variable read HTTP ${res.status}`);
          const rows=await res.json(), by=new Map(rows.map(r=>[r.name,r]));
          const dec=name=>{const r=by.get(name);if(!r)throw new Error(`${name} row missing`);for(const k of keys){try{const d=crypto.createDecipheriv('aes-256-gcm',k,Buffer.from(r.value_iv,'base64'));d.setAAD(aad);d.setAuthTag(Buffer.from(r.value_tag,'base64'));const v=Buffer.concat([d.update(Buffer.from(r.encrypted_value,'base64')),d.final()]).toString('utf8').trim();if(crypto.createHash('sha256').update(v).digest('hex')===r.value_hash)return v}catch{}}throw new Error(`${name} decrypt failed`)};
          done(dec('RENDER_API_KEY'),sid||dec('RENDER_SERVICE_ID')); console.log('render_credential_source=owner_variables_store');
          NODE
          rc=$?
          if [ "$rc" != 0 ]; then echo 'recovered=false' >> "$GITHUB_OUTPUT"; echo 'render_credential_recovery=UNAVAILABLE'; fi
          exit 0
      - name: Bind verified Owner credentials into Render runtime
        id: bind
        if: ${{ steps.recover.outputs.recovered == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          export SERVICE_ID="${RENDER_SERVICE_ID_RECOVERED:-$DEFAULT_RENDER_SERVICE_ID}"
          node scripts/ops/owner-runtime-binding.mjs
      - name: Trigger Render deployment when recovery credentials exist
        if: ${{ steps.recover.outputs.recovered == 'true' && steps.bind.outputs.changed == 'true' }}
        env:
          BINDINGS_CHANGED: ${{ steps.bind.outputs.changed }}
        shell: bash
        run: |
          set -euo pipefail
          export SERVICE_ID="${RENDER_SERVICE_ID_RECOVERED:-$DEFAULT_RENDER_SERVICE_ID}"
          node scripts/ops/owner-recovery-deploy.mjs
      - name: Wait for exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            code=$(curl -sS -m 20 -o /tmp/version.json -w '%{http_code}' "${API_BASE}/version" || true)
            if [ "$code" = 200 ]; then live=$(jq -r '.commit // .version.commit // empty' /tmp/version.json); ok=$(jq -r '.ok // false' /tmp/version.json); echo "poll=$i live=${live:-missing} expected=$GITHUB_SHA"; if [ "$ok" = true ] && [ "$live" = "$GITHUB_SHA" ]; then echo 'exact_sha_live=PASS'; exit 0; fi; fi
            sleep 10
          done
          exit 1
      - name: Verify live 112-agent registry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "${API_BASE}/api/ivx/agents" -o /tmp/agents.json
          test "$(jq -r '.ok // false' /tmp/agents.json)" = true
          test "$(jq -r '.totalAgents // 0' /tmp/agents.json)" = 112
          test "$(jq '[.agents[].agentId] | unique | length' /tmp/agents.json)" = 112
          echo 'live_112_registry=PASS'
      - name: Compare persisted service bindings with the live process
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          try {
            const base = (process.env.EXPO_PUBLIC_SUPABASE_URL || '').replace(/\/+$/, '');
            const auth = await fetch(`${base}/auth/v1/token?grant_type=password`, {
              method: 'POST', headers: { apikey: process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: process.env.OWNER_EMAIL, password: process.env.IVX_OWNER_PASSWORD || process.env.OWNER_NEW_PASSWORD }),
              signal: AbortSignal.timeout(20000),
            });
            if (!auth.ok) throw new Error(`Diagnostic owner authentication HTTP ${auth.status}`);
            const session = await auth.json();
            if (!session.access_token || session.user?.email?.toLowerCase() !== process.env.OWNER_EMAIL || !['owner','admin'].includes(session.user?.app_metadata?.role)) throw new Error('Diagnostic owner identity unconfirmed');
            const response = await fetch(`${process.env.API_BASE}/api/ivx/render-diagnostic?limit=1`, {
              headers: { Authorization: `Bearer ${session.access_token}` }, signal: AbortSignal.timeout(45000),
            });
            if (!response.ok) throw new Error(`Runtime diagnostic HTTP ${response.status}`);
            const diagnostic = await response.json();
            const keys = ['OWNER_NEW_PASSWORD','IVX_OWNER_PASSWORD','IVX_OWNER_EMAIL','EXPO_PUBLIC_SUPABASE_URL','SUPABASE_URL','EXPO_PUBLIC_SUPABASE_ANON_KEY','SUPABASE_ANON_KEY'];
            const bindings = Object.fromEntries(keys.map(key => {
              const row = diagnostic.ownerAuthEnvPresence?.[key];
              return [key, { configured: row?.present === true, runtimePresent: row?.runtimePresent === true, configuredLength: row?.length ?? null, runtimeLength: row?.runtimeLength ?? null, matchesRuntime: typeof row?.matchesRuntime === 'boolean' ? row.matchesRuntime : null, matchesTrimmedConfiguration: row?.matchesTrimmedConfiguration ?? null }];
            }));
            console.log(JSON.stringify({ sourceSha: process.env.GITHUB_SHA, runtimeSha: diagnostic.runtime?.commitSha ?? null, serviceId: diagnostic.service?.id ?? null, runtimeServiceId: diagnostic.runtime?.serviceId ?? null, instanceId: diagnostic.runtime?.instanceId ?? null, bindings, secretValuesReturned: false }));
            if (!diagnostic.ok || diagnostic.runtime?.commitSha !== process.env.GITHUB_SHA) throw new Error('Exact runtime diagnostic not verified');
            const expectedService = process.env.RENDER_SERVICE_ID_RECOVERED || process.env.DEFAULT_RENDER_SERVICE_ID;
            if (!expectedService || diagnostic.service?.id !== expectedService || diagnostic.runtime?.serviceId !== expectedService) throw new Error('Runtime diagnostic service identity mismatch');
            if (!['OWNER_NEW_PASSWORD', 'IVX_OWNER_PASSWORD'].every(key => bindings[key].matchesRuntime === true)) throw new Error('Runtime diagnostic owner password drift');
          } catch (error) {
            console.error(error instanceof Error && /^(Diagnostic owner|Runtime diagnostic|Exact runtime)/.test(error.message) ? error.message : 'Runtime binding diagnostic unavailable');
            process.exitCode = 1;
          }
          NODE
