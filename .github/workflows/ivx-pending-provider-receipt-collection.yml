name: IVX Pending Provider Receipt Collection

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main, fix/verified-finance-cron-20260913]
    paths:
      - 'qa/collect-pending-provider-receipts.mjs'
      - 'qa/phase3-budget-reconciliation.mjs'
      - '.github/workflows/ivx-pending-provider-receipt-collection.yml'

permissions:
  contents: read

concurrency:
  group: ivx-pending-provider-receipt-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify bounded receipt collection
        run: node --test qa/phase3-budget-reconciliation.test.mjs qa/collect-pending-provider-receipts.test.mjs
      - name: Collect authentic receipts and request atomic settlement
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IVX_AI_GATEWAY_KEY: ${{ secrets.IVX_AI_GATEWAY_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: node qa/collect-pending-provider-receipts.mjs
