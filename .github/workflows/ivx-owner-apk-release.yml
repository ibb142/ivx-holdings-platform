name: IVX Owner APK Release

on:
  push:
    paths:
      - '.github/workflows/ivx-owner-apk-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_QA_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies and apply Hermes compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          bun install
          cd expo
          bun install
          bun scripts/apply-patches.mjs
      - name: Verify Home black-screen recovery source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "export { default } from './home';" 'expo/app/(tabs)/(home)/index.tsx'
          grep -Fq 'testID="owner-home-ready"' 'expo/app/(tabs)/(home)/home.tsx'
          grep -Fq 'testID="home-runtime-ready"' 'expo/app/(tabs)/(home)/home.tsx'
          grep -Fq "version: \"1.10.22\"" expo/app.config.ts
          grep -Fq 'versionCode: 119' expo/app.config.ts
          node expo/scripts/patch-ai-sdk-provider-utils.mjs
          echo "home_source_gate=PASS version=1.10.22 versionCode=119"
      - name: Prepare disposable QA signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IVX Owner QA, OU=Engineering, O=IVX Holdings, L=Miami, ST=Florida, C=US"
      - name: Build installable owner QA APK
        working-directory: expo/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleQa --no-daemon -x lint
      - name: Locate, verify, and certify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find expo/android/app/build/outputs/apk/qa -name '*.apk' -type f | head -1)
          test -n "$APK"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          NAME="ivx-holdings-v1.10.22-home-fix-${SHORT_SHA}.apk"
          cp "$APK" "$NAME"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$NAME"
          APK_SHA256=$(sha256sum "$NAME" | awk '{print $1}')
          mkdir -p qa/evidence
          jq -n \
            --arg marker "ivx-android-home-black-screen-recovery-v1.10.22" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg version "1.10.22" \
            --argjson versionCode 119 \
            --arg apk "$NAME" \
            --arg sha256 "$APK_SHA256" \
            --arg certifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{marker:$marker,sourceSha:$sourceSha,version:$version,versionCode:$versionCode,apk:$apk,sha256:$sha256,signatureVerified:true,homeRouteGate:true,hermesPatchGate:true,gradleAssembleQa:true,certifiedAt:$certifiedAt,certificateScope:"Build/signature/source gates for the Home black-screen recovery APK. Physical-device login-to-Home validation remains a separate runtime check."}' \
            > qa/evidence/ivx-android-home-black-screen-recovery-cert.json
          cat qa/evidence/ivx-android-home-black-screen-recovery-cert.json
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="ivx-home-fix-v1.10.22-${SHORT_SHA}"
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" qa/evidence/ivx-android-home-black-screen-recovery-cert.json --target "$GITHUB_SHA" --title "IVX Android v1.10.22 Home Recovery ${SHORT_SHA}" --notes "QA-signed Android APK for the post-login Home black-screen recovery. Includes concrete Home index routing, native-safe Home rendering, and the Hermes/Metro provider-utils dynamic-import patch. Source SHA: ${GITHUB_SHA}. APK SHA-256: ${{ steps.apk.outputs.sha256 }}. This release certificate covers build/signature/source gates; physical-device login-to-Home runtime validation must still be confirmed on-device."
      - uses: actions/upload-artifact@v4
        with:
          name: ivx-home-fix-v1.10.22-${{ github.sha }}
          path: |
            ${{ steps.apk.outputs.name }}
            qa/evidence/ivx-android-home-black-screen-recovery-cert.json
          retention-days: 30

