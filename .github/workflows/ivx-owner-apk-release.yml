name: IVX Owner APK Release

on:
  push:
    paths:
      - '.github/workflows/ivx-owner-apk-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_QA_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies and apply Rork Metro compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          bun install
          cd expo
          bun install
          bun scripts/apply-patches.mjs
      - name: Prepare disposable QA signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IVX Owner QA, OU=Engineering, O=IVX Holdings, L=Miami, ST=Florida, C=US"
      - name: Build installable owner QA APK
        working-directory: expo/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleQa --no-daemon -x lint
      - name: Locate and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find expo/android/app/build/outputs/apk/qa -name '*.apk' -type f | head -1)
          test -n "$APK"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          NAME="ivx-owner-signin-${SHORT_SHA}.apk"
          cp "$APK" "$NAME"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$NAME"
          sha256sum "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="ivx-owner-apk-${SHORT_SHA}"
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" --target "$GITHUB_SHA" --title "IVX Owner APK ${SHORT_SHA}" --notes "Installable QA-signed Android APK containing the current owner sign-in fix. Source SHA: ${GITHUB_SHA}. Not Play Store production-signed."
      - uses: actions/upload-artifact@v4
        with:
          name: ivx-owner-apk-${{ github.sha }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

