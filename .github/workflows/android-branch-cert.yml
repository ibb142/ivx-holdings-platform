name: Android Branch Certification

on:
  push:
    branches:
      - fix/android-metro-rork-independence-20260813
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
  NODE_ENV: production
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_QA_BUILD: 'true'

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd expo
          bun install --frozen-lockfile
      - name: Prepare QA signer
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IVX CI QA, OU=Engineering, O=IVX Holdings, L=Miami, ST=Florida, C=US"
      - name: Build QA APK
        working-directory: expo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleQa --no-daemon -x lint
      - name: Locate APK
        id: apk
        working-directory: expo/android
        run: |
          APK=$(find app/build/outputs/apk/qa -name '*.apk' -type f | head -1)
          test -n "$APK"
          ABS="$(cd "$(dirname "$APK")" && pwd)/$(basename "$APK")"
          echo "path=$ABS" >> "$GITHUB_OUTPUT"
          sha256sum "$ABS"
          ls -lh "$ABS"
      - uses: actions/upload-artifact@v4
        with:
          name: ivx-android-branch-cert-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
      - name: Emulator install and launch certification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb install -r "${{ steps.apk.outputs.path }}"
            adb shell am start -W -n com.ivxholdings.app.owner/.MainActivity | tee launch.txt
            sleep 10
            adb shell pidof com.ivxholdings.app.owner
            adb exec-out screencap -p > launch.png
            adb logcat -d -t 300 > logcat.txt
            ! grep -E "FATAL EXCEPTION|AndroidRuntime: Process: com.ivxholdings.app.owner" logcat.txt
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivx-android-runtime-evidence-${{ github.sha }}
          path: |
            launch.txt
            launch.png
            logcat.txt
          if-no-files-found: warn
