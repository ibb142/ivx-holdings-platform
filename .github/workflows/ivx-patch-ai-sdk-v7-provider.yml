name: IVX Patch AI SDK v7 Provider

on:
  push:
    branches:
      - fix/public-chat-live-inference-bypass
    paths:
      - .github/workflows/ivx-patch-ai-sdk-v7-provider.yml

permissions:
  contents: write

jobs:
  patch-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-chat-live-inference-bypass
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Align OpenAI provider with AI SDK 7
        run: |
          set -euo pipefail
          bun add @ai-sdk/openai@^4.0.0
          node -e "const p=require('./package.json'); if (!String(p.dependencies['ai']).startsWith('^7')) process.exit(1); if (!String(p.dependencies['@ai-sdk/openai']).startsWith('^4')) process.exit(1); console.log('ai/provider majors aligned', p.dependencies['ai'], p.dependencies['@ai-sdk/openai'])"

      - name: Verify frozen install and backend tests
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test backend/ivx-ai-runtime.test.ts backend/public-chat-ai.test.ts || bun test backend

      - name: Commit provider and lockfile repair
        run: |
          set -euo pipefail
          git config user.name 'IVX Certification Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo 'No dependency changes produced'
            exit 1
          fi
          git commit -m 'fix(ai): align OpenAI provider with AI SDK 7'
          git push origin HEAD:fix/public-chat-live-inference-bypass
