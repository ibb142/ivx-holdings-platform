name: IVX Patch AI SDK v7 Provider

on:
  push:
    branches:
      - fix/public-chat-live-inference-bypass
    paths:
      - .github/workflows/ivx-patch-ai-sdk-v7-provider.yml

permissions:
  contents: write

jobs:
  patch-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-chat-live-inference-bypass
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Fix stale AI SDK compatibility guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/ivx-ai-runtime.ts')
          s = p.read_text()
          old = """  // Verify the adapter is spec v3 compatible (v4 is rejected by ai@6)\n  const majorVersion = Number.parseInt(adapterVersion.split('.')[0] ?? '0', 10);\n  if (majorVersion > 3) {\n    errors.push(`@ai-sdk/openai@${adapterVersion} uses spec v4, incompatible with ai@6 — downgrade to @ai-sdk/openai@3.x`);\n  }\n"""
          new = """  // AI SDK 7 requires provider spec v4. Keep this startup guard aligned\n  // with package.json so a provider/runtime major mismatch fails loudly.\n  const majorVersion = Number.parseInt(adapterVersion.split('.')[0] ?? '0', 10);\n  if (majorVersion < 4) {\n    errors.push(`@ai-sdk/openai@${adapterVersion} is incompatible with ai@7 — upgrade to @ai-sdk/openai@4.x or newer`);\n  }\n"""
          if old not in s:
              raise SystemExit('stale compatibility guard anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify frozen install and backend tests
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test backend/ivx-ai-runtime.test.ts backend/public-chat-ai.test.ts || bun test backend

      - name: Commit runtime repair and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'IVX Certification Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/ivx-ai-runtime.ts package.json bun.lock
          git rm .github/workflows/ivx-patch-ai-sdk-v7-provider.yml
          git commit -m 'fix(ai): make real inference compatible with AI SDK 7'
          git push origin HEAD:fix/public-chat-live-inference-bypass
