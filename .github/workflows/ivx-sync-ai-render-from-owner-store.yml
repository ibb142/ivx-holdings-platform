name: IVX Sync AI Render From Owner Store

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-sync-ai-render-from-owner-store.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IVX_OWNER_VARIABLES_ENCRYPTION_KEY: ${{ secrets.IVX_OWNER_VARIABLES_ENCRYPTION_KEY }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - name: Decrypt owner credentials and safely bind Render runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = await import('node:crypto');
          const base = (process.env.EXPO_PUBLIC_SUPABASE_URL || '').replace(/\/+$/, '');
          const serviceKey = process.env.SUPABASE_SERVICE_ROLE_KEY || '';
          const encryptionSecrets = [
            process.env.IVX_OWNER_VARIABLES_ENCRYPTION_KEY,
            process.env.APP_SECRET,
            process.env.JWT_SECRET,
          ].filter(Boolean);
          if (!base || !serviceKey || encryptionSecrets.length === 0) throw new Error('required GitHub runtime bindings missing');
          // Bind the same highest-priority secret used by this workflow's
          // decryption candidate order. The previous implementation referenced
          // an undefined `encryptionSecret`, so it always failed before the
          // Render environment could be updated.
          const encryptionSecret = encryptionSecrets[0];
          const names = ['RENDER_API_KEY','RENDER_SERVICE_ID','IVX_AI_GATEWAY_KEY','AI_GATEWAY_API_KEY'];
          const query = encodeURIComponent(`(${names.join(',')})`);
          const rowsRes = await fetch(`${base}/rest/v1/ivx_owner_variables?select=name,encrypted_value,value_iv,value_tag,value_hash&name=in.${query}`, {
            headers: { apikey: serviceKey, Authorization: `Bearer ${serviceKey}`, Accept: 'application/json' }
          });
          if (!rowsRes.ok) throw new Error(`owner variable read HTTP ${rowsRes.status}`);
          const rows = await rowsRes.json();
          const byName = new Map(rows.map(r => [r.name, r]));
          const keyCandidates = [...new Set(encryptionSecrets)].map(secret => crypto.createHash('sha256').update(secret, 'utf8').digest());
          const aad = Buffer.from('ivx_owner_variables:v1', 'utf8');
          function decrypt(name) {
            const row = byName.get(name);
            if (!row) throw new Error(`${name} row missing`);
            let lastError = null;
            for (const key of keyCandidates) {
              try {
                const d = crypto.createDecipheriv('aes-256-gcm', key, Buffer.from(row.value_iv, 'base64'));
                d.setAAD(aad);
                d.setAuthTag(Buffer.from(row.value_tag, 'base64'));
                const value = Buffer.concat([d.update(Buffer.from(row.encrypted_value, 'base64')), d.final()]).toString('utf8').trim();
                const hash = crypto.createHash('sha256').update(value, 'utf8').digest('hex');
                if (hash !== row.value_hash) throw new Error(`${name} hash verification failed`);
                return value;
              } catch (err) {
                lastError = err;
              }
            }
            throw lastError || new Error(`${name} decryption failed with all key candidates`);
          }
          const renderKey = decrypt('RENDER_API_KEY');
          const serviceId = decrypt('RENDER_SERVICE_ID');
          const aiKey = decrypt('IVX_AI_GATEWAY_KEY');
          const aliasKey = byName.has('AI_GATEWAY_API_KEY') ? decrypt('AI_GATEWAY_API_KEY') : aiKey;
          if (aiKey !== aliasKey) throw new Error('AI gateway aliases do not match');
          const headers = { Accept: 'application/json', 'Content-Type': 'application/json', Authorization: `Bearer ${renderKey}` };
          const envUrl = `https://api.render.com/v1/services/${encodeURIComponent(serviceId)}/env-vars`;
          // limit=100 required: default page (20) + replace-all PUT wipes vars beyond page 1.
          const getRes = await fetch(`${envUrl}?limit=100`, { headers });
          if (!getRes.ok) throw new Error(`Render env GET HTTP ${getRes.status}`);
          const existingRaw = await getRes.json();
          const existing = new Map();
          for (const item of existingRaw) {
            const ev = item.envVar || item;
            if (ev && typeof ev.key === 'string') existing.set(ev.key, typeof ev.value === 'string' ? ev.value : '');
          }
          const before = existing.size;
          existing.set('IVX_AI_GATEWAY_KEY', aiKey);
          existing.set('AI_GATEWAY_API_KEY', aiKey);
          existing.set('IVX_OWNER_VARIABLES_ENCRYPTION_KEY', encryptionSecret);
          const body = Array.from(existing, ([key,value]) => ({ key, value }));
          const putRes = await fetch(envUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
          if (!putRes.ok) throw new Error(`Render env PUT HTTP ${putRes.status}: ${(await putRes.text()).slice(0,160)}`);
          const verifyRes = await fetch(`${envUrl}?limit=100`, { headers });
          if (!verifyRes.ok) throw new Error(`Render env verify GET HTTP ${verifyRes.status}`);
          const verifyRaw = await verifyRes.json();
          const verify = new Map();
          for (const item of verifyRaw) {
            const ev = item.envVar || item;
            if (ev && typeof ev.key === 'string') verify.set(ev.key, typeof ev.value === 'string' ? ev.value : '');
          }
          for (const required of ['IVX_AI_GATEWAY_KEY','AI_GATEWAY_API_KEY','IVX_OWNER_VARIABLES_ENCRYPTION_KEY']) {
            if (!verify.get(required)) throw new Error(`Render post-write validation missing ${required}`);
          }
          console.log(`owner_store_decrypt=PASS rows=${rows.length}`);
          console.log(`render_env_merge=PASS before=${before} after=${verify.size}`);
          console.log('ai_runtime_bindings=PASS');
          const deployRes = await fetch(`https://api.render.com/v1/services/${encodeURIComponent(serviceId)}/deploys`, {
            method: 'POST', headers, body: JSON.stringify({ clearCache: 'do_not_clear' })
          });
          if (!deployRes.ok) throw new Error(`Render deploy trigger HTTP ${deployRes.status}: ${(await deployRes.text()).slice(0,160)}`);
          const deploy = await deployRes.json().catch(() => ({}));
          const deployId = deploy.id || deploy.deploy?.id || 'created';
          console.log(`render_deploy_trigger=PASS id=${deployId}`);
          NODE
