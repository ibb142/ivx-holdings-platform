name: IVX Phase 3 Read-only Production Review

on:
  pull_request:
    paths:
      - 'qa/phase3-owner-dashboard.mjs'
      - 'qa/phase3-capacity.mjs'
      - '.github/workflows/ivx-phase3-readonly-review.yml'

permissions:
  contents: read

concurrency:
  group: phase3-readonly-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-observation:
    # This review observes existing production and cannot publish a deploy,
    # change limits, create model calls or certify the PR SHA as deployed.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/phase3-provider-limits-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Resolve current deployed main without changing production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {appendFileSync} from 'node:fs';
          const health=await fetch('https://api.ivxholding.com/health',{signal:AbortSignal.timeout(10000)}).then(r=>r.json());
          const main=await fetch('https://api.github.com/repos/ibb142/ivx-holdings-platform/branches/main',{
            headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(10000)}).then(r=>r.json());
          assert.match(health.commit||'',/^[a-f0-9]{40}$/);
          assert.equal(main.commit.sha,health.commit,'Main must already be deployed');
          appendFileSync(process.env.GITHUB_ENV,`IVX_TARGET_SHA=${health.commit}\n`);
          console.log(`Observed production SHA ${health.commit}; review SHA ${process.env.GITHUB_SHA}`);
          JS
      - name: Observe configured capacity and existing provider budget
        env:
          IVX_SYSTEM_KEY: ${{ secrets.IVX_AI_SYSTEM_SECRET || secrets.IVX_SYSTEM_SECRET }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          IVX_VERCEL_TOKEN: ${{ secrets.IVX_VERCEL_TOKEN }}
        run: node qa/phase3-capacity.mjs
      - name: Observe actual Owner dashboard and disconnected-data expiry
        if: ${{ !cancelled() && env.IVX_TARGET_SHA != '' }}
        env:
          OWNER_NEW_PASSWORD: ${{ secrets.OWNER_NEW_PASSWORD }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          IVX_OWNER_PASSWORD: ${{ secrets.IVX_OWNER_PASSWORD }}
          IVX_OWNER_NEW_PASSWORD: ${{ secrets.IVX_OWNER_NEW_PASSWORD }}
          OWNER_LOGIN_PASSWORD: ${{ secrets.OWNER_LOGIN_PASSWORD }}
          IVX_OWNER_LOGIN_PASSWORD: ${{ secrets.IVX_OWNER_LOGIN_PASSWORD }}
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          node qa/phase3-owner-dashboard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-readonly-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: qa/evidence/phase3/
          if-no-files-found: error
