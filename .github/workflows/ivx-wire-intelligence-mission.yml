name: IVX Wire Intelligence Mission

on:
  push:
    branches:
      - feat/autonomous-intelligence-mission-20260823

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-intelligence-mission-20260823
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Wire mission scheduler into server boot
        shell: python
        run: |
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          imp = "import { startAutonomousIntelligenceMissionScheduler } from './backend/services/ivx-autonomous-intelligence-mission-scheduler';\n"
          anchor = "import { startAutonomousScheduler } from './backend/services/ivx-autonomous-scheduler';\n"
          if imp not in s:
              if anchor not in s:
                  raise SystemExit('server import anchor not found')
              s = s.replace(anchor, anchor + imp, 1)
          call = "startAutonomousIntelligenceMissionScheduler();\n"
          anchor2 = "startAutonomousScheduler();\n"
          if call not in s:
              if anchor2 not in s:
                  raise SystemExit('server boot anchor not found')
              s = s.replace(anchor2, anchor2 + call, 1)
          p.write_text(s)
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: cd backend && bunx tsc --noEmit
      - name: Commit wiring
        run: |
          rm .github/workflows/ivx-wire-intelligence-mission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts .github/workflows/ivx-wire-intelligence-mission.yml
          git commit -m "feat(autonomous): start intelligence mission on production boot"
          git push origin HEAD:feat/autonomous-intelligence-mission-20260823
