name: Quantum database capacity recovery
on:
  push:
    branches: ['ops/quantum-vercel-dispatcher-audit-20260914']
    paths: ['.github/workflows/quantum-vercel-dispatcher-audit.yml']
permissions:
  contents: read
concurrency:
  group: quantum-vercel-dispatcher-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Apply bounded Small compute recovery after reservation reconciliation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const key = process.env.SUPABASE_ACCESS_TOKEN?.trim();
          const serviceKey = process.env.SUPABASE_SERVICE_ROLE_KEY?.trim();
          assert(key && serviceKey, 'Existing management and recovery-read bindings required');
          const base = 'https://api.supabase.com/v1/projects/kvclcdjmjghndxsngfzb';
          async function read(suffix) {
            const response = await fetch(base + suffix, { method: 'GET', redirect: 'error',
              signal: AbortSignal.timeout(15000), headers: { Authorization: 'Bearer ' + key, Accept: 'application/json' } });
            assert.equal(response.status, 200, 'Management read HTTP ' + response.status);
            return response.json();
          }
          function compute(body) {
            assert(Array.isArray(body.selected_addons), 'Malformed selected add-ons');
            const rows = body.selected_addons.filter(entry => entry.type === 'compute' || /^ci_/.test(entry.variant?.id || ''));
            assert.equal(rows.length, 1, 'Ambiguous selected compute');
            return rows[0].variant;
          }
          const proofResponse = await fetch('https://kvclcdjmjghndxsngfzb.supabase.co/rest/v1/ivx_durable_documents?select=value&doc_key=eq.ops%2Fbudget-recovery%2Fquantum-20260914-12&limit=2', {
            method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
            headers: { apikey: serviceKey, Authorization: 'Bearer ' + serviceKey, Accept: 'application/json' },
          });
          assert.equal(proofResponse.status, 200, 'Recovery receipt read HTTP ' + proofResponse.status);
          const proofs = await proofResponse.json();
          assert.equal(proofs.length, 1, 'Recovery receipt missing or ambiguous');
          const proof = proofs[0].value;
          assert.equal(proof.cohortSha256, '9f1812e7f8af006dc1f9cb867b6a087355a8d04d11e8dc41c9267cb45bc37c08');
          assert.equal(proof.reconciledCount, 12);
          assert.equal(proof.retainedCohortNano, '9872736000');
          assert.equal(proof.after.requestsActive, 0);
          assert.equal(proof.before.unsettledLiabilityNano, proof.after.unsettledLiabilityNano);
          const before = await read('/billing/addons');
          const selected = compute(before);
          if (selected.id !== 'ci_small') {
            assert.equal(selected.id, 'ci_micro', 'Only the reviewed Micro to Small transition is allowed');
            const target = before.available_addons?.filter(entry => entry.type === 'compute_instance' || entry.type === 'compute')
              .flatMap(entry => entry.variants || []).find(variant => variant.id === 'ci_small');
            assert.equal(target?.price?.interval, 'hourly');
            assert.equal(selected.price?.interval, 'hourly');
            const targetPrice = Number(target.price.amount), priorPrice = Number(selected.price.amount);
            assert(Number.isFinite(targetPrice) && Number.isFinite(priorPrice));
            const increment = (targetPrice - priorPrice) * 24;
            assert(targetPrice <= 0.0206 && increment >= 0 && increment <= 0.18, 'Reviewed infrastructure price bound exceeded');
            assert.equal((await read('')).status, 'ACTIVE_HEALTHY', 'A project transition is already in progress');
            console.log(JSON.stringify({ observedAt: new Date().toISOString(), action: 'micro_to_small',
              hourlyPrice: targetPrice, incrementalDailyUsd: increment, recoveryReceiptVerified: true }));
            // One PATCH only. A missing acknowledgement requires readback, never automatic replay.
            const changed = await fetch(base + '/billing/addons', { method: 'PATCH', redirect: 'error',
              signal: AbortSignal.timeout(20000), headers: { Authorization: 'Bearer ' + key,
                Accept: 'application/json', 'Content-Type': 'application/json' },
              body: JSON.stringify({ addon_type: 'compute_instance', addon_variant: 'ci_small' }) });
            await changed.body?.cancel();
            assert.equal(changed.status, 200, 'Compute change acknowledgement HTTP ' + changed.status + '; inspect selection before retry');
          }
          let confirmed = false;
          for (let sample = 0; sample < 30; sample++) {
            const selection = compute(await read('/billing/addons'));
            const project = await read('');
            let memoryBytes = null;
            if (selection.id === 'ci_small' && project.status === 'ACTIVE_HEALTHY') {
              try {
                const metrics = await fetch('https://kvclcdjmjghndxsngfzb.supabase.co/customer/v1/privileged/metrics', {
                  method: 'GET', redirect: 'error', signal: AbortSignal.timeout(10000),
                  headers: { Authorization: 'Basic ' + Buffer.from('service_role:' + serviceKey).toString('base64') },
                });
                if (metrics.ok) memoryBytes = Number(/^node_memory_MemTotal_bytes(?:\{[^}]*\})?\s+([0-9.eE+-]+)/m.exec(await metrics.text())?.[1]) || null;
                else await metrics.body?.cancel();
              } catch { /* Read-only readiness retries; never repeat the PATCH. */ }
            }
            console.log(JSON.stringify({ observedAt: new Date().toISOString(), sample,
              compute: selection.id, projectStatus: project.status, memoryBytes }));
            if (selection.id === 'ci_small' && project.status === 'ACTIVE_HEALTHY' && memoryBytes >= 1_700_000_000) { confirmed = true; break; }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          assert(confirmed, 'Small compute runtime not confirmed; inspect project before any further mutation');
          NODE
      - name: Read configured disk attributes and current utilization
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const key = process.env.SUPABASE_ACCESS_TOKEN?.trim();
          assert(key, 'Management read binding unavailable');
          for (const suffix of ['/config/disk', '/config/disk/util']) {
            const response = await fetch('https://api.supabase.com/v1/projects/kvclcdjmjghndxsngfzb' + suffix, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Authorization: 'Bearer ' + key, Accept: 'application/json' },
            });
            assert.equal(response.status, 200, 'Disk configuration read HTTP ' + response.status);
            const body = await response.json();
            const attributes = body.attributes;
            const metrics = body.metrics;
            console.log(JSON.stringify({ observedAt: new Date().toISOString(), scope: 'database-disk-read-only', endpoint: suffix,
              attributes: attributes ? { type: attributes.type, sizeGb: attributes.size_gb,
                iops: attributes.iops, throughputMiBps: attributes.throughput_mibps } : null,
              metrics: metrics ? { sizeBytes: metrics.fs_size_bytes, availableBytes: metrics.fs_avail_bytes, usedBytes: metrics.fs_used_bytes } : null,
              measuredAt: body.timestamp ?? null, lastModifiedAt: body.last_modified_at ?? null }));
          }
          NODE
      - name: Read one fresh CPU and IO snapshot
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY?.trim();
          assert(key, 'Metrics binding unavailable');
          const allow = new Set([
            'node_cpu_seconds_total', 'node_memory_MemAvailable_bytes', 'node_memory_MemTotal_bytes',
            'node_memory_SwapFree_bytes', 'node_memory_SwapTotal_bytes', 'node_load1',
            'node_disk_io_time_seconds_total', 'node_disk_io_time_weighted_seconds_total',
            'node_disk_read_time_seconds_total', 'node_disk_reads_completed_total',
            'node_disk_read_bytes_total', 'node_disk_written_bytes_total',
            'node_disk_write_time_seconds_total', 'node_disk_writes_completed_total',
            'node_pressure_io_waiting_seconds_total', 'node_pressure_cpu_waiting_seconds_total',
            'node_pressure_memory_waiting_seconds_total',
          ]);
          async function snapshot() {
            const response = await fetch('https://kvclcdjmjghndxsngfzb.supabase.co/customer/v1/privileged/metrics', {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(45000),
              headers: { Authorization: 'Basic ' + Buffer.from('service_role:' + key).toString('base64') },
            });
            assert.equal(response.status, 200, 'Metrics read HTTP ' + response.status);
            const raw = await response.text();
            assert(raw.length < 5_000_000, 'Metrics response exceeds the read budget');
            const series = [];
            for (const line of raw.split('\n')) {
              const match = /^([a-zA-Z_:][a-zA-Z0-9_:]*)(?:\{([^}]*)\})?\s+([0-9.eE+-]+)(?:\s+[0-9.eE+-]+)?$/.exec(line);
              if (!match || !allow.has(match[1]) || !Number.isFinite(Number(match[3]))) continue;
              const mode = /(?:^|,)mode="([a-z]+)"/.exec(match[2] || '')?.[1];
              const device = /(?:^|,)device="([a-zA-Z0-9_-]+)"/.exec(match[2] || '')?.[1];
              const cpu = /(?:^|,)cpu="([0-9]+)"/.exec(match[2] || '')?.[1];
              series.push({ metric: match[1], ...(mode ? { mode } : {}), ...(device ? { device } : {}),
                ...(cpu ? { cpu } : {}), value: Number(match[3]) });
            }
            assert(series.length > 0, 'Required CPU/IO series unavailable');
            return { observedAt: new Date().toISOString(), series };
          }
          const before = await snapshot();
          console.log(JSON.stringify({ scope: 'database-capacity-read-only', sample: 1, ...before }));
          NODE
