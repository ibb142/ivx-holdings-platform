name: Quantum database recovery verification
on:
  push:
    branches: ['ops/quantum-vercel-dispatcher-audit-20260914']
    paths: ['.github/workflows/quantum-vercel-dispatcher-audit.yml']
permissions:
  contents: read
concurrency:
  group: quantum-vercel-dispatcher-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify recovered Small runtime without mutations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const key = process.env.SUPABASE_ACCESS_TOKEN?.trim();
          const serviceKey = process.env.SUPABASE_SERVICE_ROLE_KEY?.trim();
          assert(key && serviceKey, 'Existing management and recovery-read bindings required');
          const base = 'https://api.supabase.com/v1/projects/kvclcdjmjghndxsngfzb';
          async function read(suffix) {
            const response = await fetch(base + suffix, { method: 'GET', redirect: 'error',
              signal: AbortSignal.timeout(15000), headers: { Authorization: 'Bearer ' + key, Accept: 'application/json' } });
            assert.equal(response.status, 200, 'Management read HTTP ' + response.status);
            return response.json();
          }
          function compute(body) {
            assert(Array.isArray(body.selected_addons), 'Malformed selected add-ons');
            const rows = body.selected_addons.filter(entry => entry.type === 'compute' || /^ci_/.test(entry.variant?.id || ''));
            assert.equal(rows.length, 1, 'Ambiguous selected compute');
            return rows[0].variant;
          }
          assert.equal(compute(await read('/billing/addons')).id, 'ci_small', 'Recovered Small configuration changed');
          let confirmed = false;
          for (let sample = 0; sample < 3; sample++) {
            const selection = compute(await read('/billing/addons'));
            const project = await read('');
            let memoryBytes = null;
            if (selection.id === 'ci_small' && project.status === 'ACTIVE_HEALTHY') {
              try {
                const metrics = await fetch('https://kvclcdjmjghndxsngfzb.supabase.co/customer/v1/privileged/metrics', {
                  method: 'GET', redirect: 'error', signal: AbortSignal.timeout(10000),
                  headers: { Authorization: 'Basic ' + Buffer.from('service_role:' + serviceKey).toString('base64') },
                });
                if (metrics.ok) memoryBytes = Number(/^node_memory_MemTotal_bytes(?:\{[^}]*\})?\s+([0-9.eE+-]+)/m.exec(await metrics.text())?.[1]) || null;
                else await metrics.body?.cancel();
              } catch { /* Read-only readiness retries; never repeat the PATCH. */ }
            }
            console.log(JSON.stringify({ observedAt: new Date().toISOString(), sample,
              compute: selection.id, projectStatus: project.status, memoryBytes }));
            if (selection.id === 'ci_small' && project.status === 'ACTIVE_HEALTHY' && memoryBytes >= 1_700_000_000) { confirmed = true; break; }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          assert(confirmed, 'Small compute runtime not confirmed; inspect project before any further mutation');
          NODE
      - name: Verify live readiness and nonempty public feeds
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const failures = [];
          for (const [endpoint, collection] of [['/health/ready', null], ['/api/reels?limit=2', 'videos'], ['/api/ivx/video-platform/home-feed?limit=4', 'blocks']]) {
            const started = performance.now();
            try {
            const response = await fetch('https://api.ivxholding.com' + endpoint, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(12_000),
              headers: { Accept: 'application/json' },
            });

            assert.match(response.headers.get('content-type') || '', /application\/json/i, endpoint + ': JSON required');
            assert.equal(response.headers.get('x-ivx-qa-fixture'), null, 'Synthetic responses cannot certify public production');
            assert.notEqual(response.headers.get('x-ivx-data-state'), 'unavailable', endpoint + ': unavailable');
            const body = await response.json();
            if (!collection) console.log(JSON.stringify({ scope: 'readiness-diagnostic', observedAt: new Date().toISOString(),
              status: response.status, ready: body.ready, checks: Object.fromEntries(Object.entries(body.checks || {}).map(([name, check]) => [name, {
                ok: check.ok, state: check.state, status: check.status, ready: check.ready,
                error: typeof check.error === 'string' ? check.error.slice(0,300) : undefined,
                reason: typeof check.reason === 'string' ? check.reason.slice(0,300) : undefined,
                running: check.running, ownerAuthorized: check.ownerAuthorized, httpStatus: check.httpStatus,
                latencyMs: check.latencyMs, depth: check.depth, oldestQueuedAgeMinutes: check.oldestQueuedAgeMinutes,
                saturated: check.saturated, staleQueue: check.staleQueue, circuitOpen: check.circuit?.open,
                workerCount: Array.isArray(check.workers) ? check.workers.length : undefined,
                workerObservationReason: check.workerObservationReason,
                fields: Object.keys(check),
              }])) }));
            assert.equal(response.status, 200, endpoint + ': HTTP ' + response.status);
            if (collection) {
              assert(!body.qa_fixture && body.data_available !== false && body.degraded !== true && !body.error && body.code !== 'PUBLIC_DATA_UNAVAILABLE');
              assert(Array.isArray(body[collection]) && body[collection].length > 0, endpoint + ': empty ' + collection);
            } else assert(body.ok === true && body.ready === true, 'Actual execution readiness unavailable');
            console.log(JSON.stringify({ scope: 'live-production-recovery', observedAt: new Date().toISOString(), endpoint,
              status: response.status, durationMs: Math.round(performance.now() - started),
              ...(collection ? { count: body[collection].length } : { ready: body.ready }) }));
            } catch (error) {
              failures.push(endpoint);
              console.log(JSON.stringify({ scope: 'live-production-recovery-failure', observedAt: new Date().toISOString(), endpoint, error: error.message }));
            }
          }
          assert.equal(failures.length, 0, 'Production checks failed: ' + failures.join(', '));
          NODE
