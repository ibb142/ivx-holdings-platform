name: Quantum database capacity read-only audit
on:
  push:
    branches: ['ops/quantum-vercel-dispatcher-audit-20260914']
    paths: ['.github/workflows/quantum-vercel-dispatcher-audit.yml']
permissions:
  contents: read
concurrency:
  group: quantum-vercel-dispatcher-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Read selected compute size and public price without changing billing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const key = process.env.SUPABASE_ACCESS_TOKEN?.trim();
          assert(key, 'Management read binding unavailable');
          const response = await fetch('https://api.supabase.com/v1/projects/kvclcdjmjghndxsngfzb/billing/addons', {
            method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
            headers: { Authorization: 'Bearer ' + key, Accept: 'application/json' },
          });
          assert.equal(response.status, 200, 'Compute selection read HTTP ' + response.status);
          const body = await response.json();
          assert(Array.isArray(body.selected_addons), 'Malformed selected add-ons');
          const compute = body.selected_addons.filter(entry => entry.type === 'compute' || /^ci_/.test(entry.variant?.id || ''));
          assert.equal(compute.length, 1, 'Selected compute size could not be identified');
          const available = body.available_addons?.filter(entry => entry.type === 'compute_instance' || entry.type === 'compute')
            .flatMap(entry => entry.variants || []).filter(variant => ['ci_micro', 'ci_small'].includes(variant.id)) || [];
          console.log(JSON.stringify({ observedAt: new Date().toISOString(), scope: 'selected-database-compute-read-only',
            available: available.map(variant => ({ id: variant.id, name: variant.name,
              hourlyPrice: variant.price?.interval === 'hourly' ? variant.price.amount : null })),
            compute: compute.map(entry => ({ type: entry.type, id: entry.variant?.id, name: entry.variant?.name,
              price: entry.variant?.price ? { amount: entry.variant.price.amount, interval: entry.variant.price.interval,
                type: entry.variant.price.type, description: entry.variant.price.description } : null })) }));
          NODE
      - name: Read configured disk attributes and current utilization
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const key = process.env.SUPABASE_ACCESS_TOKEN?.trim();
          assert(key, 'Management read binding unavailable');
          for (const suffix of ['/config/disk', '/config/disk/util']) {
            const response = await fetch('https://api.supabase.com/v1/projects/kvclcdjmjghndxsngfzb' + suffix, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Authorization: 'Bearer ' + key, Accept: 'application/json' },
            });
            assert.equal(response.status, 200, 'Disk configuration read HTTP ' + response.status);
            const body = await response.json();
            const attributes = body.attributes;
            const metrics = body.metrics;
            console.log(JSON.stringify({ observedAt: new Date().toISOString(), scope: 'database-disk-read-only', endpoint: suffix,
              attributes: attributes ? { type: attributes.type, sizeGb: attributes.size_gb,
                iops: attributes.iops, throughputMiBps: attributes.throughput_mibps } : null,
              metrics: metrics ? { sizeBytes: metrics.fs_size_bytes, availableBytes: metrics.fs_avail_bytes, usedBytes: metrics.fs_used_bytes } : null,
              measuredAt: body.timestamp ?? null, lastModifiedAt: body.last_modified_at ?? null }));
          }
          NODE
      - name: Read one fresh CPU and IO snapshot
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY?.trim();
          assert(key, 'Metrics binding unavailable');
          const allow = new Set([
            'node_cpu_seconds_total', 'node_memory_MemAvailable_bytes', 'node_memory_MemTotal_bytes',
            'node_memory_SwapFree_bytes', 'node_memory_SwapTotal_bytes', 'node_load1',
            'node_disk_io_time_seconds_total', 'node_disk_io_time_weighted_seconds_total',
            'node_disk_read_time_seconds_total', 'node_disk_reads_completed_total',
            'node_disk_read_bytes_total', 'node_disk_written_bytes_total',
            'node_disk_write_time_seconds_total', 'node_disk_writes_completed_total',
            'node_pressure_io_waiting_seconds_total', 'node_pressure_cpu_waiting_seconds_total',
            'node_pressure_memory_waiting_seconds_total',
          ]);
          async function snapshot() {
            const response = await fetch('https://kvclcdjmjghndxsngfzb.supabase.co/customer/v1/privileged/metrics', {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(45000),
              headers: { Authorization: 'Basic ' + Buffer.from('service_role:' + key).toString('base64') },
            });
            assert.equal(response.status, 200, 'Metrics read HTTP ' + response.status);
            const raw = await response.text();
            assert(raw.length < 5_000_000, 'Metrics response exceeds the read budget');
            const series = [];
            for (const line of raw.split('\n')) {
              const match = /^([a-zA-Z_:][a-zA-Z0-9_:]*)(?:\{([^}]*)\})?\s+([0-9.eE+-]+)(?:\s+[0-9.eE+-]+)?$/.exec(line);
              if (!match || !allow.has(match[1]) || !Number.isFinite(Number(match[3]))) continue;
              const mode = /(?:^|,)mode="([a-z]+)"/.exec(match[2] || '')?.[1];
              const device = /(?:^|,)device="([a-zA-Z0-9_-]+)"/.exec(match[2] || '')?.[1];
              const cpu = /(?:^|,)cpu="([0-9]+)"/.exec(match[2] || '')?.[1];
              series.push({ metric: match[1], ...(mode ? { mode } : {}), ...(device ? { device } : {}),
                ...(cpu ? { cpu } : {}), value: Number(match[3]) });
            }
            assert(series.length > 0, 'Required CPU/IO series unavailable');
            return { observedAt: new Date().toISOString(), series };
          }
          const before = await snapshot();
          console.log(JSON.stringify({ scope: 'database-capacity-read-only', sample: 1, ...before }));
          NODE
