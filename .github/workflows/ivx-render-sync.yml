name: IVX Render Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API_BASE: https://api.ivxholding.com
      RENDER_API_KEY_PRIMARY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_KEY_ALIAS: ${{ secrets.IVX_RENDER_API_KEY }}
      RENDER_API_KEY_VAR_PRIMARY: ${{ vars.RENDER_API_KEY }}
      RENDER_API_KEY_VAR_ALIAS: ${{ vars.IVX_RENDER_API_KEY }}
      RENDER_SERVICE_ID_SECRET: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_SERVICE_ID_VAR: ${{ vars.RENDER_SERVICE_ID }}
      DEFAULT_RENDER_SERVICE_ID: srv-d7t9ivreo5us73ftose0
    steps:
      - uses: actions/checkout@v4

      - name: Resolve existing Render bindings without exposing values
        shell: bash
        run: |
          set -euo pipefail
          KEY="${RENDER_API_KEY_PRIMARY:-${RENDER_API_KEY_ALIAS:-${RENDER_API_KEY_VAR_PRIMARY:-${RENDER_API_KEY_VAR_ALIAS:-}}}}"
          SERVICE_ID="${RENDER_SERVICE_ID_SECRET:-${RENDER_SERVICE_ID_VAR:-$DEFAULT_RENDER_SERVICE_ID}}"
          if [ -z "$KEY" ]; then
            echo 'render_api_binding=missing'
            echo 'Checked secrets.RENDER_API_KEY, secrets.IVX_RENDER_API_KEY, vars.RENDER_API_KEY, vars.IVX_RENDER_API_KEY.'
            exit 2
          fi
          echo 'render_api_binding=present'
          echo "render_service_binding=present length=${#SERVICE_ID}"
          echo "RENDER_API_KEY_RESOLVED=$KEY" >> "$GITHUB_ENV"
          echo "RENDER_SERVICE_ID_RESOLVED=$SERVICE_ID" >> "$GITHUB_ENV"

      - name: Trigger latest main deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID_RESOLVED}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY_RESOLVED}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"clearCache":"do_not_clear"}')
          DEPLOY_ID=$(printf '%s' "$RESPONSE" | jq -r '.id // .deploy.id // empty')
          if [ -z "$DEPLOY_ID" ]; then
            echo 'Render API accepted no deploy id.'
            exit 1
          fi
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          echo "render_deploy_triggered=$DEPLOY_ID"

      - name: Wait for Render deploy live
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            RESPONSE=$(curl -fsS "https://api.render.com/v1/services/${RENDER_SERVICE_ID_RESOLVED}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY_RESOLVED}" \
              -H 'Accept: application/json')
            STATUS=$(printf '%s' "$RESPONSE" | jq -r '.status // empty')
            COMMIT=$(printf '%s' "$RESPONSE" | jq -r '.commit.id // .commitId // empty')
            echo "poll=$i status=$STATUS commit=${COMMIT:0:12} expected=${GITHUB_SHA:0:12}"
            case "$STATUS" in
              live)
                if [ -n "$COMMIT" ] && { [ "$COMMIT" = "$GITHUB_SHA" ] || [[ "$COMMIT" == "$GITHUB_SHA"* ]] || [[ "$GITHUB_SHA" == "$COMMIT"* ]]; }; then
                  echo 'render_deploy_live=PASS'
                  exit 0
                fi
                ;;
              build_failed|update_failed|canceled)
                echo "render_deploy_live=FAIL status=$STATUS"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'render_deploy_live=TIMEOUT'
          exit 1

      - name: Verify production SHA parity
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            code=$(curl -sS -m 20 -o /tmp/health.json -w '%{http_code}' "${API_BASE}/health" || true)
            if [ "$code" = '200' ]; then
              PROD=$(jq -r '.commit // empty' /tmp/health.json)
              OK=$(jq -r '.ok // false' /tmp/health.json)
              echo "health_poll=$i ok=$OK prod=${PROD:0:12} expected=${GITHUB_SHA:0:12}"
              if [ "$OK" = 'true' ] && { [ "$PROD" = "$GITHUB_SHA" ] || [[ "$PROD" == "$GITHUB_SHA"* ]] || [[ "$GITHUB_SHA" == "$PROD"* ]]; }; then
                echo 'production_sha_parity=PASS'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'production_sha_parity=FAIL'
          exit 1
