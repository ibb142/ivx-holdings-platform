name: IVX 112 Hard Start Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-112-hard-start-recovery.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  id-token: write

env:
  API_BASE: https://api.ivxholding.com

jobs:
  recover-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read live fleet truth
        id: truth
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 --max-time 30 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/before.json
          max=$(jq -r '.dispatcher.maxConcurrency // 0' /tmp/before.json)
          running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/before.json)
          queued=$(jq -r '.dispatcher.utilization24h.queuedNow // 0' /tmp/before.json)
          owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/before.json)
          test "$max" -eq 112
          echo "running=$running" >> "$GITHUB_OUTPUT"
          echo "queued=$queued" >> "$GITHUB_OUTPUT"
          echo "owner_gate=$owner_gate" >> "$GITHUB_OUTPUT"

      - name: Mint bounded recovery identity
        if: steps.truth.outputs.owner_gate == '0' && steps.truth.outputs.running != '112'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsS --max-time 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ivx-360-autonomous-recovery")
          token=$(printf '%s' "$token_json" | jq -r '.value // empty')
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Invoke real cascade start_all
        if: steps.truth.outputs.owner_gate == '0' && steps.truth.outputs.running != '112'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 3 --retry-delay 2 --max-time 120 -o /tmp/start.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-IVX-GitHub-OIDC: $OIDC_TOKEN" -d '{"action":"start_all"}' "$API_BASE/api/ivx/agents/app-completion/control")
          echo "start_all_http=$code"
          test "$code" = 200
          test "$(jq -r '.ok // false' /tmp/start.json)" = true

      - name: Certify 112 real workers
        shell: bash
        run: |
          set -euo pipefail
          pass=false
          for i in $(seq 1 12); do
            sleep 10
            if curl -fsS --max-time 30 "$API_BASE/api/ivx/agents/app-completion/dashboard" -o /tmp/final.json; then
              max=$(jq -r '.dispatcher.maxConcurrency // 0' /tmp/final.json)
              running=$(jq -r '.dispatcher.utilization24h.runningNow // 0' /tmp/final.json)
              owner_gate=$(jq -r '.dispatcher.utilization24h.ownerGateNow // 0' /tmp/final.json)
              echo "poll=$i max=$max running=$running ownerGate=$owner_gate"
              if [ "$max" -eq 112 ] && [ "$running" -eq 112 ] && [ "$owner_gate" -eq 0 ]; then pass=true; break; fi
            fi
          done
          test "$pass" = true
