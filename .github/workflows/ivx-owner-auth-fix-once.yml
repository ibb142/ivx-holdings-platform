name: IVX Owner Auth Fix Once

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-owner-auth-fix-once.yml'

permissions:
  contents: write

concurrency:
  group: ivx-owner-auth-fix-once
  cancel-in-progress: false

jobs:
  fix-once:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install
        run: bun install && cd expo && bun install
      - name: Apply owner login remediation
        run: node scripts/ivx-owner-auth-fastpath-fix.mjs
      - name: Verify auth source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'IVX_OWNER_POST_LOGIN_FAST_PATH_V1' expo/lib/auth-context.tsx
          grep -q 'IVX_OWNER_REPAIR_BACKGROUND_V1' expo/lib/auth-context.tsx
          if grep -q 'await repairOwnerRegistrationAfterLogin(session).catch' expo/lib/auth-context.tsx; then exit 1; fi
      - name: Focused auth tests
        working-directory: expo
        run: bun test __tests__/auth-hardening.test.ts __tests__/auth-timeout-fix.test.ts
      - name: Persist fix and retire one-shot scheduler
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IVX Auth Remediator'
          git config user.email 'ivx-auth-remediator@users.noreply.github.com'
          git add expo/lib/auth-context.tsx
          git rm .github/workflows/ivx-owner-auth-fix-once.yml
          git commit -m 'fix(auth): make owner login critical path nonblocking [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
