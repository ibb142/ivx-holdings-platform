name: IVX Production Deploy Governor

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'server.ts'
      - 'package.json'
      - 'bun.lock'
      - 'render.yaml'
      - '.github/workflows/ivx-render-live-cert.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# Enterprise invariant: only one automatic backend deployment decision may execute at a time.
concurrency:
  group: ivx-production-deploy-governor
  cancel-in-progress: false

jobs:
  deploy-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      IVX_AI_SYSTEM_SECRET: ${{ secrets.IVX_AI_SYSTEM_SECRET }}
      IVX_SYSTEM_SECRET: ${{ secrets.IVX_SYSTEM_SECRET }}
      DEFAULT_RENDER_SERVICE_ID: srv-d7t9ivreo5us73ftose0
      API_BASE: https://api.ivxholding.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest main target and current production truth
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          TARGET_SHA=$(git rev-parse origin/main)
          SERVICE_ID="${RENDER_SERVICE_ID:-$DEFAULT_RENDER_SERVICE_ID}"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "SERVICE_ID=$SERVICE_ID" >> "$GITHUB_ENV"
          live=''
          code=$(curl -sS --max-time 20 -o /tmp/version-before.json -w '%{http_code}' "$API_BASE/version" || true)
          if [ "$code" = 200 ]; then live=$(jq -r '.commit // empty' /tmp/version-before.json); fi
          already_live=false
          if [ "$live" = "$TARGET_SHA" ]; then already_live=true; fi
          echo "already_live=$already_live" >> "$GITHUB_OUTPUT"
          echo "governor_target=$TARGET_SHA trigger_sha=$GITHUB_SHA production_sha=${live:-missing} already_live=$already_live"

      - name: Reuse an active Render deploy for the same SHA
        id: active
        if: steps.target.outputs.already_live != 'true' && env.RENDER_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --max-time 30 "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=50" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json')
          active=$(printf '%s' "$response" | jq -c --arg sha "$TARGET_SHA" '
            [ .[]
              | select((.status == "created" or .status == "build_in_progress" or .status == "update_in_progress"))
              | select((.commit.id // .commitId // "") == $sha)
            ][0] // empty')
          if [ -n "$active" ]; then
            deploy_id=$(printf '%s' "$active" | jq -r '.id // empty')
            test -n "$deploy_id"
            echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
            echo "same_sha_active=true" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
            echo "deploy_governor=REUSE_ACTIVE same_sha=$TARGET_SHA deploy_id=$deploy_id"
          else
            echo "same_sha_active=false" >> "$GITHUB_OUTPUT"
            echo 'deploy_governor=NO_SAME_SHA_ACTIVE'
          fi

      - name: Wait for any other active Render deploy before creating one
        if: steps.target.outputs.already_live != 'true' && env.RENDER_API_KEY != '' && steps.active.outputs.same_sha_active != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            response=$(curl -fsS --max-time 30 "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=20" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json')
            active_count=$(printf '%s' "$response" | jq '[.[] | select(.status == "created" or .status == "build_in_progress" or .status == "update_in_progress")] | length')
            live=$(curl -sS --max-time 20 "$API_BASE/version" 2>/dev/null | jq -r '.commit // empty' || true)
            echo "serialize_poll=$i active_deploys=$active_count production_sha=${live:-missing} target=$TARGET_SHA"
            if [ "$live" = "$TARGET_SHA" ]; then
              echo 'TARGET_BECAME_LIVE=true' >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$active_count" = 0 ]; then exit 0; fi
            sleep 10
          done
          echo 'Another Render deployment stayed active too long; fail closed instead of creating an overlapping deploy.'
          exit 1

      - name: Create exactly one Render deploy for target SHA
        if: steps.target.outputs.already_live != 'true' && env.RENDER_API_KEY != '' && steps.active.outputs.same_sha_active != 'true' && env.TARGET_BECAME_LIVE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Final race check immediately before POST.
          response=$(curl -fsS --max-time 30 "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=50" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json')
          existing=$(printf '%s' "$response" | jq -r --arg sha "$TARGET_SHA" '
            [ .[]
              | select((.status == "created" or .status == "build_in_progress" or .status == "update_in_progress"))
              | select((.commit.id // .commitId // "") == $sha)
              | .id
            ][0] // empty')
          if [ -n "$existing" ]; then
            echo "DEPLOY_ID=$existing" >> "$GITHUB_ENV"
            echo "deploy_governor=RACE_REUSED deploy_id=$existing sha=$TARGET_SHA"
            exit 0
          fi
          create=$(curl -fsS --max-time 40 -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"${TARGET_SHA}\"}")
          deploy_id=$(printf '%s' "$create" | jq -r '.id // .deploy.id // empty')
          test -n "$deploy_id"
          echo "DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
          echo "deploy_governor=CREATED_ONCE deploy_id=$deploy_id sha=$TARGET_SHA"

      - name: Fallback through protected IVX deploy bridge
        if: steps.target.outputs.already_live != 'true' && env.RENDER_API_KEY == '' && (env.IVX_AI_SYSTEM_SECRET != '' || env.IVX_SYSTEM_SECRET != '')
        shell: bash
        run: |
          set -euo pipefail
          SYSTEM_KEY="${IVX_AI_SYSTEM_SECRET:-${IVX_SYSTEM_SECRET:-}}"
          http=$(curl -sS --max-time 60 -o /tmp/bridge.json -w '%{http_code}' \
            -X POST "$API_BASE/api/ivx/developer-deploy/action" \
            -H 'Content-Type: application/json' \
            -H "X-IVX-System-Key: ${SYSTEM_KEY}" \
            -H "Authorization: Bearer ${SYSTEM_KEY}" \
            --data "{\"action\":\"render_trigger_deploy\",\"input\":{\"serviceId\":\"${SERVICE_ID}\",\"commitId\":\"${TARGET_SHA}\"},\"confirm\":true,\"confirmText\":\"CONFIRM_IVX_RENDER_DEPLOY\",\"reason\":\"IVX Production Deploy Governor exact-SHA deployment\"}" || true)
          case "$http" in 200|201|202) ;; *) cat /tmp/bridge.json || true; exit 1;; esac
          deploy_id=$(jq -r '.result.deployId // .result.id // .deployId // empty' /tmp/bridge.json 2>/dev/null || true)
          echo "DEPLOY_ID=${deploy_id:-bridge}" >> "$GITHUB_ENV"
          echo "deploy_governor=PROTECTED_BRIDGE sha=$TARGET_SHA"

      - name: Wait for exact target SHA in production
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          for i in $(seq 1 120); do
            code=$(curl -sS --max-time 20 -o /tmp/version.json -w '%{http_code}' "$API_BASE/version" || true)
            live=''; ok=false
            if [ "$code" = 200 ]; then
              live=$(jq -r '.commit // empty' /tmp/version.json)
              ok=$(jq -r '.ok // false' /tmp/version.json)
            fi
            echo "production_poll=$i http=$code ok=$ok live=${live:-missing} target=$TARGET_SHA"
            if [ "$code" = 200 ] && [ "$ok" = true ] && [ "$live" = "$TARGET_SHA" ]; then matched=true; break; fi
            sleep 10
          done
          test "$matched" = true
          echo "RENDER_COMMIT=$TARGET_SHA" >> "$GITHUB_ENV"
          echo 'exact_sha_parity=PASS'

      - name: Verify production health and exact version
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$API_BASE/health" -o /tmp/health.json
          test "$(jq -r '.ok // false' /tmp/health.json)" = true
          version=$(curl -fsS --max-time 20 "$API_BASE/version")
          test "$(printf '%s' "$version" | jq -r '.ok // false')" = true
          test "$(printf '%s' "$version" | jq -r '.commit // empty')" = "$TARGET_SHA"
          echo 'health_and_version=PASS'

      - name: Verify AI provider and real public-chat inference
        shell: bash
        run: |
          set -euo pipefail
          ai=$(curl -fsS --retry 4 --retry-delay 2 "$API_BASE/health/ai/live")
          test "$(printf '%s' "$ai" | jq -r '.ok // false')" = true
          token="IVX-LIVE-${GITHUB_RUN_ID}-1"
          body=$(jq -nc --arg message "Return the exact token ${token} and no other text." --arg sessionId 'github-live-cert' --arg requestId "github-live-cert-${GITHUB_RUN_ID}" '{message:$message,sessionId:$sessionId,requestId:$requestId,history:[]}')
          response=$(curl -fsS --retry 3 --retry-delay 2 -X POST "$API_BASE/api/public/chat" -H 'Content-Type: application/json' -H "x-ivx-client-id: github-live-cert-${GITHUB_RUN_ID}" --data "$body")
          test "$(printf '%s' "$response" | jq -r '.source // empty')" = chatgpt
          test -n "$(printf '%s' "$response" | jq -r '.endpoint // empty')"
          printf '%s' "$response" | jq -r '.answer // .text // empty' | grep -Fq "$token"
          echo 'ai_and_real_inference=PASS'

      - name: Emit deployment-governor certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/evidence
          cat > qa/evidence/render-live-cert.json <<EOF
          {
            "certified": true,
            "authority": "IVX Production Deploy Governor",
            "triggerSha": "${GITHUB_SHA}",
            "targetSha": "${TARGET_SHA}",
            "renderDeployId": "${DEPLOY_ID:-already-live-or-auto}",
            "renderCommit": "${RENDER_COMMIT:-${TARGET_SHA}}",
            "singleAutomaticAuthority": true,
            "sameShaActiveDeployReuse": true,
            "overlapPrevention": true,
            "exactShaParity": "PASS",
            "health": "PASS",
            "aiProvider": "PASS",
            "realInference": "PASS",
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat qa/evidence/render-live-cert.json

      - uses: actions/upload-artifact@v4
        with:
          name: ivx-render-live-certificate-${{ github.run_id }}
          path: qa/evidence/render-live-cert.json
