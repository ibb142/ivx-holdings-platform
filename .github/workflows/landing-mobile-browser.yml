name: IVX Mobile Browser Feed Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'expo/ivxholding-landing/**'
      - 'qa/landing-mobile-*'
      - 'qa/landing-preview-route.mjs'
      - 'qa/landing-19-preview.mjs'
      - '.github/workflows/landing-mobile-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'expo/ivxholding-landing/**'
      - 'qa/landing-mobile-*'
      - 'qa/landing-preview-route.mjs'
      - 'qa/landing-19-preview.mjs'
      - '.github/workflows/landing-mobile-browser.yml'

permissions:
  contents: read

concurrency:
  group: landing-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-feed:
    name: Android and iPhone browser feed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - name: Prepare browser dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          bunx playwright install --with-deps chromium webkit
      - name: Start PR landing preview
        if: github.event_name == 'pull_request'
        run: |
          bun qa/landing-19-preview.mjs > "$RUNNER_TEMP/mobile-preview.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify mobile navigation and live feed
        env:
          LANDING_BASE: https://ivxholding.com
          LANDING_PREVIEW_SOURCE: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4175' || '' }}
        run: bunx playwright test --config qa/landing-mobile-playwright.config.mjs
      - name: Preserve mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-feed-${{ github.sha }}
          path: |
            qa/evidence/mobile-browser
            test-results
          if-no-files-found: error
          retention-days: 30
