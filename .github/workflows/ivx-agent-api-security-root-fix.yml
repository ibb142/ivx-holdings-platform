name: IVX Agent API Security Root Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ivx-agent-api-security-root-fix.yml'
      - 'backend/api/ivx-agent-api.ts'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ivx-agent-api-security-root-fix
  cancel-in-progress: false

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch