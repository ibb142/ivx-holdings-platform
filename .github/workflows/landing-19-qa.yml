name: IVX Landing 19 QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: landing-19-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    name: 19-agent regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify media, postal validation and evidence integrity
        run: bun test backend/services/ivx-media-weight.test.ts backend/services/ivx-registration-postal-code.test.ts backend/services/ivx-reel-variant.test.ts backend/services/ivx-landing-contract-proof.test.ts backend/services/ivx-landing19-ci-proof.test.ts
      - name: Verify registration HTTP validation
        run: bun test backend/ivx-landing19-registration.test.ts
      - name: Verify public deal recovery and registration regressions
        run: |
          bun test backend/api/ivx-public-features.test.ts backend/ivx-public-source-recovery.test.ts
          bun test backend/ivx-registration-orchestrator.test.ts
          bun test backend/ivx-canonical-identity-model.test.ts
  auth-acceptance:
    name: Isolated Auth and Postgres acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }
      - name: Start isolated local Supabase
        id: stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ivx-landing19-supabase"
          cd "$RUNNER_TEMP/ivx-landing19-supabase"
          supabase init
          python3 - <<'PY'
          import pathlib, re
          config = pathlib.Path('supabase/config.toml')
          text, count = re.subn(r'^jwt_expiry\s*=\s*\d+\s*$', 'jwt_expiry = 60', config.read_text(), flags=re.M)
          assert count == 1, 'Expected one local Auth token expiry setting'
          config.write_text(text)
          PY
          supabase start --exclude studio,imgproxy,inbucket,realtime,storage-api,edge-runtime,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/landing19-local.env"
          python3 - <<'PY'
          import os, pathlib
          values = {}
          for line in pathlib.Path(os.environ["RUNNER_TEMP"], "landing19-local.env").read_text().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  values[k] = v.strip().strip('"')
          mapping = {"SUPABASE_URL":"API_URL", "EXPO_PUBLIC_SUPABASE_URL":"API_URL", "SUPABASE_ANON_KEY":"ANON_KEY", "EXPO_PUBLIC_SUPABASE_ANON_KEY":"ANON_KEY", "SUPABASE_SERVICE_ROLE_KEY":"SERVICE_ROLE_KEY", "IVX_QA_DB_URL":"DB_URL"}
          assert values["API_URL"].startswith("http://127.0.0.1:")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for target, source in mapping.items():
                  value = values[source]
                  assert value and "\n" not in value
                  if "KEY" in target or "SECRET" in target: print("::add-mask::" + value)
                  f.write(target + "=" + value + "\n")
          PY
      - name: Prepare isolated database tables
        run: psql "$IVX_QA_DB_URL" -v ON_ERROR_STOP=1 -f qa/landing-19-auth-schema.sql
      - name: Install Chromium
        run: bunx playwright install chromium
      - name: registration.zip-code
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: bun qa/landing-19-auth.mjs registration.zip-code
      - name: registration.optional-picture
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: bun qa/landing-19-auth.mjs registration.optional-picture
      - name: registration.duplicate-user
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: bun qa/landing-19-auth.mjs registration.duplicate-user
      - name: registration.loading-retry-browser
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: bun qa/landing-19-auth.mjs registration.loading-retry-browser
      - name: registration.e2e-member-creation
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: bun qa/landing-19-auth.mjs registration.e2e-member-creation
      - name: auth.expired-token
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: bun qa/landing-19-auth.mjs auth.expired-token
      - name: auth.session-persistence-browser
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: bun qa/landing-19-auth.mjs auth.session-persistence-browser
      - name: auth.login-e2e
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: bun qa/landing-19-auth.mjs auth.login-e2e
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/ivx-landing19-supabase" --no-backup
  browser-acceptance:
    if: github.event_name != 'pull_request'
    name: Browser / ${{ matrix.unit }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        unit: [reels.autoplay-controls-browser, reels.engagement-browser, reels.scroll-navigation-browser, reels.production-render-browser, a11y.touch-targets-browser, a11y.contrast-focus-browser, perf.console-network-browser, e2e.production-browser-suite]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.9 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx playwright install chromium
      - name: Install contrast measurement
        run: |
          npm install --prefix "$RUNNER_TEMP/ivx-axe" --no-save --ignore-scripts axe-core@4.10.3
          echo "AXE_SOURCE=$RUNNER_TEMP/ivx-axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
      - name: ${{ matrix.unit }}
        run: |
          set -euo pipefail
          node qa/landing-19-production-ready.mjs
          node qa/landing-19-browser.mjs "${{ matrix.unit }}"
          node qa/landing-19-production-ready.mjs
