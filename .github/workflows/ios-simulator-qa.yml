# IVX iOS Simulator QA — strict finite certification
# Build -> boot -> install -> launch -> Maestro. No persistent Metro process.

name: iOS Simulator QA

on:
  push:
    branches: [main]
    paths:
      - 'expo/app/ivx/chat.tsx'
      - 'expo/src/modules/chat/**'
      - 'expo/.maestro/**'
      - 'expo/eas.json'
      - 'expo/app.config.ts'
      - 'expo/package.json'
      - 'expo/assets/images/**'
      - 'expo/plugins/**'
      - '.github/workflows/ios-simulator-qa.yml'
  workflow_dispatch:
    inputs:
      run_full_qa:
        description: 'Run full chat QA'
        required: false
        default: false
        type: boolean

env:
  EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_QA_BUILD: 'true'

permissions:
  contents: read

jobs:
  build-and-test:
    name: iOS Simulator Build + Maestro QA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          set -euo pipefail
          bun install
          cd expo && bun install
      - name: Prebuild iOS
        working-directory: expo
        env:
          EXPO_PUBLIC_SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --clean --no-install
          cd ios && pod install
      - name: Boot simulator
        id: sim
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          test -n "$SIM_ID"
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
      - name: Build iOS app without Metro
        working-directory: expo
        env:
          EXPO_PUBLIC_SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 2 -name '*.xcworkspace' | head -1)
          test -n "$WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workspace"]["schemes"][0])')
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.id }}" -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee expo-build.log
      - name: Install and launch IVX
        id: app
        working-directory: expo
        run: |
          set -euo pipefail
          APP=$(find ios/build -type d -name '*.app' -path '*Debug-iphonesimulator*' | head -1)
          test -n "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test -n "$BUNDLE_ID"
          xcrun simctl install "${{ steps.sim.outputs.id }}" "$APP"
          xcrun simctl launch "${{ steps.sim.outputs.id }}" "$BUNDLE_ID"
          sleep 8
          xcrun simctl io "${{ steps.sim.outputs.id }}" screenshot screenshot-01-launch.png
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Maestro launch certification
        working-directory: expo
        run: |
          set -euo pipefail
          "$HOME/.maestro/bin/maestro" test .maestro/ivx-app-launch.yaml --format junit --output maestro-launch-results.xml 2>&1 | tee maestro-launch.log
      - name: Maestro full chat QA
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_qa == 'true' }}
        working-directory: expo
        env:
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OWNER_PASSWORD"
          "$HOME/.maestro/bin/maestro" test .maestro/ivx-chat-full-qa.yaml --format junit --output maestro-chat-results.xml 2>&1 | tee maestro-chat.log
      - name: Capture evidence
        if: always()
        run: |
          xcrun simctl io "${{ steps.sim.outputs.id }}" screenshot screenshot-02-post-test.png 2>/dev/null || true
          xcrun simctl spawn "${{ steps.sim.outputs.id }}" log show --last 5m > simulator-log.txt 2>&1 || true
      - name: Upload certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-qa-${{ github.sha }}
          path: |
            screenshot-*.png
            simulator-log.txt
            expo/expo-build.log
            expo/maestro-launch-results.xml
            expo/maestro-launch.log
            expo/maestro-chat-results.xml
            expo/maestro-chat.log
          if-no-files-found: warn
          retention-days: 30
      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all 2>/dev/null || true
