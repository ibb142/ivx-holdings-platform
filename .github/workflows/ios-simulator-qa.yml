# IVX iOS Simulator QA — GitHub Actions macOS Runner
# Strict certification: build -> launch -> Maestro. Maestro failures MUST fail the job.

name: iOS Simulator QA

on:
  push:
    branches: [main]
    paths:
      - 'expo/app/ivx/chat.tsx'
      - 'expo/src/modules/chat/**'
      - 'expo/.maestro/**'
      - 'expo/eas.json'
      - 'expo/app.config.ts'
      - 'expo/package.json'
      - 'expo/assets/images/**'
      - 'expo/plugins/**'
      - '.github/workflows/ios-simulator-qa.yml'
  workflow_dispatch:
    inputs:
      run_full_qa:
        description: 'Run full 20-step chat QA (requires OWNER_PASSWORD secret)'
        required: false
        default: false
        type: boolean

env:
  EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_QA_BUILD: 'true'
  OWNER_EMAIL: iperez4242@gmail.com

permissions:
  contents: read

jobs:
  build-and-test:
    name: iOS Simulator Build + Maestro QA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install
          cd expo && bun install
      - name: Build and launch on iOS Simulator
        working-directory: expo
        timeout-minutes: 45
        env:
          EXPO_PUBLIC_SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          npx expo run:ios --configuration debug 2>&1 | tee expo-build.log
      - name: Verify a simulator is booted
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if xcrun simctl list devices booted | grep -q 'iPhone'; then
              xcrun simctl list devices booted
              exit 0
            fi
            sleep 2
          done
          echo '::error::No booted iPhone simulator after build'
          exit 1
      - name: Capture launch screenshot
        run: |
          sleep 5
          xcrun simctl io booted screenshot screenshot-01-launch.png
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Maestro launch certification
        working-directory: expo
        run: |
          set -euo pipefail
          "$HOME/.maestro/bin/maestro" test .maestro/ivx-app-launch.yaml --format junit --output maestro-launch-results.xml 2>&1 | tee maestro-launch.log
      - name: Maestro full chat QA
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_qa == 'true' }}
        working-directory: expo
        env:
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OWNER_PASSWORD" || { echo '::error::OWNER_PASSWORD secret required'; exit 1; }
          "$HOME/.maestro/bin/maestro" test .maestro/ivx-chat-full-qa.yaml --format junit --output maestro-chat-results.xml 2>&1 | tee maestro-chat.log
      - name: Capture evidence
        if: always()
        run: |
          xcrun simctl io booted screenshot screenshot-02-post-test.png 2>/dev/null || true
          xcrun simctl spawn booted log show --last 5m > simulator-log.txt 2>&1 || true
      - name: Upload certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-qa-${{ github.sha }}
          path: |
            screenshot-*.png
            simulator-log.txt
            expo/expo-build.log
            expo/maestro-launch-results.xml
            expo/maestro-launch.log
            expo/maestro-chat-results.xml
            expo/maestro-chat.log
          if-no-files-found: warn
          retention-days: 30
      - name: Certification summary
        if: always()
        run: |
          echo '## IVX iOS / Maestro Certification' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Gate: Build -> Launch -> Maestro' >> "$GITHUB_STEP_SUMMARY"
          echo '- Maestro is strict: any test failure fails this job.' >> "$GITHUB_STEP_SUMMARY"
      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all 2>/dev/null || true
