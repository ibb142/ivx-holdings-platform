# IVX iOS Simulator QA — GitHub Actions macOS Runner
#
# Runs on GitHub's macOS-latest runner with Xcode pre-installed.
# Builds the Expo iOS simulator app, boots a real iOS Simulator,
# installs the app, takes screenshots, and runs Maestro flows.
#
# Triggers:
#   - Push to main (when chat files or Maestro flows change)
#   - Manual dispatch via GitHub Actions UI
#
# Secrets required (already configured in repo):
#   - EXPO_PUBLIC_SUPABASE_URL
#   - EXPO_PUBLIC_SUPABASE_ANON_KEY
#
# Secret required for full 20-step chat QA (owner must add):
#   - OWNER_PASSWORD — owner's Supabase password for app login
#
# Artifacts uploaded:
#   - Screenshots (launch, post-test)
#   - Build log
#   - Simulator logs
#   - Maestro JUnit results
#   - Xcode scheme listing

name: iOS Simulator QA

on:
  push:
    branches: [main]
    paths:
      - 'expo/app/ivx/chat.tsx'
      - 'expo/src/modules/chat/**'
      - 'expo/.maestro/**'
      - 'expo/eas.json'
      - '.github/workflows/ios-simulator-qa.yml'
  workflow_dispatch:
    inputs:
      run_full_qa:
        description: 'Run full 20-step chat QA (requires OWNER_PASSWORD secret)'
        required: false
        default: false
        type: boolean

env:
  EXPO_PUBLIC_API_BASE_URL: https://api.ivxholding.com
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_QA_BUILD: 'true'
  OWNER_EMAIL: iperez4242@gmail.com

permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    name: iOS Simulator Build + Maestro QA
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      build_status: ${{ steps.build.outcome }}
      app_path: ${{ steps.app.outputs.path }}
      simulator_id: ${{ steps.sim.outputs.sim_id }}
      simulator_name: ${{ steps.sim.outputs.sim_name }}
      ios_version: ${{ steps.sim.outputs.ios_version }}
      maestro_launch_result: ${{ steps.maestro-launch.outcome }}
      maestro_chat_result: ${{ steps.maestro-chat.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js (Bun removed — its module system breaks Expo config loading)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (npm for macOS compatibility)
        working-directory: expo
        run: |
          # npm install creates proper node_modules/.bin symlinks that
          # bun install does not create on macOS, which caused prebuild
          # to fail with PluginError: cannot resolve expo-router.
          npm install --legacy-peer-deps

      - name: Verify Expo CLI is locally installed
        working-directory: expo
        run: |
          echo "=== Node version ==="
          node --version
          echo "=== npm version ==="
          npm --version
          echo "=== expo package version ==="
          node -e "console.log('expo version:', require('expo/package.json').version)" 2>&1 || echo "expo package not found"
          echo "=== expo-router installed? ==="
          node -e "console.log('expo-router:', require('expo-router/package.json').version)" 2>&1 || echo "expo-router NOT FOUND"
          echo "=== .bin/expo symlink ==="
          ls -la node_modules/.bin/expo 2>/dev/null || echo "No .bin/expo symlink"
          echo "=== expo bin entry ==="
          ls -la node_modules/expo/bin/cli.js 2>/dev/null || echo "No expo/bin/cli.js"
          echo "=== .bin/expo --version ==="
          node_modules/.bin/expo --version 2>&1 || echo ".bin/expo failed"

      - name: Expo prebuild (generate native iOS project)
        working-directory: expo
        continue-on-error: true
        id: prebuild
        run: |
          set -x
          echo "=== Starting prebuild ==="
          # Use the local .bin/expo symlink (npm install creates it).
          # Do NOT use npx (may download wrong version) or node_modules/expo/cli.js (wrong path).
          node_modules/.bin/expo prebuild --platform ios --clean --no-install 2>&1 | tee prebuild-output.log
          PREBUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Prebuild exit code: $PREBUILD_EXIT ==="
          if [ -d "ios" ] && [ -f "ios/Podfile" ]; then
            echo "ios directory with Podfile exists — prebuild succeeded"
            ls -la ios/ | head -10
          else
            echo "ios directory does NOT exist — prebuild failed"
            echo "=== Retrying with npx --no-install ==="
            npx --no-install expo prebuild --platform ios --clean --no-install 2>&1 | tee -a prebuild-output.log || true
          fi
        env:
          EXPO_PUBLIC_SOURCE_COMMIT_SHA: ${{ github.sha }}

      - name: Check prebuild result
        working-directory: expo
        id: prebuild-check
        run: |
          if [ -d "ios" ] && [ -f "ios/Podfile" ]; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "Prebuild succeeded — ios directory with Podfile exists"
          else
            echo "result=failed" >> $GITHUB_OUTPUT
            echo "Prebuild failed — no ios directory"
            echo "=== Full prebuild output ==="
            cat prebuild-output.log 2>/dev/null || echo "No output log found"
            exit 1
          fi

      - name: Install CocoaPods
        working-directory: expo/ios
        run: pod install --repo-update

      - name: Discover Xcode workspace and scheme
        id: xcode
        working-directory: expo/ios
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "Workspace: $WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE" 2>&1 | tee xcode-list.log
          # More robust scheme extraction — grab first non-empty line after "Schemes:"
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>&1 | awk '/Schemes:/{found=1; next} found && NF{print; exit}' | xargs)
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Scheme: '$SCHEME'"
          if [ -z "$SCHEME" ]; then
            echo "::error::No scheme found — xcodebuild cannot proceed"
            echo "=== Full xcodebuild -list output ==="
            cat xcode-list.log
            exit 1
          fi
          # Show build settings for diagnostics
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphonesimulator -configuration Debug -showBuildSettings 2>&1 | tee xcode-showbuildsettings.log | grep -E 'CONFIGURATION_BUILD_DIR|BUILT_PRODUCTS_DIR|TARGET_BUILD_DIR|PRODUCT_NAME|WRAPPER_EXTENSION' || true

      - name: Build iOS simulator app
        id: build
        working-directory: expo/ios
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== Starting xcodebuild (with build action) ==="
          # NOTE: 'build' action is REQUIRED — without it xcodebuild validates
          # the project and exits 0 but produces no .app bundle.
          xcodebuild build \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== xcodebuild exit code: $BUILD_EXIT ==="
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== BUILD FAILED — last 150 lines of build.log ==="
            tail -150 build.log
            echo "### Build Failure — Last 150 Lines" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -150 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "build_status=failed" >> $GITHUB_OUTPUT
          else
            echo "Build completed successfully"
            echo "build_status=success" >> $GITHUB_OUTPUT
          fi

      - name: Check build result
        working-directory: expo/ios
        if: steps.build.outputs.build_status != 'success'
        run: |
          echo "::error::xcodebuild failed (exit code non-zero). See build.log artifact and step summary for details."
          echo "=== Dumping full build.log to step summary ==="
          echo "### Full Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(build.log not found)"
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Find built .app bundle and post diagnostics
        id: app
        working-directory: expo/ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Searching for .app bundle in build output ==="
          find build -maxdepth 5 -type d 2>/dev/null | head -50 || echo "No build directory"
          APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found in build output"
            find build -type f 2>/dev/null | head -100 || echo "build dir empty"
            # Write diagnostics to a file and create a GitHub issue so we can
            # see the build output without admin access to Actions logs.
            {
              echo "## iOS Simulator QA Build Diagnostics"
              echo ""
              echo "**Commit:** ${GITHUB_SHA}"
              echo "**Run:** ${GITHUB_RUN_ID}"
              echo ""
              echo "### xcodebuild -list output"
              echo '```'
              cat xcode-list.log 2>/dev/null || echo "not found"
              echo '```'
              echo ""
              echo "### showBuildSettings (key vars)"
              echo '```'
              cat xcode-showbuildsettings.log 2>/dev/null | grep -E 'CONFIGURATION_BUILD_DIR|BUILT_PRODUCTS_DIR|TARGET_BUILD_DIR|PRODUCT_NAME|WRAPPER_EXTENSION|SDKROOT' || echo "not available"
              echo '```'
              echo ""
              echo "### build.log (last 250 lines)"
              echo '```'
              tail -250 build.log 2>/dev/null || echo "not found"
              echo '```'
              echo ""
              echo "### build/ directory tree"
              echo '```'
              find build -maxdepth 5 -type d 2>/dev/null | head -50 || echo "no build dir"
              echo '```'
            } > diagnostic-body.md
            gh issue create \
              --title "iOS QA Build Diagnostics — ${GITHUB_SHA:0:12}" \
              --body-file diagnostic-body.md \
              --label "ios-qa-diagnostic" \
              2>&1 || echo "gh issue create failed"
            exit 1
          fi
          APP_PATH_ABS="$(cd "$(dirname "$APP_PATH")" && pwd)/$(basename "$APP_PATH")"
          echo "path=$APP_PATH_ABS" >> $GITHUB_OUTPUT
          echo "App bundle: $APP_PATH_ABS"

      - name: Boot iOS Simulator
        id: sim
        run: |
          # Find the first available iPhone simulator
          SIM_INFO=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(json.dumps({'udid': d['udid'], 'name': d['name'], 'runtime': runtime}))
                          sys.exit(0)
          ")
          SIM_ID=$(echo "$SIM_INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['udid'])")
          SIM_NAME=$(echo "$SIM_INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['name'])")
          SIM_RUNTIME=$(echo "$SIM_INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['runtime'])")
          IOS_VERSION=$(echo "$SIM_RUNTIME" | sed 's/.*iOS-//')

          echo "sim_id=$SIM_ID" >> $GITHUB_OUTPUT
          echo "sim_name=$SIM_NAME" >> $GITHUB_OUTPUT
          echo "ios_version=$IOS_VERSION" >> $GITHUB_OUTPUT

          echo "Booting simulator: $SIM_NAME (iOS $IOS_VERSION, UDID: $SIM_ID)"
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b

      - name: Install app on simulator
        run: |
          xcrun simctl install booted "${{ steps.app.outputs.path }}"
          echo "App installed on simulator"

      - name: Launch app and capture screenshot
        run: |
          xcrun simctl launch booted com.ivxholdings.app
          sleep 10
          xcrun simctl io booted screenshot screenshot-01-launch.png
          echo "Launch screenshot saved"

      - name: Capture simulator system log
        run: |
          xcrun simctl spawn booted log stream --level info --predicate 'process == "IVXHoldings" OR process == "ivxholdings"' --timeout 5 > simulator-app.log 2>&1 || true
          xcrun simctl spawn booted log show --predicate 'process == "IVXHoldings" OR process == "ivxholdings"' --last 5m > simulator-log-history.txt 2>&1 || true

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          maestro --version

      - name: Run Maestro launch test (no auth required)
        id: maestro-launch
        working-directory: expo
        continue-on-error: true
        run: |
          maestro test .maestro/ivx-app-launch.yaml --format junit --output maestro-launch-results.xml 2>&1 | tee maestro-launch.log
          echo "Maestro launch test completed"

      - name: Run full 20-step chat QA (requires OWNER_PASSWORD secret)
        id: maestro-chat
        working-directory: expo
        env:
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        continue-on-error: true
        run: |
          if [ -z "$OWNER_PASSWORD" ] && [ "${{ github.event.inputs.run_full_qa }}" != "true" ]; then
            echo "OWNER_PASSWORD secret not set — full 20-step chat QA skipped"
            echo "To enable: add OWNER_PASSWORD as a GitHub repository secret"
            echo "result=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          maestro test .maestro/ivx-chat-full-qa.yaml --format junit --output maestro-chat-results.xml 2>&1 | tee maestro-chat.log
          echo "result=completed" >> $GITHUB_OUTPUT

      - name: Take post-test screenshot
        run: |
          xcrun simctl io booted screenshot screenshot-02-post-test.png || true

      - name: Get simulator runtime info
        if: always()
        run: |
          xcrun simctl list devices -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['udid'] == '${{ steps.sim.outputs.sim_id }}':
                      print(f\"Device: {d['name']}\")
                      print(f\"State: {d['state']}\")
                      print(f\"Runtime: {runtime}\")
          " > simulator-info.txt 2>&1 || true

      - name: Shutdown simulator
        if: always()
        run: |
          xcrun simctl shutdown all 2>/dev/null || true

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-qa-${{ github.sha }}
          path: |
            screenshot-*.png
            simulator-app.log
            simulator-log-history.txt
            simulator-info.txt
            expo/prebuild-output.log
            expo/ios/build.log
            expo/ios/xcode-list.log
            expo/ios/xcode-showbuildsettings.log
            expo/maestro-launch-results.xml
            expo/maestro-launch.log
            expo/maestro-chat-results.xml
            expo/maestro-chat.log
          retention-days: 30

      - name: Generate QA summary
        if: always()
        run: |
          echo "## iOS Simulator QA Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Simulator | ${{ steps.sim.outputs.sim_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Version | ${{ steps.sim.outputs.ios_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Status | \`${{ steps.build.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Maestro Launch | \`${{ steps.maestro-launch.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Maestro Chat QA | \`${{ steps.maestro-chat.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Screenshots: \`screenshot-01-launch.png\`, \`screenshot-02-post-test.png\`" >> $GITHUB_STEP_SUMMARY
          echo "- Build log: \`expo/ios/build.log\`" >> $GITHUB_STEP_SUMMARY
          echo "- Simulator logs: \`simulator-app.log\`, \`simulator-log-history.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "- Maestro results: \`maestro-launch-results.xml\`, \`maestro-chat-results.xml\`" >> $GITHUB_STEP_SUMMARY
