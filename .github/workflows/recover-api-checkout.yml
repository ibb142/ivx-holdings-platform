name: Recover obsolete API checkout build
on:
  push:
    branches: [ops/recover-api-checkout-20260914]
    paths:
      - '.github/workflows/recover-api-checkout.yml'
      - 'scripts/ops/cancel-obsolete-api-build.mjs'
      - 'scripts/ops/cancel-obsolete-api-build.test.mjs'
permissions:
  contents: read
concurrency:
  group: recover-api-checkout-20260914
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node --test scripts/ops/cancel-obsolete-api-build.test.mjs
      - name: Cancel only the obsolete build after its successor is queued
        run: node scripts/ops/cancel-obsolete-api-build.mjs
        env:
          EXPECTED_MAIN_SHA: 5acc9ad4c7832a6e5f841d15ac944e35b9e408ad
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          IVX_RENDER_API_KEY: ${{ secrets.IVX_RENDER_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IVX_OWNER_VARIABLES_ENCRYPTION_KEY: ${{ secrets.IVX_OWNER_VARIABLES_ENCRYPTION_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
