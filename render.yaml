# IVX Holdings — Enterprise Blueprint v6
# Multi-instance backend, autoscaling, Redis cache, background worker,
# separate staging, zero-downtime deploys with automatic rollback.
# Updated: 2026-08-12T09:25:00Z

services:
  - type: web
    name: ivx-holdings-platform
    repo: https://github.com/ibb142/ivx-holdings-platform.git
    branch: main
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node /app/node_modules/tsx/dist/cli.mjs /app/server.ts
    plan: standard
    scaling:
      minInstances: 1
      maxInstances: 3
      targetCPUPercent: 70
      targetMemoryPercent: 80
    # Deploy only after GitHub's required checks pass. Workflow-only and QA
    # evidence commits do not change the API image and must never recycle the
    # single disk-backed production instance.
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - .github/**
        - qa/**
        - docs/**
        - '**/*.md'
    healthCheckPath: /health
    domains:
      - api.ivxholding.com
    renderSubdomainPolicy: disabled
    disk:
      name: ivx-holdings-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      - key: IVX_DEPLOYMENT_ENV
        value: production
      - key: IVX_AUTOSCALING_ENABLED
        value: "true"
      - key: IVX_DEDICATED_WORKER_ENABLED
        value: "true"
      - key: IVX_OWNER_FOCUS_QUEUE_MODE
        value: "off"
      - key: IVX_PROVIDER_AUTO_REPAIR_ENABLED
        value: "false"
      - key: IVX_AUTONOMOUS_DOCTOR_INTERVAL_MS
        value: "60000"
      - key: IVX_CAMPAIGN_MAX_CONCURRENCY
        value: "12"
      - key: IVX_AUTONOMOUS_CONTINUITY_MAX_CONCURRENCY
        value: "12"
      - key: IVX_MAX_INSTANCES
        value: "3"
      - key: CHAT_DATABASE_PATH
        value: /app/data/chat-room.sqlite
      - key: IVX_DATA_DIR
        value: /app/data
      - key: CHAT_ALLOWED_ORIGINS
        value: https://chat.ivxholding.com,https://api.ivxholding.com,https://ivxholding.com,https://www.ivxholding.com
      - key: EXPO_PUBLIC_CHAT_SOCKET_PATH
        value: /socket.io
      - key: EXPO_PUBLIC_APP_ENV
        value: production
      - key: API_BASE_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_IVX_API_BASE_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_API_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_PRODUCTION_API_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_APP_URL
        value: https://chat.ivxholding.com
      - key: CHAT_ROOM_ID
        value: main-room
      - key: EXPO_PUBLIC_CHAT_DEFAULT_ROOM_ID
        value: main-room
      - key: REDIS_URL
        fromService:
          name: ivx-redis
          type: redis
          property: connectionString
      - key: IVX_REDIS_ADAPTER_ENABLED
        value: "true"
      - key: IVX_CACHE_ENABLED
        value: "true"
      - key: IVX_RATE_LIMIT_REDIS
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: STRIPE_API_KEY
        sync: false
      - key: EXPO_PUBLIC_GOOGLE_ADS_API_KEY
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: IVX_OWNER_RECOVERY_PHONE
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: CLOUDFRONT_DISTRIBUTION_ID
        sync: false
      - key: IVX_AI_GATEWAY_KEY
        sync: false
      - key: EXPO_PUBLIC_IVX_AI_GATEWAY_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO_URL
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: RENDER_SERVICE_NAME
        value: ivx-holdings-platform
      - key: IVX_INTERNAL_DEPLOY_SECRET
        sync: false
      - key: IVX_INTERNAL_WORKER_ID
        sync: false
      - key: OWNER_NEW_PASSWORD
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mydatabase
          property: connectionString
      - key: POSTGRES_URL
        sync: false
      - key: EXPO_PUBLIC_PROJECT_ID
        sync: false
      - key: EXPO_PUBLIC_TEAM_ID
        sync: false
      - key: EXPO_PUBLIC_CHAT_API_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_IVX_OWNER_AI_BASE_URL
        value: https://api.ivxholding.com
      - fromGroup: my-env-group

  - type: worker
    name: ivx-holdings-worker
    repo: https://github.com/ibb142/ivx-holdings-platform.git
    branch: main
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node /app/node_modules/tsx/dist/cli.mjs /app/backend/worker.ts
    plan: starter
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: IVX_DEPLOYMENT_ENV
        value: production
      - key: IVX_WORKER_MODE
        value: "true"
      - key: IVX_DEDICATED_WORKER_ENABLED
        value: "true"
      - key: IVX_WORKER_MAX_CONCURRENCY
        value: "16"
      - key: REDIS_URL
        fromService:
          name: ivx-redis
          type: redis
          property: connectionString
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: IVX_AI_GATEWAY_KEY
        sync: false
      - key: EXPO_PUBLIC_IVX_AI_GATEWAY_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mydatabase
          property: connectionString
      - fromGroup: my-env-group

  - type: worker
    name: ivx-senior-dev-01
    # Blueprint target: seven instances at 16 slots each. Production must not
    # claim 112/112 until Render reports all seven instances and the shared
    # durable lease path proves 112 distinct fresh worker heartbeats.
    numInstances: 7
    maxShutdownDelaySeconds: 300
    repo: https://github.com/ibb142/ivx-holdings-platform.git
    branch: main
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node /app/node_modules/tsx/dist/cli.mjs /app/backend/workers/ivx-senior-dev-worker-entry.ts
    plan: standard
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: IVX_DEPLOYMENT_ENV
        value: production
      - key: IVX_SENIOR_DEV_WORKER_ENABLED
        value: "true"
      - key: IVX_WORKER_MODE
        value: "true"
      - key: IVX_DEDICATED_WORKER_ENABLED
        value: "true"
      - key: IVX_WORKER_MAX_CONCURRENCY
        value: "16"
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO_URL
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: IVX_AI_GATEWAY_KEY
        sync: false
      - key: EXPO_PUBLIC_IVX_AI_GATEWAY_URL
        sync: false
      - key: IVX_INTERNAL_DEPLOY_SECRET
        sync: false
      - key: IVX_INTERNAL_WORKER_ID
        sync: false
      - key: IVX_INTERNAL_API_URL
        value: https://api.ivxholding.com
      - fromGroup: my-env-group

  - type: web
    name: ivx-holdings-staging
    repo: https://github.com/ibb142/ivx-holdings-platform.git
    branch: staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node /app/node_modules/tsx/dist/cli.mjs /app/server.ts
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /health
    renderSubdomainPolicy: enabled
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      - key: IVX_DEPLOYMENT_ENV
        value: staging
      - key: EXPO_PUBLIC_APP_ENV
        value: staging
      - key: CHAT_ALLOWED_ORIGINS
        value: https://ivx-holdings-staging.onrender.com,http://localhost:8081,http://localhost:19006
      - key: REDIS_URL
        fromService:
          name: ivx-redis-staging
          type: redis
          property: connectionString
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mydatabase-staging
          property: connectionString
      - key: IVX_AI_GATEWAY_KEY
        sync: false
      - fromGroup: my-env-group

  - type: web
    name: ivx-holdings-chat-frontend
    repo: https://github.com/ibb142/ivx-holdings-platform.git
    branch: main
    runtime: static
    rootDir: expo
    buildCommand: |
      set -e
      export BUN_INSTALL="$HOME/.bun"
      export PATH="$BUN_INSTALL/bin:$PATH"
      if ! command -v bun >/dev/null 2>&1; then
        echo "bun not found on PATH — bootstrapping bun locally for this build"
        if command -v curl >/dev/null 2>&1; then
          curl -fsSL https://bun.sh/install | bash
        elif command -v wget >/dev/null 2>&1; then
          wget -qO- https://bun.sh/install | bash
        else
          echo "ERROR: neither curl nor wget is available to install bun" >&2
          exit 1
        fi
        export PATH="$BUN_INSTALL/bin:$PATH"
      fi
      if ! command -v bun >/dev/null 2>&1; then
        echo "ERROR: bun installation failed; bun is still not on PATH" >&2
        exit 1
      fi
      bun --version
      bun install
      bunx expo export --platform web
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    domains:
      - chat.ivxholding.com
    renderSubdomainPolicy: disabled
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_APP_ENV
        value: production
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_IVX_API_BASE_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_API_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_PRODUCTION_API_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_CHAT_API_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_IVX_OWNER_AI_BASE_URL
        value: https://api.ivxholding.com
      - key: EXPO_PUBLIC_APP_URL
        value: https://chat.ivxholding.com
      - key: EXPO_PUBLIC_CHAT_DEFAULT_ROOM_ID
        value: main-room
      - key: EXPO_PUBLIC_CHAT_SOCKET_PATH
        value: /socket.io
      - key: EXPO_PUBLIC_GOOGLE_ADS_API_KEY
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_PROJECT_ID
        sync: false
      - key: EXPO_PUBLIC_TEAM_ID
        sync: false

  - type: pserv
    name: minio
    runtime: docker
    repo: https://github.com/render-examples/minio.git
    plan: starter
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: "10000"
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        generateValue: true
    disk:
      name: minio-data
      mountPath: /data
      sizeGB: 10

  - type: redis
    name: ivx-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: redis
    name: ivx-redis-staging
    plan: free
    ipAllowList: []

databases:
  - name: mydatabase
    plan: standard-1gb
    databaseName: ivx
    user: ivx
    postgresMajorVersion: "16"
    ipAllowList: []
    highAvailability:
      enabled: true
  - name: mydatabase-staging
    plan: basic-256mb
    databaseName: ivx_staging
    user: ivx_staging
    postgresMajorVersion: "16"
    ipAllowList: []

envVarGroups:
  - name: my-env-group
    envVars:
      - key: IVX_ENV_GROUP_ATTACHED
        value: "true"
      - key: IVX_ENV_GROUP_NAME
        value: my-env-group
      - key: IVX_ENTERPRISE_MODE
        value: "true"
